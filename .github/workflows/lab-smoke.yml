# Disposable-lab smoke: bring up all compose services, wait healthy,
# then run the two documented example-entry commands end to end.
# Triggered only when the lab chain changes (or manually).
name: lab-smoke

on:
  push:
    branches: [main]
    paths:
      - "lab/**"
      - "docs/lab/**"
      - ".github/workflows/lab-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compose config validation
        run: docker compose -f lab/docker-compose.yml config -q

      - name: Build images
        run: docker compose -f lab/docker-compose.yml build --progress=plain

      - name: Start all services
        run: |
          if ! docker compose -f lab/docker-compose.yml up -d; then
            echo "::error::compose up -d failed — dumping container state"
            docker compose -f lab/docker-compose.yml ps -a || true
            for c in ntbx-lab-ubuntu ntbx-lab-centos7 ntbx-lab-frr ntbx-lab-srlinux; do
              info=$(docker inspect --format '{{.State.Status}} exit={{.State.ExitCode}} err={{.State.Error}}' "$c" 2>/dev/null || echo "not-created")
              echo "===== $c : $info ====="
              docker logs "$c" 2>&1 | tail -25 || true
              echo "::error::$c state=[$info]"
            done
            exit 1
          fi

      - name: Wait for all services healthy (up to 5 min)
        run: |
          deadline=$((SECONDS+300))
          while [ $SECONDS -lt $deadline ]; do
            statuses=$(for c in ntbx-lab-ubuntu ntbx-lab-centos7 ntbx-lab-frr ntbx-lab-srlinux; do
              docker inspect --format '{{.State.Health.Status}}' "$c" 2>/dev/null || echo missing
            done)
            echo "$statuses"
            [ "$(echo "$statuses" | grep -c healthy)" -eq 4 ] && exit 0
            sleep 10
          done
          echo "::error::services not healthy in time"
          for c in ntbx-lab-ubuntu ntbx-lab-centos7 ntbx-lab-frr ntbx-lab-srlinux; do
            h=$(docker inspect --format '{{.State.Health.Status}}' "$c" 2>/dev/null || echo missing)
            echo "::error::$c health=[$h]"
          done
          docker ps -a; docker logs ntbx-lab-srlinux 2>&1 | tail -30; exit 1

      - name: Example 1 (linux) - entry 8ec4a39b ss port listen
        run: |
          out=$(docker exec ntbx-lab-ubuntu ss -tlnp | grep :22)
          echo "$out"
          echo "$out" | grep -q sshd

      - name: Example 2 (frr) - entry eac547bb static route syntax
        run: |
          dump() {
            echo "::error::frr running-config ip-route lines: $(docker exec ntbx-lab-frr vtysh -c "show running-config" 2>&1 | grep -i "ip route" | tr '\n' ' ' | tail -c 700)"
            echo "::error::frr daemons: $(docker exec ntbx-lab-frr vtysh -c "show daemons" 2>&1 | tr '\n' ' ' | tail -c 400)"
          }
          # Faithful replay of the documented paste workflow: feed the entry's
          # command block to vtysh via stdin (exactly like an interactive paste;
          # vtysh -c does NOT keep CLI mode between -c arguments).
          out_apply=$(printf 'configure terminal\nip route 192.168.20.0 255.255.255.0 10.0.0.2\nip route 0.0.0.0 0.0.0.0 10.0.0.2\nend\n' | docker exec -i ntbx-lab-frr vtysh 2>&1) || {
            echo "::error::vtysh stdin apply failed: $(echo "$out_apply" | tr '\n' ' ' | tail -c 600)"
            dump; exit 1
          }
          echo "$out_apply"
          # Syntax-check assertion (docs/lab/README.md example 2): the entry is a
          # syntax-check, so assert staticd HOLDS the pasted routes in running-config.
          # Route-table presence is NOT asserted: FRR does not display static routes
          # whose next hop is unreachable (10.0.0.2 has no route in the container).
          rc=$(docker exec ntbx-lab-frr vtysh -c "show running-config" 2>&1) || {
            echo "::error::show running-config failed: $(echo "$rc" | tr '\n' ' ' | tail -c 600)"
            dump; exit 1
          }
          echo "$rc" | grep -Eq "^ip route 192\.168\.20\.0/24 10\.0\.0\.2" || {
            echo "::error::pasted static route not in running-config: $(echo "$rc" | grep -i "ip route" | tr '\n' ' ' | tail -c 700)"
            dump; exit 1
          }
          out=$(docker exec ntbx-lab-frr vtysh -c "show ip route" 2>&1) || {
            echo "::error::show ip route failed: $(echo "$out" | tr '\n' ' ' | tail -c 600)"
            dump; exit 1
          }
          echo "$out"  # shown for reference only (no S-route assert by design)
          echo "syntax check OK: staticd holds ip route 192.168.20.0/24 via 10.0.0.2"

      - name: systemd check on centos7
        run: |
          # systemctl query is limited in this container (D-Bus EPERM: centos7's
          # old systemd 219 on cgroup-v2 hosts); sshd being up proves systemd works.
          out=$(docker exec ntbx-lab-centos7 pgrep -x sshd 2>&1) || {
            echo "::error::no sshd process in centos7 (systemd did not start it?): $(echo "$out" | tr '\n' ' ')"
            exit 1
          }
          echo "centos7 sshd pid: $(echo "$out" | tr '\n' ' ')"

      - name: srlinux cli check
        run: |
          out=$(docker exec ntbx-lab-srlinux sr_cli show version 2>&1) || {
            echo "::error::sr_cli show version failed: $(echo "$out" | tr '\n' ' ' | tail -c 700)"
            echo "::error::srlinux logs: $(docker logs ntbx-lab-srlinux 2>&1 | tr '\n' ' ' | tail -c 700)"
            exit 1
          }
          echo "$out" | grep -qi version || {
            echo "::error::sr_cli output has no version line: $(echo "$out" | tr '\n' ' ' | tail -c 700)"
            exit 1
          }
          echo "sr_cli ok: $(echo "$out" | head -3 | tr '\n' ' ')"

      - name: Teardown (down -v resets everything)
        if: always()
        run: docker compose -f lab/docker-compose.yml down -v
