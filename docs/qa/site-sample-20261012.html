ommunity\nsave force", "params": [{"name": "ro_community", "label": "只读团体字", "default": "RO@Public1", "required": true, "validate": "", "example": "RO@Public1", "type": "string", "description": "SNMP 只读团体字，等同口令——网管凭它采集设备数据；禁用 public 等弱值并限定来源；只读为主，写权限单独管理"}, {"name": "rw_community", "label": "读写团体字", "default": "RW@Public1", "required": true, "validate": "", "example": "RW@Public1", "type": "string", "description": "SNMP 读写团体字——持有即可远程修改设备配置，权限极高；仅必要时配置，务必限定来源网段并使用强值"}, {"name": "location", "label": "设备位置", "default": "IDC-A-机柜12", "required": false, "validate": "", "example": "IDC-A-机柜12", "type": "string", "description": "SNMP 系统位置（sysLocation）字段，标明设备物理位置（机房/机柜/U 位），告警现场定位依据；纯展示不影响功能"}, {"name": "contact", "label": "联系人", "default": "网络运维组", "required": false, "validate": "", "example": "网络运维组", "type": "string", "description": "SNMP 系统联系人（sysContact）字段，网管告警时定位责任人的依据；纯展示不影响功能"}, {"name": "nms_ip", "label": "网管服务器 IP", "default": "10.0.0.100", "required": true, "validate": "ipv4", "example": "10.0.0.100", "type": "ip", "description": "网管服务器（SNMP 采集/trap 接收）IP，设备向其发送告警并接受查询；填错网管侧收不到任何数据，等于监控失明"}], "notes": "1) 团体字不用 public/private，也不要与主机名/项目名雷同，安全审计会抽查。\n2) Trap 目标必须带 udp-domain 与 params securityname，只给 IP 不生效。\n3) 采集只需要 read 团体字；write 团体字用完建议直接删掉。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:54", "updated_at": "2026-10-09 13:45:34", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除本变更新增的 SNMP 配置（location/contact 旧值按变更记录恢复）\nsystem-view\nundo snmp-agent trap enable\nundo snmp-agent sys-info version v2c\nundo snmp-agent target-host trap address udp-domain {{nms_ip}} params securityname {{ro_community}} v2c\nundo snmp-agent community read {{ro_community}}\nundo snmp-agent community write {{rw_community}}\nundo snmp-agent sys-info location\nundo snmp-agent sys-info contact\nquit\nsave force\n# 复核\ndisplay snmp-agent community"}, {"uuid": "abbb4612-7dac-58fb-8f3e-b02b5c3afb21", "platform": "network", "device_type": "交换机", "vendor": "h3c", "os_family": "comware7", "models": "S5130 / S5560 / MSR 系列", "category": "保存配置", "title": "保存配置并备份到本地存储", "description": "用 save force 落盘，并把启动配置文件复制一份到 flash 作为回滚点。", "commands": "# ===== 保存与本地备份（H3C Comware7）=====\nsave force\ndisplay saved-configuration\ndir flash:/\ncopy startup.cfg startup-{{backup_tag}}.cfg\ndir flash:/", "params": [{"name": "backup_tag", "label": "备份标记", "default": "20260920", "required": false, "validate": "", "example": "20260920 或变更单号", "type": "string", "description": "备份文件版本标签，拼进备份文件名（如 backup-20260930-pre-upgrade.cfg）便于追溯；建议用『日期-动作』格式，回滚时按标签定位对应版本"}], "notes": "1) save force 免交互；只用 save 会被问 \"Are you sure? [Y/N]\"，脚本里会卡住。\n2) Comware7 的启动配置文件通常叫 startup.cfg，先 dir 确认实际文件名再 copy。\n3) 回滚方式：把备份文件改名回 startup.cfg，或用 startup-configuration 指定，再重启生效。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:54", "updated_at": "2026-10-09 13:45:34", "exec_level": "", "interactive": 0, "rollback": "# 回退：本条目仅保存与备份配置，不改变网络行为，无需配置回退；\n# 如需清理本次备份文件（delete 需交互确认）\ndelete startup-{{backup_tag}}.cfg\ndir flash:/"}, {"uuid": "12605808-caf7-58e7-955e-dc39d38b11c0", "platform": "network", "device_type": "路由器", "vendor": "huawei", "os_family": "vrp8", "models": "AR6000 / AR6500（V300R 版本）", "category": "VLAN", "title": "路由器以太口转二层并划入 VLAN（AR 系列）", "description": "AR 路由器默认是三层口，用 portswitch 切成二层口后再划 access VLAN。", "commands": "# ===== 以太口转二层并划 VLAN（华为 AR 路由器）=====\nsystem-view\nvlan {{vlan_id}}\n description {{vlan_name}}\n quit\ninterface GigabitEthernet {{port}}\n portswitch\n port link-type access\n port default vlan {{vlan_id}}\n quit\ndisplay port vlan\nsave\ny", "params": [{"name": "vlan_id", "label": "VLAN ID", "default": "10", "required": true, "validate": "vlan", "example": "10", "type": "string", "description": "VLAN 编号，二层广播域标识；有效范围 1-4094（1 为默认 VLAN、1002-1005 系统保留）；Trunk 两端放行列表与 PVID 必须配套，改错会隔离业务"}, {"name": "vlan_name", "label": "VLAN 名称", "default": "OFFICE", "required": false, "validate": "", "example": "OFFICE", "type": "string", "description": "VLAN 名称，二层辨识用途；建议按业务语义命名（如 OA_BIZ），纯展示不影响转发"}, {"name": "port", "label": "端口", "default": "0/0/1", "required": true, "validate": "port", "example": "0/0/1", "type": "string", "description": "接口名/接口编号，进入该接口视图后所做的配置只作用于这一个口；先 show/display 确认接口存在与状态——进错接口改配置是现场常见事故"}], "notes": "1) AR 的以太口默认是三层口，必须先 portswitch 才能配 switchport 类命令；\n   执行 portswitch 会清掉该口已有的 IP 地址配置，配之前先确认口上没有业务。\n2) 路由器上通常只用少数交换口做管理接入，业务互联仍用三层口 + 子接口。\n3) 要恢复三层口用 undo portswitch（同样会清掉二层配置）。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:54", "updated_at": "2026-10-09 13:45:35", "exec_level": "", "interactive": 0, "rollback": "# 回退：端口恢复三层模式并删除 VLAN（★ undo portswitch 前必须先清二层属性；\n# 端口原三层 IP 等配置按变更记录恢复）\nsystem-view\ninterface GigabitEthernet {{port}}\n undo port default vlan\n undo port link-type\n undo portswitch\n quit\nundo vlan {{vlan_id}}\nquit\nsave\ny\n# 复核\ndisplay port vlan"}, {"uuid": "3229bce8-fa65-5d77-b957-37a746e398ad", "platform": "network", "device_type": "路由器", "vendor": "huawei", "os_family": "vrp8", "models": "AR6000 / AR6500", "category": "Trunk", "title": "AR 交换口配置 Trunk 上联", "description": "把 portswitch 后的交换口配成 trunk，放通 VLAN 并设 PVID。", "commands": "# ===== Trunk 上联（华为 AR 路由器）=====\nsystem-view\ninterface GigabitEthernet {{port}}\n portswitch\n port link-type trunk\n port trunk allow-pass vlan {{vlan_list}}\n port trunk pvid vlan {{pvid}}\n quit\nsave\ny", "params": [{"name": "port", "label": "端口", "default": "0/0/9", "required": true, "validate": "port", "example": "0/0/9", "type": "string", "description": "接口名/接口编号，进入该接口视图后所做的配置只作用于这一个口；先 show/display 确认接口存在与状态——进错接口改配置是现场常见事故"}, {"name": "vlan_list", "label": "放通 VLAN 列表", "default": "10 20 30", "required": true, "validate": "", "example": "10 20 30 或 10 to 20", "type": "string", "description": "Trunk 放行 VLAN 列表（如 10,20,30-40），控制哪些 VLAN 流量可通过该链路；漏放行业务 VLAN 会当场断流，改动立即生效"}, {"name": "pvid", "label": "PVID / Native VLAN", "default": "1", "required": false, "validate": "vlan", "example": "1", "type": "string", "description": "Trunk 口 PVID（untagged VLAN），决定无标签流量归入哪个 VLAN；两端 PVID 不一致会导致原生态流量进错 VLAN 丢失"}], "notes": "1) 只有 portswitch 过的口才能配 link-type trunk，忘了会提示命令不存在。\n2) allow-pass 的写法与 S 系列交换机完全一致（\"vlan 10 to 20\" 或 \"vlan 10 20 30\"）。\n3) AR 交换口数量少（常见 8-9 口），上联口占满时优先考虑用交换机做汇聚。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:54", "updated_at": "2026-10-09 13:45:35", "exec_level": "", "interactive": 0, "rollback": "# 回退：撤销 Trunk 属性，端口回默认 access（下联交换机的口回退前先确认，防环路）\nsystem-view\ninterface GigabitEthernet {{port}}\n undo port trunk allow-pass vlan\n undo port trunk pvid vlan\n undo port link-type\n quit\nsave\ny\n# 复核\ndisplay port vlan"}, {"uuid": "fe970fdd-6f42-5133-bbbe-c467b36da1e2", "platform": "network", "device_type": "路由器", "vendor": "huawei", "os_family": "vrp8", "models": "AR6000 / AR6500", "category": "静态路由", "title": "配置静态路由、缺省路由与备份路由（AR 系列）", "description": "配置明细静态路由、缺省路由，并用 preference 做双出口浮动备份。", "commands": "# ===== 静态路由（华为 AR 路由器）=====\nsystem-view\nip route-static {{dest_net}} {{mask}} {{next_hop}}\nip route-static 0.0.0.0 0.0.0.0 {{next_hop}}\n! 双出口浮动备份：主出口 preference 默认 60，备份口设 70\nip route-static 0.0.0.0 0.0.0.0 {{backup_hop}} preference {{preference}}\ndisplay ip routing-table\ndisplay ip routing-table 0.0.0.0\nsave\ny", "params": [{"name": "dest_net", "label": "目的网段", "default": "192.168.20.0", "required": true, "validate": "ipv4", "example": "192.168.20.0", "type": "ip", "description": "目的网段地址，路由/策略匹配的目标方向；0.0.0.0/0 表示任意目的；方向写反会导致流量走错策略"}, {"name": "mask", "label": "掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "24 或 255.255.255.0", "type": "string", "description": "静态路由的点分十进制掩码，与 dest_net 圈定路由前缀；掩码写宽会吞掉相邻网段的路由匹配"}, {"name": "next_hop", "label": "下一跳地址", "default": "10.0.0.2", "required": true, "validate": "ipv4", "example": "10.0.0.2", "type": "ip", "description": "下一跳 IP，路由/策略转发的去向；必须是本机直连可达地址，写错路由成『黑洞』"}, {"name": "backup_hop", "label": "备份下一跳", "default": "10.1.1.2", "required": false, "validate": "ipv4", "example": "10.1.1.2", "type": "ip", "description": "浮动静态路由的备份下一跳，主路径失效后才接管转发；其管理距离/优先级必须大于主路由；须保证与本端直连可达"}, {"name": "preference", "label": "备份优先级", "default": "70", "required": false, "validate": "int:1-255", "example": "默认 60，备份 70", "type": "int", "range": "1-255", "description": "路由优先级（华为/H3C/Juniper），数值越小越优先（华为/H3C 静态默认 60）；浮动静态路由把备份侧 preference 调大"}], "notes": "1) 双出口用 preference 做浮动备份最简单；要求链路探测可结合 NQA\n   （ip route-static ... track nqa），断线能自动切换。\n2) 路由器上更常用\"出接口 + 下一跳\"的写法：ip route-static 0.0.0.0 0 <接口> <下一跳>。\n3) display ip routing-table 0.0.0.0 可直接查缺省路由的下一跳，排查上网不通最快。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:54", "updated_at": "2026-10-09 13:45:35", "exec_level": "", "interactive": 0, "rollback": "# 回退：逐条删除本变更新增的静态/缺省/浮动路由\nsystem-view\nundo ip route-static {{dest_net}} {{mask}} {{next_hop}}\nundo ip route-static 0.0.0.0 0.0.0.0 {{next_hop}}\nundo ip route-static 0.0.0.0 0.0.0.0 {{backup_hop}} preference {{preference}}\nquit\nsave\ny\n# 复核\ndisplay ip routing-table"}, {"uuid": "e4ec7c22-a0d8-5428-b0d9-0ff763aa8de6", "platform": "network", "device_type": "路由器", "vendor": "huawei", "os_family": "vrp8", "models": "AR6000 / AR6500", "category": "OSPF", "title": "配置 OSPF 并引入静态路由（AR 系列）", "description": "开启 OSPF 组网、宣告网段，并把静态路由引入 OSPF 域内。", "commands": "# ===== OSPF + 引入静态路由（华为 AR 路由器）=====\nsystem-view\nospf {{process_id}} router-id {{router_id}}\n area {{area_id}}\n  network {{network}} {{wildcard}}\n  quit\n import-route static\n silent-interface GigabitEthernet{{silent_port}}\n quit\ndisplay ospf peer\ndisplay ospf lsdb\nsave\ny", "params": [{"name": "process_id", "label": "进程号", "default": "1", "required": true, "validate": "int:1-65535", "example": "1", "type": "int", "range": "1-65535", "description": "OSPF 进程号（仅本机有效），标识一个 OSPF 实例；两端进程号可以不同，但网段/区域/认证必须匹配"}, {"name": "router_id", "label": "Router ID", "default": "2.2.2.2", "required": true, "validate": "ipv4", "example": "2.2.2.2", "type": "ip", "description": "OSPF Router ID（IPv4 格式），区域内唯一标识本路由器；重复会引发邻居震荡与路由抖动，建议用 loopback 接口地址"}, {"name": "area_id", "label": "区域号", "default": "0", "required": false, "validate": "", "example": "0 或 0.0.0.1", "type": "string", "description": "OSPF 区域 ID，控制该网段归属哪个 OSPF 区域；骨干区域固定 0.0.0.0，非骨干区域须与骨干直连（或虚链路）；填错邻居起不来、路由学不到"}, {"name": "network", "label": "宣告网段", "default": "10.1.1.0", "required": true, "validate": "ipv4", "example": "10.1.1.0", "type": "ip", "description": "OSPF 宣告网段，匹配哪些接口参与 OSPF 进程；与 wildcard 配套使用；宣告漏了/错了邻居和路由直接缺失"}, {"name": "wildcard", "label": "反掩码", "default": "0.0.0.255", "required": true, "validate": "masklen", "example": "0.0.0.255", "type": "string", "description": "OSPF/ACL 反掩码（wildcard），0 位精确匹配、1 位任意；0.0.0.255 对应 /24；写错宣告/匹配范围不对"}, {"name": "silent_port", "label": "静默接口", "default": "0/0/0", "required": false, "validate": "port", "example": "0/0/0", "type": "string", "description": "OSPF 静默接口（华为/H3C silent-interface），该口不收发 Hello；接终端的口建议设静默防误建邻居"}], "notes": "1) import-route static 会把静态路由全部引入（可用 route-policy 过滤）；\n   不加过滤可能把不该发布的私网段泄露出去。\n2) AR 与 S 系列交换机的 OSPF 语法一致，差异主要在接口命名（AR 多为 0/0/x 两段式）。\n3) 引入后在域内其他设备上用 display ospf lsdb 看 5 类 LSA，确认引入成功。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:54", "updated_at": "2026-10-09 13:45:35", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除整个 OSPF 进程（含 import-route static；进程若预存只是新增 network，\n# 则改为进 ospf 视图逐条 undo network / undo import-route static）\nsystem-view\nundo ospf {{process_id}}\nquit\nsave\ny\n# 复核\ndisplay ospf peer\ndisplay ip routing-table protocol ospf"}, {"uuid": "3279c706-6c8e-575d-823b-ca7c59d0d39c", "platform": "network", "device_type": "路由器", "vendor": "huawei", "os_family": "vrp8", "models": "AR6000 / AR6500", "category": "ACL", "title": "配置基本 ACL 与接口流量过滤", "description": "用基本 ACL 圈定内网网段供 NAT 使用，并用高级 ACL 过滤接口流量。", "commands": "# ===== 基本 ACL + 接口过滤（华为 AR 路由器）=====\nsystem-view\nacl number {{acl_number}}\n rule 5 permit source {{src_net}} {{src_wild}}\n quit\n! 接口双向过滤（inbound / outbound）\ninterface GigabitEthernet {{port}}\n traffic-filter inbound acl {{acl_number}}\n traffic-filter outbound acl {{acl_number}}\n quit\ndisplay acl {{acl_number}}\nsave\ny", "params": [{"name": "acl_number", "label": "ACL 编号", "default": "2000", "required": true, "validate": "int:1-3999", "example": "2000-2999 基本 / 3000-3999 高级", "type": "int", "range": "1-3999", "description": "ACL 编号，标识一条访问控制列表；Cisco 1-99 为标准 IP ACL、100-199 为扩展 IP ACL，华为/H3C 段位含义类似；改动后立即影响命中流量，nat outbound 等引用处需同步核对"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "src_wild", "label": "源反掩码", "default": "0.0.0.255", "required": true, "validate": "masklen", "example": "0.0.0.255", "type": "string", "description": "源网段反掩码（wildcard mask），0 位精确匹配、1 位任意；与掩码写法相反（0.0.0.255 对应 /24）"}, {"name": "port", "label": "应用端口", "default": "0/0/0", "required": true, "validate": "port", "example": "0/0/0", "type": "string", "description": "接口名/接口编号，进入该接口视图后所做的配置只作用于这一个口；先 show/display 确认接口存在与状态——进错接口改配置是现场常见事故"}], "notes": "1) 路由器上 ACL 常被 NAT、策略路由、接口过滤复用，命名时写明用途（如 ACL-NAT-INSIDE）。\n2) 修改 ACL 是\"整条规则替换\"，不要试图只改一个字段，先 display acl 再改。\n3) 同时配 inbound/outbound 过滤会造成双向拦截，确认业务方向后再加第二条。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:54", "updated_at": "2026-10-09 13:45:35", "exec_level": "", "interactive": 0, "rollback": "# 回退：先解接口 traffic-filter 引用，再删 ACL 本体（顺序反了业务即断）\nsystem-view\ninterface GigabitEthernet {{port}}\n undo traffic-filter inbound acl {{acl_number}}\n undo traffic-filter outbound acl {{acl_number}}\n quit\nundo acl number {{acl_number}}\nquit\nsave\ny\n# 复核\ndisplay acl {{acl_number}}"}, {"uuid": "5e4c16e2-7840-5c40-88d9-eb5a6b179169", "platform": "network", "device_type": "路由器", "vendor": "huawei", "os_family": "vrp8", "models": "AR6000 / AR6500", "category": "NAT", "title": "配置 Easy IP 与地址池 PAT（AR 系列）", "description": "内网通过出接口地址做 Easy IP 转换，或使用公网地址池做 PAT；附端口映射写法。", "commands": "# ===== NAT / Easy IP + 地址池（华为 AR 路由器）=====\nsystem-view\nacl number {{acl_number}}\n rule 5 permit source {{src_net}} {{src_wild}}\n quit\n! ---- 方案A：Easy IP（借用出接口地址，最常用）----\nnat outbound {{acl_number}}\n! ---- 方案B：公网地址池 PAT ----\n! nat address-group {{group_id}}\n!  section {{section_start}} {{section_end}}\n! nat outbound {{acl_number}} address-group {{group_id}}\n! ---- 服务器端口映射（公网 8080 → 内网 80）----\n! nat server protocol tcp global {{public_ip}} {{public_port}} inside {{inside_server}} {{inside_port}}\ndisplay nat outbound\ndisplay nat session all\nsave\ny", "params": [{"name": "acl_number", "label": "ACL 编号", "default": "2000", "required": true, "validate": "int:1-3999", "example": "2000-2999", "type": "int", "range": "1-3999", "description": "ACL 编号，标识一条访问控制列表；Cisco 1-99 为标准 IP ACL、100-199 为扩展 IP ACL，华为/H3C 段位含义类似；改动后立即影响命中流量，nat outbound 等引用处需同步核对"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "src_wild", "label": "源反掩码", "default": "0.0.0.255", "required": true, "validate": "masklen", "example": "0.0.0.255", "type": "string", "description": "源网段反掩码（wildcard mask），0 位精确匹配、1 位任意；与掩码写法相反（0.0.0.255 对应 /24）"}, {"name": "group_id", "label": "地址池编号", "default": "1", "required": false, "validate": "int:0-7", "example": "0-7", "type": "int", "range": "0-7", "description": "NAT 地址池编号，PAT/地址池复用转换时的地址组标识；被 nat outbound 引用，改前先解除引用关系"}, {"name": "section_start", "label": "地址池起始", "default": "200.1.1.10", "required": false, "validate": "ipv4", "example": "200.1.1.10", "type": "ip", "description": "DHCP 地址段起始 IP（华为 section 写法）"}, {"name": "section_end", "label": "地址池结束", "default": "200.1.1.20", "required": false, "validate": "ipv4", "example": "200.1.1.20", "type": "ip", "description": "DHCP 地址段结束 IP（华为 section 写法），与 section_start 圈定分配范围"}, {"name": "public_ip", "label": "公网映射 IP", "default": "200.1.1.30", "required": false, "validate": "ipv4", "example": "200.1.1.30", "type": "ip", "description": "对外发布的公网/映射 IP，NAT 后外部访问的地址；须在上联口网段内且未被占用，冲突会绑定失败"}, {"name": "public_port", "label": "公网端口", "default": "8080", "required": false, "validate": "int:1-65535", "example": "8080", "type": "int", "range": "1-65535", "description": "对外映射端口号，DNAT 的外部端口；可与内部端口不同（如 8443→443）；与现有监听冲突会绑定失败"}, {"name": "inside_server", "label": "内网服务器", "default": "192.168.10.100", "required": false, "validate": "ipv4", "example": "192.168.10.100", "type": "ip", "description": "内网服务器真实 IP（NAT 发布的后端），对外映射的源地址；该主机须可达且服务在监听，否则映射是『空转』"}, {"name": "inside_port", "label": "内网端口", "default": "80", "required": false, "validate": "int:1-65535", "example": "80", "type": "int", "range": "1-65535", "description": "内网侧接口名或映射端口号，DNAT 流量的内部接收方向；写错映射不生效"}], "notes": "1) 端口映射写的是 protocol tcp global 公网IP 端口 inside 私网IP 端口，\n   端口号顺序极易写反，配完必须从外网实测。\n2) 多内网口 + 多外网口的场景要确认 NAT 是\"出接口方向\"还是\"全局 NAT\"，配错方向不通。\n3) display nat session all 看会话表是排查 NAT 最快的手段（有会话说明转换生效）。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:55", "updated_at": "2026-10-09 13:45:35", "exec_level": "", "interactive": 0, "rollback": "# 回退：进入出接口视图撤销 nat outbound 并删除 ACL（★ 接口名按变更记录回填；\n# 启用了地址池方案的还要 undo nat address-group {{group_id}}）\nsystem-view\ninterface GigabitEthernet <出接口名>\n undo nat outbound {{acl_number}}\n quit\nundo acl number {{acl_number}}\nquit\nsave\ny\n# 复核\ndisplay nat outbound"}, {"uuid": "fdddca04-3f13-51f9-a287-59b9c32c75b3", "platform": "network", "device_type": "路由器", "vendor": "huawei", "os_family": "vrp8", "models": "AR6000 / AR6500", "category": "SSH管理", "title": "开启 SSH 并创建本地管理用户（AR 系列）", "description": "生成 RSA 密钥、启用 stelnet、建 AAA 本地管理员并限制 vty 登录协议。", "commands": "# ===== 开启 SSH + 本地用户（华为 AR 路由器）=====\nsystem-view\nsysname {{hostname}}\nrsa local-key-pair create\n! 提示输入密钥位数，建议 2048\nstelnet server enable\nssh server cipher aes256_ctr aes128_ctr\nssh server hmac sha2_256\naaa\n local-user {{username}} password irreversible-cipher {{password}}\n local-user {{username}} privilege level 15\n local-user {{username}} service-type ssh\n quit\nuser-interface vty 0 4\n authentication-mode aaa\n protocol inbound ssh\n idle-timeout {{timeout_min}} 0\n quit\nsave\ny", "params": [{"name": "hostname", "label": "设备名", "default": "SW-CORE-01", "required": false, "validate": "", "example": "SW-CORE-01", "type": "string", "description": "设备主机名，标识作用不影响转发；修改后提示符与日志来源同步变化，网管侧如按主机名建资产需同步更新"}, {"name": "username", "label": "用户名", "default": "netadmin", "required": true, "validate": "", "example": "netadmin", "type": "string", "description": "登录账号名，认证身份标识；按人名/工号命名便于审计追责，禁用共享账号"}, {"name": "password", "label": "密码", "default": "", "required": true, "validate": "", "example": "现场生成：>=12位，含大小写/数字/符号", "type": "string", "description": "账号登录口令，认证凭据；配置中可能明文/弱加密存储，导出配置时必须脱敏；遵循强口令并定期轮换"}, {"name": "timeout_min", "label": "超时分钟数", "default": "10", "required": false, "validate": "int:0-35791", "example": "10", "type": "int", "range": "0-35791", "description": "登录空闲超时（分钟），无操作自动登出；现场建议 10-30 分钟；设太短频繁重登影响效率，太长有被冒用风险"}], "notes": "1) ssh server cipher / hmac 用来收紧加密算法（等保与漏扫常要求）；\n   老版本可能不支持这两条，报错就删掉。\n2) 先 rsa local-key-pair create 再 stelnet server enable，顺序反了会报错。\n3) 生产上建议再配 ACL 限制允许登录的源地址（并 ssh server acl <编号> 引用）。\n4) ★ 口令必须现场生成随机强口令，禁止沿用任何示例值；渲染对话框未填口令会标红并阻止生成。\n", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:55", "updated_at": "2026-10-09 13:45:35", "exec_level": "", "interactive": 0, "rollback": "# 回退：恢复 vty 旧认证方式并删除本地用户（sysname 旧值按变更记录恢复；\n# RSA 密钥保留不动——删除会断掉依赖它的 SSH 会话；stelnet 服务如需彻底关闭：\n# undo stelnet server enable，执行前确认 console 通道可用）\nsystem-view\nuser-interface vty 0 4\n undo authentication-mode\n undo protocol inbound\n undo idle-timeout\n quit\naaa\n undo local-user {{username}}\n quit\nsave\ny"}, {"uuid": "7d9ce289-0814-5fd1-b8ac-ef1c65102e9b", "platform": "network", "device_type": "路由器", "vendor": "huawei", "os_family": "vrp8", "models": "AR6000 / AR6500", "category": "密码", "title": "修改 Console 口令并绑定用户级别", "description": "设置 console 认证方式与口令、用户级别及空闲超时。", "commands": "# ===== Console 口令（华为 AR 路由器）=====\nsystem-view\nuser-interface console 0\n authentication-mode password\n set authentication password cipher {{console_password}}\n user privilege level {{privilege}}\n idle-timeout {{timeout_min}}\n quit\nsave\ny", "params": [{"name": "console_password", "label": "Console 口令", "default": "C0nsole@123", "required": true, "validate": "", "example": "C0nsole@123", "type": "string", "description": "Console 串口登录口令，控制带外接入认证；是网络故障时的最后生命线，遗忘只能走 recovery 流程；配置后立即生效"}, {"name": "privilege", "label": "用户级别", "default": "15", "required": false, "validate": "int:0-15", "example": "0-15，管理用 15", "type": "int", "range": "0-15", "description": "用户权限等级（华为 0-15），控制该账号可执行命令的范围；15 为最高权限，日常运维账号给最小够用等级"}, {"name": "timeout_min", "label": "超时分钟数", "default": "10", "required": false, "validate": "int:0-35791", "example": "10", "type": "int", "range": "0-35791", "description": "登录空闲超时（分钟），无操作自动登出；现场建议 10-30 分钟；设太短频繁重登影响效率，太长有被冒用风险"}], "notes": "1) 若已配置 authentication-mode aaa，console 登录要输用户名+口令，改口令要改 local-user。\n2) cipher 是密文存储；配置文件被别人拿到时，明文口令（simple）等于泄露。\n3) 现场忘记口令需要重启并在启动阶段按 Ctrl+B 进 BootROM 清空配置，属破坏性操作。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:55", "updated_at": "2026-10-09 13:45:36", "exec_level": "", "interactive": 0, "rollback": "# 回退：恢复 Console 旧口令与旧级别（旧值按变更记录回填尖括号处；\n# 若变更前 Console 未设口令：undo authentication-mode + undo set authentication password）\nsystem-view\nuser-interface console 0\n set authentication password cipher <旧console口令>\n user privilege level <旧级别>\n undo idle-timeout\n quit\nsave\ny"}, {"uuid": "f9ffa9c8-9d71-52d2-b18e-5f5de03746b8", "platform": "network", "device_type": "路由器", "vendor": "huawei", "os_family": "vrp8", "models": "AR6000 / AR6500", "category": "SNMP", "title": "配置 SNMP v2c 与 Trap 上报（AR 系列）", "description": "开启 SNMP、设置团体字与设备信息，并指定 Trap 上报目标与源接口。", "commands": "# ===== SNMP 配置（华为 AR 路由器）=====\nsystem-view\nsnmp-agent\nsnmp-agent sys-info version v2c\nsnmp-agent community read cipher {{ro_community}}\nsnmp-agent community write cipher {{rw_community}}\nsnmp-agent sys-info location {{location}}\nsnmp-agent sys-info contact {{contact}}\nsnmp-agent target-host trap address udp-domain {{nms_ip}} params securityname cipher {{ro_community}} v2c\nsnmp-agent trap enable\nsnmp-agent trap source GigabitEthernet{{trap_source_port}}\ndisplay snmp-agent sys-info\nsave\ny", "params": [{"name": "ro_community", "label": "只读团体字", "default": "RO@Public1", "required": true, "validate": "", "example": "RO@Public1", "type": "string", "description": "SNMP 只读团体字，等同口令——网管凭它采集设备数据；禁用 public 等弱值并限定来源；只读为主，写权限单独管理"}, {"name": "rw_community", "label": "读写团体字", "default": "RW@Public1", "required": true, "validate": "", "example": "RW@Public1", "type": "string", "description": "SNMP 读写团体字——持有即可远程修改设备配置，权限极高；仅必要时配置，务必限定来源网段并使用强值"}, {"name": "location", "label": "设备位置", "default": "IDC-A-机柜12", "required": false, "validate": "", "example": "IDC-A-机柜12", "type": "string", "description": "SNMP 系统位置（sysLocation）字段，标明设备物理位置（机房/机柜/U 位），告警现场定位依据；纯展示不影响功能"}, {"name": "contact", "label": "联系人", "default": "网络运维组", "required": false, "validate": "", "example": "网络运维组", "type": "string", "description": "SNMP 系统联系人（sysContact）字段，网管告警时定位责任人的依据；纯展示不影响功能"}, {"name": "nms_ip", "label": "网管服务器 IP", "default": "10.0.0.100", "required": true, "validate": "ipv4", "example": "10.0.0.100", "type": "ip", "description": "网管服务器（SNMP 采集/trap 接收）IP，设备向其发送告警并接受查询；填错网管侧收不到任何数据，等于监控失明"}, {"name": "trap_source_port", "label": "Trap 源接口", "default": "0/0/0", "required": false, "validate": "port", "example": "0/0/0", "type": "string", "description": "SNMP trap 源接口（华为），告警报文以该接口 IP 为源；网管侧按源 IP 建资产时须与其一致"}], "notes": "1) 双出口设备一定要配 snmp-agent trap source，否则 Trap 源地址是出接口地址，\n   网管侧可能收不到或被防火墙丢弃。\n2) 团体字要和网管平台注册的一致，区分大小写。\n3) 安全基线要求：删掉默认团体字；v2c 仅内网采集使用，能上 v3 就上 v3。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:55", "updated_at": "2026-10-09 13:45:36", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除本变更新增的 SNMP 配置（location/contact 旧值按变更记录恢复；\n# 变更前未启用 snmp-agent 的可再执行 undo snmp-agent 彻底关闭）\nsystem-view\nundo snmp-agent trap enable\nundo snmp-agent trap source\nundo snmp-agent target-host trap address udp-domain {{nms_ip}} params securityname cipher {{ro_community}}\nundo snmp-agent community cipher {{ro_community}}\nundo snmp-agent community cipher {{rw_community}}\nundo snmp-agent sys-info location\nundo snmp-agent sys-info contact\nquit\nsave\ny\n# 复核\ndisplay snmp-agent community"}, {"uuid": "76acfad9-7a89-5147-83e4-4faabf14425b", "platform": "network", "device_type": "路由器", "vendor": "huawei", "os_family": "vrp8", "models": "AR6000 / AR6500", "category": "保存配置", "title": "保存配置并备份到本地存储", "description": "保存配置到 vrpcfg.zip，并在 flash 里留一份可回滚的备份。", "commands": "# ===== 保存与本地备份（华为 AR 路由器）=====\nsave\ny\ndisplay saved-configuration\ndir flash:/\ncopy flash:/vrpcfg.zip flash:/vrpcfg-{{backup_tag}}.zip\ndir flash:/\n! 回滚：指定下次启动使用的配置文件（重启后生效）\n! startup saved-configuration vrpcfg-{{backup_tag}}.zip", "params": [{"name": "backup_tag", "label": "备份标记", "default": "20260920", "required": false, "validate": "", "example": "20260920 或变更单号", "type": "string", "description": "备份文件版本标签，拼进备份文件名（如 backup-20260930-pre-upgrade.cfg）便于追溯；建议用『日期-动作』格式，回滚时按标签定位对应版本"}], "notes": "1) save 跟 y 确认，或直接 save force。\n2) 备份文件名带日期或变更单号，现场多版本并存时才分得清。\n3) startup saved-configuration 指定的是\"下次启动\"用的配置，改错了重启后设备会变样，务必确认。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:55", "updated_at": "2026-10-09 13:45:36", "exec_level": "", "interactive": 0, "rollback": "# 回退：本条目仅保存与备份配置，不改变网络行为，无需配置回退；\n# 如需清理本次备份文件（delete 需交互确认）\ndelete flash:/vrpcfg-{{backup_tag}}.zip\ndir flash:/"}, {"uuid": "fc982ad5-2758-5749-9f78-a5b2b52e41db", "platform": "network", "device_type": "交换机", "vendor": "huawei", "os_family": "vrp5", "models": "S5700 / S5720 / S6720 / S5731", "category": "VLAN", "title": "创建 VLAN 并把端口划入 Access（S 系列）", "description": "新建业务 VLAN，用 port-group 把一批端口批量划为 access 并加入该 VLAN。", "commands": "# ===== 创建 VLAN 并划入端口（华为 VRP5 交换机）=====\nsystem-view\nvlan {{vlan_id}}\n description {{vlan_name}}\n quit\nport-group {{group_name}}\n group-member GigabitEthernet {{port_start}} to GigabitEthernet {{port_end}}\n port link-type access\n port default vlan {{vlan_id}}\n quit\nsave\ny", "params": [{"name": "vlan_id", "label": "VLAN ID", "default": "10", "required": true, "validate": "vlan", "example": "10", "type": "string", "description": "VLAN 编号，二层广播域标识；有效范围 1-4094（1 为默认 VLAN、1002-1005 系统保留）；Trunk 两端放行列表与 PVID 必须配套，改错会隔离业务"}, {"name": "vlan_name", "label": "VLAN 名称", "default": "OFFICE", "required": false, "validate": "", "example": "OFFICE", "type": "string", "description": "VLAN 名称，二层辨识用途；建议按业务语义命名（如 OA_BIZ），纯展示不影响转发"}, {"name": "group_name", "label": "临时组名", "default": "TEMP-GROUP", "required": false, "validate": "", "example": "TEMP-GROUP", "type": "string", "description": "端口组名称（华为 port-group），把多个物理口归入一组批量下发配置；删除端口组不影响已应用到成员口的配置"}, {"name": "port_start", "label": "起始端口", "default": "0/0/1", "required": true, "validate": "port", "example": "0/0/1", "type": "string", "description": "批量端口区间起始号，与 port_end 配套"}, {"name": "port_end", "label": "结束端口", "default": "0/0/10", "required": true, "validate": "port", "example": "0/0/10", "type": "string", "description": "批量端口区间结束号，与 port_start 圈定 range 范围；区间内包含不该动的口会被一起改——执行前逐口核对"}], "notes": "1) VRP 没有 Cisco 那种 interface range；批量配口用 port-group（较新版本支持），\n   老版本只能逐口 interface GigabitEthernet 0/0/1 敲。\n2) 华为交换机端口是三段式 槽位/子槽位/端口（0/0/1），不能按思科的 0/1 敲。\n3) save 会二次确认 [Y/N]，脚本里必须跟一行 y，否则粘贴后会一直停在提示符。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:55", "updated_at": "2026-10-09 13:45:36", "exec_level": "", "interactive": 0, "rollback": "# 回退：先在 port-group 内撤销端口属性（配置已下发到成员口，直接删组不生效），\n# 再删组与 VLAN\nsystem-view\nport-group {{group_name}}\n undo port link-type\n undo port default vlan\n quit\nundo port-group {{group_name}}\nundo vlan {{vlan_id}}\nquit\nsave\ny\n# 复核\ndisplay vlan"}, {"uuid": "79728290-89d3-56ba-abdb-c5707aead754", "platform": "network", "device_type": "交换机", "vendor": "huawei", "os_family": "vrp5", "models": "S5700 / S5720 / S6720", "category": "Trunk", "title": "配置 Trunk 口并放通指定 VLAN（S 系列）", "description": "把级联口配成 trunk，放通允许的 VLAN 列表并设置 PVID。", "commands": "# ===== 配置 Trunk 口（华为 VRP5 交换机）=====\nsystem-view\ninterface GigabitEthernet {{port}}\n port link-type trunk\n port trunk allow-pass vlan {{vlan_list}}\n port trunk pvid vlan {{pvid}}\n undo shutdown\n quit\nsave\ny", "params": [{"name": "port", "label": "端口", "default": "0/0/24", "required": true, "validate": "port", "example": "0/0/24", "type": "string", "description": "接口名/接口编号，进入该接口视图后所做的配置只作用于这一个口；先 show/display 确认接口存在与状态——进错接口改配置是现场常见事故"}, {"name": "vlan_list", "label": "放通 VLAN 列表", "default": "10 20 30", "required": true, "validate": "", "example": "10 20 30 或 10 to 20", "type": "string", "description": "Trunk 放行 VLAN 列表（如 10,20,30-40），控制哪些 VLAN 流量可通过该链路；漏放行业务 VLAN 会当场断流，改动立即生效"}, {"name": "pvid", "label": "PVID / Native VLAN", "default": "1", "required": false, "validate": "vlan", "example": "1", "type": "string", "description": "Trunk 口 PVID（untagged VLAN），决定无标签流量归入哪个 VLAN；两端 PVID 不一致会导致原生态流量进错 VLAN 丢失"}], "notes": "1) 华为是 allow-pass，别写成思科的 allowed；连续段用 \"vlan 10 to 20\"，\n   不连续列表用 \"vlan 10 20 30\"，两者不能混在一条命令里。\n2) port trunk allow-pass vlan all 会放通全部 VLAN，生产上有隔离要求时是个隐患。\n3) pvid 相当于思科的 native VLAN，两端必须一致。\n4) ★ 本条含 shutdown / undo shutdown 类端口操作：对生产端口执行会瞬断链路，请在业务低峰期变更，并确认有带外/备用管理通道再动手。\n", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:55", "updated_at": "2026-10-09 13:45:36", "exec_level": "", "interactive": 0, "rollback": "# 回退：撤销 Trunk 属性（本变更含 undo shutdown 开启端口，端口开闭状态\n# 按变更记录决定是否 shutdown 恢复；下联口回退前先确认防环路）\nsystem-view\ninterface GigabitEthernet {{port}}\n undo port trunk allow-pass vlan\n undo port trunk pvid vlan\n undo port link-type\n quit\nsave\ny\n# 复核\ndisplay port vlan"}, {"uuid": "9f24e321-8633-58e5-9059-a2023a9bee9b", "platform": "network", "device_type": "交换机", "vendor": "huawei", "os_family": "vrp5", "models": "S5700 三层 / S6720", "category": "静态路由", "title": "配置静态路由与缺省路由（三层交换机）", "description": "配置目的网段静态路由、缺省路由与浮动备份路由。", "commands": "# ===== 静态路由（华为 VRP5 三层交换机）=====\nsystem-view\nip route-static {{dest_net}} {{mask}} {{next_hop}}\nip route-static 0.0.0.0 0.0.0.0 {{next_hop}}\n! 浮动路由：preference 数值越大越不优先，主路由失效才生效\nip route-static {{dest_net}} {{mask}} {{backup_hop}} preference {{preference}}\ndisplay ip routing-table {{dest_net}}\nsave\ny", "params": [{"name": "dest_net", "label": "目的网段", "default": "192.168.20.0", "required": true, "validate": "ipv4", "example": "192.168.20.0", "type": "ip", "description": "目的网段地址，路由/策略匹配的目标方向；0.0.0.0/0 表示任意目的；方向写反会导致流量走错策略"}, {"name": "mask", "label": "掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "24 或 255.255.255.0", "type": "string", "description": "静态路由的点分十进制掩码，与 dest_net 圈定路由前缀；掩码写宽会吞掉相邻网段的路由匹配"}, {"name": "next_hop", "label": "下一跳地址", "default": "10.0.0.2", "required": true, "validate": "ipv4", "example": "10.0.0.2", "type": "ip", "description": "下一跳 IP，路由/策略转发的去向；必须是本机直连可达地址，写错路由成『黑洞』"}, {"name": "backup_hop", "label": "备份下一跳", "default": "10.0.0.3", "required": false, "validate": "ipv4", "example": "10.0.0.3", "type": "ip", "description": "浮动静态路由的备份下一跳，主路径失效后才接管转发；其管理距离/优先级必须大于主路由；须保证与本端直连可达"}, {"name": "preference", "label": "优先级", "default": "70", "required": false, "validate": "int:1-255", "example": "默认 60，备份建议 70", "type": "int", "range": "1-255", "description": "路由优先级（华为/H3C/Juniper），数值越小越优先（华为/H3C 静态默认 60）；浮动静态路由把备份侧 preference 调大"}], "notes": "1) 三层转发的前提是先建 vlanif 并在 vlanif 上配 IP，否则没有直连路由可用。\n2) preference 越小越优先（默认 60），写成 1 会让静态路由抢走 OSPF 的路由。\n3) 缺省路由写 ip route-static 0.0.0.0 0.0.0.0 <下一跳>，掩码写 0 或 0.0.0.0 都认。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:55", "updated_at": "2026-10-09 13:45:36", "exec_level": "", "interactive": 0, "rollback": "# 回退：逐条删除本变更新增的静态/缺省/浮动路由\nsystem-view\nundo ip route-static {{dest_net}} {{mask}} {{next_hop}}\nundo ip route-static 0.0.0.0 0.0.0.0 {{next_hop}}\nundo ip route-static {{dest_net}} {{mask}} {{backup_hop}} preference {{preference}}\nquit\nsave\ny\n# 复核\ndisplay ip routing-table {{dest_net}}"}, {"uuid": "cbeb3037-d375-599b-bace-3571fd3afee2", "platform": "network", "device_type": "交换机", "vendor": "huawei", "os_family": "vrp5", "models": "S5700 三层 / S6720", "category": "OSPF", "title": "配置 OSPF 基本组网（S 系列）", "description": "开启 OSPF 进程、指定 router-id、按区域宣告网段并静默业务口。", "commands": "# ===== OSPF 基本配置（华为 VRP5）=====\nsystem-view\nospf {{process_id}} router-id {{router_id}}\n area {{area_id}}\n  network {{network}} {{wildcard}}\n  quit\n silent-interface GigabitEthernet{{silent_port}}\n quit\ndisplay ospf peer\ndisplay ospf routing\nsave\ny", "params": [{"name": "process_id", "label": "进程号", "default": "1", "required": true, "validate": "int:1-65535", "example": "1", "type": "int", "range": "1-65535", "description": "OSPF 进程号（仅本机有效），标识一个 OSPF 实例；两端进程号可以不同，但网段/区域/认证必须匹配"}, {"name": "router_id", "label": "Router ID", "default": "1.1.1.1", "required": true, "validate": "ipv4", "example": "1.1.1.1", "type": "ip", "description": "OSPF Router ID（IPv4 格式），区域内唯一标识本路由器；重复会引发邻居震荡与路由抖动，建议用 loopback 接口地址"}, {"name": "area_id", "label": "区域号", "default": "0", "required": false, "validate": "", "example": "0 或 0.0.0.1", "type": "string", "description": "OSPF 区域 ID，控制该网段归属哪个 OSPF 区域；骨干区域固定 0.0.0.0，非骨干区域须与骨干直连（或虚链路）；填错邻居起不来、路由学不到"}, {"name": "network", "label": "宣告网段", "default": "10.0.0.0", "required": true, "validate": "ipv4", "example": "10.0.0.0", "type": "ip", "description": "OSPF 宣告网段，匹配哪些接口参与 OSPF 进程；与 wildcard 配套使用；宣告漏了/错了邻居和路由直接缺失"}, {"name": "wildcard", "label": "反掩码", "default": "0.0.0.255", "required": true, "validate": "masklen", "example": "0.0.0.255", "type": "string", "description": "OSPF/ACL 反掩码（wildcard），0 位精确匹配、1 位任意；0.0.0.255 对应 /24；写错宣告/匹配范围不对"}, {"name": "silent_port", "label": "静默接口", "default": "0/0/1", "required": false, "validate": "port", "example": "0/0/1", "type": "string", "description": "OSPF 静默接口（华为/H3C silent-interface），该口不收发 Hello；接终端的口建议设静默防误建邻居"}], "notes": "1) 华为 OSPF 用\"进程 → 区域 → network\"的嵌套视图，quit 的层数别数错。\n2) network 后面是反掩码；宣告错网段会出现接口 UP 但邻居起不来，先看 display ospf peer。\n3) silent-interface 让业务口不发不收 OSPF 报文（等效 Cisco 的 passive-interface），\n   接口段要写紧凑格式 GigabitEthernet0/0/1，带空格会解析失败。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:55", "updated_at": "2026-10-09 13:45:36", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除整个 OSPF 进程（进程若预存只是新增 network，则进视图逐条 undo network）\nsystem-view\nundo ospf {{process_id}}\nquit\nsave\ny\n# 复核\ndisplay ospf peer"}, {"uuid": "ea1fe386-ed49-5dd8-bbb4-00b33b0cf500", "platform": "network", "device_type": "交换机", "vendor": "huawei", "os_family": "vrp5", "models": "S5700 / S6720", "category": "ACL", "title": "配置 ACL 并应用到接口流量过滤", "description": "创建高级 ACL 限制网段互访，用 traffic-filter 绑到接口入方向。", "commands": "# ===== ACL 配置与下发（华为 VRP5）=====\nsystem-view\nacl number {{acl_number}}\n rule 5 permit ip source {{src_net}} {{src_wild}} destination {{dst_net}} {{dst_wild}}\n rule 10 deny ip\n quit\ninterface GigabitEthernet {{port}}\n traffic-filter inbound acl {{acl_number}}\n quit\ndisplay acl {{acl_number}}\nsave\ny", "params": [{"name": "acl_number", "label": "ACL 编号", "default": "3000", "required": true, "validate": "int:1-3999", "example": "2000-3999", "type": "int", "range": "1-3999", "description": "ACL 编号，标识一条访问控制列表；Cisco 1-99 为标准 IP ACL、100-199 为扩展 IP ACL，华为/H3C 段位含义类似；改动后立即影响命中流量，nat outbound 等引用处需同步核对"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "src_wild", "label": "源反掩码", "default": "0.0.0.255", "required": true, "validate": "masklen", "example": "0.0.0.255", "type": "string", "description": "源网段反掩码（wildcard mask），0 位精确匹配、1 位任意；与掩码写法相反（0.0.0.255 对应 /24）"}, {"name": "dst_net", "label": "目的网段", "default": "10.10.0.0", "required": true, "validate": "ipv4", "example": "10.10.0.0", "type": "ip", "description": "目的网段（ACL/防火墙策略匹配字段），0.0.0.0/0 表示任意目的；与反掩码/前缀长度配套使用；范围写宽会扩大放行面"}, {"name": "dst_wild", "label": "目的反掩码", "default": "0.0.255.255", "required": true, "validate": "masklen", "example": "0.0.255.255", "type": "string", "description": "目的网段反掩码（wildcard mask），0 位精确匹配、1 位任意；与子网掩码写法相反（0.0.0.255 对应 /24），写错匹配范围全错"}, {"name": "port", "label": "应用端口", "default": "0/0/1", "required": true, "validate": "port", "example": "0/0/1", "type": "string", "description": "接口名/接口编号，进入该接口视图后所做的配置只作用于这一个口；先 show/display 确认接口存在与状态——进错接口改配置是现场常见事故"}], "notes": "1) 基本 ACL 2000-2999 只能匹配源地址；高级 ACL 3000-3999 可匹配协议/源目/端口。\n2) rule 后面的数字是规则序号，默认步长 5；要插规则就用中间序号（如 rule 6），\n   序号小的先匹配，末尾隐含 deny。\n3) 华为应用到接口用 traffic-filter，H3C 用 packet-filter，两者别记混。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:55", "updated_at": "2026-10-09 13:45:37", "exec_level": "", "interactive": 0, "rollback": "# 回退：先解接口 traffic-filter 引用，再删 ACL 本体\nsystem-view\ninterface GigabitEthernet {{port}}\n undo traffic-filter inbound acl {{acl_number}}\n quit\nundo acl number {{acl_number}}\nquit\nsave\ny\n# 复核\ndisplay acl {{acl_number}}"}, {"uuid": "5a9b2932-b97d-50d4-8ab7-2a59c1e65804", "platform": "network", "device_type": "交换机", "vendor": "huawei", "os_family": "vrp5", "models": "S5700 系列（需支持 NAT 的型号）/ 建议改用 AR 系列", "category": "NAT", "title": "配置 NAT 地址转换（Easy IP）", "description": "内网匹配 ACL 后借用出接口地址做端口复用；也可指定地址池。", "commands": "# ===== NAT / Easy IP（华为 VRP5）=====\nsystem-view\nacl number {{acl_number}}\n rule 5 permit source {{src_net}} {{src_wild}}\n quit\ninterface GigabitEthernet {{outside_port}}\n ip address {{outside_ip}} {{outside_mask}}\n quit\n! Easy IP：直接借用出接口地址（最常用）\nnat outbound {{acl_number}}\n! 使用地址池做 PAT：\n! nat address-group {{group_id}}\n!  nat outbound {{acl_number}} address-group {{group_id}}\ndisplay nat outbound\nsave\ny", "params": [{"name": "acl_number", "label": "ACL 编号", "default": "3000", "required": true, "validate": "int:1-3999", "example": "2000-3999", "type": "int", "range": "1-3999", "description": "ACL 编号，标识一条访问控制列表；Cisco 1-99 为标准 IP ACL、100-199 为扩展 IP ACL，华为/H3C 段位含义类似；改动后立即影响命中流量，nat outbound 等引用处需同步核对"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "src_wild", "label": "源反掩码", "default": "0.0.0.255", "required": true, "validate": "masklen", "example": "0.0.0.255", "type": "string", "description": "源网段反掩码（wildcard mask），0 位精确匹配、1 位任意；与掩码写法相反（0.0.0.255 对应 /24）"}, {"name": "outside_port", "label": "出接口", "default": "0/0/1", "required": true, "validate": "port", "example": "0/0/1", "type": "string", "description": "外网侧接口名，NAT outside 方向的接口绑定；内外口方向标反 NAT 完全不生效"}, {"name": "outside_ip", "label": "出接口 IP", "default": "200.1.1.2", "required": true, "validate": "ipv4", "example": "200.1.1.2", "type": "ip", "description": "外网口 IP，NAT 转换后对外呈现的地址所在接口；须与上联网段规划一致且未被占用"}, {"name": "outside_mask", "label": "出接口掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "外网口子网掩码，与 outside_ip 配套"}, {"name": "group_id", "label": "地址池编号", "default": "1", "required": false, "validate": "int:0-7", "example": "0-7", "type": "int", "range": "0-7", "description": "NAT 地址池编号，PAT/地址池复用转换时的地址组标识；被 nat outbound 引用，改前先解除引用关系"}], "notes": "1) 纯二层 S5700-LI 不支持 NAT，需要 NAT 的场合请用 AR 路由器或支持 NAT 的三层型号，\n   上设备前先用 display version 确认产品形态。\n2) nat outbound <acl> 是 Easy IP（借用出接口地址）；带 address-group 才是地址池 PAT。\n3) ACL 匹配的是内网源地址，别写成公网地址。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:55", "updated_at": "2026-10-09 13:45:37", "exec_level": "", "interactive": 0, "rollback": "# 回退：出接口视图撤销 nat outbound 并删除 ACL（接口 IP 若为既有配置勿动；\n# 启用地址池方案的还要 undo nat address-group {{group_id}}）\nsystem-view\ninterface GigabitEthernet {{outside_port}}\n undo nat outbound {{acl_number}}\n quit\nundo acl number {{acl_number}}\nquit\nsave\ny\n# 复核\ndisplay nat outbound"}, {"uuid": "db7e7679-a4e4-51cc-ba17-156b1d8e98eb", "platform": "network", "device_type": "交换机", "vendor": "huawei", "os_family": "vrp5", "models": "S5700 / S5720 / S6720", "category": "SSH管理", "title": "开启 SSH 并创建本地管理用户（S 系列）", "description": "生成 RSA 密钥、启用 stelnet、建 AAA 本地用户、限制 vty 只用 SSH。", "commands": "# ===== 开启 SSH + 本地用户（华为 VRP5）=====\nsystem-view\nsysname {{hostname}}\nrsa local-key-pair create\n! 提示输入密钥位数，建议 2048\nstelnet server enable\naaa\n local-user {{username}} password irreversible-cipher {{password}}\n local-user {{username}} privilege level 15\n local-user {{username}} service-type ssh\n quit\nuser-interface vty 0 4\n authentication-mode aaa\n protocol inbound ssh\n idle-timeout {{timeout_min}} 0\n quit\nssh user {{username}} authentication-type password\nsave\ny", "params": [{"name": "hostname", "label": "设备名", "default": "SW-CORE-01", "required": false, "validate": "", "example": "SW-CORE-01", "type": "string", "description": "设备主机名，标识作用不影响转发；修改后提示符与日志来源同步变化，网管侧如按主机名建资产需同步更新"}, {"name": "username", "label": "用户名", "default": "netadmin", "required": true, "validate": "", "example": "netadmin", "type": "string", "description": "登录账号名，认证身份标识；按人名/工号命名便于审计追责，禁用共享账号"}, {"name": "password", "label": "密码", "default": "", "required": true, "validate": "", "example": "现场生成：>=12位，含大小写/数字/符号", "type": "string", "description": "账号登录口令，认证凭据；配置中可能明文/弱加密存储，导出配置时必须脱敏；遵循强口令并定期轮换"}, {"name": "timeout_min", "label": "超时分钟数", "default": "10", "required": false, "validate": "int:0-35791", "example": "10", "type": "int", "range": "0-35791", "description": "登录空闲超时（分钟），无操作自动登出；现场建议 10-30 分钟；设太短频繁重登影响效率，太长有被冒用风险"}], "notes": "1) 必须先 rsa local-key-pair create 生成密钥，否则 stelnet server enable 会报错。\n2) irreversible-cipher 是不可逆加密存储，比 cipher 更安全；密码至少 8 位含大小写数字。\n3) protocol inbound ssh 会禁掉 Telnet，改之前务必先确认 SSH 能登录，避免锁死设备。\n4) ★ 口令必须现场生成随机强口令，禁止沿用任何示例值；渲染对话框未填口令会标红并阻止生成。\n", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:55", "updated_at": "2026-10-09 13:45:37", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除 SSH 用户映射与本地用户，恢复 vty 旧认证（sysname 旧值按变更记录恢复；\n# RSA 密钥保留；stelnet 服务如需彻底关闭：undo stelnet server enable，\n# 执行前确认 console 通道可用）\nsystem-view\nundo ssh user {{username}}\nuser-interface vty 0 4\n undo authentication-mode\n undo protocol inbound\n undo idle-timeout\n quit\naaa\n undo local-user {{username}}\n quit\nsave\ny"}, {"uuid": "aec91111-a95a-5257-afc1-fef4195ad322", "platform": "network", "device_type": "交换机", "vendor": "huawei", "os_family": "vrp5", "models": "S5700 / S5720 / S6720", "category": "密码", "title": "修改 Console 口令与用户级别", "description": "设置 console 口认证方式与口令，并配置空闲超时。", "commands": "# ===== Console 口令（华为 VRP5）=====\nsystem-view\nuser-interface console 0\n authentication-mode password\n set authentication password cipher {{console_password}}\n user privilege level {{privilege}}\n idle-timeout {{timeout_min}}\n quit\nsave\ny", "params": [{"name": "console_password", "label": "Console 口令", "default": "C0nsole@123", "required": true, "validate": "", "example": "C0nsole@123", "type": "string", "description": "Console 串口登录口令，控制带外接入认证；是网络故障时的最后生命线，遗忘只能走 recovery 流程；配置后立即生效"}, {"name": "privilege", "label": "用户级别", "default": "15", "required": false, "validate": "int:0-15", "example": "0-15，管理用 15", "type": "int", "range": "0-15", "description": "用户权限等级（华为 0-15），控制该账号可执行命令的范围；15 为最高权限，日常运维账号给最小够用等级"}, {"name": "timeout_min", "label": "超时分钟数", "default": "10", "required": false, "validate": "int:0-35791", "example": "10", "type": "int", "range": "0-35791", "description": "登录空闲超时（分钟），无操作自动登出；现场建议 10-30 分钟；设太短频繁重登影响效率，太长有被冒用风险"}], "notes": "1) authentication-mode password 是\"只有口令\"；要用户名+口令请用 authentication-mode aaa\n   并配合本地 local-user 创建账号。\n2) cipher 表示按密文存储（输入的是明文，设备加密后保存）；忘记口令只能清空配置重来。\n3) user privilege level 15 才能进所有视图；给 0-1 级会出现能登录但什么都配不了。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:55", "updated_at": "2026-10-09 13:45:37", "exec_level": "", "interactive": 0, "rollback": "# 回退：恢复 Console 旧口令与旧级别（旧值按变更记录回填尖括号处；\n# 若变更前 Console 未设口令：undo authentication-mode + undo set authentication password）\nsystem-view\nuser-interface console 0\n set authentication password cipher <旧console口令>\n user privilege level <旧级别>\n undo idle-timeout\n quit\nsave\ny"}, {"uuid": "bd0741fb-c566-5c28-b34f-a83908946c5f", "platform": "network", "device_type": "交换机", "vendor": "huawei", "os_family": "vrp5", "models": "S5700 / S6720", "category": "SNMP", "title": "配置 SNMP v2c 与 Trap 上报（S 系列）", "description": "开启 SNMP 代理、设置团体字、位置联系人，并把 Trap 上报到网管服务器。", "commands": "# ===== SNMP 配置（华为 VRP5）=====\nsystem-view\nsnmp-agent\nsnmp-agent sys-info version v2c\nsnmp-agent community read cipher {{ro_community}}\nsnmp-agent community write cipher {{rw_community}}\nsnmp-agent sys-info location {{location}}\nsnmp-agent sys-info contact {{contact}}\nsnmp-agent target-host trap address udp-domain {{nms_ip}} params securityname cipher {{ro_community}} v2c\nsnmp-agent trap enable\ndisplay snmp-agent community\nsave\ny", "params": [{"name": "ro_community", "label": "只读团体字", "default": "RO@Public1", "required": true, "validate": "", "example": "RO@Public1", "type": "string", "description": "SNMP 只读团体字，等同口令——网管凭它采集设备数据；禁用 public 等弱值并限定来源；只读为主，写权限单独管理"}, {"name": "rw_community", "label": "读写团体字", "default": "RW@Public1", "required": true, "validate": "", "example": "RW@Public1", "type": "string", "description": "SNMP 读写团体字——持有即可远程修改设备配置，权限极高；仅必要时配置，务必限定来源网段并使用强值"}, {"name": "location", "label": "设备位置", "default": "IDC-A-机柜12", "required": false, "validate": "", "example": "IDC-A-机柜12", "type": "string", "description": "SNMP 系统位置（sysLocation）字段，标明设备物理位置（机房/机柜/U 位），告警现场定位依据；纯展示不影响功能"}, {"name": "contact", "label": "联系人", "default": "网络运维组", "required": false, "validate": "", "example": "网络运维组", "type": "string", "description": "SNMP 系统联系人（sysContact）字段，网管告警时定位责任人的依据；纯展示不影响功能"}, {"name": "nms_ip", "label": "网管服务器 IP", "default": "10.0.0.100", "required": true, "validate": "ipv4", "example": "10.0.0.100", "type": "ip", "description": "网管服务器（SNMP 采集/trap 接收）IP，设备向其发送告警并接受查询；填错网管侧收不到任何数据，等于监控失明"}], "notes": "1) community 后面跟 cipher 表示密文存储；团体字别用 public/private，安全审计会判违规。\n2) Trap 目标必须带 udp-domain 与 params securityname，只写 IP 是不生效的。\n3) 只用采集时给 read 团体字就够了，write 团体字有下发配置的风险。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:55", "updated_at": "2026-10-09 13:45:37", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除本变更新增的 SNMP 配置（location/contact 旧值按变更记录恢复；\n# 变更前未启用 snmp-agent 的可再执行 undo snmp-agent 彻底关闭）\nsystem-view\nundo snmp-agent trap enable\nundo snmp-agent target-host trap address udp-domain {{nms_ip}} params securityname cipher {{ro_community}}\nundo snmp-agent community cipher {{ro_community}}\nundo snmp-agent community cipher {{rw_community}}\nundo snmp-agent sys-info location\nundo snmp-agent sys-info contact\nquit\nsave\ny\n# 复核\ndisplay snmp-agent community"}, {"uuid": "66071ff1-752e-55a0-9a7b-fa0caaaa1c96", "platform": "network", "device_type": "交换机", "vendor": "huawei", "os_family": "vrp5", "models": "S5700 / S5720 / S6720", "category": "保存配置", "title": "保存配置并备份到本地 flash", "description": "保存当前配置到 vrpcfg.zip，并在 flash 里留一份带日期的备份文件。", "commands": "# ===== 保存与本地备份（华为 VRP5）=====\nsave\ny\ndisplay saved-configuration\ndir flash:/\n! 本地备份（隔离网络不依赖 FTP/TFTP）\ncopy flash:/vrpcfg.zip flash:/vrpcfg-{{backup_tag}}.zip\ndir flash:/", "params": [{"name": "backup_tag", "label": "备份标记", "default": "20260920", "required": false, "validate": "", "example": "20260920 或变更单号", "type": "string", "description": "备份文件版本标签，拼进备份文件名（如 backup-20260930-pre-upgrade.cfg）便于追溯；建议用『日期-动作』格式，回滚时按标签定位对应版本"}], "notes": "1) save 必须跟一行 y 确认；也可以用 save force 免交互直接落盘。\n2) 默认保存到 flash:/vrpcfg.zip，备份前先用 dir 确认实际文件名（部分版本名不同）。\n3) 改坏了可以用 startup saved-configuration 指定回滚文件后重启恢复。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:55", "updated_at": "2026-10-09 13:45:37", "exec_level": "", "interactive": 0, "rollback": "# 回退：本条目仅保存与备份配置，不改变网络行为，无需配置回退；\n# 如需清理本次备份文件（delete 需交互确认）\ndelete flash:/vrpcfg-{{backup_tag}}.zip\ndir flash:/"}, {"uuid": "2eb086b7-9e35-5a3e-b98b-68a782066662", "platform": "network", "device_type": "交换机", "vendor": "juniper", "os_family": "junos", "models": "EX2300 / EX3400 / EX4300 / QFX5100", "category": "VLAN", "title": "创建 VLAN 并把端口划入 Access（Junos）", "description": "用 set 形式创建 VLAN，把接口配上 access 模式并加入该 VLAN，最后 commit。", "commands": "# ===== 创建 VLAN 并划入端口（Junos EX/QFX）=====\nconfigure\nset vlans {{vlan_name}} vlan-id {{vlan_id}}\nset interfaces {{port}} unit 0 family ethernet-switching interface-mode access\nset interfaces {{port}} unit 0 family ethernet-switching vlan members {{vlan_name}}\nset interfaces {{port}} description \"{{port_desc}}\"\nshow | compare\ncommit and-quit\nshow vlans\nshow ethernet-switching table", "params": [{"name": "vlan_name", "label": "VLAN 名称", "default": "VLAN10-OFFICE", "required": true, "validate": "", "example": "VLAN10-OFFICE", "type": "string", "description": "VLAN 名称，二层辨识用途；建议按业务语义命名（如 OA_BIZ），纯展示不影响转发"}, {"name": "vlan_id", "label": "VLAN ID", "default": "10", "required": true, "validate": "vlan", "example": "10", "type": "string", "description": "VLAN 编号，二层广播域标识；有效范围 1-4094（1 为默认 VLAN、1002-1005 系统保留）；Trunk 两端放行列表与 PVID 必须配套，改错会隔离业务"}, {"name": "vlan_name", "label": "VLAN 名称", "default": "OFFICE", "required": false, "validate": "", "example": "OFFICE", "type": "string", "description": "VLAN 名称，二层辨识用途；建议按业务语义命名（如 OA_BIZ），纯展示不影响转发"}, {"name": "port", "label": "端口", "default": "ge-0/0/1", "required": true, "validate": "port", "example": "ge-0/0/1", "type": "string", "description": "接口名/接口编号，进入该接口视图后所做的配置只作用于这一个口；先 show/display 确认接口存在与状态——进错接口改配置是现场常见事故"}, {"name": "port_desc", "label": "端口描述", "default": "to-办公区", "required": false, "validate": "", "example": "to-办公区", "type": "string", "description": "接口描述文字，标注对端设备/用途；纯展示不影响转发"}], "notes": "1) Junos 改完必须 commit 才生效；commit and-quit 提交并退出配置模式，\n   rollback 0 丢弃未提交改动，rollback 1 回到上一次提交。\n2) members 写 VLAN 名称还是 VLAN ID 取决于版本：新版(15.1+)用名称，老版本可直接写 VLAN ID；\n   写错会提示对象不存在。\n3) 接口名是两段式 ge-0/0/1（FPC/PIC/端口），QFX 上常见 xe-/et- 前缀，别按思科 0/1 敲。\n4) show | compare 是 Junos 上最好用的自检命令，提交前一定要看一眼改了什么。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:55", "updated_at": "2026-10-09 13:45:38", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除本变更创建的 VLAN 与端口接入配置（candidate 模型，改完必须 commit）\nconfigure\ndelete interfaces {{port}} unit 0 family ethernet-switching vlan members {{vlan_name}}\ndelete interfaces {{port}} unit 0 family ethernet-switching interface-mode\ndelete interfaces {{port}} description\ndelete vlans {{vlan_name}}\ncommit and-quit\n# 复核\nshow vlans\nshow ethernet-switching interfaces {{port}}"}, {"uuid": "4b1d8884-23ae-52d6-b6f5-64e17784d73c", "platform": "network", "device_type": "交换机", "vendor": "juniper", "os_family": "junos", "models": "EX4300 / QFX5100 / EX3400", "category": "Trunk", "title": "配置 Trunk 口并放通 VLAN（Junos）", "description": "把上联口配成 trunk 模式，放通多个 VLAN 并设置 native-vlan-id。", "commands": "# ===== 配置 Trunk 口（Junos）=====\nconfigure\nset interfaces {{port}} unit 0 family ethernet-switching interface-mode trunk\nset interfaces {{port}} unit 0 family ethernet-switching vlan members {{vlan_list}}\nset interfaces {{port}} unit 0 family ethernet-switching native-vlan-id {{native_vlan}}\nset interfaces {{port}} description \"{{port_desc}}\"\nshow | compare\ncommit and-quit\nshow interfaces {{port}} | display set", "params": [{"name": "port", "label": "端口", "default": "ge-0/0/24", "required": true, "validate": "port", "example": "ge-0/0/24", "type": "string", "description": "接口名/接口编号，进入该接口视图后所做的配置只作用于这一个口；先 show/display 确认接口存在与状态——进错接口改配置是现场常见事故"}, {"name": "vlan_list", "label": "放通 VLAN", "default": "VLAN10-OFFICE VLAN20-FINANCE", "required": true, "validate": "", "example": "空格分隔的 VLAN 名称列表", "type": "string", "description": "Trunk 放行 VLAN 列表（如 10,20,30-40），控制哪些 VLAN 流量可通过该链路；漏放行业务 VLAN 会当场断流，改动立即生效"}, {"name": "native_vlan", "label": "Native VLAN ID", "default": "1", "required": false, "validate": "vlan", "example": "1", "type": "string", "description": "Trunk 口 Native VLAN（untagged 承载的 VLAN），两端必须一致否则原生流量跨链路丢失；安全上建议改掉默认 VLAN 1，设为闲置 VLAN"}, {"name": "port_desc", "label": "端口描述", "default": "to-核心交换机", "required": false, "validate": "", "example": "to-核心交换机", "type": "string", "description": "接口描述文字，标注对端设备/用途；纯展示不影响转发"}], "notes": "1) Junos 的成员列表是\"空格分隔\"，与思科/华为的逗号或 to 段完全不同：\n   set ... vlan members VLAN10-OFFICE VLAN20-FINANCE\n2) native-vlan-id 写在 family ethernet-switching 层，不是写在 unit 上。\n3) trunk 放通全部用 vlan members all；生产上建议显式列举，便于审计。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:55", "updated_at": "2026-10-09 13:45:38", "exec_level": "", "interactive": 0, "rollback": "# 回退：撤销 Trunk 属性（下联口回退前先确认防环路）\nconfigure\ndelete interfaces {{port}} unit 0 family ethernet-switching vlan members\ndelete interfaces {{port}} unit 0 family ethernet-switching native-vlan-id\ndelete interfaces {{port}} unit 0 family ethernet-switching interface-mode\ndelete interfaces {{port}} description\ncommit and-quit\n# 复核\nshow interfaces {{port}} | display set"}, {"uuid": "c7a88531-3888-5a30-8fa2-851f6c7b540d", "platform": "network", "device_type": "路由器", "vendor": "juniper", "os_family": "junos", "models": "SRX300/1500 / MX / EX 三层", "category": "静态路由", "title": "配置静态路由与浮动备份（Junos）", "description": "用 CIDR 前缀写静态路由，并给出 qualified-next-hop 做备份的写法。", "commands": "# ===== 静态路由（Junos）=====\nconfigure\nset routing-options static route {{dest_net}}/{{prefix_len}} next-hop {{next_hop}}\nset routing-options static route 0.0.0.0/0 next-hop {{next_hop}}\n! 浮动备份：qualified-next-hop + preference（静态路由默认 preference 为 5）\nset routing-options static route {{dest_net}}/{{prefix_len}} preference {{main_preference}}\nset routing-options static route {{dest_net}}/{{prefix_len}} qualified-next-hop {{backup_hop}} preference {{preference}}\nshow | compare\ncommit and-quit\nshow route {{dest_net}}/{{prefix_len}}\nshow route protocol static", "params": [{"name": "dest_net", "label": "目的网段", "default": "192.168.20.0", "required": true, "validate": "ipv4", "example": "192.168.20.0", "type": "ip", "description": "目的网段地址，路由/策略匹配的目标方向；0.0.0.0/0 表示任意目的；方向写反会导致流量走错策略"}, {"name": "prefix_len", "label": "前缀长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24（Junos 用 CIDR 不用掩码）", "type": "int", "range": "0-32", "description": "前缀长度（0-32），与 IP 组成 CIDR（如 /24）；写错网段判定全错，远程操作可能当场断 SSH"}, {"name": "next_hop", "label": "下一跳地址", "default": "10.0.0.2", "required": true, "validate": "ipv4", "example": "10.0.0.2", "type": "ip", "description": "下一跳 IP，路由/策略转发的去向；必须是本机直连可达地址，写错路由成『黑洞』"}, {"name": "backup_hop", "label": "备份下一跳", "default": "10.0.0.3", "required": false, "validate": "ipv4", "example": "10.0.0.3", "type": "ip", "description": "浮动静态路由的备份下一跳，主路径失效后才接管转发；其管理距离/优先级必须大于主路由；须保证与本端直连可达"}, {"name": "preference", "label": "备份优先级", "default": "10", "required": false, "validate": "int:1-255", "example": "备份写 10，比主路由 5 大", "type": "int", "range": "1-255", "description": "路由优先级（华为/H3C/Juniper），数值越小越优先（华为/H3C 静态默认 60）；浮动静态路由把备份侧 preference 调大"}, {"name": "main_preference", "label": "主路由优先级", "default": "5", "required": false, "validate": "int:1-255", "example": "静态默认 5", "type": "int", "range": "1-255", "description": "Juniper 静态路由 preference（默认 5），数值越小越优先；备份路由把 preference 调大实现浮动切换"}], "notes": "1) Junos 写 CIDR 前缀（192.168.20.0/24），不能写点分掩码，这是最容易出错的地方。\n2) preference 越小越优先：静态默认 5、OSPF 内部 10、BGP 170。做备份把 preference 调大即可。\n3) 删路由用整条 delete：delete routing-options static route 192.168.20.0/24\n4) show route protocol static 只看静态路由，比看全表快得多。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:55", "updated_at": "2026-10-09 13:45:38", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除本变更新增的静态路由（delete 整条路由会连带 qualified-next-hop 一并删除；\n# 默认路由若变更前不存在则 delete routing-options static route 0.0.0.0/0）\nconfigure\ndelete routing-options static route {{dest_net}}/{{prefix_len}}\ndelete routing-options static route 0.0.0.0/0 next-hop {{next_hop}}\ncommit and-quit\n# 复核\nshow route {{dest_net}}/{{prefix_len}}"}, {"uuid": "8fe8f10d-ee6a-5b19-bbe3-51096df96a7b", "platform": "network", "device_type": "路由器", "vendor": "juniper", "os_family": "junos", "models": "SRX / MX / EX 三层", "category": "OSPF", "title": "配置 OSPF 基本组网（Junos）", "description": "按接口宣告 OSPF（Junos 没有 network 语句），指定区域、router-id 并设置被动接口。", "commands": "# ===== OSPF 基本配置（Junos）=====\nconfigure\nset routing-options router-id {{router_id}}\nset protocols ospf area {{area_id}} interface {{uplink_port}}.0\nset protocols ospf area {{area_id}} interface {{port}}.0\nset protocols ospf area {{area_id}} interface {{port}}.0 passive\nset protocols ospf area {{area_id}} interface lo0.0 passive\nshow | compare\ncommit and-quit\nshow ospf neighbor\nshow ospf interface\nshow route protocol ospf", "params": [{"name": "router_id", "label": "Router ID", "default": "1.1.1.1", "required": true, "validate": "ipv4", "example": "1.1.1.1", "type": "ip", "description": "OSPF Router ID（IPv4 格式），区域内唯一标识本路由器；重复会引发邻居震荡与路由抖动，建议用 loopback 接口地址"}, {"name": "area_id", "label": "区域号", "default": "0.0.0.0", "required": false, "validate": "", "example": "0.0.0.0（Junos 用点分格式）", "type": "string", "description": "OSPF 区域 ID，控制该网段归属哪个 OSPF 区域；骨干区域固定 0.0.0.0，非骨干区域须与骨干直连（或虚链路）；填错邻居起不来、路由学不到"}, {"name": "port", "label": "业务接口（被动）", "default": "ge-0/0/1", "required": true, "validate": "port", "example": "ge-0/0/1", "type": "string", "description": "接口名/接口编号，进入该接口视图后所做的配置只作用于这一个口；先 show/display 确认接口存在与状态——进错接口改配置是现场常见事故"}, {"name": "uplink_port", "label": "上行接口（非被动）", "default": "ge-0/0/24", "required": true, "validate": "port", "example": "ge-0/0/24", "type": "string", "description": "OSPF 上联接口——被动接口策略中的例外口，no passive 恢复收发 Hello 建邻居；只放开必要上联口"}], "notes": "1) Junos 的 OSPF 是\"接口级宣告\"，没有 network 语句；接口必须带 unit 号（ge-0/0/1.0）。\n2) 区域号用点分格式 0.0.0.0；写 0 会被 Junos 自动展开，但显式写更清楚。\n3) 被动接口就是在同一行末尾加 passive（不用另起 passive-interface 命令）。\n4) 改 router-id 后需要 clear ospf neighbor 或重启路由进程才生效，生产环境慎用。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:56", "updated_at": "2026-10-09 13:45:38", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除 OSPF area 配置（★ 该 area 下若有其它既有接口会一并删除，\n# 谨慎起见也可只 delete 本变更新增的 interface 条目；router-id 旧值按变更记录恢复）\nconfigure\ndelete protocols ospf area {{area_id}}\ndelete routing-options router-id\ncommit and-quit\n# 复核\nshow ospf neighbor"}, {"uuid": "e8e21247-766d-5b28-bdb4-25afbc67c7d3", "platform": "network", "device_type": "路由器", "vendor": "juniper", "os_family": "junos", "models": "SRX / EX / MX 全系列", "category": "ACL", "title": "配置防火墙过滤器（Junos Firewall Filter）并应用", "description": "创建 family inet filter，按 term 匹配源/目的并 accept/discard，绑定到接口方向。", "commands": "# ===== 防火墙过滤器（Junos）=====\nconfigure\nset firewall family inet filter {{filter_name}} term ALLOW-INTERNAL from source-address {{src_net}}/{{src_prefix}}\nset firewall family inet filter {{filter_name}} term ALLOW-INTERNAL from destination-address {{dst_net}}/{{dst_prefix}}\nset firewall family inet filter {{filter_name}} term ALLOW-INTERNAL then accept\nset firewall family inet filter {{filter_name}} term DENY-LOG from source-address 0.0.0.0/0\nset firewall family inet filter {{filter_name}} term DENY-LOG then count DENY-COUNT\nset firewall family inet filter {{filter_name}} term DENY-LOG then discard\nset interfaces {{port}} unit 0 family inet filter input {{filter_name}}\nshow | compare\ncommit and-quit\nshow firewall filter {{filter_name}}\nshow firewall", "params": [{"name": "filter_name", "label": "过滤器名称", "default": "FILTER-IN-OFFICE", "required": true, "validate": "", "example": "FILTER-IN-OFFICE", "type": "string", "description": "Juniper 防火墙过滤器（firewall filter）名，定义流量匹配与动作；应用到接口 family inet 后生效，配错可能把管理流量一起过滤掉"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "src_prefix", "label": "源前缀长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24", "type": "int", "range": "0-32", "description": "源网段前缀长度（0-32），与 src_net 组成 CIDR"}, {"name": "dst_net", "label": "目的网段", "default": "10.10.0.0", "required": true, "validate": "ipv4", "example": "10.10.0.0", "type": "ip", "description": "目的网段（ACL/防火墙策略匹配字段），0.0.0.0/0 表示任意目的；与反掩码/前缀长度配套使用；范围写宽会扩大放行面"}, {"name": "dst_prefix", "label": "目的前缀长度", "default": "16", "required": true, "validate": "int:0-32", "example": "16", "type": "int", "range": "0-32", "description": "目的网段前缀长度（0-32），与 dst_net 组成 CIDR；写宽扩大匹配面，放行面随之变大"}, {"name": "port", "label": "应用接口", "default": "ge-0/0/1", "required": true, "validate": "port", "example": "ge-0/0/1", "type": "string", "description": "接口名/接口编号，进入该接口视图后所做的配置只作用于这一个口；先 show/display 确认接口存在与状态——进错接口改配置是现场常见事故"}], "notes": "1) Junos filter 未匹配任何 term 时默认丢弃（与思科隐含 deny 一致），所以放通规则要写在前面。\n2) term 按书写顺序匹配，先匹配先生效；要插规则得用 insert 或调整顺序。\n3) 绑定方向必须写明 input/output：set interfaces ge-0/0/1 unit 0 family inet filter input <名称>。\n4) 加 then count 统计命中，show firewall 能看到每个 term 的实际命中数，排查特别快。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:56", "updated_at": "2026-10-09 13:45:39", "exec_level": "", "interactive": 0, "rollback": "# 回退：先解接口 filter 引用，再删 filter 本体（顺序反了 commit 会被拒绝）\nconfigure\ndelete interfaces {{port}} unit 0 family inet filter input {{filter_name}}\ndelete firewall family inet filter {{filter_name}}\ncommit and-quit\n# 复核\nshow firewall"}, {"uuid": "d0ae3c17-7ead-5779-b727-122575241872", "platform": "network", "device_type": "防火墙", "vendor": "juniper", "os_family": "junos", "models": "SRX300 / SRX1500 / SRX3400", "category": "NAT", "title": "配置源 NAT（PAT）与目的 NAT（端口映射）", "description": "SRX 的 NAT 必须配合安全区域与策略：先配 zone、再配 NAT 规则集、最后放行策略。", "commands": "# ===== 源 NAT + 目的 NAT（Junos SRX）=====\nconfigure\n! ---- 1) 接口先划入安全区域（NAT 与策略都依赖 zone）----\nset security zones security-zone trust interfaces {{inside_port}}.0\nset security zones security-zone untrust interfaces {{outside_port}}.0\n! ---- 2) 源 NAT（PAT：借用出接口地址）----\nset security nat source rule-set SNAT-RS from zone trust\nset security nat source rule-set SNAT-RS to zone untrust\nset security nat source rule-set SNAT-RS rule SNAT-R1 match source-address {{src_net}}/{{src_prefix}}\nset security nat source rule-set SNAT-RS rule SNAT-R1 then source-nat interface\n! ---- 3) 目的 NAT（公网端口 → 内网服务器端口）----\nset security nat destination pool {{pool_name}} address {{inside_ip}}/32\nset security nat destination pool {{pool_name}} address port {{inside_port}}\nset security nat destination rule-set DNAT-RS from zone untrust\nset security nat destination rule-set DNAT-RS rule DNAT-R1 match destination-address {{public_ip}}/32\nset security nat destination rule-set DNAT-RS rule DNAT-R1 match destination-port {{public_port}}\nset security nat destination rule-set DNAT-RS rule DNAT-R1 then destination-nat pool {{pool_name}}\n! ---- 4) 安全策略放行（不做这步 NAT 生效也不通）----\nset security policies from-zone trust to-zone untrust policy ALLOW-OUT match source-address any\nset security policies from-zone trust to-zone untrust policy ALLOW-OUT match destination-address any\nset security policies from-zone trust to-zone untrust policy ALLOW-OUT match application any\nset security policies from-zone trust to-zone untrust policy ALLOW-OUT then permit\nshow | compare\ncommit and-quit\nshow security nat source summary\nshow security flow session", "params": [{"name": "inside_port", "label": "内网接口", "default": "ge-0/0/1", "required": true, "validate": "port", "example": "ge-0/0/1", "type": "string", "description": "内网侧接口名或映射端口号，DNAT 流量的内部接收方向；写错映射不生效"}, {"name": "outside_port", "label": "外网接口", "default": "ge-0/0/0", "required": true, "validate": "port", "example": "ge-0/0/0", "type": "string", "description": "外网侧接口名，NAT outside 方向的接口绑定；内外口方向标反 NAT 完全不生效"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "src_prefix", "label": "源前缀长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24", "type": "int", "range": "0-32", "description": "源网段前缀长度（0-32），与 src_net 组成 CIDR"}, {"name": "pool_name", "label": "地址池名", "default": "DNAT-POOL-WEB", "required": true, "validate": "", "example": "DNAT-POOL-WEB", "type": "string", "description": "DHCP 地址池名称，查询/管理地址池的对象名（display ip pool name 使用）"}, {"name": "inside_ip", "label": "内网服务器", "default": "192.168.10.100", "required": true, "validate": "ipv4", "example": "192.168.10.100", "type": "ip", "description": "NAT 映射的内网真实 IP（被发布服务器的地址），DNAT 后流量的真正去向；填错把外部流量引到错误主机"}, {"name": "inside_port", "label": "内网端口", "default": "80", "required": true, "validate": "int:1-65535", "example": "80", "type": "int", "range": "1-65535", "description": "内网侧接口名或映射端口号，DNAT 流量的内部接收方向；写错映射不生效"}, {"name": "public_ip", "label": "公网 IP", "default": "200.1.1.30", "required": true, "validate": "ipv4", "example": "200.1.1.30", "type": "ip", "description": "对外发布的公网/映射 IP，NAT 后外部访问的地址；须在上联口网段内且未被占用，冲突会绑定失败"}, {"name": "public_port", "label": "公网端口", "default": "8080", "required": true, "validate": "int:1-65535", "example": "8080", "type": "int", "range": "1-65535", "description": "对外映射端口号，DNAT 的外部端口；可与内部端口不同（如 8443→443）；与现有监听冲突会绑定失败"}], "notes": "1) SRX 的 NAT 一定要\"接口划 zone → NAT 规则集 → 安全策略\"三步齐全，缺一步表现为\"配了不通\"。\n2) source-nat interface 就是 PAT（借用出接口地址）；要指定地址池用 source-nat pool <池名>。\n3) 目的 NAT 的端口写在 pool 的 address ... port 上，公网端口写在 match destination-port。\n4) show security flow session 看会话是否建立，是排查 SRX 转发问题最快的办法。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:56", "updated_at": "2026-10-09 13:45:39", "exec_level": "", "interactive": 0, "rollback": "# 回退：按创建逆序删除 NAT 与安全策略（★ zone 内接口划分若变更前不存在再删，\n# 否则保留——zone 删除会连带影响依赖它的策略）\nconfigure\ndelete security policies from-zone trust to-zone untrust policy ALLOW-OUT\ndelete security nat destination rule-set DNAT-RS\ndelete security nat destination pool {{pool_name}}\ndelete security nat source rule-set SNAT-RS\ndelete security zones security-zone trust interfaces {{inside_port}}.0\ndelete security zones security-zone untrust interfaces {{outside_port}}.0\ncommit and-quit\n# 复核\nshow security nat source summary\nshow security policies"}, {"uuid": "7a6092d4-a515-5f25-9af1-0550a38f8ec1", "platform": "network", "device_type": "交换机", "vendor": "juniper", "os_family": "junos", "models": "EX / QFX / SRX 全系列", "category": "SSH管理", "title": "开启 SSH 并创建管理用户（Junos）", "description": "配置主机名域名、开启 SSHv2、禁止 root 直登，并创建超级用户。", "commands": "# ===== 开启 SSH + 管理用户（Junos）=====\nconfigure\nset system host-name {{hostname}}\nset system domain-name {{domain}}\nset system services ssh protocol-version v2\nset system services ssh root-login deny\nset system services ssh connection-limit 5\nset system login user {{username}} uid {{uid}} class super-user\nset system login user {{username}} authentication encrypted-password \"{{password_hash}}\"\nset system login message \"{{banner}}\"\nshow | compare\ncommit and-quit\nshow system users\nshow system services", "params": [{"name": "hostname", "label": "设备名", "default": "SW-CORE-01", "required": false, "validate": "", "example": "SW-CORE-01", "type": "string", "description": "设备主机名，标识作用不影响转发；修改后提示符与日志来源同步变化，网管侧如按主机名建资产需同步更新"}, {"name": "domain", "label": "域名", "default": "corp.local", "required": true, "validate": "", "example": "corp.local", "type": "string", "description": "设备域名后缀（ip domain-name / domain-name），用于 DNS 解析补全与 SSH RSA 密钥生成；改后提示符与解析习惯同步变化"}, {"name": "username", "label": "用户名", "default": "netadmin", "required": true, "validate": "", "example": "netadmin", "type": "string", "description": "登录账号名，认证身份标识；按人名/工号命名便于审计追责，禁用共享账号"}, {"name": "uid", "label": "用户 UID", "default": "2001", "required": true, "validate": "int:100-64000", "example": "2001（不要用 0）", "type": "int", "range": "100-64000", "description": "Juniper 用户 UID（系统内部编号），同设备内必须唯一；冲突会导致权限判定混乱"}, {"name": "password_hash", "label": "加密口令串", "default": "$1$AbCdEfGh$XyZ1234567890abcdef", "required": true, "validate": "", "example": "Junos 的 $1$/$6$ 加密串", "type": "string", "description": "Juniper 已加密口令哈希（encrypted-password），直接写入配置完成认证设定；哈希与设备算法须匹配，从他机导入时确认来源可靠"}, {"name": "banner", "label": "登录提示语", "default": "仅授权人员可登录，操作留痕", "required": false, "validate": "", "example": "仅授权人员可登录", "type": "string", "description": "登录公告文字，用户认证前显示的法律/告警声明；纯提示不影响认证；含空格须整体引号包裹"}], "notes": "1) Junos 上没有\"明文口令\"参数可安全用于脚本：set ... authentication plain-text-password\n   会交互提示输入两次口令，脚本粘贴进去会停在提示符上不动 —— 现场必须手工敲。\n2) 想在脚本里一次配好，用 encrypted-password 直接贴 $1$/$6$ 加密串\n   （可先在设备上用 plain-text-password 配好，再 show configuration 取出复用）。\n3) root-login deny 是安全基线要求；uid 不要用 0（0 是 root）。\n4) class 决定权限：super-user / operator / read-only，管理用 super-user。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:56", "updated_at": "2026-10-09 13:45:39", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除本变更新增项（host-name/domain-name 旧值按变更记录回填；\n# 若变更前未设置则执行 delete system host-name / delete system domain-name）\nconfigure\ndelete system login user {{username}}\ndelete system login message\ndelete system services ssh\ncommit and-quit\n# 复核\nshow system services\nshow system users"}, {"uuid": "1838b1c2-bd11-59bb-9b3d-a3f803589144", "platform": "network", "device_type": "交换机", "vendor": "juniper", "os_family": "junos", "models": "EX / QFX / SRX 全系列", "category": "密码", "title": "设置 root 口令与登录用户口令（Junos）", "description": "Junos 无独立 console 口令，console 使用 root 或登录用户账号；root 口令必须先设。", "commands": "# ===== root 与用户口令（Junos）=====\nconfigure\n! root 口令：是 commit 的门槛（未设 root 口令时无法提交配置）\nset system root-authentication plain-text-password\n! ↑ 交互提示 Enter new password / Retype new password，必须手工输入\n! ---- 新建或改已有管理用户的口令 ----\nset system login user {{username}} class super-user uid {{uid}}\nset system login user {{username}} authentication plain-text-password\n! ↑ 同样交互输入两次\nset system login password minimum-length {{min_len}}\nset system login password change-type character-sets\nshow | compare\ncommit and-quit\nshow system login", "params": [{"name": "username", "label": "用户名", "default": "netadmin", "required": true, "validate": "", "example": "netadmin", "type": "string", "description": "登录账号名，认证身份标识；按人名/工号命名便于审计追责，禁用共享账号"}, {"name": "uid", "label": "用户 UID", "default": "2001", "required": false, "validate": "int:100-64000", "example": "2001", "type": "int", "range": "100-64000", "description": "Juniper 用户 UID（系统内部编号），同设备内必须唯一；冲突会导致权限判定混乱"}, {"name": "min_len", "label": "口令最小长度", "default": "12", "required": false, "validate": "int:6-20", "example": "6-20，建议 12", "type": "int", "range": "6-20", "description": "口令最小长度，常见 8-12 位；配合复杂度策略（数字/特殊字符下限）使用"}], "notes": "1) Junos 的 console 没有独立口令：console 登录用 root 或普通用户账号，改口令就是改账号口令。\n2) set system root-authentication plain-text-password 是**交互式**命令：粘贴脚本后会停在\n   \"Enter new password:\" 等待输入，这是 Junos 上最常见的\"脚本卡住\"原因。\n3) 忘记 root 口令的恢复方式：重启，在 loader 提示符下 boot -s 进单用户模式改配置，\n   属破坏性操作，需现场做且建议先导出配置。\n4) 安全基线：口令长度 ≥12、启用复杂度（change-type character-sets）、root-login deny。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:56", "updated_at": "2026-10-09 13:45:39", "exec_level": "", "interactive": 1, "rollback": "# 回退：口令类变更须恢复旧口令（均为交互式输入，旧值按变更记录掌握；\n# root：set system root-authentication plain-text-password；\n# 用户：set system login user {{username}} authentication plain-text-password）\nconfigure\nset system login password minimum-length <旧min_len>\ndelete system login password change-type\ncommit and-quit\n# 复核\nshow system login"}, {"uuid": "1f3f324e-2420-5fdc-abd2-ac860cf74997", "platform": "network", "device_type": "交换机", "vendor": "juniper", "os_family": "junos", "models": "EX / QFX / SRX 全系列", "category": "SNMP", "title": "配置 SNMP v2c 与 Trap 目标（Junos）", "description": "创建只读/读写团体字、设备位置联系人，并指定 Trap 上报目标。", "commands": "# ===== SNMP 配置（Junos）=====\nconfigure\nset snmp community {{ro_community}} authorization read-only\nset snmp community {{ro_community}} clients {{nms_ip}}/32\nset snmp community {{rw_community}} authorization read-write\nset snmp location \"{{location}}\"\nset snmp contact \"{{contact}}\"\nset snmp description \"{{description}}\"\nset snmp trap-group {{trap_group}} version v2\nset snmp trap-group {{trap_group}} categories link\nset snmp trap-group {{trap_group}} targets {{nms_ip}}\nshow | compare\ncommit and-quit\nshow snmp community\nshow snmp statistics", "params": [{"name": "ro_community", "label": "只读团体字", "default": "RO@Public1", "required": true, "validate": "", "example": "RO@Public1", "type": "string", "description": "SNMP 只读团体字，等同口令——网管凭它采集设备数据；禁用 public 等弱值并限定来源；只读为主，写权限单独管理"}, {"name": "rw_community", "label": "读写团体字", "default": "RW@Public1", "required": true, "validate": "", "example": "RW@Public1", "type": "string", "description": "SNMP 读写团体字——持有即可远程修改设备配置，权限极高；仅必要时配置，务必限定来源网段并使用强值"}, {"name": "location", "label": "设备位置", "default": "IDC-A-机柜12", "required": false, "validate": "", "example": "IDC-A-机柜12", "type": "string", "description": "SNMP 系统位置（sysLocation）字段，标明设备物理位置（机房/机柜/U 位），告警现场定位依据；纯展示不影响功能"}, {"name": "contact", "label": "联系人", "default": "网络运维组", "required": false, "validate": "", "example": "网络运维组", "type": "string", "description": "SNMP 系统联系人（sysContact）字段，网管告警时定位责任人的依据；纯展示不影响功能"}, {"name": "nms_ip", "label": "网管服务器 IP", "default": "10.0.0.100", "required": true, "validate": "ipv4", "example": "10.0.0.100", "type": "ip", "description": "网管服务器（SNMP 采集/trap 接收）IP，设备向其发送告警并接受查询；填错网管侧收不到任何数据，等于监控失明"}, {"name": "description", "label": "设备描述", "default": "SW-CORE-01", "required": false, "validate": "", "example": "SW-CORE-01", "type": "string", "description": "接口/SNMP 的描述文字（如接口对端、设备位置），仅运维辨识用途、不影响转发与匹配"}, {"name": "trap_group", "label": "Trap 组名", "default": "NMS-TRAP", "required": false, "validate": "", "example": "NMS-TRAP", "type": "string", "description": "Juniper SNMP trap 组名，定义告警类别（link/startup/authentication 等）与 SNMP 版本；网管按组接收告警"}], "notes": "1) 强烈建议给团体字加 clients 限制源地址（set snmp community X clients <网管IP>/32），\n   不加等于对全网开放，安全审计必查。\n2) trap-group 的 targets 逐条设置即可添加多个上报目标。\n3) location/contact/description 都要带引号，含空格也能正常保存。\n4) show snmp statistics 能看收发包计数，判断网管是否真的在采集。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:56", "updated_at": "2026-10-09 13:45:39", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除本变更新增的 SNMP 配置（location/contact/description 旧值按变更记录恢复）\nconfigure\ndelete snmp trap-group {{trap_group}}\ndelete snmp community {{ro_community}}\ndelete snmp community {{rw_community}}\ndelete snmp location\ndelete snmp contact\ndelete snmp description\ncommit and-quit\n# 复核\nshow snmp community"}, {"uuid": "541581dd-1d5f-59cf-a605-27646f408650", "platform": "network", "device_type": "交换机", "vendor": "juniper", "os_family": "junos", "models": "EX / QFX / SRX 全系列", "category": "保存配置", "title": "提交配置、导出备份与 rescue 救命配置（Junos）", "description": "Junos 没有 write memory：配置提交即生效；此处给出导出备份与 rescue 配置做法。", "commands": "# ===== 提交、备份与 rescue 配置（Junos）=====\nconfigure\nshow | compare\ncommit comment \"{{commit_comment}}\"\ncommit and-quit\n! ---- 查看当前生效配置 ----\nshow configuration | display set\n! ---- 导出配置到本地文件（隔离网络下最稳的备份方式）----\nsave /var/tmp/{{backup_name}}\n! ---- 查看已有备份文件 ----\nfile list /var/tmp/\n! ---- rescue 救命配置：出问题时一条命令回到这个状态 ----\nrequest system configuration rescue save\n! 恢复方式：rollback rescue 然后 commit\n! ---- 回滚到上一次提交 ----\n! rollback 1\n! commit", "params": [{"name": "commit_comment", "label": "提交备注", "default": "变更单 CHG-20260920", "required": false, "validate": "", "example": "变更单号，便于事后审计", "type": "string", "description": "Juniper commit 留痕说明，写入配置版本历史；回滚排查时靠它定位每次变更意图——务必写清变更原因与工单号"}, {"name": "backup_name", "label": "备份文件名", "default": "SW-CORE-01-20260920.conf", "required": true, "validate": "", "example": "SW-CORE-01-20260920.conf", "type": "string", "description": "配置/镜像备份在本地（flash/USB）的保存文件名；仅本机留痕，建议再 execute backup 到 TFTP 异机一份防单点"}], "notes": "1) Junos 是\"候选配置 + commit\"模型：改完不 commit 不生效，也没有 write memory。\n2) commit comment 会把变更单号写进提交记录，show system commit 可查历史，审计很好用。\n3) request system configuration rescue save 保存\"救命配置\"，现场改坏了 rollback rescue 即可恢复；\n   上生产前建议先做一次 rescue。\n4) 备份文件在 /var/tmp 或 /config 下；要取回本机需用 SCP/USB，隔离网络下建议直接留档在设备上。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:56", "updated_at": "2026-10-09 13:45:39", "exec_level": "", "interactive": 0, "rollback": "# 回退：本条目为提交与备份操作，不改变网络行为（commit 仅提交候选变更）；\n# 如需清理备份文件与 rescue 配置\nfile delete /var/tmp/{{backup_name}}\nrequest system configuration rescue delete"}, {"uuid": "887ade2e-5900-5ae2-830f-8fdef988fe9c", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7 / RHEL 7（openEuler 22.03 基本一致）", "category": "网络配置", "title": "临时配置 IP 地址（ip 命令族）", "description": "用 ip 命令给网卡临时加 IP，立即生效，重启网络或机器后失效。", "commands": "# ⚠ 临时生效：重启网络/机器后失效，持久化见配套条目：《永久配置 IP（ifcfg-* 文件）》\nip addr show\nip addr add {{ip_addr}}/{{prefix_len}} dev {{ifname}}\nip link set {{ifname}} up\nip addr show {{ifname}}\n# 验证连通\nping -c 2 {{gateway}}\n# 清除该 IP（需要时）：\n# ip addr del {{ip_addr}}/{{prefix_len}} dev {{ifname}}", "params": [{"name": "ifname", "label": "网卡名", "default": "eth0", "required"
