label": "超时分钟数", "default": "10", "required": false, "validate": "int:0-35791", "example": "10", "type": "int", "range": "0-35791", "description": "登录空闲超时（分钟），无操作自动登出；现场建议 10-30 分钟；设太短频繁重登影响效率，太长有被冒用风险"}], "notes": "1) 按角色分权：日常监控用审计员/只读，避免共用超级管理员。\n2) 登录来源必须限制；不限制的管理面在等保测评中直接扣分。\n3) 开启管理员操作日志，现场多人协作时能追溯到具体操作人。\n4) ★ 本条是界面操作路径，不是可直接粘贴执行的命令。\n5) ★ 口令必须现场生成随机强口令，禁止沿用任何示例值；渲染对话框未填口令会标红并阻止生成。\n", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:04", "updated_at": "2026-10-09 13:45:59", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "a2d86970-c1b5-5e45-bf9c-a4e9faacc300", "platform": "network", "device_type": "防火墙", "vendor": "topsec", "os_family": "topos", "models": "天融信 NGFW 全系列", "category": "密码", "title": "修改管理员密码口令与口令策略（Web 控制台）", "description": "修改管理员口令，配置口令复杂度、有效期与失败锁定。", "commands": "# 【重要】天融信 TopOS 的策略类配置以 Web 控制台为主，命令行仅开放少量系统级命令。\n# 本条目给出的是【Web 控制台操作路径 + 界面字段取值建议】，\n# ★ 请勿直接粘贴到 Xshell 执行 ★  仅作现场对照操作与变更记录使用。\n# 若设备型号确实开放了 CLI，请先用 ? 查看当前版本支持的命令再操作。\n\n# ===== Web 控制台操作路径 =====\n# 【改口令】系统管理 → 管理员配置 → 选中账号 → 修改密码\n#   新口令：{{password}}\n# 【口令策略】系统管理 → 安全设置 / 口令策略\n#   最小长度    ：{{min_len}}\n#   复杂度      ：数字 + 字母 + 特殊字符\n#   有效期(天)  ：{{change_days}}\n#   历史口令不可重用：{{history}} 次\n#   失败锁定    ：{{lock_times}} 次 / 锁定 {{lock_minutes}} 分钟\n#\n# 【console 说明】console（串口）登录使用管理员账号，无独立串口口令；\n#   忘记口令需现场用串口进入恢复流程（联系厂商支持）。", "params": [{"name": "password", "label": "密码", "default": "", "required": true, "validate": "", "example": "现场生成：>=12位，含大小写/数字/符号", "type": "string", "description": "账号登录口令，认证凭据；配置中可能明文/弱加密存储，导出配置时必须脱敏；遵循强口令并定期轮换"}, {"name": "min_len", "label": "口令最小长度", "default": "12", "required": false, "validate": "int:8-32", "example": "建议 12 以上", "type": "int", "range": "8-32", "description": "口令最小长度，常见 8-12 位；配合复杂度策略（数字/特殊字符下限）使用"}, {"name": "change_days", "label": "口令有效期（天）", "default": "90", "required": false, "validate": "int:0-365", "example": "90", "type": "int", "range": "0-365", "description": "口令有效期（天），超过后系统强制改密；常见 90 天；设得过短会逼出弱口令习惯，配合到期提前告警（warning_days）使用"}, {"name": "history", "label": "历史口令记录数", "default": "5", "required": false, "validate": "int:0-20", "example": "5", "type": "int", "range": "0-20", "description": "口令历史记忆次数，禁止与最近 N 次口令重复；常见 5 次；配合有效期使用防止『改回旧口令』绕过轮换"}, {"name": "lock_times", "label": "失败锁定次数", "default": "5", "required": false, "validate": "int:1-20", "example": "5", "type": "int", "range": "1-20", "description": "允许的连续登录失败次数，超过即锁定账号；常见 5 次；设太小易误伤正常运维输入"}, {"name": "lock_minutes", "label": "锁定时长（分钟）", "default": "30", "required": false, "validate": "int:1-1440", "example": "30", "type": "int", "range": "1-1440", "description": "登录连续失败后的锁定时长（分钟），防暴力破解；现场输错触发锁定后该期间无法登录，留 console 兜底"}], "notes": "1) console 与 Web/SSH 共用管理员账号口令，改一处全套生效。\n2) 口令必须纳入密码管理系统：现场忘记超级管理员口令的恢复成本很高。\n3) 安全基线：长度 ≥12、复杂度达标、有效期 ≤90 天、失败锁定 ≤5 次。\n4) ★ 本条是界面操作路径，不是可直接粘贴执行的命令。\n5) ★ 口令必须现场生成随机强口令，禁止沿用任何示例值；渲染对话框未填口令会标红并阻止生成。\n", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:04", "updated_at": "2026-10-09 13:45:59", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "ba1e498b-67b3-51de-8975-71078a92f343", "platform": "network", "device_type": "防火墙", "vendor": "topsec", "os_family": "topos", "models": "天融信 NGFW 全系列", "category": "SNMP", "title": "配置 SNMP 团体字与 Trap（Web 控制台）", "description": "开启 SNMP、配置团体字并限定网管主机，设置 Trap 上报目标。", "commands": "# 【重要】天融信 TopOS 的策略类配置以 Web 控制台为主，命令行仅开放少量系统级命令。\n# 本条目给出的是【Web 控制台操作路径 + 界面字段取值建议】，\n# ★ 请勿直接粘贴到 Xshell 执行 ★  仅作现场对照操作与变更记录使用。\n# 若设备型号确实开放了 CLI，请先用 ? 查看当前版本支持的命令再操作。\n\n# ===== Web 控制台操作路径 =====\n# 【路径】系统管理 → SNMP 配置\n#   启用 SNMP    ：是\n#   版本          ：v2c（优先 v3）\n#   只读团体字    ：{{ro_community}}\n#   读写团体字    ：{{rw_community}}（不需要下行配置就别开）\n#   允许访问主机  ：{{nms_ip}} / {{nms_mask}}（★ 必填）\n#   Trap 接收地址 ：{{nms_ip}}\n#   位置 / 联系人 ：{{location}} / {{contact}}\n#   → 保存后在网管平台验证采集", "params": [{"name": "ro_community", "label": "只读团体字", "default": "RO@Public1", "required": true, "validate": "", "example": "RO@Public1", "type": "string", "description": "SNMP 只读团体字，等同口令——网管凭它采集设备数据；禁用 public 等弱值并限定来源；只读为主，写权限单独管理"}, {"name": "rw_community", "label": "读写团体字", "default": "RW@Public1", "required": true, "validate": "", "example": "RW@Public1", "type": "string", "description": "SNMP 读写团体字——持有即可远程修改设备配置，权限极高；仅必要时配置，务必限定来源网段并使用强值"}, {"name": "nms_ip", "label": "网管服务器 IP", "default": "10.0.0.100", "required": true, "validate": "ipv4", "example": "10.0.0.100", "type": "ip", "description": "网管服务器（SNMP 采集/trap 接收）IP，设备向其发送告警并接受查询；填错网管侧收不到任何数据，等于监控失明"}, {"name": "nms_mask", "label": "网管掩码", "default": "255.255.255.0", "required": false, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "SNMP 服务允许来源的掩码，与 nms_ip 配套限定采集来源范围；配宽了等于向多余网段开放 SNMP"}, {"name": "location", "label": "设备位置", "default": "IDC-A-机柜12", "required": false, "validate": "", "example": "IDC-A-机柜12", "type": "string", "description": "SNMP 系统位置（sysLocation）字段，标明设备物理位置（机房/机柜/U 位），告警现场定位依据；纯展示不影响功能"}, {"name": "contact", "label": "联系人", "default": "网络运维组", "required": false, "validate": "", "example": "网络运维组", "type": "string", "description": "SNMP 系统联系人（sysContact）字段，网管告警时定位责任人的依据；纯展示不影响功能"}], "notes": "1) 团体字不用 public/private；允许访问主机必须限定为网管地址。\n2) 只做采集不开读写团体字；Trap 用的 UDP 162 要确认中间链路放通。\n3) Trap 源地址一般是管理口地址，双出口设备要确认网管侧路由可达。\n4) ★ 本条是界面操作路径，不是可直接粘贴执行的命令。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:04", "updated_at": "2026-10-09 13:45:59", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "7d530386-0dfd-544f-9a40-24ca9426861c", "platform": "network", "device_type": "防火墙", "vendor": "topsec", "os_family": "topos", "models": "天融信 NGFW 全系列", "category": "保存配置", "title": "保存配置：配置备份与恢复（Web 控制台）", "description": "导出配置文件归档；说明恢复操作的破坏性与注意事项。", "commands": "# 【重要】天融信 TopOS 的策略类配置以 Web 控制台为主，命令行仅开放少量系统级命令。\n# 本条目给出的是【Web 控制台操作路径 + 界面字段取值建议】，\n# ★ 请勿直接粘贴到 Xshell 执行 ★  仅作现场对照操作与变更记录使用。\n# 若设备型号确实开放了 CLI，请先用 ? 查看当前版本支持的命令再操作。\n\n# ===== Web 控制台操作路径 =====\n# 【备份】系统管理 → 配置管理 → 配置备份 → 导出\n#   文件名：TOPSEC-EDGE-01-{{backup_tag}}.conf\n#   → 归档到 U 盘 / 内网文件服务器，命名带日期与变更单号\n# 【恢复】系统管理 → 配置管理 → 配置恢复 → 选择文件 → 恢复\n#   ★ 会覆盖当前全部配置，执行前先备份当前的\n# 【重启】设备 → 重启（部分配置需重启生效，重启前确认配置已保存）", "params": [{"name": "backup_tag", "label": "备份标记", "default": "20260920", "required": false, "validate": "", "example": "20260920 或变更单号", "type": "string", "description": "备份文件版本标签，拼进备份文件名（如 backup-20260930-pre-upgrade.cfg）便于追溯；建议用『日期-动作』格式，回滚时按标签定位对应版本"}], "notes": "1) 变更前导出基线、变更后再导出一份，形成可追溯的两份归档。\n2) 恢复配置属破坏性操作，且可能要求重启，务必安排在变更窗口并双人确认。\n3) 配置文件含口令密文，归档位置的访问权限要控制。\n4) ★ 本条是界面操作路径，不是可直接粘贴执行的命令。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:04", "updated_at": "2026-10-09 13:45:59", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "0656f8d5-c5fd-5a35-b604-66e850645f22", "platform": "network", "device_type": "防火墙", "vendor": "topsec", "os_family": "topos", "models": "天融信网络卫士 NGFW 系列", "category": "VLAN", "title": "创建 VLAN 子接口（CLI 骨架 + Web 对照）", "description": "在物理口上创建 VLAN 子接口并配 IP、绑安全域。", "commands": "# ⚠ 待真机核对：本条目为 CLI 骨架 + Web 控制台对照，命令行未在本厂商真机验证过。\n# 核对方法：Console/SSH 登录后先敲 ? 查看当前视图可用命令；\n#          若列表里没有对应命令，直接用下半部分的 Web 控制台路径操作。\n\n# ---- CLI 骨架（关键字待现场用 ? 确认）----\nenable\nconfigure terminal\ninterface eth{{parent_port_no}}.{{vlan_id}}\n ip address {{vlan_ip}} {{vlan_mask}}\n zone {{zone_name}}\n exit\nexit\nwrite\nshow interface\n#\n# ---- Web 控制台路径（可直接照做）----\n# 网络管理 → 接口配置 → 选物理口 → 新增子接口(VLAN)：\n#   VLAN ID {{vlan_id}} / IP {{vlan_ip}} / 掩码 {{vlan_mask}} / 安全域 {{zone_name}}", "params": [{"name": "parent_port_no", "label": "父接口序号", "default": "2", "required": true, "validate": "int:0-63", "example": "物理口 eth2 填 2", "type": "int", "range": "0-63", "description": "父物理口 eth 编号，子接口 ethX.VLAN 承载其上"}, {"name": "vlan_id", "label": "VLAN ID", "default": "10", "required": true, "validate": "vlan", "example": "10", "type": "string", "description": "VLAN 编号，二层广播域标识；有效范围 1-4094（1 为默认 VLAN、1002-1005 系统保留）；Trunk 两端放行列表与 PVID 必须配套，改错会隔离业务"}, {"name": "vlan_ip", "label": "接口 IP", "default": "192.168.10.1", "required": true, "validate": "ipv4", "example": "192.168.10.1", "type": "ip", "description": "VLAN 子接口/网关 IP，该网段终端的默认网关；须与终端同网段；改网关地址需同步终端配置"}, {"name": "vlan_mask", "label": "子网掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "VLAN 子接口的子网掩码，与 vlan_ip 配套决定网段大小"}, {"name": "zone_name", "label": "安全域", "default": "内网域", "required": false, "validate": "", "example": "内网域 / 外网域 / DMZ 域", "type": "string", "description": "安全区域名（trust/untrust/dmz），接口的 zone 归属决定策略方向匹配；接口须先加入 zone 才能被策略引用"}], "notes": "1) ★ 待真机核对：天融信 TopOS 的策略类配置以 Web 控制台为主，CLI 为通用骨架，\n   执行前必须先用 ? 确认当前版本支持情况。\n2) 接口必须绑定\"安全域\"，策略是按安全域之间配置的，漏绑会导致策略引用不到接口。\n3) 父物理口若已在用（有 IP 或已绑策略），建子接口前先确认不影响现有业务。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:04", "updated_at": "2026-10-09 13:45:59", "exec_level": "skeleton", "interactive": 0, "rollback": "# 回退：删除 VLAN 子接口（骨架条目：undo 关键字待真机以 ? 核对；\n# 若已有策略引用该子接口，先在 Web 控制台解除引用）\nenable\nconfigure terminal\ninterface eth{{parent_port_no}}.{{vlan_id}}\n no ip address\n no zone {{zone_name}}\n shutdown\n exit\nno interface eth{{parent_port_no}}.{{vlan_id}}\nexit\nwrite\n# 复核\nshow interface"}, {"uuid": "820314dd-a0eb-50c2-b322-ba99c791e7db", "platform": "network", "device_type": "防火墙", "vendor": "topsec", "os_family": "topos", "models": "天融信 NGFW 多口型号", "category": "Trunk", "title": "配置接口聚合与 VLAN 放通（CLI 骨架 + Web 对照）", "description": "多口聚合成聚合口用于上联，并在聚合口上划分 VLAN 子接口。", "commands": "# ⚠ 待真机核对：本条目为 CLI 骨架 + Web 控制台对照，命令行未在本厂商真机验证过。\n# 核对方法：Console/SSH 登录后先敲 ? 查看当前视图可用命令；\n#          若列表里没有对应命令，直接用下半部分的 Web 控制台路径操作。\n\n# ---- CLI 骨架（关键字待现场用 ? 确认）----\nenable\nconfigure terminal\ninterface aggregate {{agg_name}}\n member eth{{member1_no}} eth{{member2_no}}\n mode {{lacp_mode}}\n exit\ninterface aggregate {{agg_name}}.{{vlan_id}}\n ip address {{agg_ip}} {{agg_mask}}\n exit\nexit\nwrite\nshow interface aggregate\n#\n# ---- Web 控制台路径（可直接照做）----\n# 网络管理 → 接口配置 → 新增 → 聚合接口：名称 {{agg_name}}，成员 eth1 eth2，模式 {{lacp_mode}}\n# 再在聚合口下\"新增子接口(VLAN)\"：VLAN {{vlan_id}} / IP {{agg_ip}} / {{agg_mask}}", "params": [{"name": "agg_name", "label": "聚合口名", "default": "AGG-UPLINK", "required": true, "validate": "", "example": "AGG-UPLINK", "type": "string", "description": "聚合接口名称（如 agg1 / link-aggregation1），标识一条聚合链路；须与对端聚合组一一对应；重命名/删除会断开现有聚合"}, {"name": "member1_no", "label": "成员口1序号", "default": "1", "required": true, "validate": "int:0-63", "example": "eth1 填 1", "type": "int", "range": "0-63", "description": "聚合成员口编号 1（eth 编号），与对端聚合组的端口一一对应；选错口 LACP 协商不起来"}, {"name": "member2_no", "label": "成员口2序号", "default": "2", "required": true, "validate": "int:0-63", "example": "eth2 填 2", "type": "int", "range": "0-63", "description": "聚合成员口编号 2（eth 编号），与对端对应"}, {"name": "lacp_mode", "label": "聚合模式", "default": "lacp", "required": false, "validate": "enum:lacp|static", "example": "lacp / static", "type": "enum", "choices": ["lacp", "static"], "description": "聚合工作模式（static 静态聚合 / lacp 动态协商），必须与对端设备一致——一端静态一端 LACP 链路起不来"}, {"name": "vlan_id", "label": "VLAN ID", "default": "10", "required": true, "validate": "vlan", "example": "10", "type": "string", "description": "VLAN 编号，二层广播域标识；有效范围 1-4094（1 为默认 VLAN、1002-1005 系统保留）；Trunk 两端放行列表与 PVID 必须配套，改错会隔离业务"}, {"name": "agg_ip", "label": "子接口 IP", "default": "192.168.10.1", "required": true, "validate": "ipv4", "example": "192.168.10.1", "type": "ip", "description": "链路聚合口的三层 IP 地址，作为该聚合链路的本端地址；须与对端同网段；配错聚合链路不通，业务随之中断"}, {"name": "agg_mask", "label": "子网掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0 列", "category": "ACL", "title": "配置访问控制策略（CLI 骨架 + Web 对照）", "description": "用地址/服务对象 + 访问控制策略控制安全域之间互访，开启日志。", "commands": "# ⚠ 待真机核对：本条目为 CLI 骨架 + Web 控制台对照，命令行未在本厂商真机验证过。\n# 核对方法：Console/SSH 登录后先敲 ? 查看当前视图可用命令；\n#          若列表里没有对应命令，直接用下半部分的 Web 控制台路径操作。\n\n# ---- CLI 骨架（关键字待现场用 ? 确认）----\nenable\nconfigure terminal\nobject address {{src_obj}} {{src_net}} {{src_mask}}\npolicy name {{policy_name}} source-zone {{src_zone}} dest-zone {{dst_zone}}  source {{src_obj}} service {{service}} action permit log enable\nexit\nwrite\nshow policy\n#\n# ---- Web 控制台路径（可直接照做）----\n# 对象管理 → 地址对象：新增 {{src_obj}} = {{src_net}} / {{src_mask}}\n# 策略管理 → 访问控制策略 → 新增：源安全域 {{src_zone}} → 目的安全域 {{dst_zone}}，\n#   源地址 {{src_obj}}，服务 {{service}}，动作允许，开启日志", "params": [{"name": "src_obj", "label": "源地址对象名", "default": "OBJ-OFFICE", "required": true, "validate": "", "example": "OBJ-OFFICE", "type": "string", "description": "源地址对象名（FortiGate/PaloAlto 等），先建对象再被策略引用；修改对象影响所有引用它的策略"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "src_mask", "label": "源掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "源网段点分十进制掩码（FortiGate 子网对象写法），与 src_net 圈定来源范围；写宽扩大放行面"}, {"name": "policy_name", "label": "策略名", "default": "OFFICE-to-SERVER", "required": true, "validate": "", "example": "OFFICE-to-SERVER", "type": "string", "description": "防火墙策略名称，运维辨识用途；建议『源_到_目的_动作』命名法，策略多了不迷路"}, {"name": "src_zone", "label": "源安全域", "default": "内网域", "required": true, "validate": "", "example": "内网域", "type": "string", "description": "源安全区域，策略入方向区域匹配；报文入接口必须真属于该 zone；修改后须 commit"}, {"name": "dst_zone", "label": "目的安全域", "default": "DMZ 域", "required": true, "validate": "", "example": "DMZ 域", "type": "string", "description": "目的安全区域（trust/dmz/untrust），策略的目的方向匹配；报文出接口必须真属于该 zone，否则策略永不命中；改后须 commit"}, {"name": "service", "label": "服务", "default": "HTTPS", "required": false, "validate": "", "example": "HTTP / HTTPS / Any", "type": "string", "description": "策略引用的服务对象名（HTTP/HTTPS/ALL 等），四层端口匹配的集合；可用预定义或自建对象；改对象影响所有引用它的策略"}], "notes": "1) ★ 待真机核对：策略类命令 CLI 支持最少，优先用 Web（下半部分）。\n2) 天融信策略基于\"安全域对\"，接口没绑安全域时策略引用不到 —— 最常见的卡点。\n3) 建议给\"拒绝\"也开日志，攻击溯源时需要拒绝记录。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:05", "updated_at": "2026-10-09 13:46:00", "exec_level": "skeleton", "interactive": 0, "rollback": "# 回退：先删策略再删地址对象（骨架语法待真机 ? 核对；Web 侧等价：\n# 策略管理删除 {{policy_name}}；对象管理删除 {{src_obj}}）\nenable\nconfigure terminal\nno policy name {{policy_name}}\nno object address {{src_obj}}\nexit\nwrite\n# 复核\nshow policy"}, {"uuid": "5241afe3-3a15-5e17-ba2d-6f6f2fd62de3", "platform": "network", "device_type": "防火墙", "vendor": "topsec", "os_family": "topos", "models": "天融信 NGFW 全系列", "category": "NAT", "title": "配置源 NAT 与目的 NAT 映射（CLI 骨架 + Web 对照）", "description": "内网出网做源地址转换（PAT），服务器对外发布做目的地址转换。", "commands": "# ⚠ 待真机核对：本条目为 CLI 骨架 + Web 控制台对照，命令行未在本厂商真机验证过。\n# 核对方法：Console/SSH 登录后先敲 ? 查看当前视图可用命令；\n#          若列表里没有对应命令，直接用下半部分的 Web 控制台路径操作。\n\n# ---- CLI 骨架（关键字待现场用 ? 确认）----\nenable\nconfigure terminal\nnat source {{src_net}} {{src_mask}} outbound-interface eth{{out_no}} type pat\nnat destination {{public_ip}} {{public_port}} {{inside_ip}} {{inside_port}} protocol tcp\nexit\nwrite\nshow nat\n#\n# ---- Web 控制台路径（可直接照做）----\n# NAT 管理 → 源地址转换：源 {{src_net}}/{{src_mask}}，类型\"接口地址转换(PAT)\"\n# NAT 管理 → 目的地址转换：公网 {{public_ip}}:{{public_port}} → 内网 {{inside_ip}}:{{inside_port}}\n# ★ 之后必须放行 外网域 → 内网域 的对应服务策略", "params": [{"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "src_mask", "label": "源掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "源网段点分十进制掩码（FortiGate 子网对象写法），与 src_net 圈定来源范围；写宽扩大放行面"}, {"name": "out_no", "label": "出接口序号", "default": "1", "required": false, "validate": "int:0-63", "example": "eth1 填 1", "type": "int", "range": "0-63", "description": "出接口 eth 编号，静态路由/NAT 的出口指向；编号写错流量走错口（多出口设备尤其注意）"}, {"name": "public_ip", "label": "公网地址", "default": "200.1.1.30", "required": true, "validate": "ipv4", "example": "200.1.1.30", "type": "ip", "description": "对外发布的公网/映射 IP，NAT 后外部访问的地址；须在上联口网段内且未被占用，冲突会绑定失败"}, {"name": "public_port", "label": "公网端口", "default": "8443", "required": true, "validate": "int:1-65535", "example": "8443", "type": "int", "range": "1-65535", "description": "对外映射端口号，DNAT 的外部端口；可与内部端口不同（如 8443→443）；与现有监听冲突会绑定失败"}, {"name": "inside_ip", "label": "内网服务器", "default": "192.168.10.100", "required": true, "validate": "ipv4", "example": "192.168.10.100", "type": "ip", "description": "NAT 映射的内网真实 IP（被发布服务器的地址），DNAT 后流量的真正去向；填错把外部流量引到错误主机"}, {"name": "inside_port", "label": "内网端口", "default": "8443", "required": true, "validate": "int:1-65535", "example": "8443", "type": "int", "range": "1-65535", "description": "内网侧接口名或映射端口号，DNAT 流量的内部接收方向；写错映射不生效"}], "notes": "1) ★ 待真机核对：NAT 命令关键字先 ? 确认或直接用 Web。\n2) ★ NAT 必须配套放行策略，只做地址转换不做策略放行，流量过不去。\n3) 端口映射的公网/内网端口别写反；内网自测（回环）不通不代表配置错。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:05", "updated_at": "2026-10-09 13:46:00", "exec_level": "skeleton", "interactive": 0, "rollback": "# 回退：删除 NAT 规则（骨架语法待真机 ? 核对；Web 侧等价：\n# NAT 管理 → 删除对应源/目的转换条目）\nenable\nconfigure terminal\nno nat source {{src_net}} {{src_mask}} outbound-interface eth{{out_no}} type pat\nno nat destination {{public_ip}} {{public_port}} {{inside_ip}} {{inside_port}} protocol tcp\nexit\nwrite\n# 复核\nshow nat"}, {"uuid": "1e812cfa-3ed8-5b59-8299-ebf972c8218a", "platform": "network", "device_type": "防火墙", "vendor": "topsec", "os_family": "topos", "models": "天融信 NGFW 全系列", "category": "SSH管理", "title": "创建管理员并限制登录来源（CLI 骨架 + Web 对照）", "description": "新建管理员账号、分配角色并限定登录来源。", "commands": "# ⚠ 待真机核对：本条目为 CLI 骨架 + Web 控制台对照，命令行未在本厂商真机验证过。\n# 核对方法：Console/SSH 登录后先敲 ? 查看当前视图可用命令；\n#          若列表里没有对应命令，直接用下半部分的 Web 控制台路径操作。\n\n# ---- CLI 骨架（关键字待现场用 ? 确认）----\nenable\nconfigure terminal\nadmin {{username}} password {{password}} role {{role}} from {{trust_ip}} {{trust_mask}}\nexit\nwrite\nshow admin\n#\n# ---- Web 控制台路径（可直接照做）----\n# 系统管理 → 管理员配置 → 新增：用户名 {{username}}，角色 {{role}}，\n#   允许登录来源 {{trust_ip}} / {{trust_mask}}，管理方式 HTTPS + SSH（不用 Telnet）", "params": [{"name": "username", "label": "用户名", "default": "netadmin", "required": true, "validate": "", "example": "netadmin", "type": "string", "description": "登录账号名，认证身份标识；按人名/工号命名便于审计追责，禁用共享账号"}, {"name": "password", "label": "密码", "default": "", "required": true, "validate": "", "example": "现场生成：>=12位，含大小写/数字/符号", "type": "string", "description": "账号登录口令，认证凭据；配置中可能明文/弱加密存储，导出配置时必须脱敏；遵循强口令并定期轮换"}, {"name": "role", "label": "角色", "default": "administrator", "required": false, "validate": "enum:administrator|auditor|readonly", "example": "administrator / auditor / readonly", "type": "enum", "choices": ["administrator", "auditor", "readonly"], "description": "管理员角色（超级管理员/审计员/只读），决定账号权限边界；遵循最小权限原则，日常运维勿用超管账号"}, {"name": "trust_ip", "label": "允许登录网段", "default": "10.0.0.0", "required": true, "validate": "ipv4", "example": "10.0.0.0", "type": "ip", "description": "管理面允许登录的来源 IP（trusthost 白名单），限定谁能访问设备管理；改前确认当前管理机 IP 在名单内，否则当场失联"}, {"name": "trust_mask", "label": "网段掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "登录来源 IP 的掩码，与 trust_ip 配套；0.0.0.0 0.0.0.0 等于不限制来源（不建议）"}], "notes": "1) ★ 待真机核对：管理员命令优先走 Web。\n2) 登录来源必须限制；不限制的管理面在等保测评中直接扣分。\n3) 开启管理员操作日志，多人协作时能追溯到具体操作人。\n4) ★ 口令必须现场生成随机强口令，禁止沿用任何示例值；渲染对话框未填口令会标红并阻止生成。\n", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:05", "updated_at": "2026-10-09 13:46:00", "exec_level": "skeleton", "interactive": 0, "rollback": "# 回退：删除本变更新建管理员（骨架语法待真机 ? 核对；★ 删除当前登录账号前\n# 先用其他管理员登录；Web 侧等价：系统管理 → 管理员配置 删除 {{username}}）\nenable\nconfigure terminal\nno admin {{username}}\nexit\nwrite\n# 复核\nshow admin"}, {"uuid": "cf292e24-a3fd-5fef-9121-35b85629c495", "platform": "network", "device_type": "防火墙", "vendor": "topsec", "os_family": "topos", "models": "天融信 NGFW 全系列", "category": "密码", "title": "修改管理员密码与口令策略（CLI 骨架 + Web 对照）", "description": "修改管理员密码并配置口令复杂度、有效期与失败锁定。", "commands": "# ⚠ 待真机核对：本条目为 CLI 骨架 + Web 控制台对照，命令行未在本厂商真机验证过。\n# 核对方法：Console/SSH 登录后先敲 ? 查看当前视图可用命令；\n#          若列表里没有对应命令，直接用下半部分的 Web 控制台路径操作。\n\n# ---- CLI 骨架（关键字待现场用 ? 确认）----\nenable\nconfigure terminal\nadmin {{username}} password {{password}}\nexit\nwrite\n#\n# ---- Web 控制台路径（可直接照做）----\n# 系统管理 → 管理员配置 → 选中账号 → 修改密码：{{password}}\n# 系统管理 → 安全设置：最小长度 {{min_len}} / 有效期 {{change_days}} 天 / 失败锁定 {{lock_times}} 次", "params": [{"name": "username", "label": "用户名", "default": "netadmin", "required": true, "validate": "", "example": "netadmin", "type": "string", "description": "登录账号名，认证身份标识；按人名/工号命名便于审计追责，禁用共享账号"}, {"name": "password", "label": "密码", "default": "", "required": true, "validate": "", "example": "现场生成：>=12位，含大小写/数字/符号", "type": "string", "description": "账号登录口令，认证凭据；配置中可能明文/弱加密存储，导出配置时必须脱敏；遵循强口令并定期轮换"}, {"name": "min_len", "label": "口令最小长度", "default": "12", "required": false, "validate": "int:8-32", "example": "建议 12 以上", "type": "int", "range": "8-32", "description": "口令最小长度，常见 8-12 位；配合复杂度策略（数字/特殊字符下限）使用"}, {"name": "change_days", "label": "口令有效期（天）", "default": "90", "required": false, "validate": "int:0-365", "example": "90", "type": "int", "range": "0-365", "description": "口令有效期（天），超过后系统强制改密；常见 90 天；设得过短会逼出弱口令习惯，配合到期提前告警（warning_days）使用"}, {"name": "lock_times", "label": "失败锁定次数", "default": "5", "required": false, "validate": "int:1-20", "example": "5", "type": "int", "range": "1-20", "description": "允许的连续登录失败次数，超过即锁定账号；常见 5 次；设太小易误伤正常运维输入"}], "notes": "1) ★ 待真机核对：console/串口登录使用管理员账号，无独立串口口令。\n2) 忘记超级管理员口令需现场用串口走恢复流程，成本高，口令必须留档。\n3) 安全基线：长度 ≥12、复杂度达标、有效期 ≤90 天、失败锁定 ≤5 次。\n4) ★ 口令必须现场生成随机强口令，禁止沿用任何示例值；渲染对话框未填口令会标红并阻止生成。\n", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:05", "updated_at": "2026-10-09 13:46:00", "exec_level": "skeleton", "interactive": 0, "rollback": "# 回退：恢复旧口令与旧口令策略（口令回退=重新设回旧值；★ 骨架条目，CLI 口令命令\n# 以 ? 核对为准，优先走 Web：系统管理 → 管理员配置 → 修改密码回填旧口令；\n# 系统管理 → 安全设置回填最小长度/有效期/锁定次数的变更前取值）\nenable\nwrite"}, {"uuid": "3c231c8a-5912-5e85-b2e6-6099718fddd3", "platform": "network", "device_type": "防火墙", "vendor": "topsec", "os_family": "topos", "models": "天融信 NGFW 全系列", "category": "SNMP", "title": "配置 SNMP 团体字与 Trap（CLI 骨架 + Web 对照）", "description": "开启 SNMP、配置团体字并限定网管主机，设置 Trap 上报目标。", "commands": "# ⚠ 待真机核对：本条目为 CLI 骨架 + Web 控制台对照，命令行未在本厂商真机验证过。\n# 核对方法：Console/SSH 登录后先敲 ? 查看当前视图可用命令；\n#          若列表里没有对应命令，直接用下半部分的 Web 控制台路径操作。\n\n# ---- CLI 骨架（关键字待现场用 ? 确认）----\nenable\nconfigure terminal\nsnmp-agent community {{ro_community}} read host {{nms_ip}} {{nms_mask}}\nsnmp-agent target-host trap host {{nms_ip}} community {{ro_community}}\nexit\nwrite\nshow snmp-agent\n#\n# ---- Web 控制台路径（可直接照做）----\n# 系统管理 → SNMP 配置：启用，只读团体字 {{ro_community}}，\n#   允许访问主机 {{nms_ip}}/{{nms_mask}}，Trap 接收地址 {{nms_ip}}，\n#   位置 {{location}}，联系人 {{contact}}", "params": [{"name": "ro_community", "label": "只读团体字", "default": "RO@Public1", "required": true, "validate": "", "example": "RO@Public1", "type": "string", "description": "SNMP 只读团体字，等同口令——网管凭它采集设备数据；禁用 public 等弱值并限定来源；只读为主，写权限单独管理"}, {"name": "nms_ip", "label": "网管服务器 IP", "default": "10.0.0.100", "required": true, "validate": "ipv4", "example": "10.0.0.100", "type": "ip", "description": "网管服务器（SNMP 采集/trap 接收）IP，设备向  "备份标记", "default": "20260920", "required": false, "validate": "", "example": "20260920 或变更单号", "type": "string", "description": "备份文件版本标签，拼进备份文件名（如 backup-20260930-pre-upgrade.cfg）便于追溯；建议用『日期-动作』格式，回滚时按标签定位对应版本"}], "notes": "1) ★ 待真机核对：部分配置需重启生效，重启前确认配置已保存。\n2) 变更前后各导出一次配置，形成可追溯的两份归档。\n3) 配置文件含口令密文，归档位置访问权限要控制。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:05", "updated_at": "2026-10-09 13:46:00", "exec_level": "skeleton", "interactive": 0, "rollback": "# 回退：本条目仅保存配置，不改变网络行为，无需配置回退；\n# Web 侧如需恢复配置：系统管理 → 配置管理 → 配置恢复（★ 覆盖全部配置，\n# 执行前先备份当前配置）\nenable"}, {"uuid": "b2f47889-8b45-55e0-8cb6-625459ca06ef", "platform": "network", "device_type": "交换机", "vendor": "zte", "os_family": "zxr10", "models": "ZXR10 5250 / 5950 / 6900 系列", "category": "VLAN", "title": "创建 VLAN 并把端口划入 Access（ZXR10）", "description": "新建业务 VLAN，进接口配 access 模式并加入该 VLAN，最后保存。", "commands": "! ===== 创建 VLAN 并划入端口（ZXR10）=====\nenable\nconfigure terminal\nvlan {{vlan_id}}\n name {{vlan_name}}\n exit\ninterface {{port}}\n switchport mode access\n switchport access vlan {{vlan_id}}\n no shutdown\n exit\nexit\nwrite\nshow vlan {{vlan_id}}", "params": [{"name": "vlan_id", "label": "VLAN ID", "default": "10", "required": true, "validate": "vlan", "example": "10", "type": "string", "description": "VLAN 编号，二层广播域标识；有效范围 1-4094（1 为默认 VLAN、1002-1005 系统保留）；Trunk 两端放行列表与 PVID 必须配套，改错会隔离业务"}, {"name": "vlan_name", "label": "VLAN 名称", "default": "OFFICE", "required": false, "validate": "", "example": "OFFICE", "type": "string", "description": "VLAN 名称，二层辨识用途；建议按业务语义命名（如 OA_BIZ），纯展示不影响转发"}, {"name": "port", "label": "端口", "default": "gei_1/1", "required": true, "validate": "port", "example": "gei_1/1", "type": "string", "description": "接口名/接口编号，进入该接口视图后所做的配置只作用于这一个口；先 show/display 确认接口存在与状态——进错接口改配置是现场常见事故"}], "notes": "1) ZXR10 接口名形如 gei_1/1（千兆以太网），三段式（gei_1/1/1）在机框式设备上常见，\n   以 show interface 的实际提示为准。\n2) ZXR10 命令体系接近 Cisco（enable / configure terminal / interface / exit），\n   但不同 ROS 版本差异较大，上机前建议先用 ? 确认命令是否存在。\n3) 保存命令为 write（部分版本可用 write memory / save），执行后用 show startup-config 核对。\n4) 批量配口可尝试 interface range（部分型号支持），不支持则逐口配。\n5) ★ 本条含 shutdown / undo shutdown 类端口操作：对生产端口执行会瞬断链路，请在业务低峰期变更，并确认有带外/备用管理通道再动手。\n", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:07", "updated_at": "2026-10-09 13:46:02", "exec_level": "", "interactive": 0, "rollback": "! 回退：删除 VLAN 并把端口恢复默认属性（端口原属 VLAN 按变更记录恢复）\nenable\nconfigure terminal\ninterface {{port}}\n no switchport access vlan\n no switchport mode access\n exit\nno vlan {{vlan_id}}\nexit\nwrite\n! 复核\nshow vlan"}, {"uuid": "b8d71d5a-6eaa-538a-b057-788469b38701", "platform": "network", "device_type": "交换机", "vendor": "zte", "os_family": "zxr10", "models": "ZXR10 5950 / 6900 系列", "category": "Trunk", "title": "配置 Trunk 口并放通 VLAN（ZXR10）", "description": "把级联口配成 trunk，放通 VLAN 列表并设置 native VLAN。", "commands": "! ===== 配置 Trunk 口（ZXR10）=====\nenable\nconfigure terminal\ninterface {{port}}\n switchport mode trunk\n switchport trunk allowed vlan {{vlan_list}}\n switchport trunk native vlan {{pvid}}\n no shutdown\n exit\nexit\nwrite\nshow interface {{port}} switchport", "params": [{"name": "port", "label": "端口", "default": "gei_1/24", "required": true, "validate": "port", "example": "gei_1/24", "type": "string", "description": "接口名/接口编号，进入该接口视图后所做的配置只作用于这一个口；先 show/display 确认接口存在与状态——进错接口改配置是现场常见事故"}, {"name": "vlan_list", "label": "放通 VLAN", "default": "10,20,30", "required": true, "validate": "", "example": "10,20,30 或 10-20", "type": "string", "description": "Trunk 放行 VLAN 列表（如 10,20,30-40），控制哪些 VLAN 流量可通过该链路；漏放行业务 VLAN 会当场断流，改动立即生效"}, {"name": "pvid", "label": "PVID / Native VLAN", "default": "1", "required": false, "validate": "vlan", "example": "1", "type": "string", "description": "Trunk 口 PVID（untagged VLAN），决定无标签流量归入哪个 VLAN；两端 PVID 不一致会导致原生态流量进错 VLAN 丢失"}], "notes": "1) 部分 ZXR10 版本用 switchport trunk vlan <列表>（不带 allowed），以 ? 提示为准；\n   两者语义相同，只是关键字差异。\n2) 放通全部用 switchport trunk vlan all（慎用）。\n3) native VLAN 两端必须一致，否则会出现跨 VLAN 串流或协议报文异常。\n4) ★ 本条含 shutdown / undo shutdown 类端口操作：对生产端口执行会瞬断链路，请在业务低峰期变更，并确认有带外/备用管理通道再动手。\n", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:07", "updated_at": "2026-10-09 13:46:02", "exec_level": "", "interactive": 0, "rollback": "! 回退：清空 Trunk 放行表并恢复 access（★ 清空前留存原放行表 show 输出，\n! 按变更记录恢复；回退前确认该口未下联交换机防环路）\nenable\nconfigure terminal\ninterface {{port}}\n no switchport trunk allowed vlan\n no switchport trunk native vlan\n no switchport mode trunk\n exit\nexit\nwrite\n! 复核\nshow interface {{port}} switchport"}, {"uuid": "576c2de4-e491-5985-a776-010da8b274d5", "platform": "network", "device_type": "路由器", "vendor": "zte", "os_family": "zxr10", "models": "ZXR10 路由器 / 三层交换机", "category": "静态路由", "title": "配置静态路由与缺省路由（ZXR10）", "description": "配置明细静态路由、缺省路由与浮动备份路由。", "commands": "! ===== 静态路由（ZXR10）=====\nenable\nconfigure terminal\nip route {{dest_net}} {{mask}} {{next_hop}}\nip route 0.0.0.0 0.0.0.0 {{next_hop}}\n! 浮动备份：最后一位是优先级/距离，越大越不优先\nip route {{dest_net}} {{mask}} {{backup_hop}} {{distance}}\nexit\nwrite\nshow ip route\nshow ip route {{dest_net}}", "params": [{"name": "dest_net", "label": "目的网段", "default": "192.168.20.0", "required": true, "validate": "ipv4", "example": "192.168.20.0", "type": "ip", "description": "目的网段地址，路由/策略匹配的目标方向；0.0.0.0/0 表示任意目的；方向写反会导致流量走错策略"}, {"name": "mask", "label": "掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "24 或 255.255.255.0", "type": "string", "description": "静态路由的点分十进制掩码，与 dest_net 圈定路由前缀；掩码写宽会吞掉相邻网段的路由匹配"}, {"name": "next_hop", "label": "下一跳地址", "default": "10.0.0.2", "required": true, "validate": "ipv4", "example": "10.0.0.2", "type": "ip", "description": "下一跳 IP，路由/策略转发的去向；必须是本机直连可达地址，写错路由成『黑洞』"}, {"name": "backup_hop", "label": "备份下一跳", "default": "10.0.0.3", "required": false, "validate": "ipv4", "example": "10.0.0.3", "type": "ip", "description": "浮动静态路由的备份下一跳，主路径失效后才接管转发；其管理距离/优先级必须大于主路由；须保证与本端直连可达"}, {"name": "distance", "label": "距离/优先级", "default": "200", "required": false, "validate": "int:1-255", "example": "默认 1，备份用 200", "type": "int", "range": "1-255", "description": "路由管理距离（FortiGate/锐捷/中兴），数值越小该路由越优先；浮动备份路由靠把备份侧 distance 调大实现主备切换"}], "notes": "1) 与 Cisco 语法一致：ip route <网段> <掩码> <下一跳> [距离]。\n2) 三层交换机做转发前确认已开启路由功能（部分型号需 ip routing）。\n3) show ip route 中静态路由标记为 S，缺省路由为 S*，排查时先看这两行。\n4) 掩码用点分写法（255.255.255.0）；若要用前缀长度写法，需按版本确认是否支持。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:07", "updated_at": "2026-10-09 13:46:02", "exec_level": "", "interactive": 0, "rollback": "! 回退：逐条删除本变更新增的静态/缺省/浮动路由\nenable\nconfigure terminal\nno ip route {{dest_net}} {{mask}} {{next_hop}}\nno ip route 0.0.0.0 0.0.0.0 {{next_hop}}\nno ip route {{dest_net}} {{mask}} {{backup_hop}} {{distance}}\nexit\nwrite\n! 复核\nshow ip route"}, {"uuid": "e79c87d3-4388-54ad-a7bb-d68e89bc5647", "platform": "network", "device_type": "路由器", "vendor": "zte", "os_family": "zxr10", "models": "ZXR10 路由器 / 三层交换机", "category": "OSPF", "title": "配置 OSPF 基本组网（ZXR10）", "description": "开启 OSPF 进程、设 router-id、宣告网段并设置被动接口。", "commands": "! ===== OSPF 基本配置（ZXR10）=====\nenable\nconfigure terminal\nrouter ospf {{process_id}}\n router-id {{router_id}}\n network {{network}} {{wildcard}} area {{area_id}}\n passive-interface {{passive_port}}\n exit\nexit\nwrite\nshow ip ospf neighbor\nshow ip ospf route", "params": [{"name": "process_id", "label": "进程号", "default": "1", "required": true, "validate": "int:1-65535", "example": "1", "type": "int", "range": "1-65535", "description": "OSPF 进程号（仅本机有效），标识一个 OSPF 实例；两端进程号可以不同，但网段/区域/认证必须匹配"}, {"name": "router_id", "label": "Router ID", "default": "7.7.7.7", "required": true, "validate": "ipv4", "example": "7.7.7.7", "type": "ip", "description": "OSPF Router ID（IPv4 格式），区域内唯一标识本路由器；重复会引发邻居震荡与路由抖动，建议用 loopback 接口地址"}, {"name": "network", "label": "宣告网段", "default": "10.0.0.0", "required": true, "validate": "ipv4", "example": "10.0.0.0", "type": "ip", "description": "OSPF 宣告网段，匹配哪些接口参与 OSPF 进程；与 wildcard 配套使用；宣告漏了/错了邻居和路由直接缺失"}, {"name": "wildcard", "label": "反掩码", "default": "0.0.0.255", "required": true, "validate": "masklen", "example": "0.0.0.255", "type": "string", "description": "OSPF/ACL 反掩码（wildcard），0 位精确匹配、1 位任意；0.0.0.255 对应 /24；写错宣告/匹配范围不对"}, {"name": "area_id", "label": "区域号", "default": "0", "required": false, "validate": "", "example": "0 或 0.0.0.1", "type": "string", "description": "OSPF 区域 ID，控制该网段归属哪个 OSPF 区域；骨干区域固定 0.0.0.0，非骨干区域须与骨干直连（或虚链路）；填错邻居起不来、路由学不到"}, {"name": "passive_port", "label": "被动接口", "default": "gei_1/1", "required": false, "validate": "port", "example": "gei_1/1", "type": "string", "description": "OSPF 被动接口（锐捷/中兴写法），同被动接口语义；上联口须 no passive 恢复建邻"}], "notes": "1) ZXR10 的 OSPF 与 Cisco 结构一致（进程 → network + area），改造成本低。\n2) network 用反掩码；router-id 建议显式指定，否则取接口地址，链路抖动会重建邻居。\n3) 被动接口写法在部分版本为 passive-interface <接口名>，也可能只支持在接口下配，\n   上机时用 ? 确认。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:07", "updated_at": "2026-10-09 13:46:02", "exec_level": "", "interactive": 0, "rollback": "! 回退：删除整个 OSPF 进程（进程若预存只是新增 network，则进视图逐条 no network）\nenable\nconfigure terminal\nno router ospf {{process_id}}\nexit\nwrite\n! 复核\nshow ip ospf neighbor"}, {"uuid": "827f9ded-e25d-5194-b0b7-5bdef84ec234", "platform": "network", "device_type": "路由器", "vendor": "zte", "os_family": "zxr10", "models": "ZXR10 全系列", "category": "ACL", "title": "配置 ACL 并应用到接口（ZXR10）", "description": "创建扩展 ACL 限制网段互访，并绑定到接口方向。", "commands": "! ===== ACL 配置与下发（ZXR10）=====\nenable\nconfigure terminal\nacl extend number {{acl_number}}\n rule 1 permit ip {{src_net}} {{src_wild}} {{dst_net}} {{dst_wild}}\n rule 100 deny ip any any\n exit\ninterface {{port}}\n ip access-group {{acl_number}} in\n exit\nexit\nwrite\nshow acl {{acl_number}}", "params": [{"name": "acl_number", "label": "ACL 编号", "default": "100", "required": true, "validate": "int:1-199", "example": "ZXR10 通常 1-99 标准、100-199 扩展", "type": "int", "range": "1-199", "description": "ACL 编号，标识一条访问控制列表；Cisco 1-99 为标准 IP ACL、100-199 为扩展 IP ACL，华为/H3C 段位含义类似；改动后立即影响命中流量，nat outbound 等引用处需同步核对"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "src_wild", "label": "源反掩码", "default": "0.0.0.255", "required": true, "validate": "masklen", "example": "0.0.0.255", "type": "string", "description": "源网段反掩码（wildcard mask），0 位精确匹配、1 位任意；与掩码写法相反（0.0.0.255 对应 /24）"}, {"name": "dst_net", "label": "目的网段", "default": "10.10.0.0", "required": true, "validate": "ipv4", "example": "10.10.0.0", "type": "ip", "description": "目的网段（ACL/防火墙策略匹配字段），0.0.0.0/0 表示任意目的；与反掩码/前缀长度配套使用；范围写宽会扩大放行面"}, {"name": "dst_wild", "label": "目的反掩码", "default": "0.0.255.255", "required": true, "validate": "masklen", "example": "0.0.255.255", "type": "string", "description": "目的网段反掩码（wildcard mask），0 位精确匹配、1 位任意；与子网掩码写法相反（0.0.0.255 对应 /24），写错匹配范围全错"}, {"name": "port", "label": "应用端口", "default": "gei_1/1", "required": true, "validate": "port", "example": "gei_1/1", "type": "string", "description": "接口名/接口编号，进入该接口视图后所做的配置只作用于这一个口；先 show/display 确认接口存在与状态——进错接口改配置是现场常见事故"}], "notes": "1) ZXR10 用 acl standard number / acl extend number <编号> 建 ACL，\n   编号段与 Cisco 类似但具体范围需按版本确认（常见 1-99 标准、100-199 扩展）。\n2) 规则用 rule <序号> 定义，序号小的先匹配，末尾隐含拒绝。\n3) 应用到接口用 ip access-group <编号> in/out。\n4) show acl 看规则与命中计数，改完务必核对是否真的生效。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:07", "updated_at": "2026-10-09 13:46:02", "exec_level": "", "interactive": 0, "rollback": "! 回退：先解接口引用，再删 ACL 本体\nenable\nconfigure terminal\ninterface {{port}}\n no ip access-group {{acl_number}} in\n exit\nno acl extend number {{acl_number}}\nexit\nwrite\n! 复核\nshow acl"}, {"uuid": "b51500b7-c1bf-5d04-af3b-0bca78a23562", "platform": "network", "device_type": "路由器", "vendor": "zte", "os_family": "zxr10", "models": "ZXR10 路由器（NAT 型号）", "category": "NAT", "title": "配置 NAT 地址转换（PAT 复用 / 静态映射）", "description": "内网网段通过出接口地址做端口复用，并给出服务器静态映射写法。", "commands": "! ===== NAT / PAT 配置（ZXR10）=====\nenable\nconfigure terminal\ninterface {{inside_port}}\n ip address {{inside_ip}} {{inside_mask}}\n ip nat inside\n exit\ninterface {{outside_port}}\n ip address {{outside_ip}} {{outside_mask}}\n ip nat outside\n exit\nacl standard number {{acl_number}}\n rule 1 permit {{src_net}} {{src_wild}}\n exit\nip nat inside source list {{acl_number}} interface {{outside_port}} overload\n! 静态一对一映射（外网访问内网服务器）\nip nat inside source static {{inside_server}} {{public_ip}}\nexit\nwrite\nshow ip nat translations", "params": [{"name": "inside_port", "label": "内网口", "default": "gei_1/1", "required": true, "validate": "port", "example": "gei_1/1", "type": "string", "description": "内网侧接口名或映射端口号，DNAT 流量的内部接收方向；写错映射不生效"}, {"name": "inside_ip", "label": "内网口 IP", "default": "192.168.1.1", "required": true, "validate": "ipv4", "example": "192.168.1.1", "type": "ip", "description": "NAT 映射的内网真实 IP（被发布服务器的地址），DNAT 后流量的真正去向；填错把外部流量引到错误主机"}, {"name": "inside_mask", "label": "内网口掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "内网接口的子网掩码，决定 inside 接口网段范围；须与内网地址规划一致"}, {"name": "outside_port", "label": "外网口", "default": "gei_1/2", "required": true, "validate": "port", "example": "gei_1/2", "type": "string", "description": "外网侧接口名，NAT outside 方向的接口绑定；内外口方向标反 NAT 完全不生效"}, {"name": "outside_ip", "label": "外网口 IP", "default": "200.1.1.2", "required": true, "validate": "ipv4", "example": "200.1.1.2", "type": "ip", "description": "外网口 IP，NAT 转换后对外呈现的地址所在接口；须与上联网段规划一致且未被占用"}, {"name": "outside_mask", "label": "外网口掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "外网口子网掩码，与 outside_ip 配套"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "src_wild", "label": "源反掩码", "default": "0.0.0.255", "required": true, "validate": "masklen", "example": "0.0.0.255", "type": "string", "description": "源网段反掩码（wildcard mask），0 位精确匹配、1 位任意；与掩码写法相反（0.0.0.255 对应 /24）"}, {"name": "acl_number", "label": "ACL 编号", "default": "1", "required": true, "validate": "int:1-99", "example": "1-99", "type": "int", "range": "1-99", "description": "ACL 编号，标识一条访问控制列表；Cisco 1-99 为标准 IP ACL、100-199 为扩展 IP ACL，华为/H3C 段位含义类似；改动后立即影响命中流量，nat outbound 等引用处需同步核对"}, {"name": "inside_server", "label": "内网服务器", "default": "192.168.1.100", "required": false, "validate": "ipv4", "example": "192.168.1.100", "type": "ip", "description": "内网服务器真实 IP（NAT 发布的后端），对外映射的源地址；该主机须可达且服务在监听，否则映射是『空转』"}, {"name": "public_ip", "label": "公网映射 IP", "default": "200.1.1.3", "required": false, "validate": "ipv4", "example": "200.1.1.3", "type": "ip", "description": "对外发布的公网/映射 IP，NAT 后外部访问的地址；须在上联口网段内且未被占用，冲突会绑定失败"}], "notes": "1) NAT 语法与 Cisco 一致（ip nat inside/outside + source list ... overload），\n   但只有带 NAT 功能的 ZXR10 型号支持，上机前确认产品形态。\n2) inside/outside 标错接口是 NAT 不生效的头号原因，先用 show ip nat statistics 看命中。\n3) 部分版本用 nat 而非 ip nat 关键字，按 ? 提示调整。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:07", "updated_at": "2026-10-09 13:46:02", "exec_level": "", "interactive": 0, "rollback": "! 回退：按创建逆序撤销 NAT（接口 IP 若为既有配置勿动 IP 行，只撤 NAT 标记）\nenable\nconfigure terminal\nno ip nat inside source static {{inside_server}} {{public_ip}}\nno ip nat inside source list {{acl_number}} interface {{outside_port}} overload\nno acl standard number {{acl_number}}\ninterface {{inside_port}}\n no ip nat inside\n exit\ninterface {{outside_port}}\n no ip nat outside\n exit\nexit\nwrite\n! 复核\nshow ip nat translations"}, {"uuid": "7bd18367-ba07-55eb-a9ca-882b8963841a", "platform": "network", "device_type": "交换机", "vendor": "zte", "os_family": "zxr10", "models": "ZXR10 全系列", "category": "SSH管理", "title": "开启 SSH 并创建本地用户（ZXR10）", "description": "配置域名、生成 RSA 密钥、创建特权用户并限制 vty 登录协议。", "commands": "! ===== 开启 SSH + 本地用户（ZXR10）=====\nenable\nconfigure terminal\nhostname {{hostname}}\nip domain-name {{domain}}\nusername {{username}} privilege 15 password {{password}}\ncrypto key generate rsa\n! ↑ 部分版本会交互提示输入密钥模数，建议 2048\nip ssh version 2\nline vty 0 4\n login local\n transport input ssh\n exec-timeout {{timeout_min}} 0\n exit\nexit\nwrite\nshow ip ssh", "params": [{"name": "hostname", "label": "设备名", "default": "SW-CORE-01", "required": false, "validate": "", "example": "SW-CORE-01", "type": "string", "description": "设备主机名，标识作用不影响转发；修改后提示符与日志来源同步变化，网管侧如按主机名建资产需同步更新"}, {"name": "domain", "label": "域名", "default": "corp.local", "required": true, "validate": "", "example": "corp.local", "type": "string", "description": "设备域名后缀（ip domain-name / domain-name），用于 DNS 解析补全与 SSH RSA 密钥生成；改后提示符与解析习惯同步变化"}, {"name": "username", "label": "用户名", "default": "netadmin", "required": true, "validate": "", "example": "netadmin", "type": "string", "description": "登录账号名，认证身份标识；按人名/工号命名便于审计追责，禁用共享账号"}, {"name": "password", "label": "密码", "default": "", "required": true, "validate": "", "example": "现场生成：>=12位，含大小写/数字/符号", "type": "string", "description": "账号登录口令，认证凭据；配置中可能明文/弱加密存储，导出配置时必须脱敏；遵循强口令并定期轮换"}, {"name": "timeout_min", "label": "超时分钟数", "default": "10", "required": false, "validate": "int:0-35791", "example": "10", "type": "int", "range": "0-35791", "description": "登录空闲超时（分钟），无操作自动登出；现场建议 10-30 分钟；设太短频繁重登影响效率，太长有被冒用风险"}], "notes": "1) 生成 RSA 密钥前必须有 hostname 与 ip domain-name，否则报错。\n2) crypto key generate rsa 在部分版本是交互式（提示输入模数），脚本会停在提示符上，\n   需手工输入 2048 后继续。\n3) transport input ssh 会关掉 Telnet，改之前务必留一个已连通的 SSH 会话。\n4) 特权级别写法与 Cisco 一致（privilege 15）；部分版本用 user privilege level 15。\n5) ★ 口令必须现场生成随机强口令，禁止沿用任何示例值；渲染对话框未填口令会标红并阻止生成。\n", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:07", "updated_at": "2026-10-09 13:46:02", "exec_level": "", "interactive": 0, "rollback": "! 回退：恢复 vty 旧认证方式并删除本地用户（hostname/domain 旧值按变更记录恢复；\n! RSA 密钥保留——删除会断掉依赖它的 SSH 会话）\nenable\nconfigure terminal\nno username {{username}}\nline vty 0 4\n no login local\n no transport input ssh\n no exec-timeout\n exit\nexit\nwrite\n! 复核\nshow ip ssh"}, {"uuid": "426b9f4e-62ac-5ffc-8cdb-4fe45e3fef3a", "platform": "network", "device_type": "交换机", "vendor": "zte", "os_family": "zxr10", "models": "ZXR10 全系列", "category": "密码", "title": "修改 Console 口令与特权密码（ZXR10）", "description": "设置 console 口令、空闲超时与特权密码。", "commands": "! ===== Console 与特权口令（ZXR10）=====\nenable\nconfigure terminal\nline console 0\n password {{console_password}}\n login\n logging synchronous\n exec-timeout {{timeout_min}} 0\n exit\nenable secret {{enable_secret}}\nexit\nwrite", "params": [{"name": "console_password", "label": "Console 口令", "default": "C0nsole@123", "required": true, "validate": "", "example": "C0nsole@123", "type": "string", "description": "Console 串口登录口令，控制带外接入认证；是网络故障时的最后生命线，遗忘只能走 recovery 流程；配置后立即生效"}, {"name": "enable_secret", "label": "特权密码", "default": "En@ble@12345", "required": true, "validate": "", "example": "En@ble@12345", "type": "string", "description": "特权模式（enable）口令，加密存储于配置；控制进入最高权限级的入口，务必强口令并定期轮换"}, {"name": "timeout_min", "label": "超时分钟数", "default": "10", "required": false, "validate": "int:0-35791", "example": "10", "type": "int", "range": "0-35791", "description": "登录空闲超时（分钟），无操作自动登出；现场建议 10-30 分钟；设太短频繁重登影响效率，太长有被冒用风险"}], "notes": "1) 与 Cisco 一致：enable secret 优先于 enable password 且加密存储，新设备只用 secret。\n2) console 下只写 login 用 line password（权限 1）；要直进特权 15 用 login local + 本地用户。\n3) 部分版本 line console 提示符为 line console 0 或 console 0，按 ? 确认。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:07", "updated_at": "2026-10-09 13:46:02", "exec_level": "", "interactive": 0, "rollback": "! 回退：口令类变更须恢复旧口令（旧值按变更记录回填尖括号处）\nenable\nconfigure terminal\nline console 0\n password <旧console口令>\n no logging synchronous\n no exec-timeout\n exit\nenable secret <旧特权口令>\nexit\nwrite"}, {"uuid": "0c99899f-4aa7-5c17-a535-8e9bb24fc930", "platform": "network", "device_type": "交换机", "vendor": "zte", "os_family": "zxr10", "models": "ZXR10 全系列", "category": "SNMP", "title": "配置 SNMP v2c 与 Trap 上报（ZXR10）", "description": "配置只读/读写团体字、设备位置联系人，并把 Trap 上报到网管。", "commands": "! ===== SNMP 配置（ZXR10）=====\nenable\nconfigure terminal\nsnmp-server community {{ro_community}} ro\nsnmp-server community {{rw_community}} rw\nsnmp-server location {{location}}\nsnmp-server contact {{contact}}\nsnmp-server host {{nms_ip}} trap version 2c {{ro_community}}\nsnmp-server enable trap\nexit\nwrite\nshow snmp community", "params": [{"name": "ro_community", "label": "只读团体字", "default": "RO@Public1", "required": true, "validate": "", "example": "RO@Public1", "type": "string", "description": "SNMP 只读团体字，等同口令——网管凭它采集设备数据；禁用 public 等弱值并限定来源；只读为主，写权限单独管理"}, {"name": "rw_community", "label": "读写团体字", "default": "RW@Public1", "required": true, "validate": "", "example": "RW@Public1", "type": "string", "description": "SNMP 读写团体字——持有即可远程修改设备配置，权限极高；仅必要时配置，务必限定来源网段并使用强值"}, {"name": "location", "label": "设备位置", "default": "IDC-A-机柜12", "required": false, "validate": "", "example": "IDC-A-机柜12", "type": "string", "description": "SNMP 系统位置（sysLocation）字段，标明设备物理位置（机房/机柜/U 位），告警现场定位依据；纯展示不影响功能"}, {"name": "contact", "label": "联系人", "default": "网络运维组", "required": false, "validate": "", "example": "网络运维组", "type": "string", "description": "SNMP 系统联系人（sysContact）字段，网管告警时定位责任人的依据；纯展示不影响功能"}, {"name": "nms_ip", "label": "网管服务器 IP", "default": "10.0.0.100", "required": true, "validate": "ipv4", "example": "10.0.0.100", "type": "ip", "description": "网管服务器（SNMP 采集/trap 接收）IP，设备向其发送告警并接受查询；填错网管侧收不到任何数据，等于监控失明"}], "notes": "1) 不同 ROS 版本 snmp-server host 的参数顺序差异较大（trap/version/团体字位置），\n   报错时按 ? 逐项确认。\n2) 只用采集时给 ro 即可；rw 有被下发配置的风险，用完及时删除。\n3) 团体字别用 public/private，安全审计会判违规。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:07", "updated_at": "2026-10-09 13:46:03", "exec_level": "", "interactive": 0, "rollback": "! 回退：删除本变更新增的 SNMP 配置（location/contact 旧值按变更记录恢复）\nenable\nconfigure terminal\nno snmp-server host {{nms_ip}} trap version 2c {{ro_community}}\nno snmp-server community {{ro_community}} ro\nno snmp-server community {{rw_community}} rw\nno snmp-server location\nno snmp-server contact\nno snmp-server enable trap\nexit\nwrite\n! 复核\nshow snmp community"}, {"uuid": "58cfa0cd-0bed-523f-b5f3-22ae605b8843", "platform": "network", "device_type": "交换机", "vendor": "zte", "os_family": "zxr10", "models": "ZXR10 全系列", "category": "保存配置", "title": "保存配置并备份到本地 flash", "description": "用 write 保存运行配置，并复制一份到 flash 作为回滚点。", "commands": "! ===== 保存与本地备份（ZXR10）=====\nenable\nwrite\nshow startup-config\ndir flash:/\ncopy running-config flash:backup-{{backup_tag}}.cfg\ndir flash:/", "params": [{"name": "backup_tag", "label": "备份标记", "default": "20260920", "required": false, "validate": "", "example": "20260920 或变更单号", "type": "string", "description": "备份文件版本标签，拼进备份文件名（如 backup-20260930-pre-upgrade.cfg）便于追溯；建议用『日期-动作』格式，回滚时按标签定位对应版本"}], "notes": "1) ZXR10 保存用 write（等效 write memory）；部分版本为 save，按 ? 确认。\n2) 隔离网络不要用 TFTP 方式备份，直接存 flash: 最稳。\n3) flash 路径可能是 flash:/ 或 cfg/，先用 dir 看现有文件再决定路径。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:08", "updated_at": "2026-10-09 13:46:03", "exec_level": "", "interactive": 0, "rollback": "! 回退：本条目仅保存与备份配置，不改变网络行为，无需配置回退；\n! 如需清理本次备份文件\nenable\ndelete flash:backup-{{backup_tag}}.cfg\ndir flash:/"}, {"uuid": "ef5e0a8b-63b4-512a-a975-c44f65020f13", "platform": "network", "device_type": "交换机", "vendor": "cisco", "os_family": "ios", "models": "全体 Cisco 设备", "category": "DNS域名解析", "title": "配置 DNS 服务器与域名解析（Cisco IOS）", "description": "指向内网 DNS 服务器并开启域名解析，验证域名可解析（离网内网 DNS 标准动作）。", "commands": "! ===== 配置 DNS 服务器与域名解析（Cisco IOS）=====\n! ---- 配置段：指向内网 DNS，开启域名解析 ----\nenable\nconfigure terminal\nip name-server {{dns_server_ip}}\nip domain-lookup\nend\n! ---- 验证段：ping 域名触发解析 + 看解析缓存 ----\nshow hosts\nping {{test_domain}}\n", "params": [{"name": "dns_server_ip", "label": "内网 DNS 服务器 IP", "default": "", "required": true, "validate": "ipv4", "example": "192.168.66.10", "type": "ip", "description": "设备侧 DNS 服务器地址，用于域名解析（ping 域名、日志主机名反查）；须网络可达；改动立即生效"}, {"name": "test_domain", "label": "验证用内网域名", "default": "", "required": true, "validate": "", "example": "gw.corp.local", "type": "string", "description": "DNS/连通性测试域名，ping 它通 = 网络+解析都正常；不通时分层排查（先 IP 后域名）"}], "notes": "1) IOS exec 无 nslookup 子命令（部分新 IOS-XE 才有）：验证解析用 ping 域名，回显 Translating \"xxx\"...domain server (IP) 即 DNS 生效。\n2) show hosts 查看已解析缓存；ping 解析成功后该域名会以临时条目出现在 hosts 表。\n3) ip domain-lookup 默认开启；若历史配置 no 掉过，ping 域名直接报 % Unrecognized host，先补回该命令。\n验证方法：show run | include name-server 确认服务器已写入 + ping test_domain（内网任意域名），60 秒完成；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-24 16:09:29", "updated_at": "2026-10-09 13:45:31", "exec_level": "", "interactive": 0, "rollback": "! 回退：撤销 name-server 并关闭域名解析（恢复未配置 DNS 的默认状态）\nenable\nconfigure terminal\nno ip name-server {{dns_server_ip}}\nno ip domain-lookup\nend\nwrite memory\n! 复核\nshow hosts"}, {"uuid": "f8f92c67-407f-5f16-8099-f462cef61eb7", "platform": "network", "device_type": "防火墙", "vendor": "fortinet", "os_family": "fortios", "models": "FortiGate 全系列", "category": "DNS域名解析", "title": "配置 DNS 服务器与域名解析（FortiOS）", "description": "config system dns 指向内网 DNS，验证域名可解析（离网内网 DNS 标准动作）。", "commands": "# ===== 配置 DNS 服务器与域名解析（FortiOS）=====\n# ---- 配置段 ----\nconfig system dns\nset primary {{dns_server_ip}}\nset protocol cleartext\nend\n# ---- 验证段 ----\nexecute ping {{test_domain}}\n", "params": [{"name": "dns_server_ip", "label": "内网 DNS 服务器 IP", "default": "", "required": true, "validate": "ipv4", "example": "192.168.66.10", "type": "ip", "description": "设备侧 DNS 服务器地址，用于域名解析（ping 域名、日志主机名反查）；须网络可达；改动立即生效"}, {"name": "test_domain", "label": "验证用内网域名", "default": "", "required": true, "validate": "", "example": "gw.corp.local", "type": "string", "description": "DNS/连通性测试域名，ping 它通 = 网络+解析都正常；不通时分层排查（先 IP 后域名）"}], "notes": "1) FortiOS 6.2+ 必须配 set protocol cleartext 才允许指向内网明文 DNS（默认 sdns 协议会拒绝自定义服务器）；6.0 老版本无 protocol 字段，该行报 Command fail 就删掉。\n2) execute ping 在 CLI 顶层执行；FortiOS 无 execute nslookup，解析验证靠 ping 域名回显 Resolved xxx as IP。\n3) set secondary 可加备用 DNS。\n验证方法：get system dns 核对 primary + execute ping test_domain，60 秒完成；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-24 16:09:29", "updated_at": "2026-10-09 13:45:32", "exec_level": "", "interactive": 0, "rollback": "# 回退：撤销 DNS 配置（unset primary 恢复默认；原 DNS 值按变更记录回填）\nconfig system dns\n    unset primary\n    unset protocol\nend\n# 复核\nshow system dns"}, {"uuid": "e5cdb683-3772-5ed0-a5b0-bcb4249401ff", "platform": "network", "device_type": "交换机", "vendor": "h3c", "os_family": "comware7", "models": "H3C Comware7 全系列", "category": "DNS域名解析", "title": "配置 DNS 服务器与域名解析（H3C Comware7）", "description": "指向内网 DNS 服务器，验证域名可解析（离网内网 DNS 标准动作）。", "commands": "# ===== 配置 DNS 服务器与域名解析（H3C Comware7）=====\n# ---- 配置段 ----\nsystem-view\ndns server {{dns_server_ip}}\nquit\n# ---- 验证段 ----\ndisplay dns server\nping {{test_domain}}\n", "params": [{"name": "dns_server_ip", "label": "内网 DNS 服务器 IP", "default": "", "required": true, "validate": "ipv4", "example": "192.168.66.10", "type": "ip", "description": "设备侧 DNS 服务器地址，用于域名解析（ping 域名、日志主机名反查）；须网络可达；改动立即生效"}, {"name": "test_domain", "label": "验证用内网域名", "default": "", "required": true, "validate": "", "example": "gw.corp.local", "type": "string", "description": "DNS/连通性测试域名，ping 它通 = 网络+解析都正常；不通时分层排查（先 IP 后域名）"}], "notes": "1) Comware7 配好静态 DNS 服务器即自动具备域名解析，没有华为式的 dns resolve 总开关（与华为的最大差异）。\n2) 若本机还要给内网终端做 DNS 代理，另配 dns proxy enable——本条只做客户端解析，不含该命令。\n3) 报错前缀是 %（华为是 Error:），别混淆；可用备用 DNS 同华为一样重复执行追加。\n验证方法：display dns server + ping test_domain，60 秒完成；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-24 16:09:29", "updated_at": "2026-10-09 13:45:34", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除 DNS 服务器引用（原配置按变更记录恢复）\nsystem-view\nundo dns server {{dns_server_ip}}\nquit\n# 复核\ndisplay dns server"}, {"uuid": "1d371020-3fbe-564d-9854-30eb2fb9b756", "platform": "network", "device_type": "交换机", "vendor": "huawei", "os_family": "vrp5", "models": "华为 S 系列（AR/VRP8 通用）", "category": "DNS域名解析", "title": "配置 DNS 服务器与域名解析（华为 VRP5，AR/VRP8 通用）", "description": "开启动态域名解析并指向内网 DNS，验证域名可解析（离网内网 DNS 标准动作）。", "commands": "# ===== 配置 DNS 服务器与域名解析（华为 VRP5，AR/VRP8 通用）=====\n# ---- 配置段 ----\nsystem-view\ndns resolve\ndns server {{dns_server_ip}}\nquit\n# ---- 验证段 ----\ndisplay dns server\nping {{test_domain}}\n", "params": [{"name": "dns_server_ip", "label": "内网 DNS 服务器 IP", "default": "", "required": true, "validate": "ipv4", "example": "192.168.66.10", "type": "ip", "description": "设备侧 DNS 服务器地址，用于域名解析（ping 域名、日志主机名反查）；须网络可达；改动立即生效"}, {"name": "test_domain", "label": "验证用内网域名", "default": "", "required": true, "validate": "", "example": "gw.corp.local", "type": "string", "description": "DNS/连通性测试域名，ping 它通 = 网络+解析都正常；不通时分层排查（先 IP 后域名）"}], "notes": "1) dns resolve 是开启动态域名解析的总开关，漏敲则 ping 域名直接报 Unknown host——这是本场景第一大坑。\n2) dns server 最多可配 8 个；重复执行即追加备用 DNS。\n3) VRP5/VRP8 命令完全一致，AR 系列路由器同样适用；ping 域名回显 PING xxx (x.x.x.x) 即解析成功。\n验证方法：display dns server 确认服务器已写入 + ping test_domain，60 秒完成；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-24 16:09:29", "updated_at": "2026-10-09 13:45:37", "exec_level": "", "interactive": 0, "rollback": "# 回退：关闭域名解析并删除 DNS 服务器引用\nsystem-view\nundo dns resolve\nundo dns server {{dns_server_ip}}\nquit\n# 复核\ndisplay dns server"}, {"uuid": "f0b04fd6-2368-5c82-a8a8-f2a50d70577e", "platform": "network", "device_type": "交换机", "vendor": "juniper", "os_family": "junos", "models": "Junos 全系列", "category": "DNS域名解析", "title": "配置 DNS 服务器与域名解析（Junos，含 commit）", "description": "set name-server 指向内网 DNS 并 commit，验证域名可解析（离网内网 DNS 标准动作）。", "commands": "# ===== 配置 DNS 服务器与域名解析（Junos，含 commit）=====\n# ---- 配置段：Junos 是 candidate 模型，改完必须 commit 才生效 ----\nconfigure\nset system name-server {{dns_server_ip}}\ncommit and-quit\n# ---- 验证段 ----\nshow configuration system name-server\nping {{test_domain}}\n", "params": [{"name": "dns_server_ip", "label": "内网 DNS 服务器 IP", "default": "", "required": true, "validate": "ipv4", "example": "192.168.66.10", "type": "ip", "description": "设备侧 DNS 服务器地址，用于域名解析（ping 域名、日志主机名反查）；须网络可达；改动立即生效"}, {"name": "test_domain", "label": "验证用内网域名", "default": "", "required": true, "validate": "", "example": "gw.corp.local", "type": "string", "description": "DNS/连通性测试域名，ping 它通 = 网络+解析都正常；不通时分层排查（先 IP 后域名）"}], "notes": "1) 忘记 commit 是 Junos\"配了不生效\"第一名：set 只进候选库，commit and-quit 才落盘并生效。\n2) show system name-server 仅 Junos 17.3+ 支持，通用写法是 show configuration system name-server（本条用后者）。\n3) 重复 set system name-server 可追加备用 DNS；删除用 delete system name-server <IP>。\n验证方法：show configuration system name-server + ping test_domain，60 秒完成；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-24 16:09:29", "updated_at": "2026-10-09 13:45:39", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除 DNS 服务器引用（原配置按变更记录恢复）\nconfigure\ndelete system name-server {{dns_server_ip}}\ncommit and-quit\n# 复核\nshow configuration system name-server"}, {"uuid": "1fa91158-9d79-5dd0-bde7-af5c56c2d77c", "platform": "linux", "device_type": "", "vendor": "openeuler", "os_family": "openeuler2203", "models": "openEuler 22.03 LTS", "category": "本地源", "title": "createrepo 自建 dnf 源（openEuler RPM 目录）", "description": "把零散 RPM 收进目录做成持久本地源；与《本地 dnf/yum 源（openEuler ISO 挂载）》互补——ISO 源解决装包环境，本条解决自定义包集合分发。", "commands": "# ===== createrepo 自建 dnf 源（openEuler RPM 目录）=====\n# ---- 0. ★ 改仓库结构前先备份既有 repo（dnf 报错随时可回滚）----\ncp -r /etc/yum.repos.d /etc/yum.repos.d.bak.$(date +%Y%m%d)\n# ---- 1. 装 createrepo_c：离网侧先按《本地 dnf/yum 源（openEuler ISO 挂载）》挂好 ISO 源再装 ----\ndnf install createrepo_c -y\n# ---- 2. 把 RPM 收进目录（U 盘/scp 均可，见传输工具条目；下面一行按实际介质路径执行）----\nmkdir -p {{repo_dir}}\n# cp /mnt/usb/*.rpm {{repo_dir}}/\ncreaterepo_c {{repo_dir}}\n# ---- 3. 写 repo 文件（gpgcheck=0：自建目录无签名，内网可控可接受）----\ncat > /etc/yum.repos.d/local-dir.repo << 'EOF'\n[local-dir]\nname=Local RPM Directory\nbaseurl=file://{{repo_dir}}\nenabled=1\ngpgcheck=0\nEOF\n# ---- 4. 刷新缓存 + 验证性安装 ----\ndnf clean all\ndnf makecache\ndnf repolist\ndnf install {{pkg_name}} -y\n", "params": [{"name": "repo_dir", "label": "RPM 目录", "default": "/opt/local-repo", "required": false, "validate": "path", "example": "/opt/local-repo", "type": "string", "description": "本地 yum 仓库目录，离网 RPM 的存放位置；放完包后 createrepo 更新元数据，repo 文件指向该目录"}, {"name": "pkg_name", "label": "验证性安装的包名", "default": "", "required": true, "validate": "", "example": "createrepo_c 自带则换其他包", "type": "string", "description": "软件包名（yum/apt/rpm 的操作对象）；离网环境先在异机下载（pip download / yumdownloader）再拷入安装"}], "notes": "1) ★ 易错点：改 /etc/yum.repos.d 前必须整目录备份（第 0 步）；openEuler 官方 repo 文件保留原名共存即可，冲突报错时再把官方源改名 .bak。\n2) baseurl 必须指向含 repodata/ 的目录——createrepo_c 跑完目录里才会生成 repodata，顺序不能反。\n3) GPG 校验取舍：自建目录没有签名仓库，gpgcheck=0 是通行做法；有安全要求时用 gpg 签名 + 本地导入 key，别简单改 gpgcheck。\n4) 目录源是本地盘路径，无需 fstab 挂载；repo 文件落盘即持久化。\n验证方法：dnf repolist 出现 local-dir + dnf install {{pkg_name}} 成功，两条命令 60 秒完成；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）\n—— 实测 2026-10-12（场2,Docker(centos7:local, 容器)）:语法核对(裁决A,yum 同族):createrepo+makecache+回退✓;dnf 本体 openEuler 真机复核", "duration": "perm", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-24 16:09:29", "updated_at": "2026-10-09 13:45:47", "exec_level": "verified-cli", "interactive": 0, "rollback": "# 回退：整个 /etc/yum.repos.d 已在变更前整目录备份——恢复备份目录并重建缓存\nls -d /etc/yum.repos.d.bak.*\nrm -rf /etc/yum.repos.d && cp -r /etc/yum.repos.d.bak.<变更日期> /etc/yum.repos.d\nrm -f /etc/yum.repos.d/local-dir.repo\ndnf clean all && dnf makecache\n# 复核\ndnf repolist"}, {"uuid": "751441e5-b7a4-58ea-9705-1a1568adb5fa", "platform": "linux", "device_type": "", "vendor": "openeuler", "os_family": "openeuler2203", "models": "openEuler 22.03 LTS（RHEL 系通用）", "category": "本地源", "title": "pip 离线安装（download → --no-index --find-links）", "description": "有网侧 pip download 带全依赖，离网侧 --no-index 从本地目录安装；Python 包离网部署标准流程。", "commands": "# ===== pip 离线安装 =====\n# ---- 1.【有网侧】下载包及其全部依赖到目录（★ 必须与离网侧同 python 大版本 + 同平台架构）----\npip download {{pkg_name}} -d {{src_path}}\nls {{src_path}}\n# ---- 2. 把整个 {{src_path}} 目录拷到离网机器（U 盘/内网，见传输工具条目）----\n# ---- 3.【离网侧】本地目录安装（--no-index 禁用一切在线源）----\npip install --no-index --find-links {{src_path}} {{pkg_name}}\n# ---- 4. 验证（import 名与包名可能不同，按实际包替换）----\npip show {{pkg_name}}\npython3 -c \"import <模块名>; print('OK')\"\n", "params": [{"name": "pkg_name", "label": "包名", "default": "", "required": true, "validate": "", "example": "requests", "type": "string", "description": "软件包名（yum/apt/rpm 的操作对象）；离网环境先在异机下载（pip download / yumdownloader）再拷入安装"}, {"name": "src_path", "label": "离线包目录", "default": "/opt/pkgs", "required": false, "validate": "path", "example": "/opt/pkgs", "type": "string", "description": "源文件/目录路径（拷贝/打包起点）；rsync 尾部斜杠语义不同（带斜杠拷内容、不带拷目录本身），先 -n 演练"}], "notes": "1) ★ 易错点：有网侧与离网侧的 python 大版本（3.9 vs 3.11）和架构（x86_64 vs aarch64）不一致，download 下来的 wheel 装不上——离网侧先 python3 --version + uname -m，跨机下载补 --platform manylinux2014_x86_64 --python-version 39 --only-binary=:all:。\n2) pip download 默认连带全部依赖（这正是要的）；离网侧 --no-index 保证绝不偷连公网源，漏写则报错前先卡半分钟超时。\n3) 源码包（tar.gz）安装需离网机有 gcc/python3-devel；离网优先 --only-binary 收 wheel。\n4) 缺依赖报 No matching distribution：回有网侧对同版本环境重新 download，别在离网侧猜。\n验证方法：pip show 出包信息 + import 成功两条命令 60 秒完成；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）\n—— 实测 2026-10-12（场2,Docker(ubuntu:22.04, 容器)）：语法核对(裁决A):pip download requests+依赖 whl→--no-index --find-links 安装 PIP-OFFLINE-OK→清理回退✓(python3-pip 经 apt 补装)", "duration": "temp", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-24 16:09:29", "updated_at": "2026-10-09 13:45:47", "exec_level": "verified-cli", "interactive": 0, "rollback": "# 回退：pip 离线安装的包按需卸载（依赖包一并卸载时注意别误删系统组件；\n# 下载目录 {{src_path}} 仅是离线包缓存，保留无害）\npip uninstall {{pkg_name}} -y\n# 复核（期望报不存在）\npip show {{pkg_name}}"}, {"uuid": "230f77a4-2814-528b-a6dc-d8e6e45d889d", "platform": "linux", "device_type": "", "vendor": "ubuntu", "os_family": "ubuntu2204", "models": "Ubuntu 22.04（含 live-server ISO）", "category": "本地源", "title": "本地 apt ISO 源（挂载 + file:/ 源 + fstab 持久化）", "description": "挂载 Ubuntu ISO 作 apt 本地源；与《本地 apt 源（deb 目录）》互补——ISO 源开箱即用免 dpkg-scanpackages。", "commands": "# ===== 本地 apt ISO 源（Ubuntu）=====\n# ---- 0. ★ 备份源配置 ----\ncp /etc/apt/sources.list /etc/apt/sources.list.bak.$(date +%Y%m%d)\n# ---- 1. 挂载 ISO ----\nmkdir -p /mnt/cdrom\nmount -o loop {{iso_path}} /mnt/cdrom\nls /mnt/cdrom/dists\n# ---- 2. 写 file:/ 源（发行代号按上一步 ls 的实际输出填 {{release_name}}）----\necho \"deb [trusted=yes] file:/mnt/cdrom {{release_name}} main universe\" > /etc/apt/sources.list.d/local-iso.list\n# ---- 3. 刷新 + 验证性安装 ----\napt-get update\napt-get install -y {{pkg_name}}\n# ---- 4. 开机自动挂载（fstab）----\necho '{{iso_path}} /mnt/cdrom iso9660 loop,ro 0 0' >> /etc/fstab\nmount -a && mount | grep /mnt/cdrom\n", "params": [{"name": "iso_path", "label": "ISO 文件路径", "default": "", "required": true, "validate": "path", "example": "/opt/iso/ubuntu-22.04.4-live-server-amd64.iso", "type": "string", "description": "本地 ISO 镜像文件路径，loop 挂载为本地安装源；写错路径 mount 失败；写入 /etc/fstab 前先手动挂载验证（配错 fstab 重启起不来）"}, {"name": "release_name", "label": "发行代号（ls dists 输出）", "default": "jammy", "required": false, "validate": "", "example": "jammy", "type": "string", "description": "Ubuntu 发行代号（jammy/focal 等），本地 ISO 源的 suite 名；必须与光盘 dists/ 目录实际名称一致，否则 apt 更新 404"}, {"name": "pkg_name", "label": "验证性安装的包名", "default": "vim", "required": false, "validate": "", "example": "vim", "type": "string", "description": "软件包名（yum/apt/rpm 的操作对象）；离网环境先在异机下载（pip download / yumdownloader）再拷入安装"}], "notes": "1) ★ 易错点：GPG 校验——file:/ 源没有可校验的 keyring，不加 [trusted=yes] 时 apt-get update 报 NO_PUBKEY/InRelease 校验失败；内网物理介质可控加 trusted=yes 是通行做法，企业有签名要求则导入 ISO 的归档 key 后去掉 trusted。\n2) ★ 易错点：fstab 写错会导致开机卡住——第 4 步追加后必须立刻 mount -a 验证无报错；更稳妥用 blkid 查 ISO 的 UUID 替换路径列。\n3) 发行代号必须与 ISO 一致（22.04 = jammy），代号写错 apt-get update 报 Release 文件不存在；live-server ISO 的 pool 含 main/universe 常用包，桌面版范围更大。\n4) apt-get update 若同时报公网源失败属正常（离网），只看 local-iso 是否 OK。\n验证方法：apt-get update 无 local-iso 报错 + apt-get install -y {{pkg_name}} 成功，60 秒完成；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：不可验证(需 ISO 介质):容器无 ubuntu-22.04 ISO,挂载/file:源/fstab 全链待带介质环境实测", "duration": "perm", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-24 16:09:29", "updated_at": "2026-10-09 13:45:49", "exec_level": "", "interactive": 0, "rollback": "# 回退：恢复变更日备份的 sources.list，删除本地源与 fstab 挂载行，卸载 ISO\nls -l /etc/apt/sources.list.bak.*\ncp /etc/apt/sources.list.bak.<变更日期> /etc/apt/sources.list\nrm -f /etc/apt/sources.list.d/local-iso.list\nsed -i '/mnt\\/cdrom/d' /etc/fstab\numount /mnt/cdrom\napt-get update\n# 复核\napt-cache policy"}, {"uuid": "3542ee8d-c063-5f96-a6a4-d470f3845b2c", "platform": "network", "device_type": "防火墙", "vendor": "paloalto", "os_family": "panos", "models": "Palo Alto 全系列", "category": "DNS域名解析", "title": "配置 DNS 服务器与域名解析（PAN-OS，set 系）", "description": "set dns-setting 指向内网 DNS 并 commit，验证域名可解析（离网内网 DNS 标准动作）。", "commands": "# ===== 配置 DNS 服务器与域名解析（PAN-OS，set 系）=====\n# ---- 配置段：Web 路径见 notes ----\nset deviceconfig system dns-setting servers primary {{dns_server_ip}}\ncommit\n# ---- 验证段 ----\nshow deviceconfig system dns-setting\nping host {{test_domain}}\n", "params": [{"name": "dns_server_ip", "label": "内网 DNS 服务器 IP", "default": "", "required": true, "validate": "ipv4", "example": "192.168.66.10", "type": "ip", "description": "设备侧 DNS 服务器地址，用于域名解析（ping 域名、日志主机名反查）；须网络可达；改动立即生效"}, {"name": "test_domain", "label": "验证用内网域名", "default": "", "required": true, "validate": "", "example": "gw.corp.local", "type": "string", "description": "DNS/连通性测试域名，ping 它通 = 网络+解析都正常；不通时分层排查（先 IP 后域名）"}], "notes": "1) Web 路径：Device → Setup → Services → Services → DNS Servers，Primary 填内网 DNS——CLI/Web 二选一，结果一致。\n2) PAN-OS 的 set 改动必须 commit 才生效；多条变更可攒一次 commit。\n3) ping host 是 PAN-OS 固定语法（裸 ping 不带 host 关键字会报错），与 IOS/VRP 习惯不同。\n验证方法：show deviceconfig system dns-setting 核对 primary + ping host test_domain，60 秒完成；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-24 16:09:29", "updated_at": "2026-10-09 13:45:52", "exec_level": "", "interactive": 0, "rollback": "# 回退：撤销 DNS 配置（原 DNS 值按变更记录回填）\nconfigure\ndelete deviceconfig system dns-setting servers primary\ncommit\n# 复核\nshow deviceconfig system dns-setting"}, {"uuid": "7ba70204-4b1f-500d-9fad-638eb2ec00ae", "platform": "network", "device_type": "交换机", "vendor": "ruijie", "os_family": "rgos", "models": "锐捷 RGOS 全系列", "category": "DNS域名解析", "title": "配置 DNS 服务器与域名解析（锐捷 RGOS）", "description": "指向内网 DNS 服务器，验证域名可解析（离网内网 DNS 标准动作）。", "commands": "! ===== 配置 DNS 服务器与域名解析（锐捷 RGOS）=====\n! ---- 配置段 ----\nenable\nconfigure terminal\nip name-server {{dns_server_ip}}\nend\n! ---- 验证段 ----\nshow hosts\nping {{test_domain}}\n", "params": [{"name": "dns_server_ip", "label": "内网 DNS 服务器 IP", "default": "", "required": true, "validate": "ipv4", "example": "192.168.66.10", "type": "ip", "description": "设备侧 DNS 服务器地址，用于域名解析（ping 域名、日志主机名反查）；须网络可达；改动立即生效"}, {"name": "test_domain", "label": "验证用内网域名", "default": "", "required": true, "validate": "", "example": "gw.corp.local", "type": "string", "description": "DNS/连通性测试域名，ping 它通 = 网络+解析都正常；不通时分层排查（先 IP 后域名）"}], "notes": "1) RGOS 与 IOS 同源：ip name-server 写法一致，domain-lookup 默认开启。\n2) ip name-server 可重复执行追加备用 DNS（最多 6 个），验证同思科用 show hosts + ping 域名。\n验证方法：show run | include name-server + ping test_domain，60 秒完成；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-24 16:09:29", "updated_at": "2026-10-09 13:45:54", "exec_level": "", "interactive": 0, "rollback": "! 回退：删除 name-server 引用（原 DNS 值按变更记录恢复）\nenable\nconfigure terminal\nno ip name-server {{dns_server_ip}}\nend\nwrite\n! 复核\nshow hosts"}, {"uuid": "987ac13d-39d8-5898-a417-1640e9c1180b", "platform": "network", "device_type": "防火墙", "vendor": "sangfor", "os_family": "sangfor_af", "models": "深信服 AF 全系列", "category": "DNS域名解析", "title": "配置 DNS 服务器与域名解析（深信服 AF，CLI 骨架 + Web 对照）", "description": "指向内网 DNS 服务器并验证解析；AF 的 DNS 属系统级配置，CLI 骨架待真机核对，Web 路径可直接照做。", "commands": "# ⚠ 待真机核对：本条目为 CLI 骨架 + Web 控制台对照，命令行未在本厂商真机验证过。\n# 核对方法：Console/
