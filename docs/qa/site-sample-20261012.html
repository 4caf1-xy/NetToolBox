<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetToolBox 命令库 · 静态站点</title>
<style>
/* token 由导出器从 SITE_TOKENS 注入（与 app/theme.py 同源，导出时校验，不做第二套色） */
:root{--bg-window:#1b1d23;--bg-panel:#232530;--bg-raised:#2a2d3a;--code-bg:#16181d;--border:#333745;--accent:#4f8cff;--success:#3fbf6f;--warning:#e0a83c;--danger:#e05656;--txt:#e8eaf0;--txt2:#9aa0b0;--txt3:#6a7080;--accent-12:rgba(79, 140, 255, 0.122);--success-14:rgba(63, 191, 111, 0.141);--warning-14:rgba(224, 168, 60, 0.141);--danger-14:rgba(224, 86, 86, 0.141);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-window);color:var(--txt);
font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
a{color:var(--accent);text-decoration:none}
.topbar{display:flex;align-items:center;gap:18px;padding:10px 20px;
background:var(--bg-panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:9}
.topbar .logo{font-weight:700;font-size:15px}
.tab{padding:5px 14px;border-radius:6px;cursor:pointer;color:var(--txt2);user-select:none}
.tab:hover{background:var(--bg-raised);color:var(--txt)}
.tab.on{background:var(--accent-12);color:var(--accent);font-weight:600}
.page{display:none;padding:16px 20px;max-width:1280px;margin:0 auto}
.page.on{display:block}
.hint{color:var(--txt3);font-size:12px;margin:6px 0}
/* 仪表盘 */
.tiers{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.tier{display:flex;align-items:center;gap:12px}
.tier .lbl{width:64px;color:var(--txt2);font-size:13px}
.tier .bar{flex:1;display:flex;gap:2px;height:14px}
.tier .bar i{display:block;height:100%}
.tier .nums{width:330px;color:var(--txt2);font-size:12px}
.tier .nums b{color:var(--txt)}
table.matrix{border-collapse:collapse;width:100%;margin-top:10px;font-size:12.5px}
table.matrix th,table.matrix td{border:1px solid var(--border);padding:4px 8px;text-align:center}
table.matrix th{background:var(--bg-raised);color:var(--txt2);font-weight:600;position:sticky;top:46px}
table.matrix td.v{text-align:left;color:var(--txt2);white-space:nowrap}
table.matrix td.c{cursor:pointer}
/* 命令库布局 */
.lib{display:flex;gap:16px}
.side{width:200px;flex-shrink:0}
.side .grp{color:var(--txt3);font-size:12px;margin:12px 4px 4px}
.vbtn{display:flex;justify-content:space-between;padding:4px 10px;border-radius:6px;
cursor:pointer;color:var(--txt2);font-size:13px}
.vbtn:hover{background:var(--bg-raised)}
.vbtn.on{background:var(--accent-12);color:var(--accent)}
.vbtn .n{color:var(--txt3);font-size:11px}
.main{flex:1;min-width:0}
.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
input[type=text],select{background:var(--bg-panel);border:1px solid var(--border);
color:var(--txt);border-radius:6px;padding:6px 10px;font-size:13px;outline:none}
input[type=text]:focus,select:focus{border-color:var(--accent)}
input.search{flex:1;min-width:200px}
.list .item{background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;
padding:10px 14px;margin-bottom:8px;cursor:pointer}
.list .item:hover{border-color:var(--border);background:var(--bg-raised)}
.item .t{font-weight:600}
.item .m{color:var(--txt3);font-size:12px;margin-top:2px}
.badge{display:inline-block;padding:1px 8px;border-radius:4px;font-size:11px;margin-left:8px;vertical-align:1px}
.b-green{background:var(--success-14);color:var(--success)}
.b-syntax{background:var(--accent-12);color:var(--accent)}
.b-hold{background:var(--warning-14);color:var(--warning)}
.b-unverified{background:transparent;color:var(--txt3);border:1px dashed var(--border)}
.detail{background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:16px 20px;margin-top:10px}
.detail h2{margin:4px 0 8px;font-size:17px}
.meta{color:var(--txt3);font-size:12px;margin-bottom:10px}
pre.code{background:var(--code-bg);border:1px solid var(--border);border-radius:8px;
padding:12px 14px;overflow:auto;white-space:pre-wrap;word-break:break-all;
font:12.5px/1.55 Consolas,"Courier New",monospace;margin:8px 0}
pre.code .cm{color:var(--txt3);font-style:italic}
.params{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
.params th,.params td{border:1px solid var(--border);padding:5px 9px;text-align:left;vertical-align:top}
.params th{background:var(--bg-raised);color:var(--txt2)}
.sec{margin:14px 0 6px;font-weight:600;font-size:13px;color:var(--txt2)}
.fold{border:1px solid var(--border);border-radius:8px;margin:8px 0;overflow:hidden}
.fold summary{cursor:pointer;padding:8px 14px;background:var(--bg-raised);color:var(--txt2);user-select:none}
.fold[open] summary{color:var(--accent)}
.notes{white-space:pre-wrap;color:var(--txt2);background:var(--code-bg);
border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-size:12.5px}
.card{background:var(--bg-panel);border:1px solid var(--border);border-radius:8px;padding:14px 18px;margin-bottom:10px}
.card h3{margin:2px 0 8px;font-size:15px}
.step{border-left:2px solid var(--accent);margin:10px 0;padding:2px 0 2px 14px}
.step .sid{color:var(--accent);font-weight:700;font-size:12px}
.branch{display:inline-block;background:var(--bg-raised);border:1px solid var(--border);
border-radius:5px;padding:2px 10px;margin:4px 6px 0 0;font-size:12px;color:var(--txt2)}
.branch b{color:var(--accent)}
.kw{color:var(--accent)}
.empty{color:var(--txt3);text-align:center;padding:40px 0}
</style>
</head>

</div>

<script>
var DATA = {"entries": [{"uuid": "e3971cfc-1d22-5542-89d5-7b72b2c3ee6a", "platform": "network", "device_type": "交换机", "vendor": "cisco", "os_family": "ios", "models": "Catalyst 2960 / 3560 / 3750 / 9300", "category": "VLAN", "title": "创建 VLAN 并把端口划入 Access", "description": "新建业务 VLAN 并命名，把一批物理端口批量划为 access 口加入该 VLAN。", "commands": "! ===== 创建 VLAN 并划入端口（Cisco IOS）=====\nenable\nconfigure terminal\nvlan {{vlan_id}}\n name {{vlan_name}}\n exit\ninterface range {{port_range}}\n switchport mode access\n switchport access vlan {{vlan_id}}\n no shutdown\n exit\nend\nwrite memory", "params": [{"name": "vlan_id", "label": "VLAN ID", "default": "10", "required": true, "validate": "vlan", "example": "10", "type": "string", "description": "VLAN 编号，二层广播域标识；有效范围 1-4094（1 为默认 VLAN、1002-1005 系统保留）；Trunk 两端放行列表与 PVID 必须配套，改错会隔离业务"}, {"name": "vlan_name", "label": "VLAN 名称", "default": "OFFICE", "required": false, "validate": "", "example": "OFFICE", "type": "string", "description": "VLAN 名称，二层辨识用途；建议按业务语义命名（如 OA_BIZ），纯展示不影响转发"}, {"name": "port_range", "label": "端口范围", "default": "0/1-0/10", "required": true, "validate": "port_range", "example": "0/1-0/10 或 Gi0/1-0/10", "expand": "port", "type": "string", "description": "端口范围表达式（如 0/1-0/10、0/1,0/3,0/5-0/7），生成器按厂商命名规则展开为接口列表；展开结果先在预览区核对再执行"}], "notes": "1) interface range 语法 IOS 12.2(55)SE 之后才支持，更老的版本要逐口敲。\n2) 端口短写 Gi0/1 与全写 GigabitEthernet0/1 等价；堆叠机框写 1/0/1。\n3) 只 end 不 write memory，重启后配置全丢，务必保存。\n4) ★ 本条含 shutdown / undo shutdown 类端口操作：对生产端口执行会瞬断链路，请在业务低峰期变更，并确认有带外/备用管理通道再动手。\n", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:48", "updated_at": "2026-10-09 13:45:29", "exec_level": "", "interactive": 0, "rollback": "! 回退：删除 VLAN 并把端口恢复默认属性（端口原属 VLAN 如非 vlan 1，按变更记录恢复）\nenable\nconfigure terminal\ninterface range {{port_range}}\n no switchport access vlan\n no switchport mode access\n exit\nno vlan {{vlan_id}}\nend\nwrite memory\n! 复核\nshow vlan brief"}, {"uuid": "b765a2c0-303b-57ed-a232-61e19288b059", "platform": "network", "device_type": "交换机", "vendor": "cisco", "os_family": "ios", "models": "Catalyst 2960 / 3560 / 3750 / 9300", "category": "Trunk", "title": "配置 Trunk 口并放通指定 VLAN", "description": "把上行/级联口配成 802.1Q trunk，放通允许通过的 VLAN 并设置 native VLAN。", "commands": "! ===== 配置 Trunk 口（Cisco IOS）=====\nenable\nconfigure terminal\ninterface {{port}}\n switchport trunk encapsulation dot1q\n switchport mode trunk\n switchport trunk allowed vlan {{vlan_list}}\n switchport trunk native vlan {{native_vlan}}\n no shutdown\n exit\nend\nwrite memory\nshow interfaces trunk", "params": [{"name": "port", "label": "端口", "default": "0/24", "required": true, "validate": "port", "example": "0/24 或 1/0/24", "type": "string", "description": "接口名/接口编号，进入该接口视图后所做的配置只作用于这一个口；先 show/display 确认接口存在与状态——进错接口改配置是现场常见事故"}, {"name": "vlan_list", "label": "放通 VLAN", "default": "10,20,30", "required": true, "validate": "", "example": "10,20,30 或 10-20", "type": "string", "description": "Trunk 放行 VLAN 列表（如 10,20,30-40），控制哪些 VLAN 流量可通过该链路；漏放行业务 VLAN 会当场断流，改动立即生效"}, {"name": "native_vlan", "label": "Native VLAN", "default": "1", "required": false, "validate": "vlan", "example": "1", "type": "string", "description": "Trunk 口 Native VLAN（untagged 承载的 VLAN），两端必须一致否则原生流量跨链路丢失；安全上建议改掉默认 VLAN 1，设为闲置 VLAN"}], "notes": "1) switchport trunk encapsulation dot1q 只有 3560/3750 这类支持多封装的老平台需要；\n   2960/9300 敲了会报 Invalid input，直接跳过这条即可。\n2) allowed vlan 用逗号列举(10,20,30)、短横线区间(10-20)，两者可混写(10,20-25,30)。\n3) 两端 native VLAN 必须一致，否则会报 native vlan mismatch 且生成树异常。\n4) ★ 本条含 shutdown / undo shutdown 类端口操作：对生产端口执行会瞬断链路，请在业务低峰期变更，并确认有带外/备用管理通道再动手。\n", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:48", "updated_at": "2026-10-09 13:45:29", "exec_level": "", "interactive": 0, "rollback": "! 回退：端口恢复 access 模式（★ 回退前确认该口未下联交换机，防止环路/断业务）\nenable\nconfigure terminal\ninterface {{port}}\n no switchport trunk allowed vlan\n no switchport trunk native vlan\n no switchport trunk encapsulation\n switchport mode access\n exit\nend\nwrite memory\n! 复核\nshow interfaces {{port}} switchport\nshow interfaces trunk"}, {"uuid": "eac547bb-4688-5afa-82cc-cd39cc580518", "platform": "network", "device_type": "路由器", "vendor": "cisco", "os_family": "ios", "models": "ISR 1900/2900/4300 / ASR1000", "category": "静态路由", "title": "配置静态路由与浮动静态路由", "description": "新增静态路由指定目的网段与下一跳；用管理距离做浮动备份路由。", "commands": "! ===== 配置静态路由（Cisco IOS）=====\nenable\nconfigure terminal\nip route {{dest_net}} {{mask}} {{next_hop}}\n! 浮动静态路由：管理距离设大（默认 1），主路由失效时才生效\nip route {{dest_net}} {{mask}} {{backup_hop}} 200\n! 默认路由\nip route 0.0.0.0 0.0.0.0 {{next_hop}}\nend\nwrite memory\nshow ip route {{dest_net}}", "params": [{"name": "dest_net", "label": "目的网段", "default": "192.168.20.0", "required": true, "validate": "ipv4", "example": "192.168.20.0", "type": "ip", "description": "目的网段地址，路由/策略匹配的目标方向；0.0.0.0/0 表示任意目的；方向写反会导致流量走错策略"}, {"name": "mask", "label": "掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "24 或 255.255.255.0", "type": "string", "description": "静态路由的点分十进制掩码，与 dest_net 圈定路由前缀；掩码写宽会吞掉相邻网段的路由匹配"}, {"name": "next_hop", "label": "下一跳地址", "default": "10.0.0.2", "required": true, "validate": "ipv4", "example": "10.0.0.2", "type": "ip", "description": "下一跳 IP，路由/策略转发的去向；必须是本机直连可达地址，写错路由成『黑洞』"}, {"name": "backup_hop", "label": "备份下一跳", "default": "10.0.0.3", "required": false, "validate": "ipv4", "example": "10.0.0.3", "type": "ip", "description": "浮动静态路由的备份下一跳，主路径失效后才接管转发；其管理距离/优先级必须大于主路由；须保证与本端直连可达"}], "notes": "1) 管理距离（最后那个数字）越小越优先：直连 0、静态 1、EIGRP 90、OSPF 110、RIP 120。\n2) 跟踪接口状态的写法要加出接口：ip route 0.0.0.0 0.0.0.0 Gi0/0 10.0.0.2，\n   这样出接口 down 时路由自动撤销；只写下一跳则不会。\n3) show ip route 里 S 表示静态路由、S* 表示默认路由，排查时先看这两行。\n—— 实验室实测 2026-10-09（场1,FRR）：实测:三条 ip route 全部接受,running-config 可见(掩码规范化为 CIDR);show ip route 无 S 行系 FRR 不展示下一跳不可达静态路由(预期差异);回退 no x3 后 running-config 归零 ✓——不判绿,转发行为待 IOS 真机", "duration": "", "verified": 0, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(FRR, vtysh)", "verified_date": "2026-10-09", "favorite": 0, "created_at": "2026-09-22 16:33:48", "updated_at": "2026-10-09 13:45:30", "exec_level": "verified-cli", "interactive": 0, "rollback": "! 回退：逐条删除本变更新增的静态路由（含浮动备份与默认路由）\nenable\nconfigure terminal\nno ip route {{dest_net}} {{mask}} {{next_hop}}\nno ip route {{dest_net}} {{mask}} {{backup_hop}} 200\nno ip route 0.0.0.0 0.0.0.0 {{next_hop}}\nend\nwrite memory\n! 复核：路由表恢复变更前状态\nshow ip route {{dest_net}}"}, {"uuid": "28250c48-48c3-50ee-b4d7-3b12495327e8", "platform": "network", "device_type": "路由器", "vendor": "cisco", "os_family": "ios", "models": "ISR 2900 / ASR1000 / Catalyst 三层", "category": "OSPF", "title": "配置 OSPF 基本组网", "description": "开启 OSPF 进程、设 router-id、宣告参与组网的网段，并把业务口设为被动接口。", "commands": "! ===== OSPF 基本配置（Cisco IOS）=====\nenable\nconfigure terminal\nrouter ospf {{process_id}}\n router-id {{router_id}}\n network {{network}} {{wildcard}} area {{area_id}}\n passive-interface default\n no passive-interface {{uplink_port}}\n exit\nend\nwrite memory\nshow ip ospf neighbor\nshow ip route ospf", "params": [{"name": "process_id", "label": "进程号", "default": "1", "required": true, "validate": "int:1-65535", "example": "1", "type": "int", "range": "1-65535", "description": "OSPF 进程号（仅本机有效），标识一个 OSPF 实例；两端进程号可以不同，但网段/区域/认证必须匹配"}, {"name": "router_id", "label": "Router ID", "default": "1.1.1.1", "required": true, "validate": "ipv4", "example": "1.1.1.1", "type": "ip", "description": "OSPF Router ID（IPv4 格式），区域内唯一标识本路由器；重复会引发邻居震荡与路由抖动，建议用 loopback 接口地址"}, {"name": "network", "label": "宣告网段", "default": "10.0.0.0", "required": true, "validate": "ipv4", "example": "10.0.0.0", "type": "ip", "description": "OSPF 宣告网段，匹配哪些接口参与 OSPF 进程；与 wildcard 配套使用；宣告漏了/错了邻居和路由直接缺失"}, {"name": "wildcard", "label": "反掩码", "default": "0.0.0.255", "required": true, "validate": "masklen", "example": "0.0.0.255", "type": "string", "description": "OSPF/ACL 反掩码（wildcard），0 位精确匹配、1 位任意；0.0.0.255 对应 /24；写错宣告/匹配范围不对"}, {"name": "area_id", "label": "区域号", "default": "0", "required": false, "validate": "", "example": "0 或 0.0.0.1", "type": "string", "description": "OSPF 区域 ID，控制该网段归属哪个 OSPF 区域；骨干区域固定 0.0.0.0，非骨干区域须与骨干直连（或虚链路）；填错邻居起不来、路由学不到"}, {"name": "uplink_port", "label": "上行接口（非被动）", "default": "0/0", "required": false, "validate": "port", "example": "0/0", "type": "string", "description": "OSPF 上联接口——被动接口策略中的例外口，no passive 恢复收发 Hello 建邻居；只放开必要上联口"}], "notes": "1) network 后面跟的是反掩码（wildcard）：24 位网段写 0.0.0.255，别写 255.255.255.0。\n2) 改 router-id 后必须 clear ip ospf process 才生效，会短暂中断邻居，别在业务高峰期做。\n3) passive-interface default + no passive-interface 上行口最省事，比逐个口 passive 不易漏。\n—— 实验室实测 2026-10-09（场1,FRR）：红:FRR 容器 ospfd 进程在(watchfrr up)但 router ospf 1 报 '% OSPF is not running in instance mode',重启容器复现;IOS 语法本体无法在 FRR 核对——环境性失败,完整回显存 evidence,待 IOS 真机/模拟器", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:48", "updated_at": "2026-10-09 13:45:30", "exec_level": "", "interactive": 0, "rollback": "! 回退：删除整个 OSPF 进程（★ 仅当进程为本次变更新建时适用；若进程预先存在\n! 只是新增 network，则改为在 router ospf 下逐条 no network / no router-id）\nenable\nconfigure terminal\nno router ospf {{process_id}}\nend\nwrite memory\n! 复核\nshow ip ospf neighbor\nshow ip route ospf"}, {"uuid": "4302cef5-db24-5403-8143-72038ad1fb23", "platform": "network", "device_type": "交换机", "vendor": "cisco", "os_family": "ios", "models": "Catalyst / ISR 全系列", "category": "ACL", "title": "配置扩展 ACL 并应用到接口", "description": "创建命名扩展 ACL 限制网段互访，并绑定到接口的 in 方向。", "commands": "! ===== 扩展 ACL 配置与下发（Cisco IOS）=====\nenable\nconfigure terminal\nip access-list extended {{acl_name}}\n permit ip {{src_net}} {{src_wild}} {{dst_net}} {{dst_wild}}\n deny   ip any any log\n exit\ninterface {{port}}\n ip access-group {{acl_name}} in\n exit\n! 只放通管理网段 SSH 登录 vty\nline vty 0 4\n access-class {{acl_name}} in\n exit\nend\nwrite memory\nshow ip access-lists {{acl_name}}", "params": [{"name": "acl_name", "label": "ACL 名称", "default": "ACL-MGMT-01", "required": true, "validate": "", "example": "ACL-MGMT-01", "type": "string", "description": "命名 ACL 的名称，控制哪些流量放行/拒绝；名称区分大小写；ip access-group 应用到接口方向后立即生效，配错可能当场切断管理流量"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "src_wild", "label": "源反掩码", "default": "0.0.0.255", "required": true, "validate": "masklen", "example": "0.0.0.255", "type": "string", "description": "源网段反掩码（wildcard mask），0 位精确匹配、1 位任意；与掩码写法相反（0.0.0.255 对应 /24）"}, {"name": "dst_net", "label": "目的网段", "default": "10.10.0.0", "required": true, "validate": "ipv4", "example": "10.10.0.0", "type": "ip", "description": "目的网段（ACL/防火墙策略匹配字段），0.0.0.0/0 表示任意目的；与反掩码/前缀长度配套使用；范围写宽会扩大放行面"}, {"name": "dst_wild", "label": "目的反掩码", "default": "0.0.255.255", "required": true, "validate": "masklen", "example": "0.0.255.255", "type": "string", "description": "目的网段反掩码（wildcard mask），0 位精确匹配、1 位任意；与子网掩码写法相反（0.0.0.255 对应 /24），写错匹配范围全错"}, {"name": "port", "label": "应用端口", "default": "0/1", "required": true, "validate": "port", "example": "0/1", "type": "string", "description": "接口名/接口编号，进入该接口视图后所做的配置只作用于这一个口；先 show/display 确认接口存在与状态——进错接口改配置是现场常见事故"}], "notes": "1) 每个 ACL 末尾都隐含 deny any any，看不到但一定生效；要放通必须显式写 permit。\n2) in / out 是\"相对设备\"的方向：in = 从该接口进来的流量，最容易搞反。\n3) 命名 ACL 想插规则要带序号（如 permit 15 ...），直接改文本会整段重排导致序号变化。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:48", "updated_at": "2026-10-09 13:45:30", "exec_level": "", "interactive": 0, "rollback": "! 回退：先解接口/vty 引用，再删 ACL 本体（顺序反了会残留引用导致业务中断）\nenable\nconfigure terminal\ninterface {{port}}\n no ip access-group {{acl_name}} in\n exit\nline vty 0 4\n no access-class {{acl_name}} in\n exit\nno ip access-list extended {{acl_name}}\nend\nwrite memory\n! 复核\nshow ip access-lists"}, {"uuid": "97e11a82-836e-5dd8-91da-db7f5bead11c", "platform": "network", "device_type": "路由器", "vendor": "cisco", "os_family": "ios", "models": "ISR 1900/2900/4300", "category": "NAT", "title": "配置 NAT 地址转换（PAT 复用）", "description": "内网网段通过出接口地址做端口复用（overload），并给出静态一对一映射写法。", "commands": "! ===== NAT / PAT 配置（Cisco IOS）=====\nenable\nconfigure terminal\ninterface {{inside_port}}\n ip address {{inside_ip}} {{inside_mask}}\n ip nat inside\n exit\ninterface {{outside_port}}\n ip address {{outside_ip}} {{outside_mask}}\n ip nat outside\n exit\naccess-list {{acl_number}} permit {{src_net}} {{src_wild}}\nip nat inside source list {{acl_number}} interface {{outside_port}} overload\n! 静态一对一映射（外网访问内网服务器）\nip nat inside source static {{inside_server}} {{public_ip}}\nend\nwrite memory\nshow ip nat translations\nshow ip nat statistics", "params": [{"name": "inside_port", "label": "内网口", "default": "0/0", "required": true, "validate": "port", "example": "0/0", "type": "string", "description": "内网侧接口名或映射端口号，DNAT 流量的内部接收方向；写错映射不生效"}, {"name": "inside_ip", "label": "内网口 IP", "default": "192.168.1.1", "required": true, "validate": "ipv4", "example": "192.168.1.1", "type": "ip", "description": "NAT 映射的内网真实 IP（被发布服务器的地址），DNAT 后流量的真正去向；填错把外部流量引到错误主机"}, {"name": "inside_mask", "label": "内网口掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "内网接口的子网掩码，决定 inside 接口网段范围；须与内网地址规划一致"}, {"name": "outside_port", "label": "外网口", "default": "0/1", "required": true, "validate": "port", "example": "0/1", "type": "string", "description": "外网侧接口名，NAT outside 方向的接口绑定；内外口方向标反 NAT 完全不生效"}, {"name": "outside_ip", "label": "外网口 IP", "default": "200.1.1.2", "required": true, "validate": "ipv4", "example": "200.1.1.2", "type": "ip", "description": "外网口 IP，NAT 转换后对外呈现的地址所在接口；须与上联网段规划一致且未被占用"}, {"name": "outside_mask", "label": "外网口掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "外网口子网掩码，与 outside_ip 配套"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "src_wild", "label": "源反掩码", "default": "0.0.0.255", "required": true, "validate": "masklen", "example": "0.0.0.255", "type": "string", "description": "源网段反掩码（wildcard mask），0 位精确匹配、1 位任意；与掩码写法相反（0.0.0.255 对应 /24）"}, {"name": "acl_number", "label": "ACL 编号", "default": "1", "required": true, "validate": "int:1-199", "example": "1-99 标准 ACL", "type": "int", "range": "1-199", "description": "ACL 编号，标识一条访问控制列表；Cisco 1-99 为标准 IP ACL、100-199 为扩展 IP ACL，华为/H3C 段位含义类似；改动后立即影响命中流量，nat outbound 等引用处需同步核对"}, {"name": "inside_server", "label": "内网服务器", "default": "192.168.1.100", "required": false, "validate": "ipv4", "example": "192.168.1.100", "type": "ip", "description": "内网服务器真实 IP（NAT 发布的后端），对外映射的源地址；该主机须可达且服务在监听，否则映射是『空转』"}, {"name": "public_ip", "label": "公网映射 IP", "default": "200.1.1.3", "required": false, "validate": "ipv4", "example": "200.1.1.3", "type": "ip", "description": "对外发布的公网/映射 IP，NAT 后外部访问的地址；须在上联口网段内且未被占用，冲突会绑定失败"}], "notes": "1) ip nat inside / outside 标错接口是 NAT 不生效的头号原因，配完先 show ip nat statistics 看命中。\n2) overload 就是 PAT（端口复用）；不写 overload 则是动态地址池，无法多地址共用。\n3) 静态映射双向生效，私网地址在前、公网地址在后。\n—— 实验室实测 2026-10-09（场1,FRR）：不可验证(FRR 无 IOS NAT 语法族):ip address 掩码写法/interface 下 ip nat inside/ip nat inside source list 均报 Unknown command——FRR NAT 语法不同构,无免许可容器等价路径,待 IOS 真机/模拟器", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:48", "updated_at": "2026-10-09 13:45:30", "exec_level": "", "interactive": 0, "rollback": "! 回退：按创建逆序撤销 NAT（接口 IP 若为既有配置则不要动 IP 行，只撤 NAT 标记）\nenable\nconfigure terminal\nno ip nat inside source static {{inside_server}} {{public_ip}}\nno ip nat inside source list {{acl_number}} interface {{outside_port}} overload\nno access-list {{acl_number}}\ninterface {{inside_port}}\n no ip nat inside\n exit\ninterface {{outside_port}}\n no ip nat outside\n exit\nend\nwrite memory\n! 复核\nshow ip nat statistics"}, {"uuid": "c51d45e0-bfe2-531c-9db4-2debdb2dba00", "platform": "network", "device_type": "交换机", "vendor": "cisco", "os_family": "ios", "models": "Catalyst 2960X/9300 / ISR（需 K9 加密镜像）", "category": "SSH管理", "title": "开启 SSH 并创建本地管理用户", "description": "生成 RSA 密钥、限制 vty 只允许 SSH、创建特权 15 的本地用户。", "commands": "! ===== 开启 SSH + 本地用户（Cisco IOS）=====\nenable\nconfigure terminal\nhostname {{hostname}}\nip domain-name {{domain}}\nusername {{username}} privilege 15 secret {{password}}\ncrypto key generate rsa modulus 2048\nip ssh version 2\nip ssh time-out 60\nip ssh authentication-retries 3\nline vty 0 4\n login local\n transport input ssh\n exec-timeout {{timeout_min}} 0\n exit\nend\nwrite memory\nshow ip ssh", "params": [{"name": "hostname", "label": "设备名", "default": "SW-CORE-01", "required": false, "validate": "", "example": "SW-CORE-01", "type": "string", "description": "设备主机名，标识作用不影响转发；修改后提示符与日志来源同步变化，网管侧如按主机名建资产需同步更新"}, {"name": "domain", "label": "域名", "default": "corp.local", "required": true, "validate": "", "example": "corp.local", "type": "string", "description": "设备域名后缀（ip domain-name / domain-name），用于 DNS 解析补全与 SSH RSA 密钥生成；改后提示符与解析习惯同步变化"}, {"name": "username", "label": "用户名", "default": "netadmin", "required": true, "validate": "", "example": "netadmin", "type": "string", "description": "登录账号名，认证身份标识；按人名/工号命名便于审计追责，禁用共享账号"}, {"name": "password", "label": "密码", "default": "", "required": true, "validate": "", "example": "现场生成：>=12位，含大小写/数字/符号", "type": "string", "description": "账号登录口令，认证凭据；配置中可能明文/弱加密存储，导出配置时必须脱敏；遵循强口令并定期轮换"}, {"name": "timeout_min", "label": "超时分钟数", "default": "10", "required": false, "validate": "int:0-35791", "example": "10", "type": "int", "range": "0-35791", "description": "登录空闲超时（分钟），无操作自动登出；现场建议 10-30 分钟；设太短频繁重登影响效率，太长有被冒用风险"}], "notes": "1) 必须先生成 RSA 密钥，且要先有 hostname 和 ip domain-name，\n   否则提示 \"% Please define a domain-name first\"。\n2) modulus 低于 768 时 IOS 15 会拒绝启用 SSHv2，建议 2048。\n3) transport input ssh 会一并关掉 Telnet，改之前确认 SSH 已能登录，别把自己锁在外面。\n4) ★ 口令必须现场生成随机强口令，禁止沿用任何示例值；渲染对话框未填口令会标红并阻止生成。\n", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:48", "updated_at": "2026-10-09 13:45:30", "exec_level": "", "interactive": 0, "rollback": "! 回退：恢复 vty 旧认证方式并删除本变更新增项（hostname/domain/RSA 密钥若为既有则跳过；\n! RSA 密钥不建议删除——会断掉依赖它的 SSH 会话，保留即可）\nenable\nconfigure terminal\nno username {{username}}\nline vty 0 4\n no login local\n no transport input ssh\n no exec-timeout\n exit\nend\nwrite memory\n! 复核\nshow ip ssh"}, {"uuid": "dd503bcb-810d-58e7-9c2d-8af6903226fc", "platform": "network", "device_type": "交换机", "vendor": "cisco", "os_family": "ios", "models": "全体 Cisco 设备", "category": "密码", "title": "修改 Console 口令与特权密码", "description": "设置 console 口口令、空闲超时，并改用加密方式保存特权密码。", "commands": "! ===== Console 与特权口令（Cisco IOS）=====\nenable\nconfigure terminal\nline console 0\n password {{console_password}}\n login\n logging synchronous\n exec-timeout {{timeout_min}} 0\n exit\nenable secret {{enable_secret}}\nservice password-encryption\nend\nwrite memory", "params": [{"name": "console_password", "label": "Console 口令", "default": "C0nsole@123", "required": true, "validate": "", "example": "C0nsole@123", "type": "string", "description": "Console 串口登录口令，控制带外接入认证；是网络故障时的最后生命线，遗忘只能走 recovery 流程；配置后立即生效"}, {"name": "enable_secret", "label": "特权密码", "default": "En@ble@12345", "required": true, "validate": "", "example": "En@ble@12345", "type": "string", "description": "特权模式（enable）口令，加密存储于配置；控制进入最高权限级的入口，务必强口令并定期轮换"}, {"name": "timeout_min", "label": "超时分钟数", "default": "10", "required": false, "validate": "int:0-35791", "example": "10", "type": "int", "range": "0-35791", "description": "登录空闲超时（分钟），无操作自动登出；现场建议 10-30 分钟；设太短频繁重登影响效率，太长有被冒用风险"}], "notes": "1) enable secret 用强哈希存储，enable password 是弱加密（7 类），新设备只用 secret；\n   两者同时存在时 secret 优先生效。\n2) console 下只写 login 用的是 line password（权限 1）；要直进特权 15 用 login local + 本地用户。\n3) logging synchronous 防止日志把正在敲的命令冲散，强烈建议加上。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:48", "updated_at": "2026-10-09 13:45:30", "exec_level": "", "interactive": 0, "rollback": "! 回退：口令类变更须恢复旧口令值（旧值不在本条目参数内，按变更记录回填尖括号处）\nenable\nconfigure terminal\nline console 0\n password <旧console口令>\n no logging synchronous\n no exec-timeout\n exit\nenable secret <旧特权口令>\nno service password-encryption\nend\nwrite memory"}, {"uuid": "a372ea5c-0f6e-51b8-b56b-8cc570ebe7cd", "platform": "network", "device_type": "交换机", "vendor": "cisco", "os_family": "ios", "models": "Catalyst / ISR 全系列", "category": "SNMP", "title": "配置 SNMP v2c 团体字与 Trap 上报", "description": "配置只读/读写团体字、设备位置联系人，并把 Trap 上报到网管服务器；附 SNMPv3 写法。", "commands": "! ===== SNMP 配置（Cisco IOS）=====\nenable\nconfigure terminal\nsnmp-server community {{ro_community}} RO\nsnmp-server community {{rw_community}} RW\nsnmp-server location {{location}}\nsnmp-server contact {{contact}}\nsnmp-server host {{nms_ip}} version 2c {{ro_community}}\nsnmp-server enable traps\n! ---- 更安全的 SNMPv3（推荐生产使用，按需启用）----\nsnmp-server group {{v3_group}} v3 auth\nsnmp-server user {{v3_user}} {{v3_group}} v3 auth sha {{v3_auth_pass}} priv aes 128 {{v3_priv_pass}}\nsnmp-server host {{nms_ip}} version 3 auth {{v3_user}}\nend\nwrite memory\nshow snmp community", "params": [{"name": "ro_community", "label": "只读团体字", "default": "RO@Public1", "required": true, "validate": "", "example": "RO@Public1", "type": "string", "description": "SNMP 只读团体字，等同口令——网管凭它采集设备数据；禁用 public 等弱值并限定来源；只读为主，写权限单独管理"}, {"name": "rw_community", "label": "读写团体字", "default": "RW@Public1", "required": true, "validate": "", "example": "RW@Public1", "type": "string", "description": "SNMP 读写团体字——持有即可远程修改设备配置，权限极高；仅必要时配置，务必限定来源网段并使用强值"}, {"name": "location", "label": "设备位置", "default": "IDC-A-机柜12", "required": false, "validate": "", "example": "IDC-A-机柜12", "type": "string", "description": "SNMP 系统位置（sysLocation）字段，标明设备物理位置（机房/机柜/U 位），告警现场定位依据；纯展示不影响功能"}, {"name": "contact", "label": "联系人", "default": "网络运维组", "required": false, "validate": "", "example": "网络运维组", "type": "string", "description": "SNMP 系统联系人（sysContact）字段，网管告警时定位责任人的依据；纯展示不影响功能"}, {"name": "nms_ip", "label": "网管服务器 IP", "default": "10.0.0.100", "required": true, "validate": "ipv4", "example": "10.0.0.100", "type": "ip", "description": "网管服务器（SNMP 采集/trap 接收）IP，设备向其发送告警并接受查询；填错网管侧收不到任何数据，等于监控失明"}, {"name": "v3_group", "label": "v3 组名", "default": "NMS-GROUP", "required": false, "validate": "", "example": "NMS-GROUP", "type": "string", "description": "SNMPv3 组名，绑定安全级别（auth/priv）与读写视图；组配置决定该组用户的权限边界"}, {"name": "v3_user", "label": "v3 用户名", "default": "nmsuser", "required": false, "validate": "", "example": "nmsuser", "type": "string", "description": "SNMPv3 用户名，绑定认证/加密口令；网管以 user+auth+priv 三元组访问设备"}, {"name": "v3_auth_pass", "label": "v3 认证口令", "default": "Auth@12345", "required": false, "validate": "", "example": "Auth@12345", "type": "string", "description": "SNMPv3 认证口令（SHA 算法），防报文冒充与篡改；与网管侧配置一致；优先用 v3 替代 v2c 明文团体字"}, {"name": "v3_priv_pass", "label": "v3 加密口令", "default": "Priv@12345", "required": false, "validate": "", "example": "Priv@12345", "type": "string", "description": "SNMPv3 加密口令（AES-128），对报文内容加密；与网管侧配置一致"}], "notes": "1) 团体字别用 public/private，等保与安全审计会直接判违规；改写后记得同步网管侧。\n2) 只读团体字给网管采集（RO），读写团体字仅在有配置下发需求时开，用完即删。\n3) SNMPv3 的 auth sha + priv aes 128 是常用组合；v2c 团体字在网上是明文传输的。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:48", "updated_at": "2026-10-09 13:45:30", "exec_level": "", "interactive": 0, "rollback": "! 回退：删除本变更新增的 SNMP 配置（location/contact 若有旧值按变更记录恢复）\nenable\nconfigure terminal\nno snmp-server host {{nms_ip}} version 2c {{ro_community}}\nno snmp-server host {{nms_ip}} version 3 auth {{v3_user}}\nno snmp-server user {{v3_user}} {{v3_group}}\nno snmp-server group {{v3_group}} v3 auth\nno snmp-server community {{ro_community}}\nno snmp-server community {{rw_community}}\nno snmp-server location\nno snmp-server contact\nend\nwrite memory\n! 复核\nshow snmp community"}, {"uuid": "70a2b9cc-3149-5a63-a48f-b07aea7946db", "platform": "network", "device_type": "交换机", "vendor": "cisco", "os_family": "ios", "models": "全体 Cisco 设备", "category": "保存配置", "title": "保存配置并备份到本地 flash", "description": "把运行配置写入启动配置，并在 flash 里留一份带日期的本地备份（不依赖网络）。", "commands": "! ===== 保存与本地备份（Cisco IOS）=====\nenable\nshow clock\nshow running-config\ncopy running-config startup-config\n! 本地 flash 备份（隔离网络下不依赖 TFTP/FTP）\ncopy running-config flash:backup-{{backup_tag}}.cfg\nshow flash:\ndir flash:\n! 需要回滚时（谨慎，会整体替换运行配置）\n! configure replace flash:backup-{{backup_tag}}.cfg force", "params": [{"name": "backup_tag", "label": "备份文件名标记", "default": "20260920", "required": false, "validate": "", "example": "20260920 或变更单号", "type": "string", "description": "备份文件版本标签，拼进备份文件名（如 backup-20260930-pre-upgrade.cfg）便于追溯；建议用『日期-动作』格式，回滚时按标签定位对应版本"}], "notes": "1) copy run start 会二次确认 Destination filename，脚本里直接回车即可。\n2) 隔离网络不要用 copy running-config tftp:，改存 flash: 更稳，配合变更单编号命名。\n3) configure replace 是整段替换（会对比差异）比直接 copy 安全，但执行前务必确认备份可用。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:48", "updated_at": "2026-10-09 13:45:31", "exec_level": "", "interactive": 0, "rollback": "! 回退：本条目仅做保存与备份，不改变网络行为，无需配置回退；\n! 如需清理本次备份文件再执行（delete 需交互确认文件名）\nenable\ndelete flash:backup-{{backup_tag}}.cfg\nshow flash:"}, {"uuid": "2fa0c57a-36a1-5293-adf3-4dc727c13e9b", "platform": "network", "device_type": "防火墙", "vendor": "fortinet", "os_family": "fortios", "models": "FortiGate 60F / 100F / 600E / VM 版", "category": "VLAN", "title": "创建 VLAN 子接口并开放管理协议", "description": "在物理口上建 VLAN 子接口、配 IP 与允许的管理协议（FortiGate 的 VLAN 即子接口）。", "commands": "# ===== 创建 VLAN 子接口（FortiOS）=====\nconfig system interface\n    edit \"{{vlan_name}}\"\n        set vdom \"root\"\n        set interface \"{{parent_port}}\"\n        set vlanid {{vlan_id}}\n        set ip {{vlan_ip}} {{vlan_mask}}\n        set allowaccess ping https ssh\n        set role lan\n        set description \"{{vlan_desc}}\"\n    next\nend\nshow system interface {{vlan_name}}", "params": [{"name": "vlan_name", "label": "子接口名", "default": "VLAN10-OFFICE", "required": true, "validate": "", "example": "VLAN10-OFFICE", "type": "string", "description": "VLAN 名称，二层辨识用途；建议按业务语义命名（如 OA_BIZ），纯展示不影响转发"}, {"name": "parent_port", "label": "父物理口", "default": "port2", "required": true, "validate": "", "example": "port2", "type": "string", "description": "VLAN 子接口的父物理口，子接口流量承载在其上；父口 down 则其下所有子接口全部 down"}, {"name": "vlan_id", "label": "VLAN ID", "default": "10", "required": true, "validate": "vlan", "example": "10", "type": "string", "description": "VLAN 编号，二层广播域标识；有效范围 1-4094（1 为默认 VLAN、1002-1005 系统保留）；Trunk 两端放行列表与 PVID 必须配套，改错会隔离业务"}, {"name": "vlan_ip", "label": "接口 IP", "default": "192.168.10.1", "required": true, "validate": "ipv4", "example": "192.168.10.1", "type": "ip", "description": "VLAN 子接口/网关 IP，该网段终端的默认网关；须与终端同网段；改网关地址需同步终端配置"}, {"name": "vlan_mask", "label": "掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "VLAN 子接口的子网掩码，与 vlan_ip 配套决定网段大小"}, {"name": "vlan_desc", "label": "描述", "default": "办公网段", "required": false, "validate": "", "example": "办公网段", "type": "string", "description": "VLAN/子接口的描述文字，运维辨识用途"}], "notes": "1) FortiGate 的 VLAN 是\"物理口上的子接口\"：set interface 必须指定父物理口，set vlanid 必填。\n2) allowaccess 决定该接口允许的管理协议（ping/https/ssh），漏配会导致无法登录管理。\n3) 接口名建议用业务名（VLAN10-OFFICE）而不是 vlan10，几十个接口时差别巨大。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:53", "updated_at": "2026-10-09 13:45:31", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除 VLAN 子接口（★ 若已有策略/路由引用该接口，先解除引用再删）\nconfig system interface\n    delete \"{{vlan_name}}\"\nend\n# 复核（期望无输出）\nshow system interface | grep {{vlan_name}}"}, {"uuid": "9fd6c2cf-c43e-5611-802a-feecccc244c8", "platform": "network", "device_type": "防火墙", "vendor": "fortinet", "os_family": "fortios", "models": "FortiGate 100F / 600E（多物理口型号）", "category": "Trunk", "title": "配置端口聚合（Aggregate / LACP）", "description": "把多个物理口组成聚合接口，用于上联交换机做链路捆绑（链路冗余/带宽叠加）。", "commands": "# ===== 端口聚合（FortiOS）=====\nconfig system interface\n    edit \"{{agg_name}}\"\n        set vdom \"root\"\n        set type aggregate\n        set member {{member_ports}}\n        set lacp-mode {{lacp_mode}}\n        set vlanforward enable\n        set description \"{{agg_desc}}\"\n    next\nend\nshow system interface {{agg_name}}\ndiagnose netlink aggregate name {{agg_name}}", "params": [{"name": "agg_name", "label": "聚合口名", "default": "AGG-WAN", "required": true, "validate": "", "example": "AGG-WAN", "type": "string", "description": "聚合接口名称（如 agg1 / link-aggregation1），标识一条聚合链路；须与对端聚合组一一对应；重命名/删除会断开现有聚合"}, {"name": "member_ports", "label": "成员口（带引号）", "default": "\"port1\" \"port2\"", "required": true, "validate": "", "example": "\"port1\" \"port2\"", "type": "string", "description": "聚合组成员口列表（空格分隔多个），一次纳入聚合的物理口集合；成员口状态/速率须一致，异常成员不参与转发"}, {"name": "lacp_mode", "label": "LACP 模式", "default": "active", "required": false, "validate": "enum:active|passive|static", "example": "active", "type": "enum", "choices": ["active", "passive", "static"], "description": "聚合工作模式（static 静态聚合 / lacp 动态协商），必须与对端设备一致——一端静态一端 LACP 链路起不来"}, {"name": "agg_desc", "label": "描述", "default": "上联核心交换机", "required": false, "validate": "", "example": "上联核心交换机", "type": "string", "description": "链路聚合口的描述文字，仅运维辨识用途、不影响转发；建议写明对端设备与用途"}], "notes": "1) member 是\"多值参数\"，要写成 set member \"port1\" \"port2\"（每个口带引号，空格分隔）。\n2) lacp-mode 选 active（主动协商）还是 passive 取决于对端；对端不支持 LACP 就用 static。\n3) 聚合口建好后，原物理口的配置会被清空，业务规划要提前做，别在业务口上直接改。\n4) 抓包/排障用 diagnose netlink aggregate name <聚合口名> 成员口是否都 UP。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:53", "updated_at": "2026-10-09 13:45:31", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除聚合口（成员口自动回到独立状态；★ 删除前确认无路由/策略引用；\n# 成员口原配置如有变更按变更记录恢复）\nconfig system interface\n    delete \"{{agg_name}}\"\nend\n# 复核（期望无输出）\nshow system interface | grep {{agg_name}}"}, {"uuid": "ab1f0f93-02cb-59cf-93b0-c22bfa0a1459", "platform": "network", "device_type": "防火墙", "vendor": "fortinet", "os_family": "fortios", "models": "FortiGate 全系列", "category": "静态路由", "title": "配置静态路由与默认路由", "description": "在路由表里新增明细路由或默认路由，指定网关、出接口与管理距离。", "commands": "# ===== 静态路由（FortiOS）=====\nconfig router static\n    edit {{seq}}\n        set dst {{dest_net}} {{dest_mask}}\n        set gateway {{gateway}}\n        set device \"{{out_interface}}\"\n        set distance {{distance}}\n        set comment \"{{comment}}\"\n    next\n    edit {{default_seq}}\n        set dst 0.0.0.0 0.0.0.0\n        set gateway {{gateway}}\n        set device \"{{out_interface}}\"\n        set distance {{default_distance}}\n    next\nend\nshow router static\nget router info routing-table all", "params": [{"name": "seq", "label": "明细路由序号", "default": "10", "required": true, "validate": "int:1-65535", "example": "10", "type": "int", "range": "1-65535", "description": "FortiGate 条目序号，edit 定位配置顺序；防火墙策略自上而下匹配，序号即优先级，插错位置会被短路"}, {"name": "dest_net", "label": "目的网段", "default": "192.168.20.0", "required": true, "validate": "ipv4", "example": "192.168.20.0", "type": "ip", "description": "目的网段地址，路由/策略匹配的目标方向；0.0.0.0/0 表示任意目的；方向写反会导致流量走错策略"}, {"name": "dest_mask", "label": "目的掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "目的网段的点分十进制掩码，与 dest_net 配套圈定策略匹配范围；掩码写宽会误匹配其他网段、扩大放行面"}, {"name": "gateway", "label": "网关", "default": "10.0.0.2", "required": true, "validate": "ipv4", "example": "10.0.0.2", "type": "ip", "description": "网关 IP，本网段出方向的下一跳；配错表现为同网段通、跨网段断；nmcli 修改后需重新激活连接生效"}, {"name": "out_interface", "label": "出接口", "default": "port1", "required": true, "validate": "", "example": "port1", "type": "string", "description": "NAT/策略的出接口名，流量转发的物理出口；必须与真实外网口一致，写错 NAT 不生效"}, {"name": "distance", "label": "管理距离", "default": "10", "required": false, "validate": "int:1-255", "example": "越小越优先，默认 10", "type": "int", "range": "1-255", "description": "路由管理距离（FortiGate/锐捷/中兴），数值越小该路由越优先；浮动备份路由靠把备份侧 distance 调大实现主备切换"}, {"name": "comment", "label": "备注", "default": "to-核心交换机", "required": false, "validate": "", "example": "to-核心交换机", "type": "string", "description": "对象的描述文字，仅运维辨识用途、不参与策略匹配；建议写明用途与申请人"}, {"name": "default_seq", "label": "默认路由序号", "default": "1", "required": false, "validate": "int:1-65535", "example": "1", "type": "int", "range": "1-65535", "description": "FortiGate 条目序号，edit 定位配置对象（自上而下匹配，序号即优先级）；插错位置会被前面的条目短路"}, {"name": "default_distance", "label": "默认路由距离", "default": "5", "required": false, "validate": "int:1-255", "example": "5", "type": "int", "range": "1-255", "description": "FortiGate 默认路由的管理距离，数值越小越优先；主备双默认路由时备份侧调大实现浮动"}], "notes": "1) dst 是\"正掩码\"写法（10.0.0.0 255.255.255.0），与思科/华为的写法一致，别写成主机位。\n2) gateway 与 device 至少要有一个；两个都给更严谨（出接口 down 时路由会自动失效）。\n3) distance 越小越优先（默认 10）；做双出口浮动备份就调整这个值。\n4) get router info routing-table all 是 FortiGate 上最常用的路由查看命令（show 命令不给下一跳细节）。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:53", "updated_at": "2026-10-09 13:45:32", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除本变更新增的两条静态路由（条目编号 {{seq}}/{{default_seq}} 见变更记录）\nconfig router static\n    delete {{seq}}\n    delete {{default_seq}}\nend\n# 复核\nshow router static\nget router info routing-table all"}, {"uuid": "ceddb0ce-aa07-5cd0-bf59-6d410a6e4921", "platform": "network", "device_type": "防火墙", "vendor": "fortinet", "os_family": "fortios", "models": "FortiGate 全系列（需高级路由功能）", "category": "OSPF", "title": "配置 OSPF 基本组网（FortiOS）", "description": "开启 OSPF、设 router-id、按区域宣告网段并指定参与组网的接口。", "commands": "# ===== OSPF 基本配置（FortiOS）=====\nconfig router ospf\n    set router-id {{router_id}}\n    config area\n        edit {{area_id}}\n        next\n    end\n    config network\n        edit {{net_seq}}\n            set prefix {{prefix_net}} {{prefix_mask}}\n        next\n    end\n    config ospf-interface\n        edit \"{{ospf_intf}}\"\n            set interface \"{{ospf_intf}}\"\n            set network-type broadcast\n        next\n    end\nend\nshow router ospf\nget router info ospf neighbor\nget router info ospf interface", "params": [{"name": "router_id", "label": "Router ID", "default": "5.5.5.5", "required": true, "validate": "ipv4", "example": "5.5.5.5", "type": "ip", "description": "OSPF Router ID（IPv4 格式），区域内唯一标识本路由器；重复会引发邻居震荡与路由抖动，建议用 loopback 接口地址"}, {"name": "area_id", "label": "区域号", "default": "0.0.0.0", "required": false, "validate": "", "example": "0.0.0.0", "type": "string", "description": "OSPF 区域 ID，控制该网段归属哪个 OSPF 区域；骨干区域固定 0.0.0.0，非骨干区域须与骨干直连（或虚链路）；填错邻居起不来、路由学不到"}, {"name": "net_seq", "label": "网段序号", "default": "1", "required": false, "validate": "int:1-65535", "example": "1", "type": "int", "range": "1-65535", "description": "FortiGate 静态路由条目序号，edit 定位具体路由；序号写错会改到别的路由条目"}, {"name": "prefix_net", "label": "宣告网段", "default": "10.0.0.0", "required": true, "validate": "ipv4", "example": "10.0.0.0", "type": "ip", "description": "前缀网段地址（FortiGate 路由前缀对象），与 prefix_mask 配套"}, {"name": "prefix_mask", "label": "网段掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "前缀网段的点分十进制掩码（FortiGate 地址/路由对象写法）"}, {"name": "ospf_intf", "label": "参与接口", "default": "port2", "required": false, "validate": "", "example": "port2", "type": "string", "description": "FortiGate OSPF 参与接口名，宣告该接口网段；修改后邻居重建，路由短暂抖动"}], "notes": "1) FortiOS 的 set prefix 用\"正掩码\"（网络号 + 掩码），不是反掩码，写错了既不通也不报错。\n2) 6.x 与 7.x 的 OSPF 配置结构有差异（7.x 增加了 config ospf-interface 等节点），\n   上机前先 get router ospf 看当前版本实际结构。\n3) 查看邻居用 get router info ospf neighbor（show 系列命令看不到实时状态）。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:53", "updated_at": "2026-10-09 13:45:32", "exec_level": "", "interactive": 0, "rollback": "# 回退：撤销 OSPF 配置（unset router-id 恢复默认；子表按逆序删除）\nconfig router ospf\n    unset router-id\n    config network\n        delete {{net_seq}}\n    end\n    config ospf-interface\n        delete \"{{ospf_intf}}\"\n    end\n    config area\n        delete {{area_id}}\n    end\nend\n# 复核\nget router info ospf neighbor"}, {"uuid": "1f331c90-7694-5387-a322-91e70a2e2fd8", "platform": "network", "device_type": "防火墙", "vendor": "fortinet", "os_family": "fortios", "models": "FortiGate 全系列", "category": "ACL", "title": "配置地址对象与防火墙策略（ACL 等效）", "description": "创建地址对象，用防火墙策略实现网段互访控制，含日志与顺序要点。", "commands": "# ===== 地址对象 + 防火墙策略（FortiOS）=====\nconfig firewall address\n    edit \"{{src_obj}}\"\n        set subnet {{src_net}} {{src_mask}}\n        set comment \"{{src_comment}}\"\n    next\nend\nconfig firewall policy\n    edit {{policy_id}}\n        set name \"{{policy_name}}\"\n        set srcintf \"{{src_intf}}\"\n        set dstintf \"{{dst_intf}}\"\n        set srcaddr \"{{src_obj}}\"\n        set dstaddr \"all\"\n        set action accept\n        set schedule \"always\"\n        set service \"{{service}}\"\n        set logtraffic all\n        set nat enable\n    next\nend\nshow firewall policy\ndiagnose firewall iprope list {{policy_id}}", "params": [{"name": "src_obj", "label": "源地址对象名", "default": "OBJ-OFFICE", "required": true, "validate": "", "example": "OBJ-OFFICE", "type": "string", "description": "源地址对象名（FortiGate/PaloAlto 等），先建对象再被策略引用；修改对象影响所有引用它的策略"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "src_mask", "label": "源掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "源网段点分十进制掩码（FortiGate 子网对象写法），与 src_net 圈定来源范围；写宽扩大放行面"}, {"name": "src_comment", "label": "对象备注", "default": "办公网段", "required": false, "validate": "", "example": "办公网段", "type": "string", "description": "FortiGate 源地址对象的描述文字，运维辨识用途"}, {"name": "policy_id", "label": "策略 ID", "default": "100", "required": true, "validate": "int:1-65535", "example": "100", "type": "int", "range": "1-65535", "description": "FortiGate 策略 ID，精确定位一条防火墙策略（diagnose 排障入口）；ID 与页面显示顺序无关，注意区分"}, {"name": "policy_name", "label": "策略名", "default": "OFFICE-to-INET", "required": true, "validate": "", "example": "OFFICE-to-INET", "type": "string", "description": "防火墙策略名称，运维辨识用途；建议『源_到_目的_动作』命名法，策略多了不迷路"}, {"name": "src_intf", "label": "入接口", "default": "VLAN10-OFFICE", "required": true, "validate": "", "example": "VLAN10-OFFICE", "type": "string", "description": "FortiGate 策略源接口（入方向接口匹配）；与流量实际入口一致才能命中，写错策略静默不生效"}, {"name": "dst_intf", "label": "出接口", "default": "wan1", "required": true, "validate": "", "example": "wan1", "type": "string", "description": "FortiGate 策略目的接口（出方向接口匹配）；与实际流量出口一致才能命中，写错策略静默不生效"}, {"name": "service", "label": "服务", "default": "ALL", "required": false, "validate": "", "example": "ALL 或 HTTP HTTPS DNS", "type": "string", "description": "策略引用的服务对象名（HTTP/HTTPS/ALL 等），四层端口匹配的集合；可用预定义或自建对象；改对象影响所有引用它的策略"}], "notes": "1) FortiGate 的\"ACL\"就是 firewall policy，自上而下匹配，先匹配到的生效；\n   新策略默认插在最前面，改远程登录相关策略时务必先确认顺序，否则可能把自己挡在外面。\n2) srcintf/dstintf 与 srcaddr/dstaddr 都是必填，漏掉一项策略不生效且日志里看不到匹配。\n3) set logtraffic all 才会记录命中日志，排障期间一定要开；生产环境注意日志量。\n4) diagnose firewall iprope list <策略ID> 可看策略在表中的实际位置与命中计数。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:53", "updated_at": "2026-10-09 13:45:32", "exec_level": "", "interactive": 0, "rollback": "# 回退：先删策略再删地址对象（策略引用对象时对象删不掉）\nconfig firewall policy\n    delete {{policy_id}}\nend\nconfig firewall address\n    delete \"{{src_obj}}\"\nend\n# 复核（期望无输出）\nshow firewall policy | grep {{policy_id}}"}, {"uuid": "9c922bf5-6fc8-58f6-9bc5-6db2b916fafe", "platform": "network", "device_type": "防火墙", "vendor": "fortinet", "os_family": "fortios", "models": "FortiGate 全系列", "category": "NAT", "title": "配置 SNAT（策略 NAT）与 DNAT（VIP 端口映射）", "description": "出方向在策略里开 NAT 实现端口复用；入方向用 VIP 做服务器端口映射。", "commands": "# ===== 出方向 SNAT（策略里开 NAT，默认借用出接口地址 = PAT）=====\nconfig firewall policy\n    edit {{policy_id}}\n        set nat enable\n    next\nend\n# ===== 入方向 DNAT：VIP 端口映射（公网 8080 → 内网 80）=====\nconfig firewall vip\n    edit \"{{vip_name}}\"\n        set extip {{public_ip}}\n        set extintf \"{{out_interface}}\"\n        set portforward enable\n        set mappedip \"{{inside_ip}}\"\n        set extport {{public_port}}\n        set mappedport {{inside_port}}\n    next\nend\n# VIP 必须再被入方向的 policy 引用才生效\nshow firewall vip\ndiagnose firewall vip list", "params": [{"name": "policy_id", "label": "策略 ID", "default": "100", "required": true, "validate": "int:1-65535", "example": "100", "type": "int", "range": "1-65535", "description": "FortiGate 策略 ID，精确定位一条防火墙策略（diagnose 排障入口）；ID 与页面显示顺序无关，注意区分"}, {"name": "vip_name", "label": "VIP 名称", "default": "VIP-WEB-8080", "required": true, "validate": "", "example": "VIP-WEB-8080", "type": "string", "description": "FortiGate VIP（虚拟 IP）对象名，DNAT 发布内部服务的入口；被防火墙策略引用，改映射直接影响外部可达性"}, {"name": "public_ip", "label": "公网 IP", "default": "200.1.1.30", "required": true, "validate": "ipv4", "example": "200.1.1.30", "type": "ip", "description": "对外发布的公网/映射 IP，NAT 后外部访问的地址；须在上联口网段内且未被占用，冲突会绑定失败"}, {"name": "out_interface", "label": "外网接口", "default": "wan1", "required": true, "validate": "", "example": "wan1", "type": "string", "description": "NAT/策略的出接口名，流量转发的物理出口；必须与真实外网口一致，写错 NAT 不生效"}, {"name": "inside_ip", "label": "内网服务器", "default": "192.168.10.100", "required": true, "validate": "ipv4", "example": "192.168.10.100", "type": "ip", "description": "NAT 映射的内网真实 IP（被发布服务器的地址），DNAT 后流量的真正去向；填错把外部流量引到错误主机"}, {"name": "public_port", "label": "公网端口", "default": "8080", "required": true, "validate": "int:1-65535", "example": "8080", "type": "int", "range": "1-65535", "description": "对外映射端口号，DNAT 的外部端口；可与内部端口不同（如 8443→443）；与现有监听冲突会绑定失败"}, {"name": "inside_port", "label": "内网端口", "default": "80", "required": true, "validate": "int:1-65535", "example": "80", "type": "int", "range": "1-65535", "description": "内网侧接口名或映射端口号，DNAT 流量的内部接收方向；写错映射不生效"}], "notes": "1) 出方向 SNAT 只要在策略里 set nat enable，默认使用出接口地址（即 PAT）；\n   要指定公网地址池才用 IP Pool + set ippool enable。\n2) 入方向 DNAT 必须\"VIP + 引用该 VIP 的入方向策略\"两步，只建 VIP 不通。\n3) 端口映射先确认 extport 与 mappedport 别写反；配完从外网实测，别只在内网 ping。\n4) 内网用户用公网地址访问内部服务器（回环问题）需要额外配置，属常见坑。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:53", "updated_at": "2026-10-09 13:45:32", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除 VIP 并撤销策略 NAT 开关（★ 若策略 {{policy_id}} 整条为本变更新建\n# 则改为 delete {{policy_id}}；仅是开 NAT 开关时用 unset nat）\nconfig firewall vip\n    delete \"{{vip_name}}\"\nend\nconfig firewall policy\n    edit {{policy_id}}\n        unset nat\n    next\nend\n# 复核（期望无输出）\nshow firewall vip | grep {{vip_name}}"}, {"uuid": "f112709f-d6eb-5472-b61f-f11f5c36e9e0", "platform": "network", "device_type": "防火墙", "vendor": "fortinet", "os_family": "fortios", "models": "FortiGate 全系列", "category": "SSH管理", "title": "开启 SSH 管理并创建受限管理员", "description": "创建管理员账号、指定权限模板并限制登录源地址，收紧管理面。", "commands": "# ===== 管理员账号 + 管理面收紧（FortiOS）=====\nconfig system admin\n    edit \"{{username}}\"\n        set password {{password}}\n        set accprofile \"{{accprofile}}\"\n        set trusthost1 {{trust_ip}} {{trust_mask}}\n        set allow-ssh enable\n    next\nend\nconfig system global\n    set admin-sport {{ssh_port}}\n    set admin-ssh-version SSHv2\n    set admintimeout {{timeout_min}}\nend\nshow system admin", "params": [{"name": "username", "label": "用户名", "default": "netadmin", "required": true, "validate": "", "example": "netadmin", "type": "string", "description": "登录账号名，认证身份标识；按人名/工号命名便于审计追责，禁用共享账号"}, {"name": "password", "label": "密码", "default": "", "required": true, "validate": "", "example": "现场生成：>=12位，含大小写/数字/符号", "type": "string", "description": "账号登录口令，认证凭据；配置中可能明文/弱加密存储，导出配置时必须脱敏；遵循强口令并定期轮换"}, {"name": "accprofile", "label": "权限模板", "default": "prof_admin", "required": false, "validate": "enum:super_admin|prof_admin", "example": "super_admin 或 prof_admin", "type": "enum", "choices": ["super_admin", "prof_admin"], "description": "FortiGate 管理员访问配置档（access profile），决定该管理员账号可访问的功能域（super_admin / super_admin_readonly 等）；配错会锁死管理权限，操作前保留一个超管会话兜底"}, {"name": "trust_ip", "label": "允许登录网段", "default": "10.0.0.0", "required": false, "validate": "ipv4", "example": "10.0.0.0", "type": "ip", "description": "管理面允许登录的来源 IP（trusthost 白名单），限定谁能访问设备管理；改前确认当前管理机 IP 在名单内，否则当场失联"}, {"name": "trust_mask", "label": "网段掩码", "default": "255.255.255.0", "required": false, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "登录来源 IP 的掩码，与 trust_ip 配套；0.0.0.0 0.0.0.0 等于不限制来源（不建议）"}, {"name": "ssh_port", "label": "SSH 端口", "default": "22", "required": false, "validate": "int:1-65535", "example": "22，建议改非标端口", "type": "int", "range": "1-65535", "description": "SSH 管理端口（默认 22），改为非标端口可减少扫描骚扰；改前先放行新端口（防火墙/安全策略），否则把自己锁在门外"}, {"name": "timeout_min", "label": "管理超时（分钟）", "default": "10", "required": false, "validate": "int:1-480", "example": "10", "type": "int", "range": "1-480", "description": "登录空闲超时（分钟），无操作自动登出；现场建议 10-30 分钟；设太短频繁重登影响效率，太长有被冒用风险"}], "notes": "1) FortiGate 默认已开 SSH，重点是\"建账号 + 限源地址\"，trusthost 不配等于对全网开放。\n2) 等保与安全基线要求：admin 账号改名、禁用 telnet、SSH 改非标端口、管理超时不超过 10 分钟。\n3) 改 admin-sport 或 trusthost 前先确认新方式可用，否则会把自己锁在门外；\n   FortiGate 靠 console + 维护模式兜底（重启后 30 秒内用默认地址登录）。\n4) ★ 口令必须现场生成随机强口令，禁止沿用任何示例值；渲染对话框未填口令会标红并阻止生成。\n", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:53", "updated_at": "2026-10-09 13:45:32", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除本变更新建的管理员并恢复全局管理参数（★ 删除当前登录账号前\n# 先用别的管理员登录；admin-sport/admintimeout 旧值按变更记录回填）\nconfig system admin\n    delete \"{{username}}\"\nend\nconfig system global\n    set admin-sport <旧端口，默认443>\n    set admintimeout <旧超时，默认5>\nend\n# 复核\nshow system admin"}, {"uuid": "680a2267-bdd2-5f11-a907-9d9026435a04", "platform": "network", "device_type": "防火墙", "vendor": "fortinet", "os_family": "fortios", "models": "FortiGate 全系列", "category": "密码", "title": "修改管理员口令（Console/HTTPS/SSH 共用）", "description": "FortiGate 没有独立 console 口令，console 与 Web/SSH 共用管理员账号密码。", "commands": "# ===== 修改管理员口令（FortiOS）=====\nconfig system admin\n    edit \"{{username}}\"\n        set password {{password}}\n    next\nend\n# 如果开了强密码策略，密码必须满足复杂度，可临时查看/调整：\nshow system password-policy\nconfig system password-policy\n    set status enable\n    set minimum-length {{min_len}}\n    set expire-status enable\n    set expire-day {{expire_day}}\nend", "params": [{"name": "username", "label": "管理员账号", "default": "admin", "required": true, "validate": "", "example": "admin", "type": "string", "description": "登录账号名，认证身份标识；按人名/工号命名便于审计追责，禁用共享账号"}, {"name": "password", "label": "新口令", "default": "Adm1n@Forti2026", "required": true, "validate": "", "example": "Adm1n@Forti2026", "type": "string", "description": "账号登录口令，认证凭据；配置中可能明文/弱加密存储，导出配置时必须脱敏；遵循强口令并定期轮换"}, {"name": "min_len", "label": "口令最小长度", "default": "12", "required": false, "validate": "int:8-128", "example": "8-128", "type": "int", "range": "8-128", "description": "口令最小长度，常见 8-12 位；配合复杂度策略（数字/特殊字符下限）使用"}, {"name": "expire_day", "label": "口令有效期（天）", "default": "90", "required": false, "validate": "int:0-365", "example": "90", "type": "int", "range": "0-365", "description": "FortiGate 账号有效期（天），到期自动禁用；管理员账号建议设长或不设，避免现场账号被锁死无法登录"}], "notes": "1) FortiGate 的 console / HTTPS / SSH 共用管理员账号口令，改一处全套生效。\n2) 忘记口令时：重启设备，30 秒内在 console 用 192.168.1.99/24 登录维护账号（用户名 maintainer）\n   可在不丢配置的前提下重置 admin 口令，比清配置友好，但同样要现场操作。\n3) 口令必须满足 system password-policy；直接 set 弱口令会被拒绝并提示原因。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:53", "updated_at": "2026-10-09 13:45:32", "exec_level": "", "interactive": 0, "rollback": "# 回退：口令类变更须恢复旧口令（旧值按变更记录掌握，人工回填尖括号处）；\n# 口令策略恢复变更前状态\nconfig system admin\n    edit \"{{username}}\"\n        set password <旧口令>\n    next\nend\nconfig system password-policy\n    set status disable\n    set expire-status disable\nend\n# 复核\nshow system password-policy"}, {"uuid": "3b4b9622-b6d2-5b09-998a-2dc5e3281f16", "platform": "network", "device_type": "防火墙", "vendor": "fortinet", "os_family": "fortios", "models": "FortiGate 全系列", "category": "SNMP", "title": "配置 SNMP 团体字与 Trap（FortiOS）", "description": "开启 SNMP 系统信息、创建团体字并限定网管主机，配置 Trap 上报。", "commands": "# ===== SNMP 配置（FortiOS）=====\nconfig system snmp sysinfo\n    set status enable\n    set description \"{{description}}\"\n    set location \"{{location}}\"\n    set contact-info \"{{contact}}\"\nend\nconfig system snmp community\n    edit {{community_id}}\n        set name \"{{community}}\"\n        set query-v1-status disable\n        set query-v2c-status enable\n        set trap-v1-status disable\n        set trap-v2c-status enable\n        config hosts\n            edit 1\n                set ip {{nms_ip}} {{nms_mask}}\n            next\n        end\n    next\nend\nshow system snmp community", "params": [{"name": "description", "label": "设备描述", "default": "FW-EDGE-01", "required": false, "validate": "", "example": "FW-EDGE-01", "type": "string", "description": "接口/SNMP 的描述文字（如接口对端、设备位置），仅运维辨识用途、不影响转发与匹配"}, {"name": "location", "label": "设备位置", "default": "IDC-A-机柜12", "required": false, "validate": "", "example": "IDC-A-机柜12", "type": "string", "description": "SNMP 系统位置（sysLocation）字段，标明设备物理位置（机房/机柜/U 位），告警现场定位依据；纯展示不影响功能"}, {"name": "contact", "label": "联系人", "default": "网络运维组", "required": false, "validate": "", "example": "网络运维组", "type": "string", "description": "SNMP 系统联系人（sysContact）字段，网管告警时定位责任人的依据；纯展示不影响功能"}, {"name": "community_id", "label": "条目序号", "default": "1", "required": false, "validate": "int:1-65535", "example": "1", "type": "int", "range": "1-65535", "description": "SNMP community 配置条目 ID（FortiGate），edit 定位具体社区记录；删错 ID 直接影响网管采集"}, {"name": "community", "label": "团体字", "default": "RO@Forti2026", "required": true, "validate": "", "example": "RO@Forti2026", "type": "string", "description": "SNMP community 对象名（FortiGate），标识一个 SNMP 读写团体，等同于口令；禁用 public/private 等弱值，并限定来源网段"}, {"name": "nms_ip", "label": "网管服务器 IP", "default": "10.0.0.100", "required": true, "validate": "ipv4", "example": "10.0.0.100", "type": "ip", "description": "网管服务器（SNMP 采集/trap 接收）IP，设备向其发送告警并接受查询；填错网管侧收不到任何数据，等于监控失明"}, {"name": "nms_mask", "label": "网管掩码", "default": "255.255.255.0", "required": false, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "SNMP 服务允许来源的掩码，与 nms_ip 配套限定采集来源范围；配宽了等于向多余网段开放 SNMP"}], "notes": "1) FortiOS 的 SNMP 团体字是\"只读\"性质，没有 RO/RW 之分；配置下发不能靠 SNMP。\n2) hosts 里必须限定网管主机 IP，不配等于对全网开放，安全审计必查。\n3) v1 明显不安全，建议 query-v1-status 与 trap-v1-status 都 disable，只留 v2c。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:53", "updated_at": "2026-10-09 13:45:32", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除 SNMP community 并恢复 sysinfo 未启用状态\nconfig system snmp community\n    delete {{community_id}}\nend\nconfig system snmp sysinfo\n    set status disable\n    unset description\n    unset location\n    unset contact-info\nend\n# 复核\nshow system snmp community"}, {"uuid": "7a5916ae-41d2-5e90-b128-cfd5b24d8bf4", "platform": "network", "device_type": "防火墙", "vendor": "fortinet", "os_family": "fortios", "models": "FortiGate 全系列", "category": "保存配置", "title": "查看配置并备份到本地 flash / USB", "description": "FortiOS 改完即生效；此处给出查看与本地备份命令（隔离网络不依赖外网）。", "commands": "# ===== 配置查看与本地备份（FortiOS）=====\nshow full-configuration\nexecute backup config flash {{backup_name}}\ndiagnose sys flash list\n# 插了 U 盘时可以直接备份到 U 盘（现场最常用）\n# execute backup config usb {{backup_name}}\n# 恢复配置（会覆盖当前配置，务必确认）\n# execute restore config flash {{backup_name}}", "params": [{"name": "backup_name", "label": "备份文件名", "default": "FW-EDGE-01-20260920.conf", "required": true, "validate": "", "example": "FW-EDGE-01-20260920.conf", "type": "string", "description": "配置/镜像备份在本地（flash/USB）的保存文件名；仅本机留痕，建议再 execute backup 到 TFTP 异机一份防单点"}], "notes": "1) FortiOS 是\"改完即写盘\"，没有 write memory 这一步；配置改动在 end 之后即持久化。\n2) 备份用 execute backup config flash <文件名>，现场更常用 U 盘：execute backup config usb。\n3) 恢复（execute restore config）会整体覆盖现有配置，执行前先备份当前的，并确认无人正在操作设备。\n4) show full-configuration 输出很长，建议配合终端日志功能留存，别只靠翻屏。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:54", "updated_at": "2026-10-09 13:45:32", "exec_level": "", "interactive": 0, "rollback": "# 回退：本条目仅备份配置到 flash，不改变网络行为，无需配置回退；\n# 需要恢复配置时（★ 覆盖当前配置并重启，务必确认后再执行）\nexecute restore config flash {{backup_name}}"}, {"uuid": "ed4efc39-7d65-5f6b-84fd-db4df71f2a63", "platform": "network", "device_type": "交换机", "vendor": "h3c", "os_family": "comware7", "models": "S5130 / S5560 / S6520 / MSR 系列", "category": "VLAN", "title": "创建 VLAN 并把端口划入 Access（Comware7）", "description": "新建业务 VLAN，用 interface range 批量把端口划为 access。", "commands": "# ===== 创建 VLAN 并划入端口（H3C Comware7）=====\nsystem-view\nvlan {{vlan_id}}\n name {{vlan_name}}\n quit\ninterface range GigabitEthernet {{port_start}} to GigabitEthernet {{port_end}}\n port link-type access\n port access vlan {{vlan_id}}\n undo shutdown\n quit\nsave force", "params": [{"name": "vlan_id", "label": "VLAN ID", "default": "10", "required": true, "validate": "vlan", "example": "10", "type": "string", "description": "VLAN 编号，二层广播域标识；有效范围 1-4094（1 为默认 VLAN、1002-1005 系统保留）；Trunk 两端放行列表与 PVID 必须配套，改错会隔离业务"}, {"name": "vlan_name", "label": "VLAN 名称", "default": "OFFICE", "required": false, "validate": "", "example": "OFFICE", "type": "string", "description": "VLAN 名称，二层辨识用途；建议按业务语义命名（如 OA_BIZ），纯展示不影响转发"}, {"name": "port_start", "label": "起始端口", "default": "1/0/1", "required": true, "validate": "port", "example": "1/0/1", "type": "string", "description": "批量端口区间起始号，与 port_end 配套"}, {"name": "port_end", "label": "结束端口", "default": "1/0/10", "required": true, "validate": "port", "example": "1/0/10", "type": "string", "description": "批量端口区间结束号，与 port_start 圈定 range 范围；区间内包含不该动的口会被一起改——执行前逐口核对"}], "notes": "1) Comware7 支持 interface range；Comware5 不支持，老设备只能逐口配。\n2) H3C 端口默认带堆叠成员号，单机也是 Gi1/0/1（不是 Gi0/1），按设备实际提示敲。\n3) save force 免交互直接落盘；save 会问是否保存，脚本里容易卡住。\n4) ★ 本条含 shutdown / undo shutdown 类端口操作：对生产端口执行会瞬断链路，请在业务低峰期变更，并确认有带外/备用管理通道再动手。\n", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:54", "updated_at": "2026-10-09 13:45:33", "exec_level": "", "interactive": 0, "rollback": "# 回退：端口恢复默认属性并删除 VLAN（interface range 撤销下发；端口开闭状态保持原样）\nsystem-view\ninterface range GigabitEthernet {{port_start}} to GigabitEthernet {{port_end}}\n undo port access vlan\n undo port link-type\n quit\nundo vlan {{vlan_id}}\nquit\nsave force\n# 复核\ndisplay vlan"}, {"uuid": "e95c9d0a-855c-5e6f-8d3d-3460f2b15107", "platform": "network", "device_type": "交换机", "vendor": "h3c", "os_family": "comware7", "models": "S5130 / S5560 / S6520", "category": "Trunk", "title": "配置 Trunk 口并放通 VLAN（Comware7）", "description": "把级联口配成 trunk，用 permit vlan 放通 VLAN 并设置 PVID。", "commands": "# ===== 配置 Trunk 口（H3C Comware7）=====\nsystem-view\ninterface GigabitEthernet {{port}}\n port link-type trunk\n port trunk permit vlan {{vlan_list}}\n port trunk pvid vlan {{pvid}}\n undo shutdown\n quit\nsave force\ndisplay interface GigabitEthernet {{port}} brief", "params": [{"name": "port", "label": "端口", "default": "1/0/24", "required": true, "validate": "port", "example": "1/0/24", "type": "string", "description": "接口名/接口编号，进入该接口视图后所做的配置只作用于这一个口；先 show/display 确认接口存在与状态——进错接口改配置是现场常见事故"}, {"name": "vlan_list", "label": "放通 VLAN 列表", "default": "10 20 30", "required": true, "validate": "", "example": "10 20 30 或 10 to 20", "type": "string", "description": "Trunk 放行 VLAN 列表（如 10,20,30-40），控制哪些 VLAN 流量可通过该链路；漏放行业务 VLAN 会当场断流，改动立即生效"}, {"name": "pvid", "label": "PVID / Native VLAN", "default": "1", "required": false, "validate": "vlan", "example": "1", "type": "string", "description": "Trunk 口 PVID（untagged VLAN），决定无标签流量归入哪个 VLAN；两端 PVID 不一致会导致原生态流量进错 VLAN 丢失"}], "notes": "1) H3C 用 permit vlan（不是思科的 allowed、华为的 allow-pass），三家动词都不同。\n2) port trunk permit vlan all 放通全部 VLAN，生产上慎用。\n3) 放通列表支持 \"vlan 10 20 30\" 与 \"vlan 10 to 20\"，混写会报语法错误。\n4) ★ 本条含 shutdown / undo shutdown 类端口操作：对生产端口执行会瞬断链路，请在业务低峰期变更，并确认有带外/备用管理通道再动手。\n", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:54", "updated_at": "2026-10-09 13:45:33", "exec_level": "", "interactive": 0, "rollback": "# 回退：撤销 Trunk 属性（下联口回退前先确认防环路；端口开闭状态保持原样）\nsystem-view\ninterface GigabitEthernet {{port}}\n undo port trunk permit vlan\n undo port trunk pvid vlan\n undo port link-type\n quit\nsave force\n# 复核\ndisplay interface GigabitEthernet {{port}} brief"}, {"uuid": "0291a9b4-a1d7-5588-a902-7a0f1ff24c6a", "platform": "network", "device_type": "路由器", "vendor": "h3c", "os_family": "comware7", "models": "MSR830 / MSR2600 / MSR3600", "category": "静态路由", "title": "配置静态路由、缺省路由与浮动备份", "description": "配置明细静态路由与缺省路由，用 preference 做备份路由。", "commands": "# ===== 静态路由（H3C Comware7）=====\nsystem-view\nip route-static {{dest_net}} {{masklen}} {{next_hop}}\nip route-static 0.0.0.0 0 {{next_hop}}\nip route-static {{dest_net}} {{masklen}} {{backup_hop}} preference {{preference}}\ndisplay ip routing-table {{dest_net}}\nsave force", "params": [{"name": "dest_net", "label": "目的网段", "default": "192.168.20.0", "required": true, "validate": "ipv4", "example": "192.168.20.0", "type": "ip", "description": "目的网段地址，路由/策略匹配的目标方向；0.0.0.0/0 表示任意目的；方向写反会导致流量走错策略"}, {"name": "masklen", "label": "掩码长度", "default": "24", "required": true, "validate": "masklen", "example": "24 或 255.255.255.0", "type": "string", "description": "静态路由前缀长度（0-32），与 dest_net 配套；0 即默认路由；写错路由表项与预期不符"}, {"name": "next_hop", "label": "下一跳地址", "default": "10.0.0.2", "required": true, "validate": "ipv4", "example": "10.0.0.2", "type": "ip", "description": "下一跳 IP，路由/策略转发的去向；必须是本机直连可达地址，写错路由成『黑洞』"}, {"name": "backup_hop", "label": "备份下一跳", "default": "10.0.0.3", "required": false, "validate": "ipv4", "example": "10.0.0.3", "type": "ip", "description": "浮动静态路由的备份下一跳，主路径失效后才接管转发；其管理距离/优先级必须大于主路由；须保证与本端直连可达"}, {"name": "preference", "label": "优先级", "default": "70", "required": false, "validate": "int:1-255", "example": "默认 60，备份用 70", "type": "int", "range": "1-255", "description": "路由优先级（华为/H3C/Juniper），数值越小越优先（华为/H3C 静态默认 60）；浮动静态路由把备份侧 preference 调大"}], "notes": "1) preference 越小越优先（默认 60）；写 1 会让静态路由抢走 OSPF 的路由。\n2) 掩码可写长度（24）也可写点分（255.255.255.0），但同一条命令里风格要统一。\n3) description 描述里不能带空格，用连字符或下划线，否则报语法错误。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:54", "updated_at": "2026-10-09 13:45:33", "exec_level": "", "interactive": 0, "rollback": "# 回退：逐条删除本变更新增的静态/缺省/浮动路由\nsystem-view\nundo ip route-static {{dest_net}} {{masklen}} {{next_hop}}\nundo ip route-static 0.0.0.0 0 {{next_hop}}\nundo ip route-static {{dest_net}} {{masklen}} {{backup_hop}} preference {{preference}}\nquit\nsave force\n# 复核\ndisplay ip routing-table {{dest_net}}"}, {"uuid": "51c3dd16-1788-50d8-8c03-6156bd3c832d", "platform": "network", "device_type": "交换机", "vendor": "h3c", "os_family": "comware7", "models": "S5560 / S6520 三层 / MSR 系列", "category": "OSPF", "title": "配置 OSPF 基本组网（Comware7）", "description": "开启 OSPF 进程、设 router-id、按区域宣告网段并静默业务口。", "commands": "# ===== OSPF 基本配置（H3C Comware7）=====\nsystem-view\nospf {{process_id}} router-id {{router_id}}\n area {{area_id}}\n  network {{network}} {{wildcard}}\n  quit\n silent-interface GigabitEthernet{{silent_port}}\n quit\ndisplay ospf peer\ndisplay ospf routing\nsave force", "params": [{"name": "process_id", "label": "进程号", "default": "1", "required": true, "validate": "int:1-65535", "example": "1", "type": "int", "range": "1-65535", "description": "OSPF 进程号（仅本机有效），标识一个 OSPF 实例；两端进程号可以不同，但网段/区域/认证必须匹配"}, {"name": "router_id", "label": "Router ID", "default": "3.3.3.3", "required": true, "validate": "ipv4", "example": "3.3.3.3", "type": "ip", "description": "OSPF Router ID（IPv4 格式），区域内唯一标识本路由器；重复会引发邻居震荡与路由抖动，建议用 loopback 接口地址"}, {"name": "area_id", "label": "区域号", "default": "0", "required": false, "validate": "", "example": "0 或 0.0.0.1", "type": "string", "description": "OSPF 区域 ID，控制该网段归属哪个 OSPF 区域；骨干区域固定 0.0.0.0，非骨干区域须与骨干直连（或虚链路）；填错邻居起不来、路由学不到"}, {"name": "network", "label": "宣告网段", "default": "10.0.0.0", "required": true, "validate": "ipv4", "example": "10.0.0.0", "type": "ip", "description": "OSPF 宣告网段，匹配哪些接口参与 OSPF 进程；与 wildcard 配套使用；宣告漏了/错了邻居和路由直接缺失"}, {"name": "wildcard", "label": "反掩码", "default": "0.0.0.255", "required": true, "validate": "masklen", "example": "0.0.0.255", "type": "string", "description": "OSPF/ACL 反掩码（wildcard），0 位精确匹配、1 位任意；0.0.0.255 对应 /24；写错宣告/匹配范围不对"}, {"name": "silent_port", "label": "静默接口", "default": "1/0/1", "required": false, "validate": "port", "example": "1/0/1", "type": "string", "description": "OSPF 静默接口（华为/H3C silent-interface），该口不收发 Hello；接终端的口建议设静默防误建邻居"}], "notes": "1) 与华为语法高度相似（都是 进程→区域→network 嵌套），主要差异在提示符与保存命令。\n2) network 用反掩码；宣告错网段会出现接口 UP 但邻居起不来，先看 display ospf peer。\n3) silent-interface 接口段写紧凑格式 GigabitEthernet1/0/1，带空格会解析失败。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:54", "updated_at": "2026-10-09 13:45:33", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除整个 OSPF 进程（进程若预存只是新增 network，则进视图逐条 undo network）\nsystem-view\nundo ospf {{process_id}}\nquit\nsave force\n# 复核\ndisplay ospf peer"}, {"uuid": "1f0a05fb-4b66-50cc-b2ef-106387f3eb68", "platform": "network", "device_type": "路由器", "vendor": "h3c", "os_family": "comware7", "models": "MSR 系列 / S 系列三层", "category": "ACL", "title": "配置高级 ACL 并应用到接口", "description": "创建高级 ACL 控制网段互访，用 packet-filter 绑到接口方向。", "commands": "# ===== ACL 配置与下发（H3C Comware7）=====\nsystem-view\nacl advanced {{acl_number}}\n rule 5 permit ip source {{src_net}} {{src_wild}} destination {{dst_net}} {{dst_wild}}\n rule 10 deny ip\n quit\ninterface GigabitEthernet {{port}}\n packet-filter {{acl_number}} inbound\n quit\ndisplay acl {{acl_number}}\nsave force", "params": [{"name": "acl_number", "label": "ACL 编号", "default": "3000", "required": true, "validate": "int:1-3999", "example": "2000-2999 基本 / 3000-3999 高级", "type": "int", "range": "1-3999", "description": "ACL 编号，标识一条访问控制列表；Cisco 1-99 为标准 IP ACL、100-199 为扩展 IP ACL，华为/H3C 段位含义类似；改动后立即影响命中流量，nat outbound 等引用处需同步核对"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "src_wild", "label": "源反掩码", "default": "0.0.0.255", "required": true, "validate": "masklen", "example": "0.0.0.255", "type": "string", "description": "源网段反掩码（wildcard mask），0 位精确匹配、1 位任意；与掩码写法相反（0.0.0.255 对应 /24）"}, {"name": "dst_net", "label": "目的网段", "default": "10.10.0.0", "required": true, "validate": "ipv4", "example": "10.10.0.0", "type": "ip", "description": "目的网段（ACL/防火墙策略匹配字段），0.0.0.0/0 表示任意目的；与反掩码/前缀长度配套使用；范围写宽会扩大放行面"}, {"name": "dst_wild", "label": "目的反掩码", "default": "0.0.255.255", "required": true, "validate": "masklen", "example": "0.0.255.255", "type": "string", "description": "目的网段反掩码（wildcard mask），0 位精确匹配、1 位任意；与子网掩码写法相反（0.0.0.255 对应 /24），写错匹配范围全错"}, {"name": "port", "label": "应用端口", "default": "1/0/1", "required": true, "validate": "port", "example": "1/0/1", "type": "string", "description": "接口名/接口编号，进入该接口视图后所做的配置只作用于这一个口；先 show/display 确认接口存在与状态——进错接口改配置是现场常见事故"}], "notes": "1) Comware7 用 acl basic / acl advanced 创建；直接写 acl number 2000 在新版本会提示改用 basic。\n2) 应用到接口用 packet-filter（华为是 traffic-filter），方向参数写 inbound/outbound。\n3) 规则序号步长 5，插入用中间号（rule 6）；自上而下匹配，末尾隐含拒绝。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:54", "updated_at": "2026-10-09 13:45:33", "exec_level": "", "interactive": 0, "rollback": "# 回退：先解接口 packet-filter 引用，再删 ACL 本体（顺序反了业务即断）\nsystem-view\ninterface GigabitEthernet {{port}}\n undo packet-filter {{acl_number}} inbound\n quit\nundo acl advanced {{acl_number}}\nquit\nsave force\n# 复核\ndisplay acl {{acl_number}}"}, {"uuid": "fd36e60b-fa43-599d-866a-0d31fcbecc95", "platform": "network", "device_type": "路由器", "vendor": "h3c", "os_family": "comware7", "models": "MSR830 / MSR2600 / MSR3600", "category": "NAT", "title": "配置出接口 NAT（Easy IP / 地址池 PAT）", "description": "在内网口用 ACL 匹配源网段，出接口做 nat outbound 实现地址转换。", "commands": "# ===== NAT / Easy IP（H3C Comware7）=====\nsystem-view\nacl basic {{acl_number}}\n rule 5 permit source {{src_net}} {{src_wild}}\n quit\ninterface GigabitEthernet {{outside_port}}\n ip address {{outside_ip}} {{outside_mask}}\n nat outbound {{acl_number}}\n quit\n! 使用公网地址池做 PAT：\n! nat address-group {{group_id}}\n!  address {{pool_start}} {{pool_end}}\n!  quit\n! interface GigabitEthernet {{outside_port}}\n!  nat outbound {{acl_number}} address-group {{group_id}}\ndisplay nat outbound\ndisplay nat session verbose\nsave force", "params": [{"name": "acl_number", "label": "ACL 编号", "default": "2000", "required": true, "validate": "int:1-3999", "example": "2000-2999", "type": "int", "range": "1-3999", "description": "ACL 编号，标识一条访问控制列表；Cisco 1-99 为标准 IP ACL、100-199 为扩展 IP ACL，华为/H3C 段位含义类似；改动后立即影响命中流量，nat outbound 等引用处需同步核对"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "src_wild", "label": "源反掩码", "default": "0.0.0.255", "required": true, "validate": "masklen", "example": "0.0.0.255", "type": "string", "description": "源网段反掩码（wildcard mask），0 位精确匹配、1 位任意；与掩码写法相反（0.0.0.255 对应 /24）"}, {"name": "outside_port", "label": "出接口", "default": "0/1", "required": true, "validate": "port", "example": "0/1", "type": "string", "description": "外网侧接口名，NAT outside 方向的接口绑定；内外口方向标反 NAT 完全不生效"}, {"name": "outside_ip", "label": "出接口 IP", "default": "200.1.1.2", "required": true, "validate": "ipv4", "example": "200.1.1.2", "type": "ip", "description": "外网口 IP，NAT 转换后对外呈现的地址所在接口；须与上联网段规划一致且未被占用"}, {"name": "outside_mask", "label": "出接口掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "外网口子网掩码，与 outside_ip 配套"}, {"name": "group_id", "label": "地址池编号", "default": "1", "required": false, "validate": "int:0-7", "example": "0-7", "type": "int", "range": "0-7", "description": "NAT 地址池编号，PAT/地址池复用转换时的地址组标识；被 nat outbound 引用，改前先解除引用关系"}, {"name": "pool_start", "label": "地址池起始", "default": "200.1.1.10", "required": false, "validate": "ipv4", "example": "200.1.1.10", "type": "ip", "description": "DHCP 地址池起始 IP，与 pool_end 圈定可分配范围"}, {"name": "pool_end", "label": "地址池结束", "default": "200.1.1.20", "required": false, "validate": "ipv4", "example": "200.1.1.20", "type": "ip", "description": "DHCP 地址池结束 IP，与 pool_start 圈定可分配范围；须在接口网段内并排除静态占用地址，否则地址冲突"}], "notes": "1) H3C 是\"出接口 NAT\"模型：nat outbound 配在出接口视图下，不是全局视图。\n2) nat outbound 不带 address-group 即 Easy IP（借用出接口地址）。\n3) display nat session verbose 看端口复用情况与命中的 ACL 规则，是排查首选。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:54", "updated_at": "2026-10-09 13:45:33", "exec_level": "", "interactive": 0, "rollback": "# 回退：出接口视图撤销 nat outbound 并删除 ACL（接口 IP 若为既有配置勿动；\n# 启用地址池方案的还要 undo nat address-group {{group_id}}）\nsystem-view\ninterface GigabitEthernet {{outside_port}}\n undo nat outbound {{acl_number}}\n quit\nundo acl basic {{acl_number}}\nquit\nsave force\n# 复核\ndisplay nat outbound"}, {"uuid": "de093fea-fd7e-58c0-a310-9a839cff8917", "platform": "network", "device_type": "交换机", "vendor": "h3c", "os_family": "comware7", "models": "S5130 / S5560 / MSR 系列", "category": "SSH管理", "title": "开启 SSH 并创建管理员账号（Comware7）", "description": "生成 RSA 密钥、启用 SSH 服务、创建 manage 类管理员并限制 vty。", "commands": "# ===== 开启 SSH + 管理员账号（H3C Comware7）=====\nsystem-view\nsysname {{hostname}}\npublic-key local create rsa\n! 提示输入密钥模数，建议 2048\nssh server enable\nlocal-user {{username}} class manage\n password simple {{password}}\n service-type ssh\n authorization-attribute user-role network-admin\n quit\nline vty 0 4\n authentication-mode scheme\n protocol inbound ssh\n idle-timeout {{timeout_min}} 0\n quit\nsave force\ndisplay ssh server status", "params": [{"name": "hostname", "label": "设备名", "default": "SW-CORE-01", "required": false, "validate": "", "example": "SW-CORE-01", "type": "string", "description": "设备主机名，标识作用不影响转发；修改后提示符与日志来源同步变化，网管侧如按主机名建资产需同步更新"}, {"name": "username", "label": "用户名", "default": "netadmin", "required": true, "validate": "", "example": "netadmin", "type": "string", "description": "登录账号名，认证身份标识；按人名/工号命名便于审计追责，禁用共享账号"}, {"name": "password", "label": "密码", "default": "", "required": true, "validate": "", "example": "现场生成：>=12位，含大小写/数字/符号", "type": "string", "description": "账号登录口令，认证凭据；配置中可能明文/弱加密存储，导出配置时必须脱敏；遵循强口令并定期轮换"}, {"name": "timeout_min", "label": "超时分钟数", "default": "10", "required": false, "validate": "int:0-35791", "example": "10", "type": "int", "range": "0-35791", "description": "登录空闲超时（分钟），无操作自动登出；现场建议 10-30 分钟；设太短频繁重登影响效率，太长有被冒用风险"}], "notes": "1) 必须先用 public-key local create rsa 生成密钥，否则 ssh server enable 报错。\n2) Comware7 的本地用户分 manage（管理类）与 network（网络接入类），SSH 登录用 class manage；\n   权限靠 authorization-attribute user-role network-admin 给（不是 privilege level）。\n3) password 支持 simple / hash 两种存储，生产建议 hash；改完先验证能登录再关 Telnet。\n4) ★ 口令必须现场生成随机强口令，禁止沿用任何示例值；渲染对话框未填口令会标红并阻止生成。\n5) ★ 本条含交互式输入（RSA 密钥模数需手工键入），不适合脚本渲染/批量粘贴；逐条手工执行。\n", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:54", "updated_at": "2026-10-09 13:45:34", "exec_level": "", "interactive": 1, "rollback": "# 回退：删除本地账号并恢复 vty 旧认证（sysname 旧值按变更记录恢复；RSA 密钥保留；\n# ssh server 如需彻底关闭：undo ssh server enable，执行前确认 console 通道可用）\nsystem-view\nundo local-user {{username}} class manage\nline vty 0 4\n undo authentication-mode scheme\n undo protocol inbound\n undo idle-timeout\n quit\nsave force\n# 复核\ndisplay ssh server status"}, {"uuid": "e06208c2-ed72-56d8-a381-d7a353aa0b0f", "platform": "network", "device_type": "交换机", "vendor": "h3c", "os_family": "comware7", "models": "S5130 / S5560 / MSR 系列", "category": "密码", "title": "修改 Console 口令与用户角色", "description": "设置 console 认证口令、用户角色与空闲超时。", "commands": "# ===== Console 口令（H3C Comware7）=====\nsystem-view\nline console 0\n authentication-mode password\n set authentication password simple {{console_password}}\n user-role network-admin\n idle-timeout {{timeout_min}} 0\n quit\nsave force", "params": [{"name": "console_password", "label": "Console 口令", "default": "C0nsole@123", "required": true, "validate": "", "example": "C0nsole@123", "type": "string", "description": "Console 串口登录口令，控制带外接入认证；是网络故障时的最后生命线，遗忘只能走 recovery 流程；配置后立即生效"}, {"name": "timeout_min", "label": "超时分钟数", "default": "10", "required": false, "validate": "int:0-35791", "example": "10", "type": "int", "range": "0-35791", "description": "登录空闲超时（分钟），无操作自动登出；现场建议 10-30 分钟；设太短频繁重登影响效率，太长有被冒用风险"}], "notes": "1) Comware7 用 user-role（如 network-admin）授权，不再用 level 15。\n2) set authentication password 后面的参数决定存储方式：simple 明文可见、hash 单向哈希。\n3) 忘记 console 口令需进 BootROM 跳过配置启动，属破坏性操作，口令一定要留档。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:54", "updated_at": "2026-10-09 13:45:34", "exec_level": "", "interactive": 0, "rollback": "# 回退：恢复 Console 旧口令（旧值按变更记录回填；若变更前未设口令：\n# undo authentication-mode + undo set authentication password；\n# user-role 保持默认不撤销——console 默认角色即 network-admin）\nsystem-view\nline console 0\n set authentication password simple <旧console口令>\n undo idle-timeout\n quit\nsave force"}, {"uuid": "056a903f-ba41-5748-b870-498b341e9e25", "platform": "network", "device_type": "交换机", "vendor": "h3c", "os_family": "comware7", "models": "S5130 / S5560 / MSR 系列", "category": "SNMP", "title": "配置 SNMP v2c 与 Trap 上报（Comware7）", "description": "开启 SNMP 代理、设置团体字与设备信息，并指定 Trap 目标。", "commands": "# ===== SNMP 配置（H3C Comware7）=====\nsystem-view\nsnmp-agent\nsnmp-agent sys-info version v2c\nsnmp-agent community read {{ro_community}}\nsnmp-agent community write {{rw_community}}\nsnmp-agent sys-info location {{location}}\nsnmp-agent sys-info contact {{contact}}\nsnmp-agent target-host trap address udp-domain {{nms_ip}} params securityname {{ro_community}} v2c\nsnmp-agent trap enable\ndisplay snmp-agent c
