ail -60\njournalctl --since \"-30 min\" --no-pager | tail -80\njournalctl -p err -b --no-pager | tail -40", "params": [], "notes": "1) -p err 只看错误级；排查服务问题再加 -u 服务名。\n2) 日志占用大时用 journalctl --vacuum-size=500M 缩容。\n—— 实测 2026-10-12（场2,Docker(ubuntu:22.04, 容器)）:语法核对(裁决A):journalctl -n/--disk-usage 实跑✓", "duration": "temp", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:59", "updated_at": "2026-09-22 16:33:59", "exec_level": "verified-cli", "interactive": 0, "rollback": ""}, {"uuid": "5b094e2d-eb19-5797-8486-e7dcd1b9b4f1", "platform": "linux", "device_type": "服务器", "vendor": "ubuntu", "os_family": "ubuntu2204", "models": "Ubuntu 20.04 / 22.04 Server", "category": "网络配置", "title": "临时配置 IP 地址（ip 命令族）", "description": "用 ip 命令临时加 IP，立即生效，重启后失效。", "commands": "# ⚠ 临时生效：重启后失效，持久化见配套条目：《netplan 永久配置 IP（Ubuntu）》\nip addr show\nip addr add {{ip_addr}}/{{prefix_len}} dev {{ifname}}\nip link set {{ifname}} up\nping -c 2 {{gateway}}", "params": [{"name": "ifname", "label": "网卡名", "default": "eth0", "required": true, "validate": "ifname", "example": "eth0 / ens33 / enp3s0 / bond0", "type": "string", "description": "Linux 网卡名（eth0/ens33/bond0 等），操作的目标接口；先 ip link 确认存在再操作，选错网卡会当场断 SSH（远程操作务必留带外兜底）"}, {"name": "ip_addr", "label": "IP 地址", "default": "192.168.10.50", "required": true, "validate": "ipv4", "example": "192.168.10.50", "type": "ip", "description": "接口 IP 地址，本机网络身份；改错/地址冲突会当场断 SSH——远程改网卡务必留 console 或带外兜底"}, {"name": "prefix_len", "label": "掩码长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24（不是 255.255.255.0）", "type": "int", "range": "0-32", "description": "前缀长度（0-32），与 IP 组成 CIDR（如 /24）；写错网段判定全错，远程操作可能当场断 SSH"}, {"name": "gateway", "label": "网关", "default": "192.168.10.1", "required": true, "validate": "ipv4", "example": "192.168.10.1", "type": "ip", "description": "网关 IP，本网段出方向的下一跳；配错表现为同网段通、跨网段断；nmcli 修改后需重新激活连接生效"}], "notes": "1) ⚠ 重启后失效：持久化见配套条目：《netplan 永久配置 IP（Ubuntu）》。\n2) Ubuntu 桌面版由 NetworkManager 管、Server 版由 systemd-networkd 管，\n   但 ip 命令两种都适用（临时调试用）。\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：实测:ip addr add 192.168.10.50/24 dev eth0 生效可见;回退 ip addr del 复核仅剩原地址 ✓;ping 网关段不可达属环境无该网段", "duration": "temp", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(ubuntu:22.04, 容器)", "verified_date": "2026-10-09", "favorite": 0, "created_at": "2026-09-22 16:33:59", "updated_at": "2026-10-09 13:45:47", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除临时添加的 IP（临时生效，重启自动消失；手动清除如下）\nip addr del {{ip_addr}}/{{prefix_len}} dev {{ifname}}\n# 复核\nip addr show {{ifname}}"}, {"uuid": "154befa8-8969-5566-8ec7-3711dba0958b", "platform": "linux", "device_type": "服务器", "vendor": "ubuntu", "os_family": "ubuntu2204", "models": "Ubuntu 18.04+ Server", "category": "网络配置", "title": "netplan 永久配置 IP（Ubuntu）", "description": "改 /etc/netplan/*.yaml 实现静态 IP 持久化，重启后仍生效。", "commands": "# 持久化：/etc/netplan/01-netcfg.yaml（文件名随意，必须是 .yaml）\ncp /etc/netplan/00-installer-config.yaml /etc/netplan/00-installer-config.yaml.bak\nvi /etc/netplan/01-netcfg.yaml\n# ---- 文件内容（YAML 缩进用空格，Tab 直接报错）----\n# network:\n#   version: 2\n#   ethernets:\n#     {{ifname}}:\n#       dhcp4: no\n#       addresses: [{{ip_addr}}/{{prefix_len}}]\n#       routes:\n#         - to: default\n#           via: {{gateway}}\n#       nameservers:\n#         addresses: [{{dns_ip}}]\n# ------------------------------------\nchmod 600 /etc/netplan/01-netcfg.yaml\nnetplan try\n# try 120 秒内不确认会自动回滚（远程改网关的救命命令）；确认没问题再：\nnetplan apply\nip addr show {{ifname}}", "params": [{"name": "ifname", "label": "网卡名", "default": "eth0", "required": true, "validate": "ifname", "example": "eth0 / ens33 / enp3s0 / bond0", "type": "string", "description": "Linux 网卡名（eth0/ens33/bond0 等），操作的目标接口；先 ip link 确认存在再操作，选错网卡会当场断 SSH（远程操作务必留带外兜底）"}, {"name": "ip_addr", "label": "IP 地址", "default": "192.168.10.50", "required": true, "validate": "ipv4", "example": "192.168.10.50", "type": "ip", "description": "接口 IP 地址，本机网络身份；改错/地址冲突会当场断 SSH——远程改网卡务必留 console 或带外兜底"}, {"name": "prefix_len", "label": "掩码长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24（不是 255.255.255.0）", "type": "int", "range": "0-32", "description": "前缀长度（0-32），与 IP 组成 CIDR（如 /24）；写错网段判定全错，远程操作可能当场断 SSH"}, {"name": "gateway", "label": "网关", "default": "192.168.10.1", "required": true, "validate": "ipv4", "example": "192.168.10.1", "type": "ip", "description": "网关 IP，本网段出方向的下一跳；配错表现为同网段通、跨网段断；nmcli 修改后需重新激活连接生效"}, {"name": "dns_ip", "label": "DNS 服务器", "default": "223.5.5.5", "required": true, "validate": "ipv4", "example": "223.5.5.5", "type": "ip", "description": "DNS 服务器 IP，写入网卡连接配置；填错表现为 ping IP 通、域名解析失败——是『能 ping 通打不开网页』的典型根因"}], "notes": "1) ★ YAML 缩进必须用空格，Tab 会直接报错；层级错了 netplan apply 会拒绝执行。\n2) ★ netplan try 是远程改网络的救命命令：不确认自动回滚，避免把自己踢下线。\n3) 配置文件建议 chmod 600（里面可能有敏感信息，netplan 会告警）。\n4) 与 RHEL 系完全不同：RHEL 用 ifcfg-*，Ubuntu 用 netplan YAML —— 别混用。\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：实测:heredoc 等价写 01-netcfg.yaml→netplan apply→eth0 出现 192.168.10.50/24+默认路由 ✓;回退 rm+apply 后地址短暂残留后刷新(容器无基线 yaml,真机有基线应即回原)——netplan try 交互确认与真机基线行为待核", "duration": "perm", "verified": 0, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(ubuntu:22.04, 容器)", "verified_date": "2026-10-09", "favorite": 0, "created_at": "2026-09-22 16:33:59", "updated_at": "2026-10-09 13:45:47", "exec_level": "verified-cli", "interactive": 0, "rollback": "# 回退：删除本变更新建的 01-netcfg.yaml 并 netplan apply\n#（恢复到 00-installer-config.yaml 原配置；netplan try 期间未确认已自动回滚过）\nrm -f /etc/netplan/01-netcfg.yaml\nnetplan apply\n# 复核\nip addr show {{ifname}}"}, {"uuid": "f22a2a84-f838-5d4c-9226-b8b77db77a00", "platform": "linux", "device_type": "服务器", "vendor": "ubuntu", "os_family": "ubuntu2204", "models": "Ubuntu 18.04+ Server", "category": "网络配置", "title": "netplan 配置 VLAN 子接口", "description": "在 netplan 里声明 VLAN 子接口并持久化。", "commands": "vi /etc/netplan/01-vlans.yaml\n# ---- 文件内容 ----\n# network:\n#   version: 2\n#   ethernets:\n#     {{ifname}}: {}\n#   vlans:\n#     {{ifname}}.{{vlan_id}}:\n#       id: {{vlan_id}}\n#       link: {{ifname}}\n#       addresses: [{{ip_addr}}/{{prefix_len}}]\n# ------------------------------------\nchmod 600 /etc/netplan/01-vlans.yaml\nnetplan apply\nip -d link show {{ifname}}.{{vlan_id}}", "params": [{"name": "ifname", "label": "网卡名", "default": "eth0", "required": true, "validate": "ifname", "example": "eth0 / ens33 / enp3s0 / bond0", "type": "string", "description": "Linux 网卡名（eth0/ens33/bond0 等），操作的目标接口；先 ip link 确认存在再操作，选错网卡会当场断 SSH（远程操作务必留带外兜底）"}, {"name": "vlan_id", "label": "VLAN ID", "default": "10", "required": true, "validate": "vlan", "example": "10", "type": "string", "description": "VLAN 编号，二层广播域标识；有效范围 1-4094（1 为默认 VLAN、1002-1005 系统保留）；Trunk 两端放行列表与 PVID 必须配套，改错会隔离业务"}, {"name": "ip_addr", "label": "IP 地址", "default": "192.168.10.50", "required": true, "validate": "ipv4", "example": "192.168.10.50", "type": "ip", "description": "接口 IP 地址，本机网络身份；改错/地址冲突会当场断 SSH——远程改网卡务必留 console 或带外兜底"}, {"name": "prefix_len", "label": "掩码长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24（不是 255.255.255.0）", "type": "int", "range": "0-32", "description": "前缀长度（0-32），与 IP 组成 CIDR（如 /24）；写错网段判定全错，远程操作可能当场断 SSH"}], "notes": "1) 母接口 {{ifname}} 必须在 ethernets 里声明（哪怕空配置），否则 vlans 引用不到。\n2) 交换机侧要 trunk + 放通该 VLAN；验证标签：cat /proc/net/vlan/config。\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：红:apply rc=0 但 ip -d link show eth0.10 'Device does not exist'(接口未建);回退 rm+apply 后接口反而出现(网络态竞态);且文件 644 时 netplan 告警 Permissions too open(seed 已补 chmod 600)。完整序列存 evidence/frr 与 g-b2b;真机复核", "duration": "perm", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:59", "updated_at": "2026-10-09 17:17:57", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除 VLAN 子接口配置文件并应用\nrm -f /etc/netplan/01-vlans.yaml\nnetplan apply\n# 复核（期望报不存在）\nip -d link show {{ifname}}.{{vlan_id}}"}, {"uuid": "c167a57b-5b04-52fe-8455-cc416d0ca1dc", "platform": "linux", "device_type": "服务器", "vendor": "ubuntu", "os_family": "ubuntu2204", "models": "Ubuntu 18.04+ Server", "category": "网络配置", "title": "netplan 配置双网卡 bond", "description": "在 netplan 里声明 bond 做链路冗余，配置持久化。", "commands": "vi /etc/netplan/01-bond.yaml\n# ---- 文件内容 ----\n# network:\n#   version: 2\n#   ethernets:\n#     {{ifname}}: {}\n#     {{ifname2}}: {}\n#   bonds:\n#     bond0:\n#       interfaces: [{{ifname}}, {{ifname2}}]\n#       parameters:\n#         mode: active-backup\n#         mii-monitor-interval: 100\n#       addresses: [{{ip_addr}}/{{prefix_len}}]\n#       routes:\n#         - to: default\n#           via: {{gateway}}\n# ------------------------------------\nchmod 600 /etc/netplan/01-bond.yaml\nnetplan apply\ncat /proc/net/bonding/bond0", "params": [{"name": "ifname", "label": "网卡名", "default": "eth0", "required": true, "validate": "ifname", "example": "eth0 / ens33 / enp3s0 / bond0", "type": "string", "description": "Linux 网卡名（eth0/ens33/bond0 等），操作的目标接口；先 ip link 确认存在再操作，选错网卡会当场断 SSH（远程操作务必留带外兜底）"}, {"name": "ifname2", "label": "第二块网卡", "default": "eth1", "required": true, "validate": "ifname", "example": "eth1", "type": "string", "description": "bond 的第二个成员网卡名；加入 bond 后该口原有 IP 配置被接管，先确认其上无独立业务"}, {"name": "ip_addr", "label": "IP 地址", "default": "192.168.10.50", "required": true, "validate": "ipv4", "example": "192.168.10.50", "type": "ip", "description": "接口 IP 地址，本机网络身份；改错/地址冲突会当场断 SSH——远程改网卡务必留 console 或带外兜底"}, {"name": "prefix_len", "label": "掩码长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24（不是 255.255.255.0）", "type": "int", "range": "0-32", "description": "前缀长度（0-32），与 IP 组成 CIDR（如 /24）；写错网段判定全错，远程操作可能当场断 SSH"}, {"name": "gateway", "label": "网关", "default": "192.168.10.1", "required": true, "validate": "ipv4", "example": "192.168.10.1", "type": "ip", "description": "网关 IP，本网段出方向的下一跳；配错表现为同网段通、跨网段断；nmcli 修改后需重新激活连接生效"}], "notes": "1) member 网卡在 ethernets 里要声明为空配置，交给 bonds 接管。\n2) mode 常用 active-backup（主备）与 802.3ad（LACP，需交换机配合）。\n3) 改完先 netplan try 再 apply。\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：不可验证(单网卡):容器仅 eth0,无 eth1 无法成 bond;seed 已补 chmod 600;双网卡环境待真机/多网卡 VM", "duration": "perm", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:00", "updated_at": "2026-10-09 17:17:57", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除 bond 配置文件并应用（成员口恢复独立；★ 原 IP 若在成员口上\n# 按变更记录配回，期间业务走带外）\nrm -f /etc/netplan/01-bond.yaml\nnetplan apply\n# 复核\ncat /proc/net/bonding/bond0 2>/dev/null || echo 'bond0 已删除'"}, {"uuid": "c0ed7438-d915-58e5-b34b-1b520d3ccc47", "platform": "linux", "device_type": "服务器", "vendor": "ubuntu", "os_family": "ubuntu2204", "models": "Ubuntu 18.04+（systemd-resolved）", "category": "网络配置", "title": "DNS 配置（systemd-resolved）", "description": "Ubuntu 的 /etc/resolv.conf 指向 stub，直接改会被覆盖，要改 resolved 或 netplan。", "commands": "resolvectl status | head -20\n# 方式一：全局 DNS\nvi /etc/systemd/resolved.conf\n# DNS={{dns_ip}}\n# FallbackDNS=\nsystemctl restart systemd-resolved\n# 方式二（推荐）：写在 netplan 的 nameservers 里（见《netplan 永久配置 IP（Ubuntu）》）\nresolvectl status | grep \"DNS Servers\"\ndig @{{dns_ip}} {{domain}} +short", "params": [{"name": "dns_ip", "label": "DNS 服务器", "default": "223.5.5.5", "required": true, "validate": "ipv4", "example": "223.5.5.5", "type": "ip", "description": "DNS 服务器 IP，写入网卡连接配置；填错表现为 ping IP 通、域名解析失败——是『能 ping 通打不开网页』的典型根因"}, {"name": "domain", "label": "域名", "default": "www.example.com", "required": true, "validate": "", "example": "www.example.com", "type": "string", "description": "设备域名后缀（ip domain-name / domain-name），用于 DNS 解析补全与 SSH RSA 密钥生成；改后提示符与解析习惯同步变化"}], "notes": "1) ★ /etc/resolv.conf 是指向 127.0.0.53 的软链，手改会被 systemd-resolved 覆盖回去。\n2) netplan 里配 DNS 会下发到 resolved，是最干净的持久化方式。\n3) resolvectl status 能看到每个链路（网卡）各自的 DNS。\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：实测:resolved.conf 写 DNS=223.5.5.5→restart→resolvectl 见 DNS Servers: 223.5.5.5+dig 解析;回退恢复后回到 127.0.0.11 ✓", "duration": "perm", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(ubuntu:22.04, 容器)", "verified_date": "2026-10-09", "favorite": 0, "created_at": "2026-09-22 16:34:00", "updated_at": "2026-10-09 13:45:48", "exec_level": "", "interactive": 0, "rollback": "# 回退：变更时未备份 resolved.conf——按变更记录回填旧 DNS 值；\n# 变更前未设全局 DNS 则删除对应行后重启服务\nvi /etc/systemd/resolved.conf\nsystemctl restart systemd-resolved\n# 复核\nresolvectl status | grep 'DNS Servers'"}, {"uuid": "0d3ca58c-9ecd-5bfd-b4d6-505a7e58ae58", "platform": "linux", "device_type": "服务器", "vendor": "ubuntu", "os_family": "ubuntu2204", "models": "Ubuntu 20.04+（装了 network-manager）", "category": "网络配置", "title": "nmcli 配置 IP（Ubuntu 桌面版/装了 NM 的服务器）", "description": "Ubuntu 装了 NetworkManager 时用 nmcli 配置，写入持久化并立即生效。", "commands": "nmcli con show\nnmcli con mod \"{{con_name}}\" ipv4.method manual ipv4.addresses {{ip_addr}}/{{prefix_len}}\nnmcli con mod \"{{con_name}}\" ipv4.gateway {{gateway}}\nnmcli con mod \"{{con_name}}\" ipv4.dns {{dns_ip}}\nnmcli con up \"{{con_name}}\"", "params": [{"name": "con_name", "label": "连接名", "default": "eth0", "required": false, "validate": "", "example": "nmcli con show 查看，一般等于网卡名", "type": "string", "description": "NetworkManager 连接配置名，nmcli 按它修改网卡参数；先 nmcli con show 确认名字再改，改错连接会断网（远程操作务必留 console/带外兜底）"}, {"name": "ip_addr", "label": "IP 地址", "default": "192.168.10.50", "required": true, "validate": "ipv4", "example": "192.168.10.50", "type": "ip", "description": "接口 IP 地址，本机网络身份；改错/地址冲突会当场断 SSH——远程改网卡务必留 console 或带外兜底"}, {"name": "prefix_len", "label": "掩码长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24（不是 255.255.255.0）", "type": "int", "range": "0-32", "description": "前缀长度（0-32），与 IP 组成 CIDR（如 /24）；写错网段判定全错，远程操作可能当场断 SSH"}, {"name": "gateway", "label": "网关", "default": "192.168.10.1", "required": true, "validate": "ipv4", "example": "192.168.10.1", "type": "ip", "description": "网关 IP，本网段出方向的下一跳；配错表现为同网段通、跨网段断；nmcli 修改后需重新激活连接生效"}, {"name": "dns_ip", "label": "DNS 服务器", "default": "223.5.5.5", "required": true, "validate": "ipv4", "example": "223.5.5.5", "type": "ip", "description": "DNS 服务器 IP，写入网卡连接配置；填错表现为 ping IP 通、域名解析失败——是『能 ping 通打不开网页』的典型根因"}], "notes": "1) Server 默认用 netplan+networkd，没有 nmcli；装了 network-manager 才有。\n2) nmcli 与 netplan 同时管理同一网卡会打架，一个网卡认一个管。\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：实测:装 network-manager 后 NM 未运行/未托管 eth0,con show/mod 报 not running——与 notes'一个网卡认一个管'口径一致;桌面版/NM 托管行为待真机", "duration": "both", "verified": 0, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(ubuntu:22.04, 容器)", "verified_date": "2026-10-09", "favorite": 0, "created_at": "2026-09-22 16:34:00", "updated_at": "2026-10-09 13:45:48", "exec_level": "verified-cli", "interactive": 0, "rollback": "# 回退：恢复连接旧地址配置（旧值按变更记录回填；变更前若为 DHCP 按下行清空静态项）\nnmcli con mod \"{{con_name}}\" ipv4.method auto ipv4.addresses \"\" ipv4.gateway \"\" ipv4.dns \"\"\nnmcli con up \"{{con_name}}\"\n# 复核\nnmcli con show \"{{con_name}}\""}, {"uuid": "297246ef-c222-5d30-b76b-d0daaad8b08b", "platform": "linux", "device_type": "服务器", "vendor": "ubuntu", "os_family": "ubuntu2204", "models": "Ubuntu 18.04+", "category": "服务管理", "title": "systemctl 服务管理（Ubuntu）", "description": "启动/停止/重启/状态/自启，Ubuntu 与 Debian 通用。", "commands": "systemctl status {{service_name}} --no-pager\nsystemctl restart {{service_name}}\nsystemctl enable --now {{service_name}}\nsystemctl is-enabled {{service_name}}\njournalctl -u {{service_name}} -n 50 --no-pager", "params": [{"name": "service_name", "label": "服务名", "default": "ssh", "required": true, "validate": "", "example": "ssh / firewalld / NetworkManager", "type": "string", "description": "systemd 服务名（ssh/nginx 等；Ubuntu 单元名是 ssh，sshd 仅为别名，enable/journalctl 须用本名 ssh），start/stop/enable 的操作对象；disable/stop 关键服务（如 sshd）前确认 console 可达"}], "notes": "1) enable --now 一步到位：设自启并立即启动（等价 enable + start）。\n2) disable --now 反过来：停掉并取消自启。\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：实测:status/restart/enable --now/is-enabled/journalctl 全通(service_name 默认已修 sshd→ssh:enable 别名会报 Refusing to operate);回退 stop→is-active inactive→start 恢复 ✓", "duration": "both", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(ubuntu:22.04, 容器)", "verified_date": "2026-10-09", "favorite": 0, "created_at": "2026-09-22 16:34:00", "updated_at": "2026-10-09 17:17:57", "exec_level": "", "interactive": 0, "rollback": "# 回退：本条目为服务管理操作演示，回退目标=恢复变更前服务状态：\n# systemctl stop {{service_name}}（若变更前未运行）；\n# systemctl disable {{service_name}}（若变更前未设自启）\nsystemctl status {{service_name}} --no-pager"}, {"uuid": "baa13814-e05f-5d12-9cd8-4f92aecf28a6", "platform": "linux", "device_type": "服务器", "vendor": "ubuntu", "os_family": "ubuntu2204", "models": "Ubuntu 18.04+", "category": "服务管理", "title": "开机自启排查（Ubuntu）", "description": "查服务自启状态与自启列表。", "commands": "systemctl is-enabled {{service_name}}\nsystemctl list-unit-files --type=service --state=enabled --no-pager\nsystemctl list-dependencies {{service_name}}", "params": [{"name": "service_name", "label": "服务名", "default": "ssh", "required": true, "validate": "", "example": "ssh / firewalld / NetworkManager", "type": "string", "description": "systemd 服务名（ssh/nginx 等；Ubuntu 单元名是 ssh，sshd 仅为别名，enable/journalctl 须用本名 ssh），start/stop/enable 的操作对象；disable/stop 关键服务（如 sshd）前确认 console 可达"}], "notes": "1) is-enabled 输出 enabled/static/disabled；static 表示被依赖拉起，不是自启失败。\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：实测:is-enabled 出 alias(sshd 为 ssh 别名)、list-unit-files enabled 列表、list-dependencies 依赖树均正常;notes 补充 alias 亦为合法输出 ✓", "duration": "both", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(ubuntu:22.04, 容器)", "verified_date": "2026-10-09", "favorite": 0, "created_at": "2026-09-22 16:34:00", "updated_at": "2026-10-09 17:17:57", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "c728b20c-8028-52e1-bcd2-5e28eb6cfdb4", "platform": "linux", "device_type": "服务器", "vendor": "ubuntu", "os_family": "ubuntu2204", "models": "Ubuntu 18.04+（ufw）", "category": "防火墙", "title": "ufw 防火墙基础（Ubuntu）", "description": "Ubuntu 默认的 ufw 防火墙：放行端口、按源放行、启停。", "commands": "ufw status verbose\n# ★ 先放行 SSH 再 enable，否则会把自己踢下线\nufw allow 22/tcp\nufw allow {{port}}/tcp\nufw allow from {{src_net}}/{{prefix_len}} to any port {{port}} proto tcp\nufw enable\nufw status numbered\n# 删除规则\nufw status numbered\nufw delete 2", "params": [{"name": "port", "label": "端口号", "default": "8080", "required": true, "validate": "int:1-65535", "example": "8080", "type": "int", "range": "1-65535", "description": "TCP 端口号（0-65535），ufw 放行、ss 查监听、tcpdump 抓包过滤的对象；放行前先确认服务在监听；ufw 规则即时生效，锁自己端口前留 console 兜底"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "prefix_len", "label": "源掩码长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24", "type": "int", "range": "0-32", "description": "前缀长度（0-32），与 IP 组成 CIDR（如 /24）；写错网段判定全错，远程操作可能当场断 SSH"}], "notes": "1) ★ ufw enable 前必须先 allow 22/tcp，否则远程会话直接断开。\n2) ufw delete 2 删的是 status numbered 里编号为 2 的规则（编号会变，先查再删）。\n3) ufw 不需要 reload，规则即时生效并持久化；与手写 iptables 规则会互相干扰。\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：实测:allow 22/8080/网段规则→enable(Firewall is active)→status numbered 5条;非交互删除 yes|ufw delete 2 成功;回退 disable 后 inactive ✓", "duration": "perm", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(ubuntu:22.04, 容器)", "verified_date": "2026-10-09", "favorite": 0, "created_at": "2026-09-22 16:34:00", "updated_at": "2026-10-09 13:45:48", "exec_level": "", "interactive": 0, "rollback": "# 回退：按编号倒序删除本次添加的规则（编号先 ufw status numbered 现场确认）；\n# 若变更前 ufw 未启用则整体关闭\nufw status numbered\nufw delete <编号>\nufw disable\n# 复核\nufw status verbose"}, {"uuid": "8ec4a39b-6ad4-5b74-806c-70f307f38479", "platform": "linux", "device_type": "服务器", "vendor": "ubuntu", "os_family": "ubuntu2204", "models": "Ubuntu 18.04+", "category": "排查命令", "title": "查端口监听与占用（ss）", "description": "确认服务是否监听、被谁占用。", "commands": "ss -tlnp | grep :{{port}}\nss -tlnp\nss -tlnp | grep {{pid}}", "params": [{"name": "port", "label": "端口号", "default": "8080", "required": true, "validate": "int:1-65535", "example": "8080", "type": "int", "range": "1-65535", "description": "TCP 端口号（0-65535），ufw 放行、ss 查监听、tcpdump 抓包过滤的对象；放行前先确认服务在监听；ufw 规则即时生效，锁自己端口前留 console 兜底"}, {"name": "pid", "label": "进程号", "default": "1234", "required": true, "validate": "int:1-4194304", "example": "1234", "type": "int", "range": "1-4194304", "description": "进程号（PID），ss/cat /proc/PID 定位进程资源与监听；kill 前先 ps 确认进程归属，误杀系统进程会宕机"}], "notes": "1) LISTEN 没有 → 服务没起；LISTEN 有但不通 → ufw/iptables 或对端链路。\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：实测:起python3监听8080后 ss -tlnp|grep :8080 出LISTEN行(users:(\"python3\"));grep 1234 无输出rc=1,判读口径复现 ✓", "duration": "temp", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(ubuntu:22.04, 容器)", "verified_date": "2026-10-09", "favorite": 0, "created_at": "2026-09-22 16:34:00", "updated_at": "2026-10-09 13:45:48", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "6227b8fd-fb8a-5d72-b3ec-f81f8fed481e", "platform": "linux", "device_type": "服务器", "vendor": "ubuntu", "os_family": "ubuntu2204", "models": "Ubuntu 18.04+", "category": "排查命令", "title": "tcpdump 抓包入门（Ubuntu）", "description": "按主机/端口抓包，远程排查记得排除 SSH 流量。", "commands": "tcpdump -i {{ifname}} -nn host {{peer_ip}} -c 100\ntcpdump -i {{ifname}} -nn port {{port}} -c 100\ntcpdump -i {{ifname}} -nn not port 22 -c 200\ntcpdump -i {{ifname}} -nn -w /tmp/capture.pcap -c 1000", "params": [{"name": "ifname", "label": "网卡名", "default": "eth0", "required": true, "validate": "ifname", "example": "eth0 / ens33 / enp3s0 / bond0", "type": "string", "description": "Linux 网卡名（eth0/ens33/bond0 等），操作的目标接口；先 ip link 确认存在再操作，选错网卡会当场断 SSH（远程操作务必留带外兜底）"}, {"name": "peer_ip", "label": "对端 IP", "default": "192.168.10.1", "required": true, "validate": "ipv4", "example": "192.168.10.1", "type": "ip", "description": "对端/目标 IP，ping/traceroute/tcpdump 等诊断命令的过滤与测试对象；仅诊断用途不影响配置"}, {"name": "port", "label": "端口号", "default": "8080", "required": true, "validate": "int:1-65535", "example": "8080", "type": "int", "range": "1-65535", "description": "TCP 端口号（0-65535），ufw 放行、ss 查监听、tcpdump 抓包过滤的对象；放行前先确认服务在监听；ufw 规则即时生效，锁自己端口前留 console 兜底"}], "notes": "1) -nn 不解析域名；远程排查加 not port 22。\n2) tcpdump 没装：apt install tcpdump（离线场景见本地源条目）。\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：实测:icmp -c3 on eth0 抓到 echo request/reply;host/port/not port 22 三式原样执行无语法错(0 packets属无流量);-w /tmp/capture.pcap 写盘5 packets ✓", "duration": "temp", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(ubuntu:22.04, 容器)", "verified_date": "2026-10-09", "favorite": 0, "created_at": "2026-09-22 16:34:00", "updated_at": "2026-10-09 13:45:48", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "5cb7d2aa-008c-5609-bcdb-5c458adce088", "platform": "linux", "device_type": "服务器", "vendor": "ubuntu", "os_family": "ubuntu2204", "models": "Ubuntu 18.04+", "category": "日志", "title": "journalctl 日志过滤（Ubuntu）", "description": "按服务/时间/级别过滤 systemd 日志。", "commands": "journalctl -u {{service_name}} -n 100 --no-pager\njournalctl -xe\njournalctl -p err -b --no-pager\njournalctl --since \"10 min ago\" --no-pager", "params": [{"name": "service_name", "label": "服务名", "default": "ssh", "required": true, "validate": "", "example": "ssh / firewalld / NetworkManager", "type": "string", "description": "systemd 服务名（ssh/nginx 等；Ubuntu 单元名是 ssh，sshd 仅为别名，enable/journalctl 须用本名 ssh），start/stop/enable 的操作对象；disable/stop 关键服务（如 sshd）前确认 console 可达"}], "notes": "1) --since \"10 min ago\" 这类相对时间很顺手；也可用具体时间戳。\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：实测:四式过滤全通(service_name 默认值已修 sshd→ssh,-u sshd 在 Ubuntu 返回空为实证发现);--since 相对时间可用 ✓", "duration": "temp", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(ubuntu:22.04, 容器)", "verified_date": "2026-10-09", "favorite": 0, "created_at": "2026-09-22 16:34:00", "updated_at": "2026-10-09 17:17:57", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "c5f087ce-249d-53df-b710-cb956350d397", "platform": "linux", "device_type": "服务器", "vendor": "ubuntu", "os_family": "ubuntu2204", "models": "Ubuntu 18.04+", "category": "本地源", "title": "本地 apt 源（deb 目录）★ 离网特供", "description": "把收集来的 deb 目录做成 apt 源，离线安装。", "commands": "mkdir -p /opt/local-debs\ncp ./*.deb /opt/local-debs/\ncd /opt/local-debs\ndpkg-scanpackages . /dev/null | gzip > Packages.gz\necho \"deb [trusted=yes] file:/opt/local-debs ./\" > /etc/apt/sources.list.d/local.list\napt-get update\napt-get install {{pkg_name}} -y\napt-cache policy {{pkg_name}}", "params": [{"name": "pkg_name", "label": "软件包名", "default": "createrepo", "required": true, "validate": "", "example": "createrepo", "type": "string", "description": "软件包名（yum/apt/rpm 的操作对象）；离网环境先在异机下载（pip download / yumdownloader）再拷入安装"}], "notes": "1) ★ 每次加了新 deb 都要重新 dpkg-scanpackages 生成 Packages.gz，否则 apt 看不到。\n2) [trusted=yes] 免签名校验；内网多机可改用 http 服务共享目录。\n3) apt-get update 报 NO_PUBKEY → 加 [trusted=yes] 或导入 key。\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：实测:apt-get download 造 deb→dpkg-scanpackages→local.list→apt-get update 命中本地源→install 成功;回退删源后 apt-cache policy 无 local ✓", "duration": "perm", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(ubuntu:22.04, 容器)", "verified_date": "2026-10-09", "favorite": 0, "created_at": "2026-09-22 16:34:00", "updated_at": "2026-10-09 13:45:49", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除本地源配置与 deb 目录（★ 已安装的包保留，按需 apt-get remove）\nrm -f /etc/apt/sources.list.d/local.list\nrm -rf /opt/local-debs\napt-get update\n# 复核（期望无 local 源）\napt-cache policy"}, {"uuid": "8269a8fc-9951-5617-a6a3-c5cb20b54f56", "platform": "linux", "device_type": "服务器", "vendor": "ubuntu", "os_family": "ubuntu2204", "models": "Ubuntu 18.04+", "category": "本地源", "title": "离线 deb 安装（含依赖处理）", "description": "没有源时用 dpkg 直接装，重点是依赖。", "commands": "dpkg -i {{pkg_name}}.deb\ndpkg -i ./*.deb\n# 装完有依赖缺失时（有可用源的情况下）：\napt-get install -f -y\ndpkg -l | grep {{pkg_name}}", "params": [{"name": "pkg_name", "label": "软件包名", "default": "createrepo", "required": true, "validate": "", "example": "createrepo", "type": "string", "description": "软件包名（yum/apt/rpm 的操作对象）；离网环境先在异机下载（pip download / yumdownloader）再拷入安装"}], "notes": "1) dpkg -i 不会自动装依赖 → 把依赖 deb 放同目录一起 dpkg -i ./*.deb。\n2) apt-get install -f 自动补缺失依赖（需要至少一个可用源）。\n3) 查包内容：dpkg -L {{pkg_name}}；查已装版本：dpkg -l | grep {{pkg_name}}。\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：实测:dpkg -i 安装、dpkg -l 查询、apt-get remove 回退全通(实验用 sl 包替代 createrepo,后者的包名在 Ubuntu 实为 createrepo-c) ✓", "duration": "temp", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(ubuntu:22.04, 容器)", "verified_date": "2026-10-09", "favorite": 0, "created_at": "2026-09-22 16:34:00", "updated_at": "2026-10-09 13:45:49", "exec_level": "", "interactive": 0, "rollback": "# 回退：卸载本变更安装的包（依赖包按需一并卸载，注意别误删系统组件）\napt-get remove {{pkg_name}} -y\n# 复核（期望报未安装）\ndpkg -l | grep {{pkg_name}}"}, {"uuid": "466cab9e-536b-5bf4-aea8-2f03676cb2ee", "platform": "linux", "device_type": "服务器", "vendor": "ubuntu", "os_family": "ubuntu2204", "models": "Ubuntu 18.04+", "category": "磁盘", "title": "磁盘空间排查（df/du/deleted 句柄）", "description": "定位磁盘占满，含 deleted 句柄的经典坑。", "commands": "df -h\ndu -sh /* 2>/dev/null | sort -rh | head -10\ndu -sh /var/log/* | sort -rh | head -10\nlsof | grep deleted | head\njournalctl --disk-usage\njournalctl --vacuum-size=500M", "params": [], "notes": "1) df 满、du 不大 → lsof | grep deleted；journalctl 日志可用 --vacuum-size 缩容。\n2) 清理正在写的日志用 : > 文件截断，不要直接 rm。\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：实测:df/du/lsof/journalctl --disk-usage/--vacuum-size=500M 全通;容器无 deleted 句柄(空属正常) ✓", "duration": "temp", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(ubuntu:22.04, 容器)", "verified_date": "2026-10-09", "favorite": 0, "created_at": "2026-09-22 16:34:00", "updated_at": "2026-09-22 16:34:00", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "62c1bb3c-3721-58ab-a681-2ca3f0965f8b", "platform": "linux", "device_type": "服务器", "vendor": "ubuntu", "os_family": "ubuntu2204", "models": "Ubuntu 18.04+", "category": "系统资源", "title": "CPU / 内存资源判读（top/free）", "description": "看谁在吃资源，正确解读 free 输出。", "commands": "top -b -n 1 | head -20\nfree -h\nps aux --sort=-%mem | head -10\nps aux --sort=-%cpu | head -10", "params": [], "notes": "1) free 看 available；buff/cache 是缓存不算占用。\n2) %wa 高 = IO 等待（磁盘瓶颈）；%us 高 = 应用吃 CPU。\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：实测:top -b -n 1 快照、free available、ps --sort=-%mem/-%cpu TOP 列表均正常回显 ✓", "duration": "temp", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(ubuntu:22.04, 容器)", "verified_date": "2026-10-09", "favorite": 0, "created_at": "2026-09-22 16:34:00", "updated_at": "2026-09-22 16:34:00", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "dcec3d65-dac4-482a-93fd-a47cb8116871", "platform": "linux", "device_type": "服务器", "vendor": "ubuntu", "os_family": "ubuntu2204", "models": "Ubuntu 22.04 LTS", "category": "网络配置", "title": "临时添加静态路由（Ubuntu）", "description": "临时加一条静态路由；持久化需写进 netplan 的 routes 段。", "commands": "# 1) 临时生效（重启失效）\nip route add {{dest_net}}/{{prefix_len}} via {{gateway}}\nip route show\n# 2) 持久化：把下面这段加进 /etc/netplan/*.yaml 的 ethernets 对应网卡下，再执行\n#    routes:\n#      - to: {{dest_net}}/{{prefix_len}}\n#        via: {{gateway}}\nnetplan apply\n# 3) 复核\nip route show | grep {{dest_net}}", "params": [{"name": "dest_net", "label": "目的网段", "default": "10.0.0.0", "required": true, "validate": "ipv4", "example": "10.0.0.0", "type": "ip", "description": "目的网段地址，路由/策略匹配的目标方向；0.0.0.0/0 表示任意目的；方向写反会导致流量走错策略"}, {"name": "prefix_len", "label": "掩码长度", "default": "8", "required": true, "validate": "masklen", "example": "8", "type": "string", "description": "前缀长度（0-32），与 IP 组成 CIDR（如 /24）；写错网段判定全错，远程操作可能当场断 SSH"}, {"name": "gateway", "label": "下一跳网关", "default": "192.168.1.1", "required": true, "validate": "ipv4", "example": "192.168.1.1", "type": "ip", "description": "网关 IP，本网段出方向的下一跳；配错表现为同网段通、跨网段断；nmcli 修改后需重新激活连接生效"}], "notes": "1) 本条目同时给出**临时**与**持久化**两套做法，按现场需要取用。\n2) 只配去程不够：对端也要有回程路由，否则单向不通。\n3) 临时路由重启必丢，做变更请用第 2) 段的 nmcli 方式。\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：实测:ip route add 10.0.0.0/8 via 实际网关 → 路由表出现 S 行;回退 del 后 grep 无残留 ✓", "duration": "both", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(ubuntu:22.04, 容器)", "verified_date": "2026-10-09", "favorite": 0, "created_at": "2026-09-22 16:34:00", "updated_at": "2026-10-09 13:45:49", "exec_level": "", "interactive": 0, "rollback": "# 回退：临时路由 ip route del；持久化段若已写入 netplan yaml 则手工删除该 routes 行\n#（变更未自动备份，按变更记录定位文件）再 netplan apply\nip route del {{dest_net}}/{{prefix_len}} via {{gateway}}\nnetplan apply\n# 复核（期望无该路由）\nip route show | grep {{dest_net}}"}, {"uuid": "badd911f-39c1-4ec8-aeb3-55d6a4e52992", "platform": "linux", "device_type": "服务器", "vendor": "ubuntu", "os_family": "ubuntu2204", "models": "Ubuntu 22.04 LTS", "category": "排查命令", "title": "ethtool 网卡链路诊断（Ubuntu）", "description": "用 ethtool 判断物理层是否 Link detected、速率双工是否协商正常。", "commands": "ethtool {{ifname}}\nethtool -S {{ifname}} | head -40\nip -s link show {{ifname}}", "params": [{"name": "ifname", "label": "网卡名", "default": "eth0", "required": false, "validate": "ifname", "example": "eth0", "type": "string", "description": "Linux 网卡名（eth0/ens33/bond0 等），操作的目标接口；先 ip link 确认存在再操作，选错网卡会当场断 SSH（远程操作务必留带外兜底）"}], "notes": "1) Link detected: no 说明物理层没起来（线缆/网口/对端）。\n2) 虚拟机里还要核对虚拟网卡与桥接网卡是否对应。\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：实测:eth0 Speed 10000Mb/s Duplex Full Link detected: yes;ethtool -S 统计与 ip -s link 计数一致 ✓", "duration": "temp", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(ubuntu:22.04, 容器)", "verified_date": "2026-10-09", "favorite": 0, "created_at": "2026-09-22 16:34:00", "updated_at": "2026-10-09 13:45:49", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "4817095e-4f5c-48ce-a682-4fd496ad3b4e", "platform": "linux", "device_type": "服务器", "vendor": "ubuntu", "os_family": "ubuntu2204", "models": "Ubuntu 22.04 LTS", "category": "排查命令", "title": "连通性排查三连（Ubuntu）", "description": "ping / traceroute / dig 三连，覆盖二层可达、路径与 DNS 解析。", "commands": "ping -c 4 {{target}}\ntraceroute -n {{target}}\ndig +short {{domain}}", "params": [{"name": "target", "label": "目标地址", "default": "223.5.5.5", "required": true, "validate": "ipv4", "example": "223.5.5.5", "type": "ip", "description": "连通性测试目标（IP 或域名），ping/traceroute 的对象；先测 IP 再测域名可分离网络故障与 DNS 故障"}, {"name": "domain", "label": "待解析域名", "default": "www.baidu.com", "required": false, "validate": "", "example": "www.baidu.com", "type": "string", "description": "设备域名后缀（ip domain-name / domain-name），用于 DNS 解析补全与 SSH RSA 密钥生成；改后提示符与解析习惯同步变化"}], "notes": "1) 能 ping 通 IP 但 dig 不通 → 查 DNS 配置（不是连通性问题）。\n2) traceroute 默认走 UDP，被过滤时可加 -I 用 ICMP 再试。\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：实测:ping 223.5.5.5 0% loss rtt≈9ms;traceroute 第1跳网关可达(后续*为过滤);dig www.baidu.com 正常解析 ✓", "duration": "temp", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(ubuntu:22.04, 容器)", "verified_date": "2026-10-09", "favorite": 0, "created_at": "2026-09-22 16:34:00", "updated_at": "2026-10-09 13:45:49", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "a88980b9-2830-5411-a556-1bacd821b23c", "platform": "network", "device_type": "交换机", "vendor": "cisco", "os_family": "ios", "models": "Catalyst / ISR 全系列", "category": "接口诊断", "title": "接口状态诊断（show interfaces 族）", "description": "接口 up/down、VLAN 归属、错误计数、ARP 与 MAC 学习——排查树的基础步骤。", "commands": "! ===== 接口状态诊断（Cisco IOS）=====\nenable\nshow interfaces status\nshow ip interface brief\nshow interfaces\nshow controllers ethernet-controller | include CRC|errors|discard\nshow arp\nshow mac address-table dynamic", "params": [], "notes": "1) show interfaces status 一屏看全端口（VLAN/状态/速率/双工）——排查从这里开始。\n2) Line protocol down 但 physical up → 对端或封装问题；两者都 down → 物理层。\n3) CRC/input errors 持续增长 → 线缆或光模块质量，换件验证。\n4) show mac address-table dynamic 看 MAC 学在哪个口 —— 环路排查（漂移）关键。\n—— lab 判定（场2,FRR 8.4）:不可核对(不可验证):show ip interface brief/show interfaces(复数)/show controllers/show arp/show mac address-table 全部 Unknown(FRR 命令面为 show interface brief 单数形,实录 err_unresolved);IOS 语法本体待真机/模拟器", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:00", "updated_at": "2026-09-22 16:34:00", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "526e648c-b0c2-5029-a9b4-c2d8d1f4119f", "platform": "network", "device_type": "交换机", "vendor": "cisco", "os_family": "ios", "models": "Catalyst / ISR 全系列", "category": "日志", "title": "系统日志排查（show logging）", "description": "从系统日志里找链路抖动、err-disable、协议告警的直接证据。", "commands": "! ===== 系统日志排查（Cisco IOS）=====\nenable\nterminal monitor\nshow logging | include %LINK|%LINE|err-disable|%SPANTREE|%OSPF|%BGP\nshow logging | last 50\nshow running-config | include logging", "params": [], "notes": "1) %LINK-5-CHANGED 看端口什么时候翻的；%SPANTREE 看有没有环路/拓扑变化。\n2) terminal monitor 让 VTY 会话也能实时收到日志（排障时先敲）。\n3) err-disable 的原因日志会写明（psecure-violation / loopback / bpduguard）。\n—— 实测 2026-10-12（场2,Docker(frr:8.4, 容器)）:语法核对(FRR 8.4):show logging✓(zebra 日志配置回显)+show running-config|include✓;terminal monitor IOS exec 专有 FRR 拒绝(enable 别名拒绝同类,场1 实录);完整 IOS 判读待真机", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:00", "updated_at": "2026-09-22 16:34:00", "exec_level": "verified-cli", "interactive": 0, "rollback": ""}, {"uuid": "7d6820f7-2739-5e11-9dbc-6b9b3f3a504a", "platform": "network", "device_type": "路由器", "vendor": "cisco", "os_family": "ios", "models": "ISR / ASR（BGP 场景）", "category": "BGP", "title": "BGP 邻居状态诊断（show ip bgp）", "description": "BGP 邻居 Idle/Active/Established 的快速定位。", "commands": "! ===== BGP 诊断（Cisco IOS）=====\nenable\nshow ip bgp summary\nshow ip bgp nei lan_id}}\nset network interface ethernet {{parent_port}} layer3 units {{sub_if}} ip {{vlan_ip}}/{{prefix_len}}\nset network interface ethernet {{parent_port}} layer3 units {{sub_if}} comment \"{{vlan_desc}}\"\nset zone {{zone_name}} network layer3 {{sub_if}}\nset network virtual-router default interface {{sub_if}}\ncommit\nshow interface all", "params": [{"name": "parent_port", "label": "父物理口", "default": "ethernet1/2", "required": true, "validate": "", "example": "ethernet1/2", "type": "string", "description": "VLAN 子接口的父物理口，子接口流量承载在其上；父口 down 则其下所有子接口全部 down"}, {"name": "sub_if", "label": "子接口名", "default": "ethernet1/2.10", "required": true, "validate": "", "example": "ethernet1/2.10", "type": "string", "description": "PaloAlto 子接口编号（ethernet1/x.N 中的 N），VLAN 子接口标识；tag 值与 vlan_id 配套"}, {"name": "vlan_id", "label": "VLAN ID", "default": "10", "required": true, "validate": "vlan", "example": "10", "type": "string", "description": "VLAN 编号，二层广播域标识；有效范围 1-4094（1 为默认 VLAN、1002-1005 系统保留）；Trunk 两端放行列表与 PVID 必须配套，改错会隔离业务"}, {"name": "vlan_ip", "label": "接口 IP", "default": "192.168.10.1", "required": true, "validate": "ipv4", "example": "192.168.10.1", "type": "ip", "description": "VLAN 子接口/网关 IP，该网段终端的默认网关；须与终端同网段；改网关地址需同步终端配置"}, {"name": "prefix_len", "label": "掩码长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24（PAN-OS 用 CIDR）", "type": "int", "range": "0-32", "description": "前缀长度（0-32），与 IP 组成 CIDR（如 /24）；写错网段判定全错，远程操作可能当场断 SSH"}, {"name": "zone_name", "label": "安全区域名", "default": "trust", "required": false, "validate": "", "example": "trust / untrust / dmz", "type": "string", "description": "安全区域名（trust/untrust/dmz），接口的 zone 归属决定策略方向匹配；接口须先加入 zone 才能被策略引用"}, {"name": "vlan_desc", "label": "描述", "default": "办公网段", "required": false, "validate": "", "example": "办公网段", "type": "string", "description": "VLAN/子接口的描述文字，运维辨识用途"}], "notes": "1) PAN-OS 有三件套必须齐全：子接口 → 划入 zone → 加入 virtual-router，缺一样流量就不通。\n   子接口名必须是\"父接口.tag\"格式（ethernet1/2.10），tag 就写 VLAN ID。\n2) IP 用 CIDR 写法（192.168.10.1/24），不是点分掩码。\n3) 所有配置都是\"候选配置\"，必须 commit 才生效；未 commit 的改动可以用\n   show config diff 查看、revert config 丢弃。\n4) 物理口若已是 layer3 且带 IP，需要先清掉再建子接口，否则报错。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:01", "updated_at": "2026-10-09 13:45:51", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除 VLAN 子接口并解除 zone/虚拟路由器引用（引用未解时 delete 会被拒）\nconfigure\ndelete zone {{zone_name}} network layer3 {{sub_if}}\ndelete network virtual-router default interface {{sub_if}}\ndelete network interface ethernet {{parent_port}} layer3 units {{sub_if}}\ncommit\n# 复核（期望无该接口）\nshow interface all"}, {"uuid": "70bb798c-8e45-5bfd-8340-6cb541ed710d", "platform": "network", "device_type": "防火墙", "vendor": "paloalto", "os_family": "panos", "models": "PA-440 / PA-3220 / PA-5220", "category": "Trunk", "title": "配置链路聚合（AE 接口）与 Trunk 子接口", "description": "把多个物理口绑成 AE 聚合口，再在 AE 上建 tag 子接口作为 Trunk 上联。", "commands": "# ===== 链路聚合 + Trunk 子接口（PAN-OS）=====\nconfigure\n! ---- 1) 创建 AE 聚合口并加入成员口 ----\nset network interface ethernet {{member1}} layer2 lacp enable true\nset network interface ethernet {{member1}} aggregate-group {{ae_name}}\nset network interface ethernet {{member2}} layer2 lacp enable true\nset network interface ethernet {{member2}} aggregate-group {{ae_name}}\n! ---- 2) 在 AE 上建子接口作为 Trunk（每个 VLAN 一个 tag 子接口）----\nset network interface aggregate-ethernet {{ae_name}} layer3 units {{ae_name}}.{{vlan_id}} tag {{vlan_id}}\nset network interface aggregate-ethernet {{ae_name}} layer3 units {{ae_name}}.{{vlan_id}} ip {{vlan_ip}}/{{prefix_len}}\nset zone trust network layer3 {{ae_name}}.{{vlan_id}}\nset network virtual-router default interface {{ae_name}}.{{vlan_id}}\ncommit\nshow interface all\nshow lacp interfaces", "params": [{"name": "member1", "label": "成员口1", "default": "ethernet1/1", "required": true, "validate": "", "example": "ethernet1/1", "type": "string", "description": "PaloAlto 聚合组成员口 1（ethernet1/x），加入 AE 后其独立配置失效；两成员口速率/双工/配置必须对称"}, {"name": "member2", "label": "成员口2", "default": "ethernet1/2", "required": true, "validate": "", "example": "ethernet1/2", "type": "string", "description": "PaloAlto 聚合组成员口 2，配置必须与成员口 1 完全对称，否则成员被踢出聚合"}, {"name": "ae_name", "label": "聚合口名", "default": "ae1", "required": true, "validate": "", "example": "ae1", "type": "string", "description": "PaloAlto 聚合接口（AE）名称，把多个物理口聚成一条逻辑链路提高带宽与冗余；成员口 LACP/layer2 配置必须对称；删除聚合组会连带断开成员口业务"}, {"name": "vlan_id", "label": "VLAN ID", "default": "10", "required": true, "validate": "vlan", "example": "10", "type": "string", "description": "VLAN 编号，二层广播域标识；有效范围 1-4094（1 为默认 VLAN、1002-1005 系统保留）；Trunk 两端放行列表与 PVID 必须配套，改错会隔离业务"}, {"name": "vlan_ip", "label": "子接口 IP", "default": "192.168.10.1", "required": true, "validate": "ipv4", "example": "192.168.10.1", "type": "ip", "description": "VLAN 子接口/网关 IP，该网段终端的默认网关；须与终端同网段；改网关地址需同步终端配置"}, {"name": "prefix_len", "label": "掩码长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24", "type": "int", "range": "0-32", "description": "前缀长度（0-32），与 IP 组成 CIDR（如 /24）；写错网段判定全错，远程操作可能当场断 SSH"}], "notes": "1) PAN-OS 的\"trunk\"由\"AE 聚合口 + 多个 tag 子接口\"组合实现，没有 Cisco 那种\n   switchport mode trunk 命令。\n2) 成员口必须先设 aggregate-group 才会成为聚合成员；只开 lacp enable 不会自动聚合。\n3) 多个 VLAN 就重复建多个 tag 子接口（ae1.10、ae1.20…），别想一次配完。\n4) show lacp interfaces 看成员口是否都 negotiated，是排查聚合异常的第一步。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:01", "updated_at": "2026-10-09 13:45:51", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除 AE 子接口与引用，成员口解除聚合（成员口原配置按变更记录恢复）\nconfigure\ndelete zone trust network layer3 {{ae_name}}.{{vlan_id}}\ndelete network virtual-router default interface {{ae_name}}.{{vlan_id}}\ndelete network interface aggregate-ethernet {{ae_name}} layer3 units {{ae_name}}.{{vlan_id}}\ndelete network interface ethernet {{member1}} aggregate-group\ndelete network interface ethernet {{member1}} layer2 lacp\ndelete network interface ethernet {{member2}} aggregate-group\ndelete network interface ethernet {{member2}} layer2 lacp\ndelete network interface aggregate-ethernet {{ae_name}}\ncommit\n# 复核\nshow interface all"}, {"uuid": "4e21bace-fb13-5c98-a7fe-f74ec449f43a", "platform": "network", "device_type": "防火墙", "vendor": "paloalto", "os_family": "panos", "models": "PA 全系列", "category": "静态路由", "title": "配置静态路由与默认路由（PAN-OS）", "description": "在 virtual-router 的路由表中新增静态路由，指定下一跳与出接口。", "commands": "# ===== 静态路由（PAN-OS）=====\nconfigure\nset network virtual-router default routing-table ip static-route {{route_name}} destination {{dest_net}}/{{prefix_len}}\nset network virtual-router default routing-table ip static-route {{route_name}} nexthop ip-address {{next_hop}}\nset network virtual-router default routing-table ip static-route {{route_name}} interface {{out_interface}}\nset network virtual-router default routing-table ip static-route {{route_name}} metric {{metric}}\nset network virtual-router default routing-table ip static-route {{default_route_name}} destination 0.0.0.0/0\nset network virtual-router default routing-table ip static-route {{default_route_name}} nexthop ip-address {{next_hop}}\nset network virtual-router default routing-table ip static-route {{default_route_name}} interface {{out_interface}}\ncommit\nshow routing route\nshow routing route type static\ntest routing fib-lookup virtual-router default ip {{probe_ip}}", "params": [{"name": "route_name", "label": "路由名", "default": "TO-CORE", "required": true, "validate": "", "example": "TO-CORE", "type": "string", "description": "PaloAlto 静态路由条目名，标识一条静态路由；修改后须 commit 才生效"}, {"name": "dest_net", "label": "目的网段", "default": "192.168.20.0", "required": true, "validate": "ipv4", "example": "192.168.20.0", "type": "ip", "description": "目的网段地址，路由/策略匹配的目标方向；0.0.0.0/0 表示任意目的；方向写反会导致流量走错策略"}, {"name": "prefix_len", "label": "前缀长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24", "type": "int", "range": "0-32", "description": "前缀长度（0-32），与 IP 组成 CIDR（如 /24）；写错网段判定全错，远程操作可能当场断 SSH"}, {"name": "next_hop", "label": "下一跳地址", "default": "10.0.0.2", "required": true, "validate": "ipv4", "example": "10.0.0.2", "type": "ip", "description": "下一跳 IP，路由/策略转发的去向；必须是本机直连可达地址，写错路由成『黑洞』"}, {"name": "out_interface", "label": "出接口", "default": "ethernet1/1", "required": true, "validate": "", "example": "ethernet1/1", "type": "string", "description": "NAT/策略的出接口名，流量转发的物理出口；必须与真实外网口一致，写错 NAT 不生效"}, {"name": "metric", "label": "metric", "default": "10", "required": false, "validate": "int:1-65535", "example": "越小越优先，默认 10", "type": "int", "range": "1-65535", "description": "PaloAlto 路由 metric 值，同前缀多条路由时决定优劣；修改后须 commit 才生效"}, {"name": "default_route_name", "label": "默认路由名", "default": "DEFAULT-TO-ISP", "required": false, "validate": "", "example": "DEFAULT-TO-ISP", "type": "string", "description": "PaloAlto 默认路由（0.0.0.0/0）的静态路由条目名，仅作辨识；修改后须 commit 才生效"}, {"name": "probe_ip", "label": "探测目标 IP", "default": "8.8.8.8", "required": false, "validate": "ipv4", "example": "8.8.8.8", "type": "ip", "description": "路由探测目标 IP（FIB lookup 测试），验证目的地址实际命中哪条路由；仅诊断用途不影响配置"}], "notes": "1) 路由挂在 virtual-router 下，如果设备上有多个 VR，要确认加到哪个 VR（默认 default）。\n2) destination 用 CIDR（192.168.20.0/24）；nexthop 与 interface 都建议给，便于链路 down 时失效。\n3) test routing fib-lookup virtual-router default ip <目标> 可直连查\"这个目的走哪个下一跳\"，\n   比翻路由表快得多 —— 这是 PAN-OS 排查路由的首选命令。\n4) metric 越小越优先（默认 10）；做浮动备份调整 metric 即可。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:01", "updated_at": "2026-10-09 13:45:51", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除本变更新增的静态路由与默认路由\nconfigure\ndelete network virtual-router default routing-table ip static-route {{route_name}}\ndelete network virtual-router default routing-table ip static-route {{default_route_name}}\ncommit\n# 复核\nshow routing route type static"}, {"uuid": "713c3eeb-c398-5ae8-af31-05c5ed260301", "platform": "network", "device_type": "防火墙", "vendor": "paloalto", "os_family": "panos", "models": "PA 全系列（需高级路由订阅）", "category": "OSPF", "title": "配置 OSPF 基本组网（PAN-OS）", "description": "启用 OSPF、指定 router-id、按区域把接口加入 OSPF 并设置被动接口。", "commands": "# ===== OSPF 基本配置（PAN-OS）=====\nconfigure\nset network virtual-router default protocol ospf router-id {{router_id}}\nset network virtual-router default protocol ospf enable yes\nset network virtual-router default protocol ospf area {{area_id}} interface {{uplink_port}}\nset network virtual-router default protocol ospf area {{area_id}} interface {{port}}\nset network virtual-router default protocol ospf area {{area_id}} interface {{port}} passive yes\nset network virtual-router default protocol ospf area {{area_id}} type normal\ncommit\nshow routing protocol ospf neighbor\nshow routing protocol ospf interface\nshow routing protocol ospf summary", "params": [{"name": "router_id", "label": "Router ID", "default": "6.6.6.6", "required": true, "validate": "ipv4", "example": "6.6.6.6", "type": "ip", "description": "OSPF Router ID（IPv4 格式），区域内唯一标识本路由器；重复会引发邻居震荡与路由抖动，建议用 loopback 接口地址"}, {"name": "area_id", "label": "区域号", "default": "0.0.0.0", "required": false, "validate": "", "example": "0.0.0.0（点分格式）", "type": "string", "description": "OSPF 区域 ID，控制该网段归属哪个 OSPF 区域；骨干区域固定 0.0.0.0，非骨干区域须与骨干直连（或虚链路）；填错邻居起不来、路由学不到"}, {"name": "uplink_port", "label": "上行接口（非被动）", "default": "ethernet1/1", "required": true, "validate": "", "example": "ethernet1/1", "type": "string", "description": "OSPF 上联接口——被动接口策略中的例外口，no passive 恢复收发 Hello 建邻居；只放开必要上联口"}, {"name": "port", "label": "业务接口（被动）", "default": "ethernet1/2", "required": true, "validate": "", "example": "ethernet1/2", "type": "string", "description": "接口名/接口编号，进入该接口视图后所做的配置只作用于这一个口；先 show/display 确认接口存在与状态——进错接口改配置是现场常见事故"}], "notes": "1) OSPF 需要先有接口 IP 并加入 virtual-router；接口没进 VR 就不会出现在可选列表里。\n2) passive yes 让业务口不发不收 Hello（等效 Cisco passive-interface）。\n3) 部分型号/版本需装高级路由（Advanced Routing）授权才有 OSPF，上机前先确认 license。\n4) 邻居起不来的第一件事：确认两端 area 类型（normal/stub）与 Hello/Dead 定时器一致。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:02", "updated_at": "2026-10-09 13:45:51", "exec_level": "", "interactive": 0, "rollback": "# 回退：撤销 OSPF（delete area 连带其下接口/类型；router-id/enable 恢复默认）\nconfigure\ndelete network virtual-router default protocol ospf area {{area_id}}\ndelete network virtual-router default protocol ospf router-id\ndelete network virtual-router default protocol ospf enable\ncommit\n# 复核\nshow routing protocol ospf neighbor"}, {"uuid": "79235f77-4cc9-5b5a-a4db-92fe85549eb0", "platform": "network", "device_type": "防火墙", "vendor": "paloalto", "os_family": "panos", "models": "PA 全系列", "category": "ACL", "title": "配置安全策略与地址对象（ACL 等效）", "description": "创建地址对象与服务对象，用 security rule 控制区域间访问，并开启日志。", "commands": "# ===== 地址对象 + 安全策略（PAN-OS）=====\nconfigure\nset address {{src_obj}} ip-netmask {{src_net}}/{{src_prefix}}\nset address {{dst_obj}} ip-netmask {{dst_net}}/{{dst_prefix}}\nset service {{svc_obj}} protocol tcp port {{dst_port}}\nset rulebase security rules {{rule_name}} from {{src_zone}}\nset rulebase security rules {{rule_name}} to {{dst_zone}}\nset rulebase security rules {{rule_name}} source {{src_obj}}\nset rulebase security rules {{rule_name}} destination {{dst_obj}}\nset rulebase security rules {{rule_name}} application {{application}}\nset rulebase security rules {{rule_name}} service {{svc_obj}}\nset rulebase security rules {{rule_name}} action allow\nset rulebase security rules {{rule_name}} log-end yes\ncommit\nshow rulebase security rules\nshow session all filter rule {{rule_name}}", "params": [{"name": "src_obj", "label": "源地址对象名", "default": "OBJ-OFFICE", "required": true, "validate": "", "example": "OBJ-OFFICE", "type": "string", "description": "源地址对象名（FortiGate/PaloAlto 等），先建对象再被策略引用；修改对象影响所有引用它的策略"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "src_prefix", "label": "源前缀长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24", "type": "int", "range": "0-32", "description": "源网段前缀长度（0-32），与 src_net 组成 CIDR"}, {"name": "dst_obj", "label": "目的地址对象名", "default": "OBJ-SERVER", "required": true, "validate": "", "example": "OBJ-SERVER", "type": "string", "description": "PaloAlto 目的地址对象名，先建对象再被安全策略引用；修改对象网段会影响所有引用它的策略，改后须 commit"}, {"name": "dst_net", "label": "目的网段", "default": "10.10.0.0", "required": true, "validate": "ipv4", "example": "10.10.0.0", "type": "ip", "description": "目的网段（ACL/防火墙策略匹配字段），0.0.0.0/0 表示任意目的；与反掩码/前缀长度配套使用；范围写宽会扩大放行面"}, {"name": "dst_prefix", "label": "目的前缀长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24", "type": "int", "range": "0-32", "description": "目的网段前缀长度（0-32），与 dst_net 组成 CIDR；写宽扩大匹配面，放行面随之变大"}, {"name": "svc_obj", "label": "服务对象名", "default": "SVC-WEB-8443", "required": true, "validate": "", "example": "SVC-WEB-8443", "type": "string", "description": "PaloAlto 服务对象名，定义协议+端口组合供策略引用；修改对象影响所有引用它的策略"}, {"name": "dst_port", "label": "目的端口", "default": "8443", "required": true, "validate": "int:1-65535", "example": "8443", "type": "int", "range": "1-65535", "description": "服务对象的端口号（0-65535，如 8443），定义四层匹配；改端口须同步核对后端真实监听，否则策略放行了也没流量"}, {"name": "rule_name", "label": "策略名", "default": "OFFICE-to-SERVER", "required": true, "validate": "", "example": "OFFICE-to-SERVER", "type": "string", "description": "PaloAlto 安全/NAT 规则名，标识一条策略；命名带方向与用途（如 OA_to_DB_allow）；修改后须 commit"}, {"name": "src_zone", "label": "源区域", "default": "trust", "required": true, "validate": "", "example": "trust", "type": "string", "description": "源安全区域，策略入方向区域匹配；报文入接口必须真属于该 zone；修改后须 commit"}, {"name": "dst_zone", "label": "目的区域", "default": "dmz", "required": true, "validate": "", "example": "dmz", "type": "string", "description": "目的安全区域（trust/dmz/untrust），策略的目的方向匹配；报文出接口必须真属于该 zone，否则策略永不命中；改后须 commit"}, {"name": "application", "label": "应用", "default": "ssl", "required": false, "validate": "", "example": "ssl / web-browsing / any", "type": "string", "description": "PaloAlto 安全策略的应用识别值（ssl / ssh / dns 等），基于应用识别放行流量而非仅端口；填 any 放行全部应用；规则修改后须 commit 才生效"}], "notes": "1) PAN-OS 的策略是\"区域对区域\"（from/to zone），不是绑定到接口；这条与思科/华为思维完全不同。\n2) application 与 service 的关系：application 是 L7 识别（推荐用 ssl/web-browsing 这类），\n   service 是 L4 端口（用 application-default 可让系统自动带出端口）。\n3) 策略自上而下匹配，先匹配生效；新规则默认加在末尾，插到前面要显式指定位置。\n4) 必须有 source/destination/application（或 service）三要素，缺一个提交会报错。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:02", "updated_at": "2026-10-09 13:45:51", "exec_level": "", "interactive": 0, "rollback": "# 回退：先删策略再删对象/服务（被引用时 delete 会被拒）\nconfigure\ndelete rulebase security rules {{rule_name}}\ndelete address {{src_obj}}\ndelete address {{dst_obj}}\ndelete service {{svc_obj}}\ncommit\n# 复核\nshow rulebase security rules"}, {"uuid": "b516d80d-67b1-5549-b7e9-4cf3dc2a471c", "platform": "network", "device_type": "防火墙", "vendor": "paloalto", "os_family": "panos", "models": "PA 全系列", "category": "NAT", "title": "配置源 NAT（SNAT/PAT）与目的 NAT（DNAT 端口映射）", "description": "用 NAT 策略做源地址转换与端口映射，并说明与安全策略的配合关系。", "commands": "# ===== 源 NAT + 目的 NAT（PAN-OS）=====\nconfigure\n! ---- 1) 源 NAT：内网出网做 PAT（借用出接口地址）----\nset rulebase nat rules {{snat_name}} from {{src_zone}}\nset rulebase nat rules {{snat_name}} to {{dst_zone}}\nset rulebase nat rules {{snat_name}} source {{src_net}}/{{src_prefix}}\nset rulebase nat rules {{snat_name}} destination any\nset rulebase nat rules {{snat_name}} service any\nset rulebase nat rules {{snat_name}} source-translation dynamic-ip-and-port interface-address interface {{out_interface}}\n! ---- 2) 目的 NAT：公网端口映射到内网服务器 ----\nset rulebase nat rules {{dnat_name}} from {{untrust_zone}}\nset rulebase nat rules {{dnat_name}} to {{trust_zone}}\nset rulebase nat rules {{dnat_name}} destination {{public_ip}}/32\nset rulebase nat rules {{dnat_name}} service {{svc_name}}\nset rulebase nat rules {{dnat_name}} source any\nset rulebase nat rules {{dnat_name}} destination-translation translated-address {{inside_ip}}\nset rulebase nat rules {{dnat_name}} destination-translation translated-port {{inside_port}}\ncommit\nshow running nat-policy\nshow session all", "params": [{"name": "snat_name", "label": "SNAT 策略名", "default": "SNAT-TO-INTERNET", "required": true, "validate": "", "example": "SNAT-TO-INTERNET", "type": "string", "description": "SNAT 规则名，标识一条源地址转换（内网出去的方向）；修改后须 commit 才生效"}, {"name": "src_zone", "label": "源区域", "default": "trust", "required": true, "validate": "", "example": "trust", "type": "string", "description": "源安全区域，策略入方向区域匹配；报文入接口必须真属于该 zone；修改后须 commit"}, {"name": "dst_zone", "label": "目的区域", "default": "untrust", "required": true, "validate": "", "example": "untrust", "type": "string", "description": "目的安全区域（trust/dmz/untrust），策略的目的方向匹配；报文出接口必须真属于该 zone，否则策略永不命中；改后须 commit"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "src_prefix", "label": "源前缀长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24", "type": "int", "range": "0-32", "description": "源网段前缀长度（0-32），与 src_net 组成 CIDR"}, {"name": "out_interface", "label": "出接口", "default": "ethernet1/1", "required": true, "validate": "", "example": "ethernet1/1", "type": "string", "description": "NAT/策略的出接口名，流量转发的物理出口；必须与真实外网口一致，写错 NAT 不生效"}, {"name": "dnat_name", "label": "DNAT 策略名", "default": "DNAT-WEB-8443", "required": true, "validate": "", "example": "DNAT-WEB-8443", "type": "string", "description": "DNAT/NAT 规则名，标识一条目的地址转换（外部访问内部服务的映射入口）；名称建议带业务语义；修改后须 commit 才生效"}, {"name": "untrust_zone", "label": "外网区域", "default": "untrust", "required": true, "validate": "", "example": "untrust", "type": "string", "description": "非受信安全区域名（外网侧），DNAT/策略的来源区域匹配"}, {"name": "trust_zone", "label": "内网区域", "default": "trust", "required": true, "validate": "", "example": "trust", "type": "string", "description": "受信/目的安全区域名，NAT 与安全策略的区域匹配；与区域规划一致，改后须 commit"}, {"name": "public_ip", "label": "公网 IP", "default": "200.1.1.30", "required": true, "validate": "ipv4", "example": "200.1.1.30", "type": "ip", "description": "对外发布的公网/映射 IP，NAT 后外部访问的地址；须在上联口网段内且未被占用，冲突会绑定失败"}, {"name": "svc_name", "label": "服务对象名", "default": "SVC-WEB-8443", "required": true, "validate": "", "example": "SVC-WEB-8443", "type": "string", "description": "NAT 规则引用的服务对象名，DNAT 的端口匹配依据；修改后须 commit"}, {"name": "inside_ip", "label": "内网服务器", "default": "192.168.10.100", "required": true, "validate": "ipv4", "example": "192.168.10.100", "type": "ip", "description": "NAT 映射的内网真实 IP（被发布服务器的地址），DNAT 后流量的真正去向；填错把外部流量引到错误主机"}, {"name": "inside_port", "label": "内网端口", "default": "8443", "required": true, "validate": "int:1-65535", "example": "8443", "type": "int", "range": "1-65535", "description": "内网侧接口名或映射端口号，DNAT 流量的内部接收方向；写错映射不生效"}], "notes": "1) PAN-OS 的 NAT 是\"策略\"（rulebase nat rules），与安全策略分开：**NAT 策略只做转换，\n   是否放行由安全策略决定**，因此 DNAT 场景必须同时配一条允许 untrust→trust 的安全策略。\n2) source-translation dynamic-ip-and-port interface-address 就是 PAT（借用出接口地址）。\n3) DNAT 的 service 对象端口要与 translated-port 对齐，端口写错表现为\"能连上但业务不通\"。\n4) show session all 看会话；排查 NAT 时确认会话里显示的源/目的地址是否是转换后的结果。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:02", "updated_at": "2026-10-09 13:45:51", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除 NAT 规则（SNAT/DNAT 相互独立可直接删；zone 内接口划分\n# 若变更前不存在另行处理，不在本回退范围）\nconfigure\ndelete rulebase nat rules {{snat_name}}\ndelete rulebase nat rules {{dnat_name}}\ncommit\n# 复核\nshow running nat-policy"}, {"uuid": "367389ae-43d1-5d99-a504-c0fdf0daded4", "platform": "network", "device_type": "防火墙", "vendor": "paloalto", "os_family": "panos", "models": "PA 全系列", "category": "SSH管理", "title": "开启 SSH 管理并创建管理员账号", "description": "创建管理员账号与角色、限制管理源地址、指定 SSH 版本与端口。", "commands": "# ===== 管理员账号 + 管理面收紧（PAN-OS）=====\nconfigure\nset mgt-config users {{username}} permissions role-based superuser yes\nset mgt-config users {{username}} password\n! ↑ 交互提示输入两次口令，脚本里会停在提示符上，需手工输入\nset deviceconfig system permitted-ip {{mgmt_net}}/{{mgmt_prefix}}\nset deviceconfig system ssh-version 2\nset deviceconfig system port {{ssh_port}}\nset deviceconfig system hostname {{hostname}}\ncommit\nshow mgt-config users\nshow deviceconfig system", "params": [{"name": "username", "label": "用户名", "default": "netadmin", "required": true, "validate": "", "example": "netadmin", "type": "string", "description": "登录账号名，认证身份标识；按人名/工号命名便于审计追责，禁用共享账号"}, {"name": "mgmt_net", "label": "允许管理网段", "default": "10.0.0.0", "required": true, "validate": "ipv4", "example": "10.0.0.0", "type": "ip", "description": "管理平台允许访问的源网段（permitted-ip 白名单），限制谁能访问设备管理面；改前确认当前管理机来源网段在名单内，否则当场失联"}, {"name": "mgmt_prefix", "label": "管理网段前缀", "default": "24", "required": true, "validate": "int:0-32", "example": "24", "type": "int", "range": "0-32", "description": "管理源网段前缀长度，与 mgmt_net 配套；写窄会漏掉跳板机网段"}, {"name": "ssh_port", "label": "SSH 端口", "default": "22", "required": false, "validate": "int:1-65535", "example": "22，建议改非标端口", "type": "int", "range": "1-65535", "description": "SSH 管理端口（默认 22），改为非标端口可减少扫描骚扰；改前先放行新端口（防火墙/安全策略），否则把自己锁在门外"}, {"name": "hostname", "label": "设备名", "default": "FW-EDGE-01", "required": false, "validate": "", "example": "FW-EDGE-01", "type": "string", "description": "设备主机名，标识作用不影响转发；修改后提示符与日志来源同步变化，网管侧如按主机名建资产需同步更新"}], "notes": "1) set mgt-config users X password 是交互式命令：粘贴脚本会停在 \"Enter password:\" —— 现场手工敲。\n   想在脚本里一次配好，可用 password-hash 方式（先在界面/设备上设好再导出配置复用）。\n2) permitted-ip 是\"管理面白名单\"，配了就只允许该网段访问管理接口；\n   配置前务必确认自己在白名单网段内，否则会把自己锁在外面。\n3) 角色权限用 permissions role-based superuser yes；更细的可用自定义 role。\n4) 改 port 或 permitted-ip 前，先留一个已连通的会话，改完立即用新方式验证。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:02", "updated_at": "2026-10-09 13:45:52", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除本变更新建管理员并恢复管理面参数（★ 删除当前登录账号前\n# 先用其他管理员登录；hostname 旧值按变更记录回填，变更前未设置则\n# delete deviceconfig system hostname；permitted-ip 若变更前无则 delete 撤销）\nconfigure\ndelete mgt-config users {{username}}\nset deviceconfig system port <旧管理端口，默认443>\ncommit\n# 复核\nshow mgt-config users"}, {"uuid": "3eaf7291-5531-5b2f-a27a-f07ecd4a0f01", "platform": "network", "device_type": "防火墙", "vendor": "paloalto", "os_family": "panos", "models": "PA 全系列", "category": "密码", "title": "修改管理员口令并设置口令策略", "description": "修改管理员口令，配置口令复杂度与有效期策略。", "commands": "# ===== 修改管理员口令（PAN-OS）=====\nconfigure\nset mgt-config users {{username}} password\n! ↑ 交互输入两次新口令，无法在脚本里自动化\nset mgt-config password-complexity enabled yes\nset mgt-config password-complexity minimum-length {{min_len}}\nset mgt-config password-complexity minimum-numeric {{min_numeric}}\nset mgt-config password-complexity minimum-special {{min_special}}\nset mgt-config password-complexity password-history-count {{history}}\nset mgt-config password-complexity password-change-period {{change_days}}\nset mgt-config password-complexity password-change-warning {{warning_days}}\ncommit\nshow mgt-config password-complexity", "params": [{"name": "username", "label": "用户名", "default": "netadmin", "required": true, "validate": "", "example": "netadmin", "type": "string", "description": "登录账号名，认证身份标识；按人名/工号命名便于审计追责，禁用共享账号"}, {"name": "min_len", "label": "口令最小长度", "default": "12", "required": false, "validate": "int:8-15", "example": "8-15", "type": "int", "range": "8-15", "description": "口令最小长度，常见 8-12 位；配合复杂度策略（数字/特殊字符下限）使用"}, {"name": "min_numeric", "label": "最少数字位数", "default": "2", "required": false, "validate": "int:0-15", "example": "2", "type": "int", "range": "0-15", "description": "口令中最少数字字符个数（PaloAlto 复杂度策略），强制混合字符组成"}, {"name": "min_special", "label": "最少特殊字符数", "default": "2", "required": false, "validate": "int:0-15", "example": "2", "type": "int", "range": "0-15", "description": "口令中最少特殊字符个数（PaloAlto 复杂度策略）"}, {"name": "history", "label": "口令历史记录数", "default": "12", "required": false, "validate": "int:0-50", "example": "12", "type": "int", "range": "0-50", "description": "口令历史记忆次数，禁止与最近 N 次口令重复；常见 5 次；配合有效期使用防止『改回旧口令』绕过轮换"}, {"name": "change_days", "label": "口令有效期（天）", "default": "90", "required": false, "validate": "int:0-365", "example": "90", "type": "int", "range": "0-365", "description": "口令有效期（天），超过后系统强制改密；常见 90 天；设得过短会逼出弱口令习惯，配合到期提前告警（warning_days）使用"}, {"name": "warning_days", "label": "到期前提醒（天）", "default": "7", "required": false, "validate": "int:0-365", "example": "7", "type": "int", "range": "0-365", "description": "口令到期提前告警天数，临近过期登录时提示用户；与 change_days 配套，常见 7-14 天"}], "notes": "1) 改口令必须交互输入，脚本粘贴会卡在 \"Enter password:\"；现场手工敲，或从界面改。\n2) PAN-OS 的 console / HTTPS / SSH 共用同一套管理员账号，改一处全套生效。\n3) 忘记 admin 口令的恢复：通过 console 在维护模式（Maintenance Recovery）重置，\n   需要重启并现场操作，属破坏性操作。\n4) 安全基线：minimum-length ≥12、必须有数字与特殊字符、有效期 ≤90 天、开启历史记录。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:02", "updated_at": "2026-10-09 13:45:52", "exec_level": "", "interactive": 0, "rollback": "# 回退：口令类变更须恢复旧口令（交互输入，旧值按变更记录掌握；\n# ★ 本条 rollback 为盲写（命令正文审查通道超时未逐行核对），复核时重点核对\n# 该条目 commands 与 params 后修订占位与路径）\nconfigure\nset mgt-config users <管理员账号> password\n# ↑ 交互输入旧口令两次\n# 口令策略恢复变更前状态（若变更前无策略：delete deviceconfig system password-policy）\ncommit"}, {"uuid": "512998b6-470d-50e7-8afc-37193c6a31db", "platform": "network", "device_type": "防火墙", "vendor": "paloalto", "os_family": "panos", "models": "PA 全系列", "category": "SNMP", "title": "配置 SNMP 团体字与 Trap 目标（PAN-OS）", "description": "配置 SNMP v2c 团体字、限定网管源地址并指定 Trap 接收服务器。", "commands": "# ===== SNMP 配置（PAN-OS）=====\nconfigure\nset deviceconfig system snmp-setting access-setting version v2c snmp-community-string {{ro_community}}\nset deviceconfig system snmp-setting access-setting version v2c permitted-ip {{nms_ip}}/32\nset deviceconfig system snmp-setting trap-setting v2c enable yes\nset deviceconfig system snmp-setting trap-setting v2c servers {{nms_ip}}\nset deviceconfig system snmp-setting trap-setting v2c community-string {{ro_community}}\ncommit\nshow deviceconfig system snmp-setting", "params": [{"name": "ro_community", "label": "只读团体字", "default": "RO@Public1", "required": true, "validate": "", "example": "RO@Public1", "type": "string", "description": "SNMP 只读团体字，等同口令——网管凭它采集设备数据；禁用 public 等弱值并限定来源；只读为主，写权限单独管理"}, {"name": "nms_ip", "label": "网管服务器 IP", "default": "10.0.0.100", "required": true, "validate": "ipv4", "example": "10.0.0.100", "type": "ip", "description": "网管服务器（SNMP 采集/trap 接收）IP，设备向其发送告警并接受查询；填错网管侧收不到任何数据，等于监控失明"}], "notes": "1) permitted-ip 必须配，不配等于对全网开放 SNMP，安全审计必查。\n2) 团体字别用 public/private；建议与其它设备区分，避免一处泄露全网受影响。\n3) Trap 的 community-string 要与接收端一致，否则网管收不到告警。\n4) 更安全的做法是用 SNMPv3（set deviceconfig system snmp-setting access-setting version v3 ...），\n   需要配 usm-users 与认证/加密口令。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:02", "updated_at": "2026-10-09 13:45:52", "exec_level": "", "interactive": 0, "rollback": "# 回退：撤销 SNMP v2c 配置（delete 恢复默认未配置状态）\nconfigure\ndelete deviceconfig system snmp-setting access-setting version v2c\ndelete deviceconfig system snmp-setting trap-setting v2c\ncommit\n# 复核\nshow deviceconfig system snmp-setting"}, {"uuid": "2156ab5b-7fbc-5a1d-9565-b943fd139c1d", "platform": "network", "device_type": "防火墙", "vendor": "paloalto", "os_family": "panos", "models": "PA 全系列", "category": "保存配置", "title": "提交配置并导出配置文件归档", "description": "commit 生效后把配置导出为文件（含命名版本），并把导出文件取回本机归档。", "commands": "# ===== 提交与导出配置（PAN-OS）=====\nconfigure\nshow config diff\ncommit\n! ---- 导出运行配置到设备本地文件 ----\nsave config to {{backup_name}}\n! ---- 列出已有导出文件 ----\nshow config saved\n! ---- 命名版本快照（在界面上做，便于一键回滚）----\n! 【Web】Device → Setup → Operations → Save named configuration snapshot\n! 【Web】导出到本机：Device → Setup → Operations → Export configuration version\n! ---- 回滚 ----\n! load config from {{backup_name}}\n! load config version <版本号>\n! commit", "params": [{"name": "backup_name", "label": "导出文件名", "default": "FW-EDGE-01-20260920.xml", "required": true, "validate": "", "example": "FW-EDGE-01-20260920.xml", "type": "string", "description": "配置/镜像备份在本地（flash/USB）的保存文件名；仅本机留痕，建议再 execute backup 到 TFTP 异机一份防单点"}], "notes": "1) PAN-OS 每次 commit 都会自动生成一个版本快照，误改后可以 load config version <版本号> 回滚。\n2) save config to <文件名> 是导出到设备本地；要取回本机需在界面上\n   Device → Setup → Operations → Export 或用 SCP 拉取（隔离网络下建议存本地归档）。\n3) 变更前先在界面做一次 \"Save named configuration snapshot\"，命名带变更单号，回滚最方便。\n4) load config 会覆盖当前运行配置，执行前确认没有其他人正在操作设备。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:02", "updated_at": "2026-10-09 13:45:52", "exec_level": "", "interactive": 0, "rollback": "# 回退：本条目为提交与导出操作（commit 提交的是候选配置），配置内容不变；\n# 如需恢复到本快照（★ 覆盖当前运行配置，确认后再执行）\nload config from {{backup_name}} to running-config\ncommit\n# 复核\nshow running security-policy"}, {"uuid": "1c128aa6-de9b-53c7-90de-802fa9aa2e13", "platform": "network", "device_type": "交换机", "vendor": "ruijie", "os_family": "rgos", "models": "RG-S2910 / S5750 / S6220", "category": "VLAN", "title": "创建 VLAN 并把端口划入 Access（锐捷 RGOS）", "description": "新建业务 VLAN，用 interface range 批量把端口划为 access 并加入 VLAN。", "commands": "! ===== 创建 VLAN 并划入端口（锐捷 RGOS）=====\nenable\nconfigure terminal\nvlan {{vlan_id}}\n name {{vlan_name}}\n exit\ninterface range GigabitEthernet {{port_range}}\n switchport mode access\n switchport access vlan {{vlan_id}}\n no shutdown\n exit\nend\nwrite\nshow vlan", "params": [{"name": "vlan_id", "label": "VLAN ID", "default": "10", "required": true, "validate": "vlan", "example": "10", "type": "string", "description": "VLAN 编号，二层广播域标识；有效范围 1-4094（1 为默认 VLAN、1002-1005 系统保留）；Trunk 两端放行列表与 PVID 必须配套，改错会隔离业务"}, {"name": "vlan_name", "label": "VLAN 名称", "default": "OFFICE", "required": false, "validate": "", "example": "OFFICE", "type": "string", "description": "VLAN 名称，二层辨识用途；建议按业务语义命名（如 OA_BIZ），纯展示不影响转发"}, {"name": "port_range", "label": "端口范围", "default": "0/1-0/10", "required": true, "validate": "port_range", "example": "0/1-0/10", "expand": "port", "type": "string", "description": "端口范围表达式（如 0/1-0/10、0/1,0/3,0/5-0/7），生成器按厂商命名规则展开为接口列表；展开结果先在预览区核对再执行"}], "notes": "1) 锐捷接口名按机型不同：独立式多为 Gi0/1，盒式/机框式为 Gi0/0/1，以 show interface 实际提示为准。\n2) 锐捷支持 interface range 且支持逗号列表，与思科写法一致。\n3) 保存命令是 write（等价 write memory），部分版本会二次确认。\n4) ★ 本条含 shutdown / undo shutdown 类端口操作：对生产端口执行会瞬断链路，请在业务低峰期变更，并确认有带外/备用管理通道再动手。\n", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:02", "updated_at": "2026-10-09 13:45:53", "exec_level": "", "interactive": 0, "rollback": "! 回退：删除 VLAN 并把端口恢复默认属性（端口原属 VLAN 按变更记录恢复）\nenable\nconfigure terminal\ninterface range GigabitEthernet {{port_range}}\n no switchport access vlan\n no switchport mode access\n exit\nno vlan {{vlan_id}}\nend\nwrite\n! 复核\nshow vlan"}, {"uuid": "b664366d-7fb6-5ed7-a4e2-452a87d051f2", "platform": "network", "device_type": "交换机", "vendor": "ruijie", "os_family": "rgos", "models": "RG-S2910 / S5750 / S6220", "category": "Trunk", "title": "配置 Trunk 口并放通 VLAN（锐捷 RGOS）", "description": "把级联口配成 trunk，用 allowed vlan add 追加放通 VLAN，并设置 native VLAN。", "commands": "! ===== 配置 Trunk 口（锐捷 RGOS）=====\nenable\nconfigure terminal\ninterface GigabitEthernet {{port}}\n switchport mode trunk\n switchport trunk allowed vlan add {{vlan_list}}\n switchport trunk native vlan {{pvid}}\n no shutdown\n exit\nend\nwrite\nshow interfaces GigabitEthernet {{port}} switchport", "params": [{"name": "port", "label": "端口", "default": "0/24", "required": true, "validate": "port", "example": "0/24", "type": "string", "description": "接口名/接口编号，进入该接口视图后所做的配置只作用于这一个口；先 show/display 确认接口存在与状态——进错接口改配置是现场常见事故"}, {"name": "vlan_list", "label": "放通 VLAN 列表", "default": "10 20 30", "required": true, "validate": "", "example": "10 20 30 或 10 to 20", "type": "string", "description": "Trunk 放行 VLAN 列表（如 10,20,30-40），控制哪些 VLAN 流量可通过该链路；漏放行业务 VLAN 会当场断流，改动立即生效"}, {"name": "pvid", "label": "PVID / Native VLAN", "default": "1", "required": false, "validate": "vlan", "example": "1", "type": "string", "description": "Trunk 口 PVID（untagged VLAN），决定无标签流量归入哪个 VLAN；两端 PVID 不一致会导致原生态流量进错 VLAN 丢失"}], "notes": "1) 锐捷用 allowed vlan add 追加；不带 add 是覆盖式设置，会把原有放通列表冲掉。\n2) 取消放通用 switchport trunk allowed vlan remove <vlan>。\n3) native VLAN 两端必须一致，否则会出现跨 VLAN 串流或协议报文异常。\n4) ★ 本条含 shutdown / undo shutdown 类端口操作：对生产端口执行会瞬断链路，请在业务低峰期变更，并确认有带外/备用管理通道再动手。\n", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:02", "updated_at": "2026-10-09 13:45:53", "exec_level": "", "interactive": 0, "rollback": "! 回退：精确移除本次放通的 VLAN 与 native vlan（放行表其余部分保持不变；\n! ★ 回退前确认该口未下联交换机，防环路）\nenable\nconfigure terminal\ninterface GigabitEthernet {{port}}\n no switchport trunk allowed vlan {{vlan_list}}\n no switchport trunk native vlan\n no switchport mode trunk\n exit\nend\nwrite\n! 复核\nshow interfaces GigabitEthernet {{port}} switchport"}, {"uuid": "2e17b383-ad10-533f-9e0f-ab2e4922a845", "platform": "network", "device_type": "路由器", "vendor": "ruijie", "os_family": "rgos", "models": "RG-RSR 系列 / 三层交换机", "category": "静态路由", "title": "配置静态路由与缺省路由（锐捷 RGOS）", "description": "配置明细静态路由、缺省路由与浮动备份路由。", "commands": "! ===== 静态路由（锐捷 RGOS）=====\nenable\nconfigure terminal\nip route {{dest_net}} {{mask}} {{next_hop}}\nip route 0.0.0.0 0.0.0.0 {{next_hop}}\nip route {{dest_net}} {{mask}} {{backup_hop}} {{distance}}\nend\nwrite\nshow ip route", "params": [{"name": "dest_net", "label": "目的网段", "default": "192.168.20.0", "required": true, "validate": "ipv4", "example": "192.168.20.0", "type": "ip", "description": "目的网段地址，路由/策略匹配的目标方向；0.0.0.0/0 表示任意目的；方向写反会导致流量走错策略"}, {"name": "mask", "label": "掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "24 或 255.255.255.0", "type": "string", "description": "静态路由的点分十进制掩码，与 dest_net 圈定路由前缀；掩码写宽会吞掉相邻网段的路由匹配"}, {"name": "next_hop", "label": "下一跳地址", "default": "10.0.0.2", "required": true, "validate": "ipv4", "example": "10.0.0.2", "type": "ip", "description": "下一跳 IP，路由/策略转发的去向；必须是本机直连可达地址，写错路由成『黑洞』"}, {"name": "backup_hop", "label": "备份下一跳", "default": "10.0.0.3", "required": false, "validate": "ipv4", "example": "10.0.0.3", "type": "ip", "description": "浮动静态路由的备份下一跳，主路径失效后才接管转发；其管理距离/优先级必须大于主路由；须保证与本端直连可达"}, {"name": "distance", "label": "管理距离", "default": "200", "required": false, "validate": "int:1-255", "example": "默认 1，备份用 200", "type": "int", "range": "1-255", "description": "路由管理距离（FortiGate/锐捷/中兴），数值越小该路由越优先；浮动备份路由靠把备份侧 distance 调大实现主备切换"}], "notes": "1) 最后一位是管理距离（distance），越大越不优先，浮动备份就靠它。\n2) 锐捷三层交换机做路由转发前要确认已开启路由功能（部分型号需 ip routing）。\n3) show ip route 中 S 为静态、S* 为缺省路由；直接 ping 验证比看表更快。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:02", "updated_at": "2026-10-09 13:45:53", "exec_level": "", "interactive": 0, "rollback": "! 回退：逐条删除本变更新增的静态/缺省/浮动路由\nenable\nconfigure terminal\nno ip route {{dest_net}} {{mask}} {{next_hop}}\nno ip route 0.0.0.0 0.0.0.0 {{next_hop}}\nno ip route {{dest_net}} {{mask}} {{backup_hop}} {{distance}}\nend\nwrite\n! 复核\nshow ip route"}, {"uuid": "51ce7f24-f3b5-5056-b442-e2f713666fae", "platform": "network", "device_type": "路由器", "vendor": "ruijie", "os_family": "rgos", "models": "RG-RSR 系列 / 三层交换机", "category": "OSPF", "title": "配置 OSPF 基本组网（锐捷 RGOS）", "description": "开启 OSPF 进程、设 router-id、宣告网段并静默业务口。", "commands": "! ===== OSPF 基本配置（锐捷 RGOS）=====\nenable\nconfigure terminal\nrouter ospf {{process_id}}\n router-id {{router_id}}\n network {{network}} {{wildcard}} area {{area_id}}\n passive-interface {{passive_port}}\n exit\nend\nwrite\nshow ip ospf neighbor\nshow ip route ospf", "params": [{"name": "process_id", "label": "进程号", "default": "1", "required": true, "validate": "int:1-65535", "example": "1", "type": "int", "range": "1-65535", "description": "OSPF 进程号（仅本机有效），标识一个 OSPF 实例；两端进程号可以不同，但网段/区域/认证必须匹配"}, {"name": "router_id", "label": "Router ID", "default": "4.4.4.4", "required": true, "validate": "ipv4", "example": "4.4.4.4", "type": "ip", "description": "OSPF Router ID（IPv4 格式），区域内唯一标识本路由器；重复会引发邻居震荡与路由抖动，建议用 loopback 接口地址"}, {"name": "network", "label": "宣告网段", "default": "10.0.0.0", "required": true, "validate": "ipv4", "example": "10.0.0.0", "type": "ip", "description": "OSPF 宣告网段，匹配哪些接口参与 OSPF 进程；与 wildcard 配套使用；宣告漏了/错了邻居和路由直接缺失"}, {"name": "wildcard", "label": "反掩码", "default": "0.0.0.255", "required": true, "validate": "masklen", "example": "0.0.0.255", "type": "string", "description": "OSPF/ACL 反掩码（wildcard），0 位精确匹配、1 位任意；0.0.0.255 对应 /24；写错宣告/匹配范围不对"}, {"name": "area_id", "label": "区域号", "default": "0", "required": false, "validate": "", "example": "0 或 0.0.0.1", "type": "string", "description": "OSPF 区域 ID，控制该网段归属哪个 OSPF 区域；骨干区域固定 0.0.0.0，非骨干区域须与骨干直连（或虚链路）；填错邻居起不来、路由学不到"}, {"name": "passive_port", "label": "被动接口", "default": "0/1", "required": false, "validate": "port", "example": "0/1", "type": "string", "description": "OSPF 被动接口（锐捷/中兴写法），同被动接口语义；上联口须 no passive 恢复建邻"}], "notes": "1) 锐捷命令与思科几乎一致，现场可以套思科经验，但保存命令是 write。\n2) network 用反掩码；router-id 建议显式指定，否则取接口地址，链路抖动会重建邻居。\n3) passive-interface 加在业务接入口，能明显减少不必要报文与日志。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:02", "updated_at": "2026-10-09 13:45:53", "exec_level": "", "interactive": 0, "rollback": "! 回退：删除整个 OSPF 进程（进程若预存只是新增 network，则进视图逐条 no network）\nenable\nconfigure terminal\nno router ospf {{process_id}}\nend\nwrite\n! 复核\nshow ip ospf neighbor"}, {"uuid": "f83d46d7-f563-5849-8c0c-8d374ee95ed0", "platform": "network", "device_type": "交换机", "vendor": "ruijie", "os_family": "rgos", "models": "RG-S2910 / S5750 / RSR 系列", "category": "ACL", "title": "配置扩展 ACL 并应用到接口（锐捷 RGOS）", "description": "创建命名扩展 ACL 限制网段互访，并绑定到接口 in 方向。", "commands": "! ===== 扩展 ACL 配置与下发（锐捷 RGOS）=====\nenable\nconfigure terminal\nip access-list extended {{acl_name}}\n permit ip {{src_net}} {{src_wild}} {{dst_net}} {{dst_wild}}\n deny ip any any\n exit\ninterface GigabitEthernet {{port}}\n ip access-group {{acl_name}} in\n exit\nend\nwrite\nshow ip access-lists {{acl_name}}", "params": [{"name": "acl_name", "label": "ACL 名称", "default": "ACL-OFFICE-01", "required": true, "validate": "", "example": "ACL-OFFICE-01", "type": "string", "description": "命名 ACL 的名称，控制哪些流量放行/拒绝；名称区分大小写；ip access-group 应用到接口方向后立即生效，配错可能当场切断管理流量"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "src_wild", "label": "源反掩码", "default": "0.0.0.255", "required": true, "validate": "masklen", "example": "0.0.0.255", "type": "string", "description": "源网段反掩码（wildcard mask），0 位精确匹配、1 位任意；与掩码写法相反（0.0.0.255 对应 /24）"}, {"name": "dst_net", "label": "目的网段", "default": "10.10.0.0", "required": true, "validate": "ipv4", "example": "10.10.0.0", "type": "ip", "description": "目的网段（ACL/防火墙策略匹配字段），0.0.0.0/0 表示任意目的；与反掩码/前缀长度配套使用；范围写宽会扩大放行面"}, {"name": "dst_wild", "label": "目的反掩码", "default": "0.0.255.255", "required": true, "validate": "masklen", "example": "0.0.255.255", "type": "string", "description": "目的网段反掩码（wildcard mask），0 位精确匹配、1 位任意；与子网掩码写法相反（0.0.0.255 对应 /24），写错匹配范围全错"}, {"name": "port", "label": "应用端口", "default": "0/1", "required": true, "validate": "port", "example": "0/1", "type": "string", "description": "接口名/接口编号，进入该接口视图后所做的配置只作用于这一个口；先 show/display 确认接口存在与状态——进错接口改配置是现场常见事故"}], "notes": "1) 锐捷 ACL 语法与思科高度一致（含隐含 deny any any），但部分版本不支持 log 关键字。\n2) in/out 是相对本设备的方向，别把出方向当入方向配。\n3) 改完用 show ip access-lists 看命中计数验证是否生效。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:02", "updated_at": "2026-10-09 13:45:53", "exec_level": "", "interactive": 0, "rollback": "! 回退：先解接口引用，再删 ACL 本体\nenable\nconfigure terminal\ninterface GigabitEthernet {{port}}\n no ip access-group {{acl_name}} in\n exit\nno ip access-list extended {{acl_name}}\nend\nwrite\n! 复核\nshow ip access-lists"}, {"uuid": "f3509a0e-7e27-55cb-bc65-94e7c5d38bb0", "platform": "network", "device_type": "路由器", "vendor": "ruijie", "os_family": "rgos", "models": "RG-RSR 系列（NAT 网关型号）", "category": "NAT", "title": "配置 NAT 地址转换（PAT 复用 / 静态映射）", "description": "内网网段通过出接口地址做端口复用，并给出服务器静态映射写法。", "commands": "! ===== NAT / PAT 配置（锐捷 RGOS）=====\nenable\nconfigure terminal\ninterface GigabitEthernet {{inside_port}}\n ip address {{inside_ip}} {{inside_mask}}\n ip nat inside\n exit\ninterface GigabitEthernet {{outside_port}}\n ip address {{outside_ip}} {{outside_mask}}\n ip nat outside\n exit\naccess-list {{acl_number}} permit {{src_net}} {{src_wild}}\nip nat inside source list {{acl_number}} interface GigabitEthernet {{outside_port}} overload\n! 静态一对一映射\nip nat inside source static {{inside_server}} {{public_ip}}\nend\nwrite\nshow ip nat translations", "params": [{"name": "inside_port", "label": "内网口", "default": "0/0", "required": true, "validate": "port", "example": "0/0", "type": "string", "description": "内网侧接口名或映射端口号，DNAT 流量的内部接收方向；写错映射不生效"}, {"name": "inside_ip", "label": "内网口 IP", "default": "192.168.1.1", "r
