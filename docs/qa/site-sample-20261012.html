equired": true, "validate": "ipv4", "example": "192.168.1.1", "type": "ip", "description": "NAT 映射的内网真实 IP（被发布服务器的地址），DNAT 后流量的真正去向；填错把外部流量引到错误主机"}, {"name": "inside_mask", "label": "内网口掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "内网接口的子网掩码，决定 inside 接口网段范围；须与内网地址规划一致"}, {"name": "outside_port", "label": "外网口", "default": "0/1", "required": true, "validate": "port", "example": "0/1", "type": "string", "description": "外网侧接口名，NAT outside 方向的接口绑定；内外口方向标反 NAT 完全不生效"}, {"name": "outside_ip", "label": "外网口 IP", "default": "200.1.1.2", "required": true, "validate": "ipv4", "example": "200.1.1.2", "type": "ip", "description": "外网口 IP，NAT 转换后对外呈现的地址所在接口；须与上联网段规划一致且未被占用"}, {"name": "outside_mask", "label": "外网口掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "外网口子网掩码，与 outside_ip 配套"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "src_wild", "label": "源反掩码", "default": "0.0.0.255", "required": true, "validate": "masklen", "example": "0.0.0.255", "type": "string", "description": "源网段反掩码（wildcard mask），0 位精确匹配、1 位任意；与掩码写法相反（0.0.0.255 对应 /24）"}, {"name": "acl_number", "label": "ACL 编号", "default": "1", "required": true, "validate": "int:1-199", "example": "1-99", "type": "int", "range": "1-199", "description": "ACL 编号，标识一条访问控制列表；Cisco 1-99 为标准 IP ACL、100-199 为扩展 IP ACL，华为/H3C 段位含义类似；改动后立即影响命中流量，nat outbound 等引用处需同步核对"}, {"name": "inside_server", "label": "内网服务器", "default": "192.168.1.100", "required": false, "validate": "ipv4", "example": "192.168.1.100", "type": "ip", "description": "内网服务器真实 IP（NAT 发布的后端），对外映射的源地址；该主机须可达且服务在监听，否则映射是『空转』"}, {"name": "public_ip", "label": "公网映射 IP", "default": "200.1.1.3", "required": false, "validate": "ipv4", "example": "200.1.1.3", "type": "ip", "description": "对外发布的公网/映射 IP，NAT 后外部访问的地址；须在上联口网段内且未被占用，冲突会绑定失败"}], "notes": "1) 只有带 NAT 功能的锐捷路由器/网关型号支持，纯交换型号没有 nat 命令。\n2) inside/outside 标错接口是最常见故障，先用 show ip nat statistics 看是否命中。\n3) 端口映射（入方向 PAT）各版本写法有差异，上机前先用 ? 查看当前版本支持的命令形式。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:02", "updated_at": "2026-10-09 13:45:54", "exec_level": "", "interactive": 0, "rollback": "! 回退：按创建逆序撤销 NAT（接口 IP 若为既有配置勿动 IP 行，只撤 NAT 标记）\nenable\nconfigure terminal\nno ip nat inside source static {{inside_server}} {{public_ip}}\nno ip nat inside source list {{acl_number}} interface GigabitEthernet {{outside_port}} overload\nno access-list {{acl_number}}\ninterface GigabitEthernet {{inside_port}}\n no ip nat inside\n exit\ninterface GigabitEthernet {{outside_port}}\n no ip nat outside\n exit\nend\nwrite\n! 复核\nshow ip nat translations"}, {"uuid": "294982b2-6cad-5377-87ff-033423a38030", "platform": "network", "device_type": "交换机", "vendor": "ruijie", "os_family": "rgos", "models": "RG-S2910 / S5750", "category": "SSH管理", "title": "开启 SSH 并创建本地用户（锐捷 RGOS）", "description": "配置域名、生成 RSA 密钥、创建特权 15 用户并限制 vty 只用 SSH。", "commands": "! ===== 开启 SSH + 本地用户（锐捷 RGOS）=====\nenable\nconfigure terminal\nhostname {{hostname}}\nip domain-name {{domain}}\nusername {{username}} privilege 15 password {{password}}\ncrypto key generate rsa\n! 提示输入密钥模数，建议 2048\nip ssh version 2\nline vty 0 4\n login local\n transport input ssh\n exec-timeout {{timeout_min}} 0\n exit\nend\nwrite\nshow ip ssh", "params": [{"name": "hostname", "label": "设备名", "default": "SW-CORE-01", "required": false, "validate": "", "example": "SW-CORE-01", "type": "string", "description": "设备主机名，标识作用不影响转发；修改后提示符与日志来源同步变化，网管侧如按主机名建资产需同步更新"}, {"name": "domain", "label": "域名", "default": "corp.local", "required": true, "validate": "", "example": "corp.local", "type": "string", "description": "设备域名后缀（ip domain-name / domain-name），用于 DNS 解析补全与 SSH RSA 密钥生成；改后提示符与解析习惯同步变化"}, {"name": "username", "label": "用户名", "default": "netadmin", "required": true, "validate": "", "example": "netadmin", "type": "string", "description": "登录账号名，认证身份标识；按人名/工号命名便于审计追责，禁用共享账号"}, {"name": "password", "label": "密码", "default": "", "required": true, "validate": "", "example": "现场生成：>=12位，含大小写/数字/符号", "type": "string", "description": "账号登录口令，认证凭据；配置中可能明文/弱加密存储，导出配置时必须脱敏；遵循强口令并定期轮换"}, {"name": "timeout_min", "label": "超时分钟数", "default": "10", "required": false, "validate": "int:0-35791", "example": "10", "type": "int", "range": "0-35791", "description": "登录空闲超时（分钟），无操作自动登出；现场建议 10-30 分钟；设太短频繁重登影响效率，太长有被冒用风险"}], "notes": "1) 必须先配 hostname 和 ip domain-name，再生成 RSA 密钥。\n2) 部分版本的 crypto key generate rsa 不接受 modulus 参数，会直接提示输入位数，按提示录入即可。\n3) transport input ssh 会关掉 Telnet，务必留一个已连通的 SSH 会话再执行。\n4) ★ 口令必须现场生成随机强口令，禁止沿用任何示例值；渲染对话框未填口令会标红并阻止生成。\n", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:02", "updated_at": "2026-10-09 13:45:54", "exec_level": "", "interactive": 0, "rollback": "! 回退：恢复 vty 旧认证方式并删除本地用户（hostname/domain 旧值按变更记录恢复；\n! RSA 密钥保留——删除会断掉依赖它的 SSH 会话）\nenable\nconfigure terminal\nno username {{username}}\nline vty 0 4\n no login local\n no transport input ssh\n no exec-timeout\n exit\nend\nwrite\n! 复核\nshow ip ssh"}, {"uuid": "f4066cd1-f4ee-5a1a-b7d3-d2d39edd624b", "platform": "network", "device_type": "交换机", "vendor": "ruijie", "os_family": "rgos", "models": "RG-S2910 / S5750 / RSR 系列", "category": "密码", "title": "修改 Console 口令与特权密码（锐捷 RGOS）", "description": "设置 console 口令、空闲超时与特权密码。", "commands": "! ===== Console 与特权口令（锐捷 RGOS）=====\nenable\nconfigure terminal\nline console 0\n password {{console_password}}\n login\n logging synchronous\n exec-timeout {{timeout_min}} 0\n exit\nenable secret {{enable_secret}}\nend\nwrite", "params": [{"name": "console_password", "label": "Console 口令", "default": "C0nsole@123", "required": true, "validate": "", "example": "C0nsole@123", "type": "string", "description": "Console 串口登录口令，控制带外接入认证；是网络故障时的最后生命线，遗忘只能走 recovery 流程；配置后立即生效"}, {"name": "enable_secret", "label": "特权密码", "default": "En@ble@12345", "required": true, "validate": "", "example": "En@ble@12345", "type": "string", "description": "特权模式（enable）口令，加密存储于配置；控制进入最高权限级的入口，务必强口令并定期轮换"}, {"name": "timeout_min", "label": "超时分钟数", "default": "10", "required": false, "validate": "int:0-35791", "example": "10", "type": "int", "range": "0-35791", "description": "登录空闲超时（分钟），无操作自动登出；现场建议 10-30 分钟；设太短频繁重登影响效率，太长有被冒用风险"}], "notes": "1) 与思科一样，enable secret 优先于 enable password，且是加密存储，新设备只用 secret。\n2) console 下只写 login 用 line password（权限 1）；要直进特权 15 用 login local + 本地用户。\n3) logging synchronous 防止日志打断命令行输入。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:02", "updated_at": "2026-10-09 13:45:54", "exec_level": "", "interactive": 0, "rollback": "! 回退：口令类变更须恢复旧口令（旧值按变更记录回填尖括号处）\nenable\nconfigure terminal\nline console 0\n password <旧console口令>\n no logging synchronous\n no exec-timeout\n exit\nenable secret <旧特权口令>\nend\nwrite"}, {"uuid": "7d2f4189-56c9-5318-9860-b00f9386d016", "platform": "network", "device_type": "交换机", "vendor": "ruijie", "os_family": "rgos", "models": "RG-S2910 / S5750 / RSR 系列", "category": "SNMP", "title": "配置 SNMP v2c 与 Trap 上报（锐捷 RGOS）", "description": "配置只读/读写团体字、设备位置联系人，并把 Trap 上报到网管。", "commands": "! ===== SNMP 配置（锐捷 RGOS）=====\nenable\nconfigure terminal\nsnmp-server community {{ro_community}} ro\nsnmp-server community {{rw_community}} rw\nsnmp-server location {{location}}\nsnmp-server contact {{contact}}\nsnmp-server host {{nms_ip}} version 2c {{ro_community}}\nsnmp-server enable traps\nend\nwrite\nshow snmp community", "params": [{"name": "ro_community", "label": "只读团体字", "default": "RO@Public1", "required": true, "validate": "", "example": "RO@Public1", "type": "string", "description": "SNMP 只读团体字，等同口令——网管凭它采集设备数据；禁用 public 等弱值并限定来源；只读为主，写权限单独管理"}, {"name": "rw_community", "label": "读写团体字", "default": "RW@Public1", "required": true, "validate": "", "example": "RW@Public1", "type": "string", "description": "SNMP 读写团体字——持有即可远程修改设备配置，权限极高；仅必要时配置，务必限定来源网段并使用强值"}, {"name": "location", "label": "设备位置", "default": "IDC-A-机柜12", "required": false, "validate": "", "example": "IDC-A-机柜12", "type": "string", "description": "SNMP 系统位置（sysLocation）字段，标明设备物理位置（机房/机柜/U 位），告警现场定位依据；纯展示不影响功能"}, {"name": "contact", "label": "联系人", "default": "网络运维组", "required": false, "validate": "", "example": "网络运维组", "type": "string", "description": "SNMP 系统联系人（sysContact）字段，网管告警时定位责任人的依据；纯展示不影响功能"}, {"name": "nms_ip", "label": "网管服务器 IP", "default": "10.0.0.100", "required": true, "validate": "ipv4", "example": "10.0.0.100", "type": "ip", "description": "网管服务器（SNMP 采集/trap 接收）IP，设备向其发送告警并接受查询；填错网管侧收不到任何数据，等于监控失明"}], "notes": "1) 锐捷的 ro/rw 关键字会原样存储（不做大小写转换），大小写写错会导致权限不符预期。\n2) 只用采集时给 ro 即可；rw 有被下发配置的风险，用完及时删除。\n3) 部分版本 snmp-server host 需要显式加 traps 关键字，报错时按 ? 提示调整。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:03", "updated_at": "2026-10-09 13:45:54", "exec_level": "", "interactive": 0, "rollback": "! 回退：删除本变更新增的 SNMP 配置（location/contact 旧值按变更记录恢复）\nenable\nconfigure terminal\nno snmp-server host {{nms_ip}} version 2c {{ro_community}}\nno snmp-server community {{ro_community}} ro\nno snmp-server community {{rw_community}} rw\nno snmp-server location\nno snmp-server contact\nno snmp-server enable traps\nend\nwrite\n! 复核\nshow snmp community"}, {"uuid": "8e954d9d-a0de-52d3-986a-ce93474207ef", "platform": "network", "device_type": "交换机", "vendor": "ruijie", "os_family": "rgos", "models": "RG-S2910 / S5750 / RSR 系列", "category": "保存配置", "title": "保存配置并备份到本地 flash", "description": "用 write 保存运行配置，并复制一份到 flash 作为回滚点。", "commands": "! ===== 保存与本地备份（锐捷 RGOS）=====\nenable\nwrite\nshow startup-config\ndir flash:/\ncopy running-config flash:backup-{{backup_tag}}.cfg\ndir flash:/", "params": [{"name": "backup_tag", "label": "备份标记", "default": "20260920", "required": false, "validate": "", "example": "20260920 或变更单号", "type": "string", "description": "备份文件版本标签，拼进备份文件名（如 backup-20260930-pre-upgrade.cfg）便于追溯；建议用『日期-动作』格式，回滚时按标签定位对应版本"}], "notes": "1) 锐捷保存用 write（部分版本有 write memory 等价形式），执行后用 show startup-config 核对。\n2) 隔离网络不要用 TFTP 方式备份，直接存 flash: 最稳。\n3) 备份文件带日期或变更单号，多版本并存才好回滚。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:03", "updated_at": "2026-10-09 13:45:54", "exec_level": "", "interactive": 0, "rollback": "! 回退：本条目仅保存与备份配置，不改变网络行为，无需配置回退；\n! 如需清理本次备份文件（delete 需交互确认）\nenable\ndelete flash:backup-{{backup_tag}}.cfg\ndir flash:/"}, {"uuid": "7e979831-9ef6-5df8-8df7-f1f4160d3a86", "platform": "network", "device_type": "防火墙", "vendor": "sangfor", "os_family": "sangfor_af", "models": "AF-1000 / AF-2000 / AF-8000 系列", "category": "VLAN", "title": "创建 VLAN 子接口（Web 控制台）", "description": "在物理口上创建 VLAN 子接口并配 IP、划入区域，用于多网段接入。", "commands": "# 【重要】深信服 AF 的策略类配置以 Web 控制台为主，命令行仅开放少量系统级命令。\n# 本条目给出的是【Web 控制台操作路径 + 界面字段取值建议】，\n# ★ 请勿直接粘贴到 Xshell 执行 ★  仅作现场对照操作与变更记录使用。\n# 若设备型号确实开放了 CLI，请先用 ? 查看当前版本支持的命令再操作。\n\n# ===== Web 控制台操作路径 =====\n# 【路径】网络 → 接口/区域 → 选择物理接口 → 新增 → 子接口(VLAN)\n#   子接口名称：{{sub_if_name}}\n#   父接口    ：{{parent_port}}\n#   VLAN ID   ：{{vlan_id}}\n#   IP 地址   ：{{vlan_ip}}\n#   子网掩码  ：{{vlan_mask}}\n#   所属区域  ：{{zone_name}}（内网/外网/DMZ）\n#   管理方式  ：勾选 HTTPS、Ping（按需勾选 SSH）\n#   → 保存后确认接口状态为「已连接」\n#\n# 【验证】网络 → 接口/区域 列表查看该子接口状态与 IP\n#         诊断工具 → Ping 测试（源接口选该子接口）", "params": [{"name": "sub_if_name", "label": "子接口名称", "default": "VLAN10-OFFICE", "required": true, "validate": "", "example": "VLAN10-OFFICE", "type": "string", "description": "子接口名称（ethX.VLAN 形式），VLAN 三层终结点；Web 控制台配置项，须与交换机侧 Trunk 放行对应"}, {"name": "parent_port", "label": "父接口", "default": "eth2", "required": true, "validate": "", "example": "eth2", "type": "string", "description": "VLAN 子接口的父物理口，子接口流量承载在其上；父口 down 则其下所有子接口全部 down"}, {"name": "vlan_id", "label": "VLAN ID", "default": "10", "required": true, "validate": "vlan", "example": "10", "type": "string", "description": "VLAN 编号，二层广播域标识；有效范围 1-4094（1 为默认 VLAN、1002-1005 系统保留）；Trunk 两端放行列表与 PVID 必须配套，改错会隔离业务"}, {"name": "vlan_ip", "label": "接口 IP", "default": "192.168.10.1", "required": true, "validate": "ipv4", "example": "192.168.10.1", "type": "ip", "description": "VLAN 子接口/网关 IP，该网段终端的默认网关；须与终端同网段；改网关地址需同步终端配置"}, {"name": "vlan_mask", "label": "子网掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "VLAN 子接口的子网掩码，与 vlan_ip 配套决定网段大小"}, {"name": "zone_name", "label": "所属区域", "default": "内网区域", "required": false, "validate": "", "example": "内网区域 / 外网区域 / DMZ", "type": "string", "description": "安全区域名（trust/untrust/dmz），接口的 zone 归属决定策略方向匹配；接口须先加入 zone 才能被策略引用"}], "notes": "1) AF 的 VLAN 是\"物理口上的子接口\"，父接口的 IP 若已被占用需先处理，否则子接口起不来。\n2) 区域（内网/外网/DMZ）决定策略方向，配错区域会出现\"策略写了不通\"。\n3) 接口的\"管理方式\"要按需勾选 HTTPS/Ping/SSH，勾多了等于扩大攻击面，按最小化原则勾。\n4) ★ 本条是界面操作路径，不是可直接粘贴执行的命令。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:03", "updated_at": "2026-10-09 13:45:55", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "5725af8f-d266-5551-8789-380343295b9f", "platform": "network", "device_type": "防火墙", "vendor": "sangfor", "os_family": "sangfor_af", "models": "AF-2000 / AF-8000 系列（多口型号）", "category": "Trunk", "title": "配置 Trunk 链路聚合上联（Web 控制台）", "description": "把多个物理口聚合成一个逻辑口用于上联，配合对端做链路捆绑。", "commands": "# 【重要】深信服 AF 的策略类配置以 Web 控制台为主，命令行仅开放少量系统级命令。\n# 本条目给出的是【Web 控制台操作路径 + 界面字段取值建议】，\n# ★ 请勿直接粘贴到 Xshell 执行 ★  仅作现场对照操作与变更记录使用。\n# 若设备型号确实开放了 CLI，请先用 ? 查看当前版本支持的命令再操作。\n\n# ===== Web 控制台操作路径 =====\n# 【路径】网络 → 接口/区域 → 新增 → 聚合接口（或\"接口聚合\"）\n#   聚合口名称：{{agg_name}}\n#   成员接口  ：{{member_ports}}\n#   工作模式  ：{{lacp_mode}}（静态聚合 / 动态 LACP，需与对端一致）\n#   IP 地址   ：{{agg_ip}}\n#   子网掩码  ：{{agg_mask}}\n#   所属区域  ：{{zone_name}}\n#   → 保存后确认成员口全部 UP，聚合口状态为「已连接」\n#\n# 【验证】网络 → 接口/区域 查看聚合口与成员口状态", "params": [{"name": "agg_name", "label": "聚合口名称", "default": "AGG-WAN", "required": true, "validate": "", "example": "AGG-WAN", "type": "string", "description": "聚合接口名称（如 agg1 / link-aggregation1），标识一条聚合链路；须与对端聚合组一一对应；重命名/删除会断开现有聚合"}, {"name": "member_ports", "label": "成员接口", "default": "eth1、eth2", "required": true, "validate": "", "example": "eth1、eth2", "type": "string", "description": "聚合组成员口列表（空格分隔多个），一次纳入聚合的物理口集合；成员口状态/速率须一致，异常成员不参与转发"}, {"name": "lacp_mode", "label": "工作模式", "default": "动态 LACP", "required": false, "validate": "enum:静态聚合|动态 LACP", "example": "动态 LACP", "type": "enum", "choices": ["静态聚合", "动态 LACP"], "description": "聚合工作模式（static 静态聚合 / lacp 动态协商），必须与对端设备一致——一端静态一端 LACP 链路起不来"}, {"name": "agg_ip", "label": "IP 地址", "default": "200.1.1.2", "required": true, "validate": "ipv4", "example": "200.1.1.2", "type": "ip", "description": "链路聚合口的三层 IP 地址，作为该聚合链路的本端地址；须与对端同网段；配错聚合链路不通，业务随之中断"}, {"name": "agg_mask", "label": "子网掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "聚合口 IP 的子网掩码，决定聚合口所属网段范围；须与对端一致，配错引发路由不可达"}, {"name": "zone_name", "label": "所属区域", "default": "外网区域", "required": false, "validate": "", "example": "外网区域", "type": "string", "description": "安全区域名（trust/untrust/dmz），接口的 zone 归属决定策略方向匹配；接口须先加入 zone 才能被策略引用"}], "notes": "1) 聚合模式必须与对端交换机一致：对端配 LACP（active）则本端选动态，否则用静态聚合。\n2) 成员口加入聚合后会继承聚合口配置，原成员口上的 IP 会失效，规划要提前做。\n3) 上联核心交换机做双链路时，注意两端都要做聚合，单端做会出现环路或断流。\n4) ★ 本条是界面操作路径，不是可直接粘贴执行的命令。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:03", "updated_at": "2026-10-09 13:45:55", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "949bc517-781f-54fa-a8c0-aaeda5757c3f", "platform": "network", "device_type": "防火墙", "vendor": "sangfor", "os_family": "sangfor_af", "models": "AF 全系列", "category": "静态路由", "title": "配置静态路由与默认路由（Web 控制台）", "description": "新增明细路由与默认路由，指定网关与出接口。", "commands": "# 【重要】深信服 AF 的策略类配置以 Web 控制台为主，命令行仅开放少量系统级命令。\n# 本条目给出的是【Web 控制台操作路径 + 界面字段取值建议】，\n# ★ 请勿直接粘贴到 Xshell 执行 ★  仅作现场对照操作与变更记录使用。\n# 若设备型号确实开放了 CLI，请先用 ? 查看当前版本支持的命令再操作。\n\n# ===== Web 控制台操作路径 =====\n# 【路径】网络 → 路由 → 静态路由 → 新增\n#   目的网段  ：{{dest_net}}\n#   子网掩码  ：{{dest_mask}}\n#   网关/下一跳：{{next_hop}}\n#   出接口    ：{{out_interface}}\n#   优先级    ：{{priority}}（数值越小越优先）\n#   描述      ：{{comment}}\n#   → 默认路由填 目的网段 0.0.0.0 / 掩码 0.0.0.0 / 下一跳为运营商网关\n#\n# 【验证】网络 → 路由 → 路由表（查看是否生效）\n#         诊断工具 → Ping / 路由追踪（源接口选对应接口）", "params": [{"name": "dest_net", "label": "目的网段", "default": "192.168.20.0", "required": true, "validate": "ipv4", "example": "192.168.20.0", "type": "ip", "description": "目的网段地址，路由/策略匹配的目标方向；0.0.0.0/0 表示任意目的；方向写反会导致流量走错策略"}, {"name": "dest_mask", "label": "子网掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "目的网段的点分十进制掩码，与 dest_net 配套圈定策略匹配范围；掩码写宽会误匹配其他网段、扩大放行面"}, {"name": "next_hop", "label": "下一跳地址", "default": "10.0.0.2", "required": true, "validate": "ipv4", "example": "10.0.0.2", "type": "ip", "description": "下一跳 IP，路由/策略转发的去向；必须是本机直连可达地址，写错路由成『黑洞』"}, {"name": "out_interface", "label": "出接口", "default": "eth1", "required": true, "validate": "", "example": "eth1", "type": "string", "description": "NAT/策略的出接口名，流量转发的物理出口；必须与真实外网口一致，写错 NAT 不生效"}, {"name": "priority", "label": "优先级", "default": "10", "required": false, "validate": "int:1-255", "example": "越小越优先", "type": "int", "range": "1-255", "description": "路由优先级（深信服/天融信），数值越小越优先；多出口场景主链路设小值，备份链路设大值"}, {"name": "comment", "label": "描述", "default": "to-核心交换机", "required": false, "validate": "", "example": "to-核心交换机", "type": "string", "description": "对象的描述文字，仅运维辨识用途、不参与策略匹配；建议写明用途与申请人"}], "notes": "1) AF 上\"出接口\"与\"网关\"建议都填：只填网关时，出接口链路 down 后路由不会立即失效。\n2) 双出口做备份靠优先级；切换行为受会话保持影响，割接前建议先用诊断工具验证。\n3) 有 NAT 场景时注意：内网出网的路由 + 源地址转换（NAT）是两件事，都要配。\n4) ★ 本条是界面操作路径，不是可直接粘贴执行的命令。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:03", "updated_at": "2026-10-09 13:45:55", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "f62afb7e-9710-582e-832e-65efaeecd1ed", "platform": "network", "device_type": "防火墙", "vendor": "sangfor", "os_family": "sangfor_af", "models": "AF 全系列（支持动态路由的版本）", "category": "OSPF", "title": "配置 OSPF 动态路由（Web 控制台）", "description": "开启 OSPF、指定 router-id 与区域，把接口加入 OSPF 并设置被动接口。", "commands": "# 【重要】深信服 AF 的策略类配置以 Web 控制台为主，命令行仅开放少量系统级命令。\n# 本条目给出的是【Web 控制台操作路径 + 界面字段取值建议】，\n# ★ 请勿直接粘贴到 Xshell 执行 ★  仅作现场对照操作与变更记录使用。\n# 若设备型号确实开放了 CLI，请先用 ? 查看当前版本支持的命令再操作。\n\n# ===== Web 控制台操作路径 =====\n# 【路径】网络 → 路由 → 动态路由 → OSPF → 启用\n#   Router ID ：{{router_id}}\n#   区域 ID   ：{{area_id}}\n#   参与接口  ：{{ospf_interface}}（宣告该接口所在网段）\n#   被动接口  ：{{passive_interface}}（业务接入口设为被动）\n#   认证      ：按需开启（推荐 MD5）\n#   → 保存后查看 OSPF 邻居状态是否为 Full\n#\n# 【验证】网络 → 路由 → 动态路由 → 邻居表 / 路由表", "params": [{"name": "router_id", "label": "Router ID", "default": "8.8.8.8", "required": true, "validate": "ipv4", "example": "8.8.8.8", "type": "ip", "description": "OSPF Router ID（IPv4 格式），区域内唯一标识本路由器；重复会引发邻居震荡与路由抖动，建议用 loopback 接口地址"}, {"name": "area_id", "label": "区域 ID", "default": "0.0.0.0", "required": false, "validate": "", "example": "0.0.0.0", "type": "string", "description": "OSPF 区域 ID，控制该网段归属哪个 OSPF 区域；骨干区域固定 0.0.0.0，非骨干区域须与骨干直连（或虚链路）；填错邻居起不来、路由学不到"}, {"name": "ospf_interface", "label": "参与接口", "default": "eth1", "required": true, "validate": "", "example": "eth1", "type": "string", "description": "参与 OSPF 宣告的接口名，该接口所在网段被通告进 OSPF；Web 控制台配置项，改动后注意邻接关系重建"}, {"name": "passive_interface", "label": "被动接口", "default": "eth2", "required": false, "validate": "", "example": "eth2", "type": "string", "description": "OSPF 被动接口（只宣告网段、不收发 Hello），业务接入口设为被动防止与终端误建邻居关系"}], "notes": "1) 部分 AF 版本默认不开动态路由，需先确认授权/版本是否支持 OSPF。\n2) 邻居起不来先核对：区域 ID、Hello/Dead 定时器、认证方式、MTU（大包丢会卡在 ExStart）。\n3) 业务接入口设为被动接口，避免向终端发 Hello 报文。\n4) ★ 本条是界面操作路径，不是可直接粘贴执行的命令。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:03", "updated_at": "2026-10-09 13:45:55", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "928768c1-2aba-5d17-975a-e105ab99b69a", "platform": "network", "device_type": "防火墙", "vendor": "sangfor", "os_family": "sangfor_af", "models": "AF 全系列", "category": "ACL", "title": "配置 ACL 访问控制策略（Web 控制台）", "description": "用地址对象 + 访问控制策略实现网段互访控制，开启日志便于审计。", "commands": "# 【重要】深信服 AF 的策略类配置以 Web 控制台为主，命令行仅开放少量系统级命令。\n# 本条目给出的是【Web 控制台操作路径 + 界面字段取值建议】，\n# ★ 请勿直接粘贴到 Xshell 执行 ★  仅作现场对照操作与变更记录使用。\n# 若设备型号确实开放了 CLI，请先用 ? 查看当前版本支持的命令再操作。\n\n# ===== Web 控制台操作路径 =====\n# 【第一步】对象 → 地址 → 新增（或\"地址对象\"）\n#   名称：{{src_obj}}    类型：子网   地址：{{src_net}} / {{src_mask}}\n# 【第二步】策略 → 访问控制策略 → 新增\n#   策略名称  ：{{policy_name}}\n#   源区域    ：{{src_zone}}      目的区域：{{dst_zone}}\n#   源地址    ：{{src_obj}}       目的地址：{{dst_obj}}\n#   服务      ：{{service}}（如 HTTP/HTTPS/Any）\n#   动作      ：允许（或拒绝）\n#   日志      ：勾选\"记录日志\"（排障与审计都要）\n#   时间计划  ：全天（或按需）\n#   → 保存后调整策略顺序（自上而下匹配，先匹配生效）\n#\n# 【验证】策略 → 访问控制策略 看命中计数；日志 → 会话日志/策略日志", "params": [{"name": "src_obj", "label": "源地址对象名", "default": "OBJ-OFFICE", "required": true, "validate": "", "example": "OBJ-OFFICE", "type": "string", "description": "源地址对象名（FortiGate/PaloAlto 等），先建对象再被策略引用；修改对象影响所有引用它的策略"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "src_mask", "label": "源掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "源网段点分十进制掩码（FortiGate 子网对象写法），与 src_net 圈定来源范围；写宽扩大放行面"}, {"name": "policy_name", "label": "策略名称", "default": "OFFICE-to-SERVER", "required": true, "validate": "", "example": "OFFICE-to-SERVER", "type": "string", "description": "防火墙策略名称，运维辨识用途；建议『源_到_目的_动作』命名法，策略多了不迷路"}, {"name": "src_zone", "label": "源区域", "default": "内网区域", "required": true, "validate": "", "example": "内网区域", "type": "string", "description": "源安全区域，策略入方向区域匹配；报文入接口必须真属于该 zone；修改后须 commit"}, {"name": "dst_zone", "label": "目的区域", "default": "DMZ", "required": true, "validate": "", "example": "DMZ", "type": "string", "description": "目的安全区域（trust/dmz/untrust），策略的目的方向匹配；报文出接口必须真属于该 zone，否则策略永不命中；改后须 commit"}, {"name": "dst_obj", "label": "目的地址对象", "default": "OBJ-SERVER", "required": true, "validate": "", "example": "OBJ-SERVER", "type": "string", "description": "PaloAlto 目的地址对象名，先建对象再被安全策略引用；修改对象网段会影响所有引用它的策略，改后须 commit"}, {"name": "service", "label": "服务", "default": "HTTPS", "required": false, "validate": "", "example": "HTTP / HTTPS / Any", "type": "string", "description": "策略引用的服务对象名（HTTP/HTTPS/ALL 等），四层端口匹配的集合；可用预定义或自建对象；改对象影响所有引用它的策略"}], "notes": "1) AF 的策略是\"区域对区域 + 地址对象\"，先建对象再写策略，否则下拉框里选不到。\n2) 策略自上而下匹配，先匹配生效；新策略默认加在末尾，改管理类放通策略时要特别小心顺序。\n3) 一定要勾选日志，否则排障时没有任何线索可用。\n4) ★ 本条是界面操作路径，不是可直接粘贴执行的命令。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:03", "updated_at": "2026-10-09 13:45:55", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "77e1fca8-eedd-5ff2-96f2-8c05959c34cb", "platform": "network", "device_type": "防火墙", "vendor": "sangfor", "os_family": "sangfor_af", "models": "AF 全系列", "category": "NAT", "title": "配置 NAT 源地址转换与目的地址映射（Web 控制台）", "description": "内网出网做源 NAT（PAT），服务器对外发布做目的 NAT（端口映射）。", "commands": "# 【重要】深信服 AF 的策略类配置以 Web 控制台为主，命令行仅开放少量系统级命令。\n# 本条目给出的是【Web 控制台操作路径 + 界面字段取值建议】，\n# ★ 请勿直接粘贴到 Xshell 执行 ★  仅作现场对照操作与变更记录使用。\n# 若设备型号确实开放了 CLI，请先用 ? 查看当前版本支持的命令再操作。\n\n# ===== Web 控制台操作路径 =====\n# 【源 NAT】策略 → NAT → 源地址转换 → 新增\n#   名称      ：{{snat_name}}\n#   源区域    ：{{src_zone}}       目的区域：{{dst_zone}}\n#   源地址    ：{{src_net}} / {{src_mask}}\n#   转换方式  ：使用出接口地址（PAT）\n# 【目的 NAT】策略 → NAT → 目的地址转换 → 新增\n#   名称      ：{{dnat_name}}\n#   源区域    ：{{untrust_zone}}   目的区域：{{trust_zone}}\n#   目的地址  ：{{public_ip}}      公网端口：{{public_port}}\n#   转换为    ：{{inside_ip}}      内网端口：{{inside_port}}\n#   → 保存后必须在【访问控制策略】里放行对应流量的① 才真正生效\n#\n# 【验证】日志 → 会话日志（确认转换后的源/目的地址）", "params": [{"name": "snat_name", "label": "SNAT 名称", "default": "SNAT-TO-INTERNET", "required": true, "validate": "", "example": "SNAT-TO-INTERNET", "type": "string", "description": "SNAT 规则名，标识一条源地址转换（内网出去的方向）；修改后须 commit 才生效"}, {"name": "src_zone", "label": "源区域", "default": "内网区域", "required": true, "validate": "", "example": "内网区域", "type": "string", "description": "源安全区域，策略入方向区域匹配；报文入接口必须真属于该 zone；修改后须 commit"}, {"name": "dst_zone", "label": "目的区域", "default": "外网区域", "required": true, "validate": "", "example": "外网区域", "type": "string", "description": "目的安全区域（trust/dmz/untrust），策略的目的方向匹配；报文出接口必须真属于该 zone，否则策略永不命中；改后须 commit"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "src_mask", "label": "源掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "源网段点分十进制掩码（FortiGate 子网对象写法），与 src_net 圈定来源范围；写宽扩大放行面"}, {"name": "dnat_name", "label": "DNAT 名称", "default": "DNAT-WEB-8443", "required": true, "validate": "", "example": "DNAT-WEB-8443", "type": "string", "description": "DNAT/NAT 规则名，标识一条目的地址转换（外部访问内部服务的映射入口）；名称建议带业务语义；修改后须 commit 才生效"}, {"name": "untrust_zone", "label": "外网区域", "default": "外网区域", "required": true, "validate": "", "example": "外网区域", "type": "string", "description": "非受信安全区域名（外网侧），DNAT/策略的来源区域匹配"}, {"name": "trust_zone", "label": "内网区域", "default": "内网区域", "required": true, "validate": "", "example": "内网区域", "type": "string", "description": "受信/目的安全区域名，NAT 与安全策略的区域匹配；与区域规划一致，改后须 commit"}, {"name": "public_ip", "label": "公网 IP", "default": "200.1.1.30", "required": true, "validate": "ipv4", "example": "200.1.1.30", "type": "ip", "description": "对外发布的公网/映射 IP，NAT 后外部访问的地址；须在上联口网段内且未被占用，冲突会绑定失败"}, {"name": "public_port", "label": "公网端口", "default": "8443", "required": true, "validate": "int:1-65535", "example": "8443", "type": "int", "range": "1-65535", "description": "对外映射端口号，DNAT 的外部端口；可与内部端口不同（如 8443→443）；与现有监听冲突会绑定失败"}, {"name": "inside_ip", "label": "内网服务器", "default": "192.168.10.100", "required": true, "validate": "ipv4", "example": "192.168.10.100", "type": "ip", "description": "NAT 映射的内网真实 IP（被发布服务器的地址），DNAT 后流量的真正去向；填错把外部流量引到错误主机"}, {"name": "inside_port", "label": "内网端口", "default": "8443", "required": true, "validate": "int:1-65535", "example": "8443", "type": "int", "range": "1-65535", "description": "内网侧接口名或映射端口号，DNAT 流量的内部接收方向；写错映射不生效"}], "notes": "1) ★ 只配 NAT 不配访问控制策略，流量不会通过 —— 这是深信服 AF 上最常见的\"配了不通\"。\n2) 端口映射的公网端口与内网端口容易写反，配完必须从外部网络实测。\n3) 内网用户通过公网地址访问内部服务器（回环）需要额外配置，属常见坑。\n4) ★ 本条是界面操作路径，不是可直接粘贴执行的命令。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:03", "updated_at": "2026-10-09 13:45:55", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "d988fa9c-1498-5f05-a747-bd61b681c864", "platform": "network", "device_type": "防火墙", "vendor": "sangfor", "os_family": "sangfor_af", "models": "AF 全系列", "category": "SSH管理", "title": "创建 SSH 管理员账号并收紧管理面（Web 控制台）", "description": "新建管理员、按角色授权、限制登录来源 IP，开启登录审计。", "commands": "# 【重要】深信服 AF 的策略类配置以 Web 控制台为主，命令行仅开放少量系统级命令。\n# 本条目给出的是【Web 控制台操作路径 + 界面字段取值建议】，\n# ★ 请勿直接粘贴到 Xshell 执行 ★  仅作现场对照操作与变更记录使用。\n# 若设备型号确实开放了 CLI，请先用 ? 查看当前版本支持的命令再操作。\n\n# ===== Web 控制台操作路径 =====\n# 【路径】系统 → 管理员/权限管理 → 管理员 → 新增\n#   用户名    ：{{username}}\n#   密码      ：{{password}}（首次登录强制修改）\n#   角色      ：{{role}}（超级管理员 / 审计员 / 只读）\n#   允许登录来源：{{trust_ip}} / {{trust_mask}}（★ 建议必填）\n#   允许登录方式：HTTPS、SSH（按需勾选，不用 Telnet）\n#   → 系统 → 管理员 → 登录策略：开启登录失败锁定、会话超时 {{timeout_min}} 分钟\n#\n# 【验证】系统 → 日志 → 管理员登录日志", "params": [{"name": "username", "label": "用户名", "default": "netadmin", "required": true, "validate": "", "example": "netadmin", "type": "string", "description": "登录账号名，认证身份标识；按人名/工号命名便于审计追责，禁用共享账号"}, {"name": "password", "label": "密码", "default": "", "required": true, "validate": "", "example": "现场生成：>=12位，含大小写/数字/符号", "type": "string", "description": "账号登录口令，认证凭据；配置中可能明文/弱加密存储，导出配置时必须脱敏；遵循强口令并定期轮换"}, {"name": "role", "label": "角色", "default": "超级管理员", "required": false, "validate": "enum:超级管理员|审计员|只读用户", "example": "超级管理员", "type": "enum", "choices": ["超级管理员", "审计员", "只读用户"], "description": "管理员角色（超级管理员/审计员/只读），决定账号权限边界；遵循最小权限原则，日常运维勿用超管账号"}, {"name": "trust_ip", "label": "允许登录网段", "default": "10.0.0.0", "required": true, "validate": "ipv4", "example": "10.0.0.0", "type": "ip", "description": "管理面允许登录的来源 IP（trusthost 白名单），限定谁能访问设备管理；改前确认当前管理机 IP 在名单内，否则当场失联"}, {"name": "trust_mask", "label": "网段掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "登录来源 IP 的掩码，与 trust_ip 配套；0.0.0.0 0.0.0.0 等于不限制来源（不建议）"}, {"name": "timeout_min", "label": "超时分钟数", "default": "10", "required": false, "validate": "int:0-35791", "example": "10", "type": "int", "range": "0-35791", "description": "登录空闲超时（分钟），无操作自动登出；现场建议 10-30 分钟；设太短频繁重登影响效率，太长有被冒用风险"}], "notes": "1) 按最小权限建账号：日常查看用只读/审计员，超级管理员只在变更时使用。\n2) 登录来源限制（trusthost）必须配，不配等于管理面暴露给全网。\n3) 等保要求：管理员账户实名、口令复杂度达标、开启登录失败锁定与操作审计。\n4) ★ 本条是界面操作路径，不是可直接粘贴执行的命令。\n5) ★ 口令必须现场生成随机强口令，禁止沿用任何示例值；渲染对话框未填口令会标红并阻止生成。\n", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:03", "updated_at": "2026-10-09 13:45:56", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "95f8f01e-f7ca-5b89-b053-7a89cbaeb700", "platform": "network", "device_type": "防火墙", "vendor": "sangfor", "os_family": "sangfor_af", "models": "AF 全系列", "category": "密码", "title": "修改管理员密码口令与口令策略（Web 控制台）", "description": "修改管理员口令，并配置口令复杂度、有效期与锁定策略。", "commands": "# 【重要】深信服 AF 的策略类配置以 Web 控制台为主，命令行仅开放少量系统级命令。\n# 本条目给出的是【Web 控制台操作路径 + 界面字段取值建议】，\n# ★ 请勿直接粘贴到 Xshell 执行 ★  仅作现场对照操作与变更记录使用。\n# 若设备型号确实开放了 CLI，请先用 ? 查看当前版本支持的命令再操作。\n\n# ===== Web 控制台操作路径 =====\n# 【改口令】系统 → 管理员/权限管理 → 管理员 → 选中账号 → 修改密码\n#   新口令：{{password}}（需满足复杂度策略）\n# 【口令策略】系统 → 管理员 → 口令策略（或\"安全设置\"）\n#   最小长度      ：{{min_len}}\n#   复杂度        ：必须包含数字 + 字母 + 特殊字符\n#   有效期(天)    ：{{change_days}}\n#   历史口令不可重用：{{history}} 次\n#   连续失败锁定  ：{{lock_times}} 次 / 锁定 {{lock_minutes}} 分钟\n#\n# 【console 说明】设备的 console 口（串口）登录同样使用管理员账号口令，\n#   没有独立 console 口令；忘记口令需现场用串口进入恢复流程（联系厂商支持）。", "params": [{"name": "password", "label": "密码", "default": "", "required": true, "validate": "", "example": "现场生成：>=12位，含大小写/数字/符号", "type": "string", "description": "账号登录口令，认证凭据；配置中可能明文/弱加密存储，导出配置时必须脱敏；遵循强口令并定期轮换"}, {"name": "min_len", "label": "口令最小长度", "default": "12", "required": false, "validate": "int:8-32", "example": "建议 12 以上", "type": "int", "range": "8-32", "description": "口令最小长度，常见 8-12 位；配合复杂度策略（数字/特殊字符下限）使用"}, {"name": "change_days", "label": "口令有效期（天）", "default": "90", "required": false, "validate": "int:0-365", "example": "90", "type": "int", "range": "0-365", "description": "口令有效期（天），超过后系统强制改密；常见 90 天；设得过短会逼出弱口令习惯，配合到期提前告警（warning_days）使用"}, {"name": "history", "label": "历史口令记录数", "default": "5", "required": false, "validate": "int:0-20", "example": "5", "type": "int", "range": "0-20", "description": "口令历史记忆次数，禁止与最近 N 次口令重复；常见 5 次；配合有效期使用防止『改回旧口令』绕过轮换"}, {"name": "lock_times", "label": "失败锁定次数", "default": "5", "required": false, "validate": "int:1-20", "example": "5", "type": "int", "range": "1-20", "description": "允许的连续登录失败次数，超过即锁定账号；常见 5 次；设太小易误伤正常运维输入"}, {"name": "lock_minutes", "label": "锁定时长（分钟）", "default": "30", "required": false, "validate": "int:1-1440", "example": "30", "type": "int", "range": "1-1440", "description": "登录连续失败后的锁定时长（分钟），防暴力破解；现场输错触发锁定后该期间无法登录，留 console 兜底"}], "notes": "1) console 与 Web/SSH 共用管理员账号，改口令是全套生效。\n2) 忘记超级管理员口令时只能走串口 + 厂商恢复流程（可能需要重新部署），\n   所以口令一定要纳入密码管理系统并双人保管。\n3) 安全基线：长度 ≥12、复杂度三选三、有效期 ≤90 天、失败锁定 ≤5 次。\n4) ★ 本条是界面操作路径，不是可直接粘贴执行的命令。\n5) ★ 口令必须现场生成随机强口令，禁止沿用任何示例值；渲染对话框未填口令会标红并阻止生成。\n", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:03", "updated_at": "2026-10-09 13:45:56", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "735e25ab-4733-5f80-97da-036e1448649a", "platform": "network", "device_type": "防火墙", "vendor": "sangfor", "os_family": "sangfor_af", "models": "AF 全系列", "category": "SNMP", "title": "配置 SNMP 团体字与 Trap 上报（Web 控制台）", "description": "开启 SNMP、配置只读/读写团体字并限定网管主机，设置 Trap 上报。", "commands": "# 【重要】深信服 AF 的策略类配置以 Web 控制台为主，命令行仅开放少量系统级命令。\n# 本条目给出的是【Web 控制台操作路径 + 界面字段取值建议】，\n# ★ 请勿直接粘贴到 Xshell 执行 ★  仅作现场对照操作与变更记录使用。\n# 若设备型号确实开放了 CLI，请先用 ? 查看当前版本支持的命令再操作。\n\n# ===== Web 控制台操作路径 =====\n# 【路径】系统 → SNMP（或\"网络管理/SNMP 配置\"）\n#   启用 SNMP     ：是\n#   SNMP 版本     ：v2c（优先用 v3）\n#   只读团体字    ：{{ro_community}}\n#   读写团体字    ：{{rw_community}}（不需要下发配置就别开）\n#   允许访问主机  ：{{nms_ip}} / {{nms_mask}}（★ 必填）\n#   Trap 接收地址 ：{{nms_ip}}\n#   设备位置/联系人：{{location}} / {{contact}}\n#   → 保存后从网管平台测试采集\n#\n# 【验证】诊断工具 → 抓包 / 或直接在网管平台看该设备是否在线", "params": [{"name": "ro_community", "label": "只读团体字", "default": "RO@Public1", "required": true, "validate": "", "example": "RO@Public1", "type": "string", "description": "SNMP 只读团体字，等同口令——网管凭它采集设备数据；禁用 public 等弱值并限定来源；只读为主，写权限单独管理"}, {"name": "rw_community", "label": "读写团体字", "default": "RW@Public1", "required": true, "validate": "", "example": "RW@Public1", "type": "string", "description": "SNMP 读写团体字——持有即可远程修改设备配置，权限极高；仅必要时配置，务必限定来源网段并使用强值"}, {"name": "nms_ip", "label": "网管服务器 IP", "default": "10.0.0.100", "required": true, "validate": "ipv4", "example": "10.0.0.100", "type": "ip", "description": "网管服务器（SNMP 采集/trap 接收）IP，设备向其发送告警并接受查询；填错网管侧收不到任何数据，等于监控失明"}, {"name": "nms_mask", "label": "网管掩码", "default": "255.255.255.0", "required": false, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "SNMP 服务允许来源的掩码，与 nms_ip 配套限定采集来源范围；配宽了等于向多余网段开放 SNMP"}, {"name": "location", "label": "设备位置", "default": "IDC-A-机柜12", "required": false, "validate": "", "example": "IDC-A-机柜12", "type": "string", "description": "SNMP 系统位置（sysLocation）字段，标明设备物理位置（机房/机柜/U 位），告警现场定位依据；纯展示不影响功能"}, {"name": "contact", "label": "联系人", "default": "网络运维组", "required": false, "validate": "", "example": "网络运维组", "type": "string", "description": "SNMP 系统联系人（sysContact）字段，网管告警时定位责任人的依据；纯展示不影响功能"}], "notes": "1) 团体字不用 public/private；\"允许访问主机\"必须限定为网管服务器地址。\n2) 只做采集时不要开读写团体字，减少被下发配置的风险。\n3) Trap 报文的源地址通常是管理口地址，注意中间防火墙是否放通 UDP 162。\n4) ★ 本条是界面操作路径，不是可直接粘贴执行的命令。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:03", "updated_at": "2026-10-09 13:45:56", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "dbbc27de-359f-5e60-8f70-da621fd41c71", "platform": "network", "device_type": "防火墙", "vendor": "sangfor", "os_family": "sangfor_af", "models": "AF 全系列", "category": "保存配置", "title": "保存配置：配置备份与恢复（Web 控制台）", "description": "导出配置文件归档，并说明恢复与回滚的注意事项。", "commands": "# 【重要】深信服 AF 的策略类配置以 Web 控制台为主，命令行仅开放少量系统级命令。\n# 本条目给出的是【Web 控制台操作路径 + 界面字段取值建议】，\n# ★ 请勿直接粘贴到 Xshell 执行 ★  仅作现场对照操作与变更记录使用。\n# 若设备型号确实开放了 CLI，请先用 ? 查看当前版本支持的命令再操作。\n\n# ===== Web 控制台操作路径 =====\n# 【备份】系统 → 配置备份/恢复（或\"系统维护 → 备份恢复\"）\n#   备份方式：导出配置文件到本机\n#   文件名  ：AF-EDGE-01-{{backup_tag}}.conf\n#   → 文件存到 U 盘 / 内网文件服务器归档，命名带日期与变更单号\n# 【恢复】同一菜单 → 选择配置文件 → 恢复\n#   ★ 恢复会覆盖当前全部配置，执行前先备份当前的，并确认无人正在操作设备\n# 【重启前】确认配置已保存（AF 多数版本改动即时生效，但仍建议显式备份一次）", "params": [{"name": "backup_tag", "label": "备份标记", "default": "20260920", "required": false, "validate": "", "example": "20260920 或变更单号", "type": "string", "description": "备份文件版本标签，拼进备份文件名（如 backup-20260930-pre-upgrade.cfg）便于追溯；建议用『日期-动作』格式，回滚时按标签定位对应版本"}], "notes": "1) 每次变更前后各导出一次配置，形成\"变更前基线 + 变更后结果\"两份归档。\n2) 恢复配置属于破坏性操作：会覆盖当前全部策略、对象、账号，务必双人确认。\n3) 配置文件可能包含口令密文，归档时注意存放位置与权限（不要放共享盘随意存取）。\n4) ★ 本条是界面操作路径，不是可直接粘贴执行的命令。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:03", "updated_at": "2026-10-09 13:45:56", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "fd9c5add-d84f-5923-8fee-c430aca0b146", "platform": "network", "device_type": "防火墙", "vendor": "sangfor", "os_family": "sangfor_af", "models": "AF-1000 / AF-2000 / AF-8000 系列", "category": "VLAN", "title": "创建 VLAN 子接口（CLI 骨架 + Web 对照）", "description": "在物理口上创建 VLAN 子接口并配 IP；CLI 为通用骨架，Web 路径可直接照做。", "commands": "# ⚠ 待真机核对：本条目为 CLI 骨架 + Web 控制台对照，命令行未在本厂商真机验证过。\n# 核对方法：Console/SSH 登录后先敲 ? 查看当前视图可用命令；\n#          若列表里没有对应命令，直接用下半部分的 Web 控制台路径操作。\n\n# ---- CLI 骨架（关键字待现场用 ? 确认）----\nenable\nconfigure terminal\ninterface eth{{parent_port_no}}.{{vlan_id}}\n ip address {{vlan_ip}} {{vlan_mask}}\n description {{vlan_desc}}\n no shutdown\n exit\nexit\nwrite\nshow interface\nshow running-config\n#\n# ---- Web 控制台路径（可直接照做）----\n# 网络 → 接口/区域 → 选物理接口 → 新增 → 子接口(VLAN)\n#   VLAN ID {{vlan_id}} / IP {{vlan_ip}} / 掩码 {{vlan_mask}} / 所属区域 {{zone_name}}", "params": [{"name": "parent_port_no", "label": "父接口序号", "default": "2", "required": true, "validate": "int:0-63", "example": "物理口 eth2 就填 2", "type": "int", "range": "0-63", "description": "父物理口 eth 编号，子接口 ethX.VLAN 承载其上"}, {"name": "vlan_id", "label": "VLAN ID", "default": "10", "required": true, "validate": "vlan", "example": "10", "type": "string", "description": "VLAN 编号，二层广播域标识；有效范围 1-4094（1 为默认 VLAN、1002-1005 系统保留）；Trunk 两端放行列表与 PVID 必须配套，改错会隔离业务"}, {"name": "vlan_ip", "label": "接口 IP", "default": "192.168.10.1", "required": true, "validate": "ipv4", "example": "192.168.10.1", "type": "ip", "description": "VLAN 子接口/网关 IP，该网段终端的默认网关；须与终端同网段；改网关地址需同步终端配置"}, {"name": "vlan_mask", "label": "子网掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "VLAN 子接口的子网掩码，与 vlan_ip 配套决定网段大小"}, {"name": "vlan_desc", "label": "描述", "default": "VLAN10-OFFICE", "required": false, "validate": "", "example": "VLAN10-OFFICE", "type": "string", "description": "VLAN/子接口的描述文字，运维辨识用途"}, {"name": "zone_name", "label": "所属区域", "default": "内网区域", "required": false, "validate": "", "example": "内网区域 / 外网区域 / DMZ", "type": "string", "description": "安全区域名（trust/untrust/dmz），接口的 zone 归属决定策略方向匹配；接口须先加入 zone 才能被策略引用"}], "notes": "1) ★ 待真机核对：深信服 AF 的策略类配置以 Web 控制台为主，CLI 开放程度有限，\n   上面的命令是通用骨架，**执行前必须先用 ? 确认当前版本是否支持**。\n2) 若 CLI 不支持，直接走 Web 路径（下半部分），这是现场最快的方式。\n3) 子接口的父物理口 IP 若已被占用要先处理；区域（内网/外网/DMZ）决定策略方向，配错会\"策略写了不通\"。\n4) ★ 本条含 shutdown / undo shutdown 类端口操作：对生产端口执行会瞬断链路，请在业务低峰期变更，并确认有带外/备用管理通道再动手。\n", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:03", "updated_at": "2026-10-09 13:45:56", "exec_level": "skeleton", "interactive": 0, "rollback": "# 回退：删除 VLAN 子接口（骨架条目：undo 关键字待真机以 ? 核对；\n# 若已有策略引用该子接口，先在 Web 控制台解除引用）\nenable\nconfigure terminal\ninterface eth{{parent_port_no}}.{{vlan_id}}\n no ip address\n no description\n shutdown\n exit\nno interface eth{{parent_port_no}}.{{vlan_id}}\nexit\nwrite\n# 复核\nshow interface"}, {"uuid": "fe0e1ef5-52d5-5c32-8794-7f9e27bc5a36", "platform": "network", "device_type": "防火墙", "vendor": "sangfor", "os_family": "sangfor_af", "models": "AF 多口型号", "category": "Trunk", "title": "配置链路聚合上联（CLI 骨架 + Web 对照）", "description": "把多个物理口聚合成逻辑口用于上联，模式需与对端交换机一致。", "commands": "# ⚠ 待真机核对：本条目为 CLI 骨架 + Web 控制台对照，命令行未在本厂商真机验证过。\n# 核对方法：Console/SSH 登录后先敲 ? 查看当前视图可用命令；\n#          若列表里没有对应命令，直接用下半部分的 Web 控制台路径操作。\n\n# ---- CLI 骨架（关键字待现场用 ? 确认）----\nenable\nconfigure terminal\ninterface aggregate {{agg_name}}\n member eth{{member1_no}} eth{{member2_no}}\n mode {{lacp_mode}}\n exit\nexit\nwrite\nshow interface aggregate\n#\n# ---- Web 控制台路径（可直接照做）----\n# 网络 → 接口/区域 → 新增 → 聚合接口：名称 {{agg_name}} / 成员 eth1 eth2 / 模式 {{lacp_mode}}\n# 再在聚合口下\"新增子接口(VLAN)\"放通业务 VLAN", "params": [{"name": "agg_name", "label": "聚合口名", "default": "AGG-UPLINK", "required": true, "validate": "", "example": "AGG-UPLINK", "type": "string", "description": "聚合接口名称（如 agg1 / link-aggregation1），标识一条聚合链路；须与对端聚合组一一对应；重命名/删除会断开现有聚合"}, {"name": "member1_no", "label": "成员口1序号", "default": "1", "required": true, "validate": "int:0-63", "example": "eth1 填 1", "type": "int", "range": "0-63", "description": "聚合成员口编号 1（eth 编号），与对端聚合组的端口一一对应；选错口 LACP 协商不起来"}, {"name": "member2_no", "label": "成员口2序号", "default": "2", "required": true, "validate": "int:0-63", "example": "eth2 填 2", "type": "int", "range": "0-63", "description": "聚合成员口编号 2（eth 编号），与对端对应"}, {"name": "lacp_mode", "label": "聚合模式", "default": "lacp", "required": false, "validate": "enum:lacp|static", "example": "lacp / static", "type": "enum", "choices": ["lacp", "static"], "description": "聚合工作模式（static 静态聚合 / lacp 动态协商），必须与对端设备一致——一端静态一端 LACP 链路起不来"}], "notes": "1) ★ 待真机核对：聚合命令关键字各版本差异大，先 ? 确认。\n2) 聚合模式必须与对端交换机一致：对端 LACP 主动就选 lacp，否则用 static。\n3) 成员口加入聚合后会继承聚合口配置，原成员口 IP 失效，规划要提前做。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:03", "updated_at": "2026-10-09 13:45:56", "exec_level": "skeleton", "interactive": 0, "rollback": "# 回退：删除聚合口（成员口回独立状态；骨架语法待真机 ? 核对；\n# ★ 删除前确认无策略/路由引用该聚合口）\nenable\nconfigure terminal\nno interface aggregate {{agg_name}}\nexit\nwrite\n# 复核\nshow interface aggregate"}, {"uuid": "3a88643e-d412-50a7-a7a2-1427f1d523f2", "platform": "network", "device_type": "防火墙", "vendor": "sangfor", "os_family": "sangfor_af", "models": "AF 全系列", "category": "静态路由", "title": "配置静态路由与默认路由（CLI 骨架 + Web 对照）", "description": "新增明细路由与默认路由，指定网关与出接口。", "commands": "# ⚠ 待真机核对：本条目为 CLI 骨架 + Web 控制台对照，命令行未在本厂商真机验证过。\n# 核对方法：Console/SSH 登录后先敲 ? 查看当前视图可用命令；\n#          若列表里没有对应命令，直接用下半部分的 Web 控制台路径操作。\n\n# ---- CLI 骨架（关键字待现场用 ? 确认）----\nenable\nconfigure terminal\nip route {{dest_net}} {{dest_mask}} {{next_hop}}\nip route 0.0.0.0 0.0.0.0 {{next_hop}}\nexit\nwrite\nshow ip route\n#\n# ---- Web 控制台路径（可直接照做）----\n# 网络 → 路由 → 静态路由 → 新增\n#   目的网段 {{dest_net}} / 掩码 {{dest_mask}} / 下一跳 {{next_hop}} / 出接口 eth{{out_no}}", "params": [{"name": "dest_net", "label": "目的网段", "default": "192.168.20.0", "required": true, "validate": "ipv4", "example": "192.168.20.0", "type": "ip", "description": "目的网段地址，路由/策略匹配的目标方向；0.0.0.0/0 表示任意目的；方向写反会导致流量走错策略"}, {"name": "dest_mask", "label": "子网掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "目的网段的点分十进制掩码，与 dest_net 配套圈定策略匹配范围；掩码写宽会误匹配其他网段、扩大放行面"}, {"name": "next_hop", "label": "下一跳地址", "default": "10.0.0.2", "required": true, "validate": "ipv4", "example": "10.0.0.2", "type": "ip", "description": "下一跳 IP，路由/策略转发的去向；必须是本机直连可达地址，写错路由成『黑洞』"}, {"name": "out_no", "label": "出接口序号", "default": "2", "required": false, "validate": "int:0-63", "example": "出接口 eth2 填 2", "type": "int", "range": "0-63", "description": "出接口 eth 编号，静态路由/NAT 的出口指向；编号写错流量走错口（多出口设备尤其注意）"}], "notes": "1) ★ 待真机核对：不同 AF 版本的 ip route 参数顺序可能不同，报错按 ? 调整。\n2) 网关与出接口建议都指定，链路 down 时路由能及时失效。\n3) 有 NAT 的场景，\"路由可达\"与\"地址转换\"是两件事，缺一不通。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:03", "updated_at": "2026-10-09 13:45:56", "exec_level": "skeleton", "interactive": 0, "rollback": "# 回退：逐条删除本变更新增的静态/默认路由（no 前缀骨架语法待真机 ? 核对）\nenable\nconfigure terminal\nno ip route {{dest_net}} {{dest_mask}} {{next_hop}}\nno ip route 0.0.0.0 0.0.0.0 {{next_hop}}\nexit\nwrite\n# 复核\nshow ip route"}, {"uuid": "7523771d-9bbd-5282-a7b6-f059da6b507e", "platform": "network", "device_type": "防火墙", "vendor": "sangfor", "os_family": "sangfor_af", "models": "AF 支持动态路由版本", "category": "OSPF", "title": "配置 OSPF 动态路由（CLI 骨架 + Web 对照）", "description": "开启 OSPF、指定 router-id 与区域，把接口加入 OSPF。", "commands": "# ⚠ 待真机核对：本条目为 CLI 骨架 + Web 控制台对照，命令行未在本厂商真机验证过。\n# 核对方法：Console/SSH 登录后先敲 ? 查看当前视图可用命令；\n#          若列表里没有对应命令，直接用下半部分的 Web 控制台路径操作。\n\n# ---- CLI 骨架（关键字待现场用 ? 确认）----\nenable\nconfigure terminal\nrouter ospf {{process_id}}\n router-id {{router_id}}\n network {{network}} {{wildcard}} area {{area_id}}\n exit\nexit\nwrite\nshow ip ospf neighbor\n#\n# ---- Web 控制台路径（可直接照做）----\n# 网络 → 路由 → 动态路由 → OSPF：Router ID {{router_id}} / 区域 {{area_id}} / 参与接口 eth{{ospf_no}}", "params": [{"name": "process_id", "label": "进程号", "default": "1", "required": true, "validate": "int:1-65535", "example": "1", "type": "int", "range": "1-65535", "description": "OSPF 进程号（仅本机有效），标识一个 OSPF 实例；两端进程号可以不同，但网段/区域/认证必须匹配"}, {"name": "router_id", "label": "Router ID", "default": "8.8.8.8", "required": true, "validate": "ipv4", "example": "8.8.8.8", "type": "ip", "description": "OSPF Router ID（IPv4 格式），区域内唯一标识本路由器；重复会引发邻居震荡与路由抖动，建议用 loopback 接口地址"}, {"name": "area_id", "label": "区域号", "default": "0", "required": false, "validate": "", "example": "0 或 0.0.0.0", "type": "string", "description": "OSPF 区域 ID，控制该网段归属哪个 OSPF 区域；骨干区域固定 0.0.0.0，非骨干区域须与骨干直连（或虚链路）；填错邻居起不来、路由学不到"}, {"name": "network", "label": "宣告网段", "default": "10.0.0.0", "required": true, "validate": "ipv4", "example": "10.0.0.0", "type": "ip", "description": "OSPF 宣告网段，匹配哪些接口参与 OSPF 进程；与 wildcard 配套使用；宣告漏了/错了邻居和路由直接缺失"}, {"name": "wildcard", "label": "反掩码", "default": "0.0.0.255", "required": true, "validate": "masklen", "example": "0.0.0.255", "type": "string", "description": "OSPF/ACL 反掩码（wildcard），0 位精确匹配、1 位任意；0.0.0.255 对应 /24；写错宣告/匹配范围不对"}, {"name": "ospf_no", "label": "参与接口序号", "default": "2", "required": false, "validate": "int:0-63", "example": "eth2 填 2", "type": "int", "range": "0-63", "description": "OSPF 参与接口的 eth 编号（CLI 展示/配置用），与实际物理口对应"}], "notes": "1) ★ 待真机核对：先确认版本/授权支持动态路由（部分中低端型号不开放）。\n2) 邻居卡 ExStart/Exchange 多为 MTU 或认证不匹配；卡 Init 多为单向可达。\n3) 业务接入口建议设为被动/静默，避免向终端发 Hello。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:03", "updated_at": "2026-10-09 13:45:56", "exec_level": "skeleton", "interactive": 0, "rollback": "# 回退：删除整个 OSPF 进程（骨架语法待真机 ? 核对；进程若预存则逐条撤销新增项）\nenable\nconfigure terminal\nno router ospf {{process_id}}\nexit\nwrite\n# 复核\nshow ip ospf neighbor"}, {"uuid": "dc32258c-f7d3-559b-b682-d6ffb5367fba", "platform": "network", "device_type": "防火墙", "vendor": "sangfor", "os_family": "sangfor_af", "models": "AF 全系列", "category": "ACL", "title": "配置访问控制策略（CLI 骨架 + Web 对照）", "description": "用地址对象 + 访问控制策略控制区域间互访，开启日志。", "commands": "# ⚠ 待真机核对：本条目为 CLI 骨架 + Web 控制台对照，命令行未在本厂商真机验证过。\n# 核对方法：Console/SSH 登录后先敲 ? 查看当前视图可用命令；\n#          若列表里没有对应命令，直接用下半部分的 Web 控制台路径操作。\n\n# ---- CLI 骨架（关键字待现场用 ? 确认）----\nenable\nconfigure terminal\naddress-object {{src_obj}} {{src_net}} {{src_mask}}\npolicy name {{policy_name}} from {{src_zone}} to {{dst_zone}}  source {{src_obj}} destination any action permit log enable\nexit\nwrite\nshow policy\n#\n# ---- Web 控制台路径（可直接照做）----\n# 对象 → 地址：新增 {{src_obj}} = {{src_net}} / {{src_mask}}\n# 策略 → 访问控制策略 → 新增：源区域 {{src_zone}} → 目的区域 {{dst_zone}}，\n#   源地址 {{src_obj}}，服务 {{service}}，动作允许，勾选记录日志", "params": [{"name": "src_obj", "label": "源地址对象名", "default": "OBJ-OFFICE", "required": true, "validate": "", "example": "OBJ-OFFICE", "type": "string", "description": "源地址对象名（FortiGate/PaloAlto 等），先建对象再被策略引用；修改对象影响所有引用它的策略"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "src_mask", "label": "源掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "源网段点分十进制掩码（FortiGate 子网对象写法），与 src_net 圈定来源范围；写宽扩大放行面"}, {"name": "policy_name", "label": "策略名", "default": "OFFICE-to-SERVER", "required": true, "validate": "", "example": "OFFICE-to-SERVER", "type": "string", "description": "防火墙策略名称，运维辨识用途；建议『源_到_目的_动作』命名法，策略多了不迷路"}, {"name": "src_zone", "label": "源区域", "default": "内网区域", "required": true, "validate": "", "example": "内网区域", "type": "string", "description": "源安全区域，策略入方向区域匹配；报文入接口必须真属于该 zone；修改后须 commit"}, {"name": "dst_zone", "label": "目的区域", "default": "DMZ", "required": true, "validate": "", "example": "DMZ", "type": "string", "description": "目的安全区域（trust/dmz/untrust），策略的目的方向匹配；报文出接口必须真属于该 zone，否则策略永不命中；改后须 commit"}, {"name": "service", "label": "服务", "default": "HTTPS", "required": false, "validate": "", "example": "HTTP / HTTPS / Any", "type": "string", "description": "策略引用的服务对象名（HTTP/HTTPS/ALL 等），四层端口匹配的集合；可用预定义或自建对象；改对象影响所有引用它的策略"}], "notes": "1) ★ 待真机核对：策略类命令的 CLI 支持情况最少，优先用 Web（下半部分）。\n2) AF 策略是\"区域对区域\"，先建地址对象再写策略，否则下拉框选不到。\n3) 策略自上而下匹配；调整管理类放通策略时注意别把自己挡在外面。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:03", "updated_at": "2026-10-09 13:45:56", "exec_level": "skeleton", "interactive": 0, "rollback": "# 回退：先删策略再删地址对象（骨架语法待真机 ? 核对；Web 侧等价：\n# 策略 → 访问控制策略删除 {{policy_name}}；对象 → 地址删除 {{src_obj}}）\nenable\nconfigure terminal\nno policy name {{policy_name}}\nno address-object {{src_obj}}\nexit\nwrite\n# 复核\nshow policy"}, {"uuid": "a5cf9c48-dc8f-529f-b612-d12c200902b0", "platform": "network", "device_type": "防火墙", "vendor": "sangfor", "os_family": "sangfor_af", "models": "AF 全系列", "category": "NAT", "title": "配置源 NAT 与目的 NAT 映射（CLI 骨架 + Web 对照）", "description": "内网出网做源 NAT（PAT），服务器对外发布做目的 NAT（端口映射）。", "commands": "# ⚠ 待真机核对：本条目为 CLI 骨架 + Web 控制台对照，命令行未在本厂商真机验证过。\n# 核对方法：Console/SSH 登录后先敲 ? 查看当前视图可用命令；\n#          若列表里没有对应命令，直接用下半部分的 Web 控制台路径操作。\n\n# ---- CLI 骨架（关键字待现场用 ? 确认）----\nenable\nconfigure terminal\nnat source {{src_net}} {{src_mask}} outbound-interface eth{{out_no}} mode pat\nnat destination {{public_ip}} {{public_port}} to {{inside_ip}} {{inside_port}} protocol tcp\nexit\nwrite\nshow nat\n#\n# ---- Web 控制台路径（可直接照做）----\n# 策略 → NAT → 源地址转换：源 {{src_net}}/{{src_mask}}，转换方式\"使用出接口地址\"(PAT)\n# 策略 → NAT → 目的地址转换：公网 {{public_ip}}:{{public_port}} → 内网 {{inside_ip}}:{{inside_port}}\n# ★ 之后必须在\"访问控制策略\"里放行对应流量才真正生效", "params": [{"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "src_mask", "label": "源掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "源网段点分十进制掩码（FortiGate 子网对象写法），与 src_net 圈定来源范围；写宽扩大放行面"}, {"name": "out_no", "label": "出接口序号", "default": "1", "required": false, "validate": "int:0-63", "example": "eth1 填 1", "type": "int", "range": "0-63", "description": "出接口 eth 编号，静态路由/NAT 的出口指向；编号写错流量走错口（多出口设备尤其注意）"}, {"name": "public_ip", "label": "公网 IP", "default": "200.1.1.30", "required": true, "validate": "ipv4", "example": "200.1.1.30", "type": "ip", "description": "对外发布的公网/映射 IP，NAT 后外部访问的地址；须在上联口网段内且未被占用，冲突会绑定失败"}, {"name": "public_port", "label": "公网端口", "default": "8443", "required": true, "validate": "int:1-65535", "example": "8443", "type": "int", "range": "1-65535", "description": "对外映射端口号，DNAT 的外部端口；可与内部端口不同（如 8443→443）；与现有监听冲突会绑定失败"}, {"name": "inside_ip", "label": "内网服务器", "default": "192.168.10.100", "required": true, "validate": "ipv4", "example": "192.168.10.100", "type": "ip", "description": "NAT 映射的内网真实 IP（被发布服务器的地址），DNAT 后流量的真正去向；填错把外部流量引到错误主机"}, {"name": "inside_port", "label": "内网端口", "default": "8443", "required": true, "validate": "int:1-65535", "example": "8443", "type": "int", "range": "1-65535", "description": "内网侧接口名或映射端口号，DNAT 流量的内部接收方向；写错映射不生效"}], "notes": "1) ★ 待真机核对：NAT 命令关键字各版本差异大，务必先 ? 确认或用 Web。\n2) ★ 只配 NAT 不配访问控制策略，流量不会通过 —— 这是 AF 上最常见的\"配了不通\"。\n3) 端口映射的公网/内网端口别写反，配完必须从外部实测。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:03", "updated_at": "2026-10-09 13:45:57", "exec_level": "skeleton", "interactive": 0, "rollback": "# 回退：删除 NAT 规则（骨架语法待真机 ? 核对；Web 侧等价：\n# 策略 → NAT 删除对应源/目的转换条目）\nenable\nconfigure terminal\nno nat source {{src_net}} {{src_mask}} outbound-interface eth{{out_no}} mode pat\nno nat destination {{public_ip}} {{public_port}} to {{inside_ip}} {{inside_port}} protocol tcp\nexit\nwrite\n# 复核\nshow nat"}, {"uuid": "7a83cce4-1ca0-5f52-add6-16646c5b1ef8", "platform": "network", "device_type": "防火墙", "vendor": "sangfor", "os_family": "sangfor_af", "models": "AF 全系列", "category": "SSH管理", "title": "创建管理员并限制登录来源（CLI 骨架 + Web 对照）", "description": "新建管理员账号、分配角色并限定登录来源 IP。", "commands": "# ⚠ 待真机核对：本条目为 CLI 骨架 + Web 控制台对照，命令行未在本厂商真机验证过。\n# 核对方法：Console/SSH 登录后先敲 ? 查看当前视图可用命令；\n#          若列表里没有对应命令，直接用下半部分的 Web 控制台路径操作。\n\n# ---- CLI 骨架（关键字待现场用 ? 确认）----\nenable\nconfigure terminal\nadmin user {{username}} password {{password}} role {{role}} trusthost {{trust_ip}} {{trust_mask}}\nexit\nwrite\nshow admin user\n#\n# ---- Web 控制台路径（可直接照做）----\n# 系统 → 管理员/权限管理 → 新增：用户名 {{username}}，角色 {{role}}，\n#   允许登录来源 {{trust_ip}} / {{trust_mask}}，允许方式 HTTPS + SSH（不用 Telnet）", "params": [{"name": "username", "label": "用户名", "default": "netadmin", "required": true, "validate": "", "example": "netadmin", "type": "string", "description": "登录账号名，认证身份标识；按人名/工号命名便于审计追责，禁用共享账号"}, {"name": "password", "label": "密码", "default": "", "required": true, "validate": "", "example": "现场生成：>=12位，含大小写/数字/符号", "type": "string", "description": "账号登录口令，认证凭据；配置中可能明文/弱加密存储，导出配置时必须脱敏；遵循强口令并定期轮换"}, {"name": "role", "label": "角色", "default": "administrator", "required": false, "validate": "enum:administrator|auditor|readonly", "example": "administrator / auditor / readonly", "type": "enum", "choices": ["administrator", "auditor", "readonly"], "description": "管理员角色（超级管理员/审计员/只读），决定账号权限边界；遵循最小权限原则，日常运维勿用超管账号"}, {"name": "trust_ip", "label": "允许登录网段", "default": "10.0.0.0", "required": true, "validate": "ipv4", "example": "10.0.0.0", "type": "ip", "description": "管理面允许登录的来源 IP（trusthost 白名单），限定谁能访问设备管理；改前确认当前管理机 IP 在名单内，否则当场失联"}, {"name": "trust_mask", "label": "网段掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "登录来源 IP 的掩码，与 trust_ip 配套；0.0.0.0 0.0.0.0 等于不限制来源（不建议）"}], "notes": "1) ★ 待真机核对：管理员相关命令优先走 Web（下半部分），CLI 支持有限。\n2) 登录来源限制（trusthost）必须配，不配等于管理面暴露给全网。\n3) 按角色分权：日常监控用只读/审计，超级管理员只在变更时使用。\n4) ★ 口令必须现场生成随机强口令，禁止沿用任何示例值；渲染对话框未填口令会标红并阻止生成。\n", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:03", "updated_at": "2026-10-09 13:45:57", "exec_level": "skeleton", "interactive": 0, "rollback": "# 回退：删除本变更新建管理员（骨架语法待真机 ? 核对；★ 删除当前登录账号前\n# 先用其他管理员登录；Web 侧等价：系统 → 管理员/权限管理 删除 {{username}}）\nenable\nconfigure terminal\nno admin user {{username}}\nexit\nwrite\n# 复核\nshow admin user"}, {"uuid": "c010213b-00d1-5868-91d1-8736a8b14961", "platform": "network", "device_type": "防火墙", "vendor": "sangfor", "os_family": "sangfor_af", "models": "AF 全系列", "category": "密码", "title": "修改管理员密码与口令策略（CLI 骨架 + Web 对照）", "description": "修改管理员密码，并配置口令复杂度与有效期。", "commands": "# ⚠ 待真机核对：本条目为 CLI 骨架 + Web 控制台对照，命令行未在本厂商真机验证过。\n# 核对方法：Console/SSH 登录后先敲 ? 查看当前视图可用命令；\n#          若列表里没有对应命令，直接用下半部分的 Web 控制台路径操作。\n\n# ---- CLI 骨架（关键字待现场用 ? 确认）----\nenable\nconfigure terminal\nadmin user {{username}} password {{password}}\nexit\nwrite\n#\n# ---- Web 控制台路径（可直接照做）----\n# 系统 → 管理员/权限管理 → 选中账号 → 修改密码：{{password}}\n# 系统 → 安全设置：最小长度 {{min_len}} / 有效期 {{change_days}} 天 / 失败锁定 {{lock_times}} 次", "params": [{"name": "username", "label": "用户名", "default": "netadmin", "required": true, "validate": "", "example": "netadmin", "type": "string", "description": "登录账号名，认证身份标识；按人名/工号命名便于审计追责，禁用共享账号"}, {"name": "password", "label": "密码", "default": "", "required": true, "validate": "", "example": "现场生成：>=12位，含大小写/数字/符号", "type": "string", "description": "账号登录口令，认证凭据；配置中可能明文/弱加密存储，导出配置时必须脱敏；遵循强口令并定期轮换"}, {"name": "min_len", "label": "口令最小长度", "default": "12", "required": false, "validate": "int:8-32", "example": "建议 12 以上", "type": "int", "range": "8-32", "description": "口令最小长度，常见 8-12 位；配合复杂度策略（数字/特殊字符下限）使用"}, {"name": "change_days", "label": "口令有效期（天）", "default": "90", "required": false, "validate": "int:0-365", "example": "90", "type": "int", "range": "0-365", "description": "口令有效期（天），超过后系统强制改密；常见 90 天；设得过短会逼出弱口令习惯，配合到期提前告警（warning_days）使用"}, {"name": "lock_times", "label": "失败锁定次数", "default": "5", "required": false, "validate": "int:1-20", "example": "5", "type": "int", "range": "1-20", "description": "允许的连续登录失败次数，超过即锁定账号；常见 5 次；设太小易误伤正常运维输入"}], "notes": "1) ★ 待真机核对：console 与 Web/SSH 共用管理员账号密码，无独立 console 口令。\n2) 忘记超级管理员口令需走串口+厂商恢复流程，成本很高 —— 口令务必纳入密码管理系统。\n3) 安全基线：长度 ≥12、复杂度达标、有效期 ≤90 天、失败锁定 ≤5 次。\n4) ★ 口令必须现场生成随机强口令，禁止沿用任何示例值；渲染对话框未填口令会标红并阻止生成。\n", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:04", "updated_at": "2026-10-09 13:45:57", "exec_level": "skeleton", "interactive": 0, "rollback": "# 回退：恢复旧口令与旧口令策略（口令回退=重新设回旧值；★ 骨架条目，CLI 口令命令\n# 以 ? 核对为准，优先走 Web：系统 → 管理员/权限管理 → 修改密码回填旧口令；\n# 系统 → 安全设置回填最小长度/有效期/锁定次数的变更前取值）\nenable\nwrite"}, {"uuid": "201cd5ee-7298-52e3-ba1d-8860b3b62176", "platform": "network", "device_type": "防火墙", "vendor": "sangfor", "os_family": "sangfor_af", "models": "AF 全系列", "category": "SNMP", "title": "配置 SNMP 团体字与 Trap（CLI 骨架 + Web 对照）", "description": "开启 SNMP、配置团体字并限定网管主机，设置 Trap 上报。", "commands": "# ⚠ 待真机核对：本条目为 CLI 骨架 + Web 控制台对照，命令行未在本厂商真机验证过。\n# 核对方法：Console/SSH 登录后先敲 ? 查看当前视图可用命令；\n#          若列表里没有对应命令，直接用下半部分的 Web 控制台路径操作。\n\n# ---- CLI 骨架（关键字待现场用 ? 确认）----\nenable\nconfigure terminal\nsnmp enable\nsnmp community {{ro_community}} read-only host {{nms_ip}} {{nms_mask}}\nsnmp trap host {{nms_ip}} community {{ro_community}}\nexit\nwrite\nshow snmp\n#\n# ---- Web 控制台路径（可直接照做）----\n# 系统 → SNMP：启用，只读团体字 {{ro_community}}，允许访问主机 {{nms_ip}}/{{nms_mask}}，\n#   Trap 接收地址 {{nms_ip}}，位置 {{location}}，联系人 {{contact}}", "params": [{"name": "ro_community", "label": "只读团体字", "default": "RO@Public1", "required": true, "validate": "", "example": "RO@Public1", "type": "string", "description": "SNMP 只读团体字，等同口令——网管凭它采集设备数据；禁用 public 等弱值并限定来源；只读为主，写权限单独管理"}, {"name": "nms_ip", "label": "网管服务器 IP", "default": "10.0.0.100", "required": true, "validate": "ipv4", "example": "10.0.0.100", "type": "ip", "description": "网管服务器（SNMP 采集/trap 接收）IP，设备向其发送告警并接受查询；填错网管侧收不到任何数据，等于监控失明"}, {"name": "nms_mask", "label": "网管掩码", "default": "255.255.255.0", "required": false, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "SNMP 服务允许来源的掩码，与 nms_ip 配套限定采集来源范围；配宽了等于向多余网段开放 SNMP"}, {"name": "location", "label": "设备位置", "default": "IDC-A-机柜12", "required": false, "validate": "", "example": "IDC-A-机柜12", "type": "string", "description": "SNMP 系统位置（sysLocation）字段，标明设备物理位置（机房/机柜/U 位），告警现场定位依据；纯展示不影响功能"}, {"name": "contact", "label": "联系人", "default": "网络运维组", "required": false, "validate": "", "example": "网络运维组", "type": "string", "description": "SNMP 系统联系人（sysContact）字段，网管告警时定位责任人的依据；纯展示不影响功能"}], "notes": "1) ★ 待真机核对：SNMP 命令关键字先 ? 确认；Web 路径（下半部分）更可靠。\n2) 团体字不用 public/private；\"允许访问主机\"必须限定为网管地址。\n3) Trap 走 UDP 162，确认中间链路放通；Trap 源地址通常是管理口地址。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:04", "updated_at": "2026-10-09 13:45:57", "exec_level": "skeleton", "interactive": 0, "rollback": "# 回退：关闭 SNMP 并删除团体字/Trap 配置（snmp disable 等 undo 关键字待真机 ? 核对；\n# Web 侧等价：系统 → SNMP 关闭并删除对应条目）\nenable\nconfigure terminal\nno snmp community {{ro_community}}\nno snmp trap host {{nms_ip}}\nsnmp disable\nexit\nwrite\n# 复核\nshow snmp"}, {"uuid": "0d183a0c-3ab1-5232-bb68-c713aa54c555", "platform": "network", "device_type": "防火墙", "vendor": "sangfor", "os_family": "sangfor_af", "models": "AF 全系列", "category": "保存配置", "title": "保存配置与备份（CLI 骨架 + Web 对照）", "description": "落盘当前配置并导出备份文件归档。", "commands": "# ⚠ 待真机核对：本条目为 CLI 骨架 + Web 控制台对照，命令行未在本厂商真机验证过。\n# 核对方法：Console/SSH 登录后先敲 ? 查看当前视图可用命令；\n#          若列表里没有对应命令，直接用下半部分的 Web 控制台路径操作。\n\n# ---- CLI 骨架（关键字待现场用 ? 确认）----\nenable\nwrite\nshow running-config\nexit\n#\n# ---- Web 控制台路径（可直接照做）----\n# 系统 → 配置备份/恢复 → 导出配置文件：AF-EDGE-01-{{backup_tag}}.conf\n# ★ 恢复会覆盖当前全部配置，执行前先备份当前的，并确认无人正在操作设备", "params": [{"name": "backup_tag", "label": "备份标记", "default": "20260920", "required": false, "validate": "", "example": "20260920 或变更单号", "type": "string", "description": "备份文件版本标签，拼进备份文件名（如 backup-20260930-pre-upgrade.cfg）便于追溯；建议用『日期-动作』格式，回滚时按标签定位对应版本"}], "notes": "1) ★ 待真机核对：AF 多数版本改动即时生效，但仍建议显式备份一次。\n2) 变更前后各导出一次配置，形成\"变更前基线 + 变更后结果\"两份归档。\n3) 配置文件含口令密文，归档位置的访问权限要控制。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:04", "updated_at": "2026-10-09 13:45:57", "exec_level": "skeleton", "interactive": 0, "rollback": "# 回退：本条目仅保存配置，不改变网络行为，无需配置回退；\n# Web 侧如需恢复配置：系统 → 配置备份/恢复 → 导入配置文件\n#（★ 覆盖全部配置，执行前先备份当前配置并确认无人正在操作设备）\nenable"}, {"uuid": "d6b8a812-f4ab-589c-a736-8dfff070b4d9", "platform": "network", "device_type": "防火墙", "vendor": "topsec", "os_family": "topos", "models": "天融信网络卫士 NGFW 系列", "category": "VLAN", "title": "创建 VLAN 子接口（Web 控制台）", "description": "在物理口上创建 VLAN 子接口并配 IP、绑定安全域。", "commands": "# 【重要】天融信 TopOS 的策略类配置以 Web 控制台为主，命令行仅开放少量系统级命令。\n# 本条目给出的是【Web 控制台操作路径 + 界面字段取值建议】，\n# ★ 请勿直接粘贴到 Xshell 执行 ★  仅作现场对照操作与变更记录使用。\n# 若设备型号确实开放了 CLI，请先用 ? 查看当前版本支持的命令再操作。\n\n# ===== Web 控制台操作路径 =====\n# 【路径】网络管理 → 接口配置 → 选择物理接口 → 新增子接口(VLAN)\n#   接口名称  ：{{sub_if_name}}\n#   所属物理口：{{parent_port}}\n#   VLAN ID   ：{{vlan_id}}\n#   IP 地址   ：{{vlan_ip}}\n#   子网掩码  ：{{vlan_mask}}\n#   安全域    ：{{zone_name}}\n#   管理权限  ：勾选 Ping、HTTPS（按需勾选 SSH）\n#   → 保存后确认接口状态 UP\n#\n# 【验证】网络管理 → 接口配置（接口列表状态）；诊断工具 → Ping", "params": [{"name": "sub_if_name", "label": "子接口名称", "default": "VLAN10-OFFICE", "required": true, "validate": "", "example": "VLAN10-OFFICE", "type": "string", "description": "子接口名称（ethX.VLAN 形式），VLAN 三层终结点；Web 控制台配置项，须与交换机侧 Trunk 放行对应"}, {"name": "parent_port", "label": "所属物理口", "default": "eth2", "required": true, "validate": "", "example": "eth2", "type": "string", "description": "VLAN 子接口的父物理口，子接口流量承载在其上；父口 down 则其下所有子接口全部 down"}, {"name": "vlan_id", "label": "VLAN ID", "default": "10", "required": true, "validate": "vlan", "example": "10", "type": "string", "description": "VLAN 编号，二层广播域标识；有效范围 1-4094（1 为默认 VLAN、1002-1005 系统保留）；Trunk 两端放行列表与 PVID 必须配套，改错会隔离业务"}, {"name": "vlan_ip", "label": "接口 IP", "default": "192.168.10.1", "required": true, "validate": "ipv4", "example": "192.168.10.1", "type": "ip", "description": "VLAN 子接口/网关 IP，该网段终端的默认网关；须与终端同网段；改网关地址需同步终端配置"}, {"name": "vlan_mask", "label": "子网掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "VLAN 子接口的子网掩码，与 vlan_ip 配套决定网段大小"}, {"name": "zone_name", "label": "安全域", "default": "内网域", "required": false, "validate": "", "example": "内网域 / 外网域 / DMZ 域", "type": "string", "description": "安全区域名（trust/untrust/dmz），接口的 zone 归属决定策略方向匹配；接口须先加入 zone 才能被策略引用"}], "notes": "1) 天融信防火墙的接口必须绑定\"安全域\"，策略是按安全域之间配置的，漏绑策略无法引用接口。\n2) 父物理口若已在用（有 IP 或已绑策略），建子接口前先确认不会影响现有业务。\n3) 管理权限按最小化原则勾选，只留 Ping + HTTPS 即可，SSH 按需。\n4) ★ 本条是界面操作路径，不是可直接粘贴执行的命令。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:04", "updated_at": "2026-10-09 13:45:58", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "f624ab5f-063c-5905-b829-0d402364ba85", "platform": "network", "device_type": "防火墙", "vendor": "topsec", "os_family": "topos", "models": "天融信 NGFW（多口型号）", "category": "Trunk", "title": "配置 Trunk 接口聚合与 VLAN 放通（Web 控制台）", "description": "把多个物理口聚合成聚合口用于上联，并在聚合口上划分 VLAN 子接口。", "commands": "# 【重要】天融信 TopOS 的策略类配置以 Web 控制台为主，命令行仅开放少量系统级命令。\n# 本条目给出的是【Web 控制台操作路径 + 界面字段取值建议】，\n# ★ 请勿直接粘贴到 Xshell 执行 ★  仅作现场对照操作与变更记录使用。\n# 若设备型号确实开放了 CLI，请先用 ? 查看当前版本支持的命令再操作。\n\n# ===== Web 控制台操作路径 =====\n# 【路径】网络管理 → 接口配置 → 新增 → 聚合接口\n#   聚合口名称：{{agg_name}}\n#   成员接口  ：{{member_ports}}\n#   聚合模式  ：{{lacp_mode}}（需与对端一致）\n#   安全域    ：{{zone_name}}\n#   → 再在聚合口下继续\"新增子接口(VLAN)\"放通各业务 VLAN：\n#     VLAN ID：{{vlan_id}}   IP：{{agg_ip}} / {{agg_mask}}\n#\n# 【验证】接口列表确认成员口与聚合口状态均为 UP", "params": [{"name": "agg_name", "label": "聚合口名称", "default": "AGG-UPLINK", "required": true, "validate": "", "example": "AGG-UPLINK", "type": "string", "description": "聚合接口名称（如 agg1 / link-aggregation1），标识一条聚合链路；须与对端聚合组一一对应；重命名/删除会断开现有聚合"}, {"name": "member_ports", "label": "成员接口", "default": "eth1、eth2", "required": true, "validate": "", "example": "eth1、eth2", "type": "string", "description": "聚合组成员口列表（空格分隔多个），一次纳入聚合的物理口集合；成员口状态/速率须一致，异常成员不参与转发"}, {"name": "lacp_mode", "label": "聚合模式", "default": "LACP", "required": false, "validate": "enum:静态聚合|LACP", "example": "LACP", "type": "enum", "choices": ["静态聚合", "LACP"], "description": "聚合工作模式（static 静态聚合 / lacp 动态协商），必须与对端设备一致——一端静态一端 LACP 链路起不来"}, {"name": "zone_name", "label": "安全域", "default": "内网域", "required": false, "validate": "", "example": "内网域", "type": "string", "description": "安全区域名（trust/untrust/dmz），接口的 zone 归属决定策略方向匹配；接口须先加入 zone 才能被策略引用"}, {"name": "vlan_id", "label": "VLAN ID", "default": "10", "required": true, "validate": "vlan", "example": "10", "type": "string", "description": "VLAN 编号，二层广播域标识；有效范围 1-4094（1 为默认 VLAN、1002-1005 系统保留）；Trunk 两端放行列表与 PVID 必须配套，改错会隔离业务"}, {"name": "agg_ip", "label": "子接口 IP", "default": "192.168.10.1", "required": true, "validate": "ipv4", "example": "192.168.10.1", "type": "ip", "description": "链路聚合口的三层 IP 地址，作为该聚合链路的本端地址；须与对端同网段；配错聚合链路不通，业务随之中断"}, {"name": "agg_mask", "label": "子网掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "聚合口 IP 的子网掩码，决定聚合口所属网段范围；须与对端一致，配错引发路由不可达"}], "notes": "1) 聚合模式必须与对端交换机一致，否则链路起不来或只有一条在用。\n2) 天融信防火墙在聚合口上建 VLAN 子接口即可实现 Trunk 上联，无需单独的 trunk 开关。\n3) 安全域要绑定在聚合口/子接口上，绑定错误会出现\"策略命中但流量不过\"。\n4) ★ 本条是界面操作路径，不是可直接粘贴执行的命令。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:04", "updated_at": "2026-10-09 13:45:58", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "ba9ca3aa-8942-5f89-8a2a-5f8801975132", "platform": "network", "device_type": "防火墙", "vendor": "topsec", "os_family": "topos", "models": "天融信 NGFW 全系列", "category": "静态路由", "title": "配置静态路由与默认路由（Web 控制台）", "description": "新增明细路由与默认路由，指定网关、出接口与优先级。", "commands": "# 【重要】天融信 TopOS 的策略类配置以 Web 控制台为主，命令行仅开放少量系统级命令。\n# 本条目给出的是【Web 控制台操作路径 + 界面字段取值建议】，\n# ★ 请勿直接粘贴到 Xshell 执行 ★  仅作现场对照操作与变更记录使用。\n# 若设备型号确实开放了 CLI，请先用 ? 查看当前版本支持的命令再操作。\n\n# ===== Web 控制台操作路径 =====\n# 【路径】网络管理 → 路由配置 → 静态路由 → 新增\n#   目的地址  ：{{dest_net}}\n#   子网掩码  ：{{dest_mask}}\n#   下一跳    ：{{next_hop}}\n#   出接口    ：{{out_interface}}\n#   优先级    ：{{priority}}（数值越小越优先）\n#   描述      ：{{comment}}\n#   → 默认路由：目的地址 0.0.0.0 / 掩码 0.0.0.0 / 下一跳为运营商网关\n#\n# 【验证】网络管理 → 路由配置 → 路由表；诊断工具 → 路由追踪", "params": [{"name": "dest_net", "label": "目的网段", "default": "192.168.20.0", "required": true, "validate": "ipv4", "example": "192.168.20.0", "type": "ip", "description": "目的网段地址，路由/策略匹配的目标方向；0.0.0.0/0 表示任意目的；方向写反会导致流量走错策略"}, {"name": "dest_mask", "label": "子网掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "目的网段的点分十进制掩码，与 dest_net 配套圈定策略匹配范围；掩码写宽会误匹配其他网段、扩大放行面"}, {"name": "next_hop", "label": "下一跳地址", "default": "10.0.0.2", "required": true, "validate": "ipv4", "example": "10.0.0.2", "type": "ip", "description": "下一跳 IP，路由/策略转发的去向；必须是本机直连可达地址，写错路由成『黑洞』"}, {"name": "out_interface", "label": "出接口", "default": "eth1", "required": true, "validate": "", "example": "eth1", "type": "string", "description": "NAT/策略的出接口名，流量转发的物理出口；必须与真实外网口一致，写错 NAT 不生效"}, {"name": "priority", "label": "优先级", "default": "10", "required": false, "validate": "int:1-255", "example": "越小越优先", "type": "int", "range": "1-255", "description": "路由优先级（深信服/天融信），数值越小越优先；多出口场景主链路设小值，备份链路设大值"}, {"name": "comment", "label": "描述", "default": "to-核心交换机", "required": false, "validate": "", "example": "to-核心交换机", "type": "string", "description": "对象的描述文字，仅运维辨识用途、不参与策略匹配；建议写明用途与申请人"}], "notes": "1) 网关与出接口建议同时指定，链路 down 时路由能及时失效，切换更干净。\n2) 双出口备份靠优先级；切换会影响现有会话，割接窗口内操作。\n3) 配 NAT 的场景里，\"路由可达\"与\"地址转换\"是两件事，缺一不通。\n4) ★ 本条是界面操作路径，不是可直接粘贴执行的命令。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:04", "updated_at": "2026-10-09 13:45:58", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "22460ef6-2956-5b3b-b135-53a88e33fd89", "platform": "network", "device_type": "防火墙", "vendor": "topsec", "os_family": "topos", "models": "天融信 NGFW（支持动态路由版本）", "category": "OSPF", "title": "配置 OSPF 动态路由（Web 控制台）", "description": "开启 OSPF 进程、设置 router-id 与区域，按接口宣告网段。", "commands": "# 【重要】天融信 TopOS 的策略类配置以 Web 控制台为主，命令行仅开放少量系统级命令。\n# 本条目给出的是【Web 控制台操作路径 + 界面字段取值建议】，\n# ★ 请勿直接粘贴到 Xshell 执行 ★  仅作现场对照操作与变更记录使用。\n# 若设备型号确实开放了 CLI，请先用 ? 查看当前版本支持的命令再操作。\n\n# ===== Web 控制台操作路径 =====\n# 【路径】网络管理 → 路由配置 → 动态路由 → OSPF → 启用\n#   Router ID ：{{router_id}}\n#   区域 ID   ：{{area_id}}\n#   宣告接口  ：{{ospf_interface}}\n#   被动接口  ：{{passive_interface}}\n#   认证      ：按需开启（MD5）\n#   → 保存后查看邻居状态是否为 Full\n#\n# 【验证】网络管理 → 动态路由 → 邻居表 / OSPF 路由表", "params": [{"name": "router_id", "label": "Router ID", "default": "9.9.9.9", "required": true, "validate": "ipv4", "example": "9.9.9.9", "type": "ip", "description": "OSPF Router ID（IPv4 格式），区域内唯一标识本路由器；重复会引发邻居震荡与路由抖动，建议用 loopback 接口地址"}, {"name": "area_id", "label": "区域 ID", "default": "0.0.0.0", "required": false, "validate": "", "example": "0.0.0.0", "type": "string", "description": "OSPF 区域 ID，控制该网段归属哪个 OSPF 区域；骨干区域固定 0.0.0.0，非骨干区域须与骨干直连（或虚链路）；填错邻居起不来、路由学不到"}, {"name": "ospf_interface", "label": "宣告接口", "default": "eth1", "required": true, "validate": "", "example": "eth1", "type": "string", "description": "参与 OSPF 宣告的接口名，该接口所在网段被通告进 OSPF；Web 控制台配置项，改动后注意邻接关系重建"}, {"name": "passive_interface", "label": "被动接口", "default": "eth2", "required": false, "validate": "", "example": "eth2", "type": "string", "description": "OSPF 被动接口（只宣告网段、不收发 Hello），业务接入口设为被动防止与终端误建邻居关系"}], "notes": "1) 先确认版本/授权支持动态路由，部分中低端型号默认不开放。\n2) 邻居卡在 ExStart/Exchange 多为 MTU 不一致或认证不匹配；卡在 Init 多为单向可达或组播被挡。\n3) 业务接入口设被动，减少不必要的 Hello 报文。\n4) ★ 本条是界面操作路径，不是可直接粘贴执行的命令。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:04", "updated_at": "2026-10-09 13:45:58", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "a21ba346-fe3d-57f0-84e9-c90c2c08a18a", "platform": "network", "device_type": "防火墙", "vendor": "topsec", "os_family": "topos", "models": "天融信 NGFW 全系列", "category": "ACL", "title": "配置 ACL 访问控制策略（Web 控制台）", "description": "用地址/服务对象 + 访问控制策略控制安全域之间互访，开启日志。", "commands": "# 【重要】天融信 TopOS 的策略类配置以 Web 控制台为主，命令行仅开放少量系统级命令。\n# 本条目给出的是【Web 控制台操作路径 + 界面字段取值建议】，\n# ★ 请勿直接粘贴到 Xshell 执行 ★  仅作现场对照操作与变更记录使用。\n# 若设备型号确实开放了 CLI，请先用 ? 查看当前版本支持的命令再操作。\n\n# ===== Web 控制台操作路径 =====\n# 【第一步】对象管理 → 地址对象 → 新增：{{src_obj}} = {{src_net}} / {{src_mask}}\n# 【第二步】策略管理 → 访问控制策略 → 新增\n#   策略名称  ：{{policy_name}}\n#   源安全域  ：{{src_zone}}     目的安全域：{{dst_zone}}\n#   源地址    ：{{src_obj}}      目的地址：{{dst_obj}}\n#   服务      ：{{service}}\n#   动作      ：允许 / 拒绝（可选\"拒绝并记录日志\"）\n#   日志      ：开启\n#   → 保存后确认策略顺序（自上而下匹配）\n#\n# 【验证】策略管理 看命中计数；日志 → 安全日志/会话日志", "params": [{"name": "src_obj", "label": "源地址对象名", "default": "OBJ-OFFICE", "required": true, "validate": "", "example": "OBJ-OFFICE", "type": "string", "description": "源地址对象名（FortiGate/PaloAlto 等），先建对象再被策略引用；修改对象影响所有引用它的策略"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "src_mask", "label": "源掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "源网段点分十进制掩码（FortiGate 子网对象写法），与 src_net 圈定来源范围；写宽扩大放行面"}, {"name": "policy_name", "label": "策略名称", "default": "OFFICE-to-SERVER", "required": true, "validate": "", "example": "OFFICE-to-SERVER", "type": "string", "description": "防火墙策略名称，运维辨识用途；建议『源_到_目的_动作』命名法，策略多了不迷路"}, {"name": "src_zone", "label": "源安全域", "default": "内网域", "required": true, "validate": "", "example": "内网域", "type": "string", "description": "源安全区域，策略入方向区域匹配；报文入接口必须真属于该 zone；修改后须 commit"}, {"name": "dst_zone", "label": "目的安全域", "default": "DMZ 域", "required": true, "validate": "", "example": "DMZ 域", "type": "string", "description": "目的安全区域（trust/dmz/untrust），策略的目的方向匹配；报文出接口必须真属于该 zone，否则策略永不命中；改后须 commit"}, {"name": "dst_obj", "label": "目的地址对象", "default": "OBJ-SERVER", "required": true, "validate": "", "example": "OBJ-SERVER", "type": "string", "description": "PaloAlto 目的地址对象名，先建对象再被安全策略引用；修改对象网段会影响所有引用它的策略，改后须 commit"}, {"name": "service", "label": "服务", "default": "HTTPS", "required": false, "validate": "", "example": "HTTP / HTTPS / Any", "type": "string", "description": "策略引用的服务对象名（HTTP/HTTPS/ALL 等），四层端口匹配的集合；可用预定义或自建对象；改对象影响所有引用它的策略"}], "notes": "1) 天融信策略是基于\"安全域对\"的，接口没绑安全域时策略引用不到，这是最常见的配置卡点。\n2) 策略顺序决定生效结果，调整管理类放通策略前先确认不会把自己挡在外面。\n3) 建议为\"拒绝\"也开日志，攻击溯源时需要拒绝记录。\n4) ★ 本条是界面操作路径，不是可直接粘贴执行的命令。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:04", "updated_at": "2026-10-09 13:45:58", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "18a9a17f-7b70-58f5-9086-846929993eff", "platform": "network", "device_type": "防火墙", "vendor": "topsec", "os_family": "topos", "models": "天融信 NGFW 全系列", "category": "NAT", "title": "配置源 NAT 与目的 NAT 映射（Web 控制台）", "description": "内网出网做源地址转换（PAT），服务器对外发布做目的地址转换（端口映射）。", "commands": "# 【重要】天融信 TopOS 的策略类配置以 Web 控制台为主，命令行仅开放少量系统级命令。\n# 本条目给出的是【Web 控制台操作路径 + 界面字段取值建议】，\n# ★ 请勿直接粘贴到 Xshell 执行 ★  仅作现场对照操作与变更记录使用。\n# 若设备型号确实开放了 CLI，请先用 ? 查看当前版本支持的命令再操作。\n\n# ===== Web 控制台操作路径 =====\n# 【源 NAT】NAT 管理 → 源地址转换(SNAT) → 新增\n#   名称      ：{{snat_name}}\n#   源安全域  ：{{src_zone}}   目的安全域：{{dst_zone}}\n#   源地址    ：{{src_net}} / {{src_mask}}\n#   转换类型  ：接口地址转换（PAT）/ 地址池转换\n# 【目的 NAT】NAT 管理 → 目的地址转换(DNAT) → 新增\n#   名称      ：{{dnat_name}}\n#   源安全域  ：{{untrust_zone}}  目的安全域：{{trust_zone}}\n#   公网地址  ：{{public_ip}}     公网端口：{{public_port}}\n#   映射地址  ：{{inside_ip}}     映射端口：{{inside_port}}\n#   → 保存后必须在【访问控制策略】放行 外网域 → 内网域 的对应服务\n#\n# 【验证】日志 → 会话日志（确认转换前后地址）；诊断工具 → 连通性测试", "params": [{"name": "snat_name", "label": "SNAT 名称", "default": "SNAT-TO-INTERNET", "required": true, "validate": "", "example": "SNAT-TO-INTERNET", "type": "string", "description": "SNAT 规则名，标识一条源地址转换（内网出去的方向）；修改后须 commit 才生效"}, {"name": "src_zone", "label": "源安全域", "default": "内网域", "required": true, "validate": "", "example": "内网域", "type": "string", "description": "源安全区域，策略入方向区域匹配；报文入接口必须真属于该 zone；修改后须 commit"}, {"name": "dst_zone", "label": "目的安全域", "default": "外网域", "required": true, "validate": "", "example": "外网域", "type": "string", "description": "目的安全区域（trust/dmz/untrust），策略的目的方向匹配；报文出接口必须真属于该 zone，否则策略永不命中；改后须 commit"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "src_mask", "label": "源掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "源网段点分十进制掩码（FortiGate 子网对象写法），与 src_net 圈定来源范围；写宽扩大放行面"}, {"name": "dnat_name", "label": "DNAT 名称", "default": "DNAT-WEB-8443", "required": true, "validate": "", "example": "DNAT-WEB-8443", "type": "string", "description": "DNAT/NAT 规则名，标识一条目的地址转换（外部访问内部服务的映射入口）；名称建议带业务语义；修改后须 commit 才生效"}, {"name": "untrust_zone", "label": "外网安全域", "default": "外网域", "required": true, "validate": "", "example": "外网域", "type": "string", "description": "非受信安全区域名（外网侧），DNAT/策略的来源区域匹配"}, {"name": "trust_zone", "label": "内网安全域", "default": "内网域", "required": true, "validate": "", "example": "内网域", "type": "string", "description": "受信/目的安全区域名，NAT 与安全策略的区域匹配；与区域规划一致，改后须 commit"}, {"name": "public_ip", "label": "公网地址", "default": "200.1.1.30", "required": true, "validate": "ipv4", "example": "200.1.1.30", "type": "ip", "description": "对外发布的公网/映射 IP，NAT 后外部访问的地址；须在上联口网段内且未被占用，冲突会绑定失败"}, {"name": "public_port", "label": "公网端口", "default": "8443", "required": true, "validate": "int:1-65535", "example": "8443", "type": "int", "range": "1-65535", "description": "对外映射端口号，DNAT 的外部端口；可与内部端口不同（如 8443→443）；与现有监听冲突会绑定失败"}, {"name": "inside_ip", "label": "内网服务器", "default": "192.168.10.100", "required": true, "validate": "ipv4", "example": "192.168.10.100", "type": "ip", "description": "NAT 映射的内网真实 IP（被发布服务器的地址），DNAT 后流量的真正去向；填错把外部流量引到错误主机"}, {"name": "inside_port", "label": "内网端口", "default": "8443", "required": true, "validate": "int:1-65535", "example": "8443", "type": "int", "range": "1-65535", "description": "内网侧接口名或映射端口号，DNAT 流量的内部接收方向；写错映射不生效"}], "notes": "1) ★ 天融信的 NAT 同样需要配套放行策略：只做地址转换不做策略放行，流量过不去。\n2) 端口映射的公网/内网端口别写反，配完从外部实测；内网自测（回环）不通不代表配置错。\n3) 源 NAT 用\"接口地址转换\"即 PAT；需要固定出口 IP 的场景用地址池转换。\n4) ★ 本条是界面操作路径，不是可直接粘贴执行的命令。", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:34:04", "updated_at": "2026-10-09 13:45:59", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "d424c561-399b-5ff0-8a61-ee74b3f6e6bc", "platform": "network", "device_type": "防火墙", "vendor": "topsec", "os_family": "topos", "models": "天融信 NGFW 全系列", "category": "SSH管理", "title": "创建 SSH 管理员并收紧管理面（Web 控制台）", "description": "新建管理员账号、分配角色、限定登录来源并开启登录审计。", "commands": "# 【重要】天融信 TopOS 的策略类配置以 Web 控制台为主，命令行仅开放少量系统级命令。\n# 本条目给出的是【Web 控制台操作路径 + 界面字段取值建议】，\n# ★ 请勿直接粘贴到 Xshell 执行 ★  仅作现场对照操作与变更记录使用。\n# 若设备型号确实开放了 CLI，请先用 ? 查看当前版本支持的命令再操作。\n\n# ===== Web 控制台操作路径 =====\n# 【路径】系统管理 → 管理员配置 → 新增\n#   用户名    ：{{username}}\n#   密码      ：{{password}}\n#   角色/权限 ：{{role}}（超级管理员 / 配置管理员 / 审计员）\n#   允许登录来源：{{trust_ip}} / {{trust_mask}}（★ 必填）\n#   允许管理方式：HTTPS、SSH（不用 Telnet）\n#   → 系统管理 → 安全设置：登录失败锁定、会话超时 {{timeout_min}} 分钟\n#\n# 【验证】系统管理 → 日志 → 管理员操作日志", "params": [{"name": "username", "label": "用户名", "default": "netadmin", "required": true, "validate": "", "example": "netadmin", "type": "string", "description": "登录账号名，认证身份标识；按人名/工号命名便于审计追责，禁用共享账号"}, {"name": "password", "label": "密码", "default": "", "required": true, "validate": "", "example": "现场生成：>=12位，含大小写/数字/符号", "type": "string", "description": "账号登录口令，认证凭据；配置中可能明文/弱加密存储，导出配置时必须脱敏；遵循强口令并定期轮换"}, {"name": "role", "label": "角色", "default": "超级管理员", "required": false, "validate": "enum:超级管理员|配置管理员|审计员", "example": "超级管理员", "type": "enum", "choices": ["超级管理员", "配置管理员", "审计员"], "description": "管理员角色（超级管理员/审计员/只读），决定账号权限边界；遵循最小权限原则，日常运维勿用超管账号"}, {"name": "trust_ip", "label": "允许登录网段", "default": "10.0.0.0", "required": true, "validate": "ipv4", "example": "10.0.0.0", "type": "ip", "description": "管理面允许登录的来源 IP（trusthost 白名单），限定谁能访问设备管理；改前确认当前管理机 IP 在名单内，否则当场失联"}, {"name": "trust_mask", "label": "网段掩码", "default": "255.255.255.0", "required": true, "validate": "masklen", "example": "255.255.255.0", "type": "string", "description": "登录来源 IP 的掩码，与 trust_ip 配套；0.0.0.0 0.0.0.0 等于不限制来源（不建议）"}, {"name": "timeout_min", "
