rams": [{"name": "dns_server_ip", "label": "内网 DNS 服务器 IP", "default": "", "required": true, "validate": "ipv4", "example": "192.168.66.10", "type": "ip", "description": "设备侧 DNS 服务器地址，用于域名解析（ping 域名、日志主机名反查）；须网络可达；改动立即生效"}, {"name": "test_domain", "label": "验证用内网域名", "default": "", "required": true, "validate": "", "example": "gw.corp.local", "type": "string", "description": "DNS/连通性测试域名，ping 它通 = 网络+解析都正常；不通时分层排查（先 IP 后域名）"}], "notes": "1) ★ 待真机核对：TopOS 各版本 DNS 配置入口差异大，优先走 Web 控制台路径。\n2) TopOS 的诊断工具（ping/nslookup）集中在 Web 系统菜单，CLI 侧以 ? 实测为准。\n3) 核对通过后回填本条目并把 exec_level 升级为 verified-cli。\n验证方法：Web 应用 DNS 后 ping test_domain 看解析；CLI 侧核对 ? 输出后补录真机命令；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-24 16:09:29", "updated_at": "2026-10-09 13:46:00", "exec_level": "skeleton", "interactive": 0, "rollback": ""}, {"uuid": "33907be8-0f9a-53c7-86ef-c79d5b95db4e", "platform": "linux", "device_type": "服务器", "vendor": "ops", "os_family": "linux", "models": "任意 Linux（RHEL/Debian 系通用）", "category": "传输工具", "title": "rsync 断点续传同步大文件（先 -n 演练）", "description": "离网/半离网环境传 ISO、日志包、备份目录：rsync -avP 中断后重跑同命令即续传。", "commands": "# ===== rsync 断点续传同步大文件（先 -n 演练）=====\n# ---- 0. ★ 首次务必 -n 演练（dry run）：确认将同步/覆盖的清单再实跑 ----\nrsync -avn --progress {{src_path}} {{dst_path}}\n# ---- 1. 实跑（-P = --partial --progress；中断后重跑同一条命令即断点续传）----\nrsync -avP {{src_path}} {{dst_path}}\n# ---- 2. 校验（单文件全量比对；目录用 du -sh 两侧对比先粗验）----\nsha256sum {{src_path}}\nsha256sum {{dst_path}}\n", "params": [{"name": "src_path", "label": "源路径（文件或目录）", "default": "", "required": true, "validate": "path", "example": "/data/iso/openEuler-22.03.iso", "type": "string", "description": "源文件/目录路径（拷贝/打包起点）；rsync 尾部斜杠语义不同（带斜杠拷内容、不带拷目录本身），先 -n 演练"}, {"name": "dst_path", "label": "目标路径", "default": "", "required": true, "validate": "path", "example": "/backup/openEuler-22.03.iso", "type": "string", "description": "拷贝目标路径（本机文件(含文件名)或 remote:/path）；rsync 尾部斜杠语义不同（带斜杠拷内容），先 -n/--dry-run 演练再实跑，防覆盖错文件(含文件名)"}], "notes": "1) ★ 危险点：首次必须 -n 演练。rsync 的斜杠语义要命：src 尾部带 /（如 /data/iso/）拷的是\"目录内容\"，不带 / 拷的是\"目录本身\"——演练输出里核对路径再实跑。\n2) 绝不要随手加 --delete：它会把目标侧多余文件删光，先想清楚再上。\n3) 单文件用 sha256sum 两侧比对；目录级粗验用 du -sh，精确校验走《分卷打包与合并校验》条目的 SHA256SUMS 流程。\n4) 两台机器都装了 rsync 才能用远端路径；本地盘/U 盘之间同样可用（rsync /src /mnt/usb/）。\n验证方法：先 -n 演练确认清单，实跑后 sha256sum 两侧比对一致即通过；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：实测:-avn 演练列清单、-avP 实跑 20MB、sha256sum 两侧一致(dst_path 示例值已修为文件路径,原 /backup/ 目录会报 Is a directory) ✓", "duration": "temp", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(ubuntu:22.04, 容器)", "verified_date": "2026-10-09", "favorite": 0, "created_at": "2026-09-24 16:09:29", "updated_at": "2026-10-09 17:17:57", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除本次同步到目标的产物（★ 确认目标路径无他人文件后再删；\n# 若目标原已有同名旧版本且需恢复，按变更前备份回填）\nrm -rf {{dst_path}}\n# 复核\nls {{dst_path}} 2>/dev/null || echo '目标已清空'"}, {"uuid": "aa9c2c24-c478-5614-bf42-0a3a606023fd", "platform": "linux", "device_type": "服务器", "vendor": "ops", "os_family": "linux", "models": "任意 Linux（RHEL/Debian 系通用）", "category": "传输工具", "title": "分卷打包与合并校验（tar + split + sha256）", "description": "大目录/大文件切成小卷过 U 盘或受限通道：打包分卷、逐卷校验、合并解压三段流程。", "commands": "# ===== 分卷打包与合并校验（tar + split + sha256）=====\n# ---- 1.【打包机】打包并按卷大小切分（-l 是小写 L；卷名以 .aa/.ab… 结尾）----\ntar czf - {{src_path}} | split -b {{chunk_size}} - {{dst_path}}/bundle.tar.gz.\n# ---- 2.【打包机】生成逐卷校验清单（清单要随卷一起带走）----\nsha256sum {{dst_path}}/bundle.tar.gz.* > {{dst_path}}/SHA256SUMS\n# ---- 3.【接收机】★ 合并前先逐卷校验，任何一行 FAILED 都不许往下走 ----\ncd {{dst_path}} && sha256sum -c SHA256SUMS\n# ---- 4.【接收机】校验全过才合并解压（-C 恢复目录自行替换）----\ncat {{dst_path}}/bundle.tar.gz.* > {{dst_path}}/bundle.tar.gz\ntar xzf {{dst_path}}/bundle.tar.gz -C /恢复目录\n", "params": [{"name": "src_path", "label": "源路径（文件或目录）", "default": "", "required": true, "validate": "path", "example": "/data/iso/openEuler-22.03.iso", "type": "string", "description": "源文件/目录路径（拷贝/打包起点）；rsync 尾部斜杠语义不同（带斜杠拷内容、不带拷目录本身），先 -n 演练"}, {"name": "dst_path", "label": "目标路径", "default": "", "required": true, "validate": "path", "example": "/backup/", "type": "string", "description": "拷贝目标路径（本机目录或 remote:/path）；rsync 尾部斜杠语义不同（带斜杠拷内容），先 -n/--dry-run 演练再实跑，防覆盖错目录"}, {"name": "chunk_size", "label": "分卷大小", "default": "2G", "required": false, "validate": "", "example": "2G / 500M", "type": "string", "description": "split 分卷大小（如 4G / 500M），控制大文件切分粒度；按中转介质单文件上限取值（FAT32 为 4G），分卷合并用 cat"}], "notes": "1) ★ 危险点：合并与解压前必须先 sha256sum -c 全绿——少一卷/坏一卷时 cat 出来的 tar 解压必报错甚至静默丢数据。\n2) split -b 的 {{chunk_size}} 写法：2G / 500M / 100k（tar 命令本身也认 -b 但这里给 split 用，注意单位大小写）。\n3) 卷文件名前缀 bundle.tar.gz. 末尾的点是刻意的（split 自动补 aa/ab），别手抖删掉。\n4) 解压报\"unexpected EOF\"九成是卷不全或合并前没校验；tar tzf 列表预览可再验一次压缩包完整性。\n验证方法：打包后随机删改一卷跑 sha256sum -c 应报 FAILED（负例），全量重拷后 -c 全过再解压成功；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：实测:tar|split 生成 .aa 卷、sha256sum -c 全 OK、cat 合并解压文件一致 ✓", "duration": "temp", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(ubuntu:22.04, 容器)", "verified_date": "2026-10-09", "favorite": 0, "created_at": "2026-09-24 16:09:30", "updated_at": "2026-10-09 13:46:01", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除分卷、合并包与解压产物（★ 仅清理本变更产生的 bundle.* 与 SHA256SUMS，\n# 别误删目标目录原有文件）\nrm -f {{dst_path}}/bundle.tar.gz* {{dst_path}}/SHA256SUMS\n# 复核\nls {{dst_path}}"}, {"uuid": "773e37b3-60e1-5687-8c6e-ae29cbd59dee", "platform": "linux", "device_type": "服务器", "vendor": "ops", "os_family": "linux", "models": "任意 Linux（RHEL/Debian 系通用）", "category": "传输工具", "title": "U 盘挂载拷贝（ntfs-3g/exfat，认准设备名防错盘）", "description": "物理介质离线搬运：识别设备、按文件系统类型挂载、拷贝落盘、安全卸载。", "commands": "# ===== U 盘挂载拷贝（ntfs-3g/exfat）=====\n# ---- 0. ★ 认准设备名：lsblk 核对容量/型号，别凭 sda/sdb 惯性猜 ----\nlsblk -o NAME,SIZE,MODEL,FSTYPE,MOUNTPOINT\n# ---- 1. 挂载（挂载点必须是空目录；NTFS 用 ntfs-3g，exFAT 用 exfat-fuse，FAT32 直接 mount vfat）----\nmkdir -p /mnt/usb\nmount.ntfs-3g /dev/{{usb_dev}} /mnt/usb\nmount | grep /mnt/usb\n# ---- 2. 拷贝 + 强制落盘 ----\ncp -av {{src_path}} /mnt/usb/\nsync\n# ---- 3. 安全卸载（卸载成功才拔盘）----\numount /mnt/usb\n", "params": [{"name": "src_path", "label": "源路径（文件或目录）", "default": "", "required": true, "validate": "path", "example": "/data/iso/openEuler-22.03.iso", "type": "string", "description": "源文件/目录路径（拷贝/打包起点）；rsync 尾部斜杠语义不同（带斜杠拷内容、不带拷目录本身），先 -n 演练"}, {"name": "usb_dev", "label": "U 盘分区设备名（lsblk 确认）", "default": "", "required": true, "validate": "", "example": "sdb1", "type": "string", "description": "U 盘设备名（如 sdb1），挂载离网拷贝介质；mount 前用 lsblk/dmesg 确认设备名——认错盘会挂错文件系统甚至误格式化"}], "notes": "1) ★ 危险点（高危）：/dev/{{usb_dev}} 必须是分区（sdb1）不是整盘（sdb），更不能是系统盘——mount 前用 lsblk 核对容量与 MODEL 字段，现场血泪教训多为错插错挂。\n2) ★ 拔盘前必须 sync：U 盘写缓存未落盘就拔 = 文件损坏；cp 完成只代表进了缓存。\n3) NTFS/exFAT 支持需 ntfs-3g / exfat-utils 包（离网安装见本地源条目）；都不支持时退回 FAT32 中转（单文件 ≤4G 限制要留意）。\n4) umount 报 target is busy：cd 出挂载点、lsof +D /mnt/usb 找占用进程，别硬拔。\n验证方法：挂载后 df -h /mnt/usb 看容量与文件系统、cp 后 sync + ls -l 对比大小、umount 无报错；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：不可验证(无 USB 设备):容器无 /dev/sdb 类块设备,挂载/sync/umount 链待带 U 盘环境实测", "duration": "temp", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-24 16:09:30", "updated_at": "2026-10-09 13:46:01", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除本次拷入 U 盘的文件并卸载（先 sync 再 umount，卸载成功才拔盘）\nrm -ri /mnt/usb/$(basename {{src_path}})\nsync && umount /mnt/usb"}, {"uuid": "0a7c29e2-568f-5c00-9e22-6e92dc0c64b6", "platform": "linux", "device_type": "服务器", "vendor": "ops", "os_family": "linux", "models": "任意 Linux（RHEL/Debian 系通用）", "category": "传输工具", "title": "scp 限速传输（-l 限速，避免占满管理口带宽）", "description": "半离网内网走 ssh 通道传文件：scp -l 限速；更长清单推荐 rsync --bwlimit（可续传）。", "commands": "# ===== scp 限速传输 =====\n# ---- scp：-l 单位 Kbit/s（8000 ≈ 1 MB/s），给管理口留出带宽数量级 ----\nscp -l 8000 {{src_path}} {{remote_user}}@{{remote_ip}}:{{dst_path}}\n# ---- 备选：rsync --bwlimit 单位 KB/s（断点续传、目录递归更省心，二选一）----\nrsync -avP --bwlimit=8000 {{src_path}} {{remote_user}}@{{remote_ip}}:{{dst_path}}\n# ---- 接收侧校验 ----\nsha256sum {{dst_path}}\n", "params": [{"name": "src_path", "label": "源路径（文件或目录）", "default": "", "required": true, "validate": "path", "example": "/data/iso/openEuler-22.03.iso", "type": "string", "description": "源文件/目录路径（拷贝/打包起点）；rsync 尾部斜杠语义不同（带斜杠拷内容、不带拷目录本身），先 -n 演练"}, {"name": "dst_path", "label": "目标路径", "default": "", "required": true, "validate": "path", "example": "/backup/openEuler-22.03.iso", "type": "string", "description": "拷贝目标路径（本机文件(含文件名)或 remote:/path）；rsync 尾部斜杠语义不同（带斜杠拷内容），先 -n/--dry-run 演练再实跑，防覆盖错文件(含文件名)"}, {"name": "remote_user", "label": "对端登录用户", "default": "root", "required": false, "validate": "", "example": "root", "type": "string", "description": "远端登录用户名，scp/rsync 认证身份；须对目标路径有写权限"}, {"name": "remote_ip", "label": "对端 IP", "default": "", "required": true, "validate": "ipv4", "example": "192.0.2.14", "type": "ip", "description": "远端主机 IP（scp/rsync 拷贝目标），跨机传输去向；先确认 SSH 可达且免密/凭据就绪再跑大文件"}], "notes": "1) scp -l 是 Kbit/s、rsync --bwlimit 是 KB/s——差 8 倍，同一个\"8000\"含义完全不同，别混。\n2) scp 大文件中断只能重来；传 ISO 这类大文件优先 rsync -avP（见 rsync 条目），scp 留给小文件/单次快传。\n3) 首连会问 host key（yes 确认）；目标端口非 22 用 scp -P 大写、rsync -e \"ssh -p 端口\"。\n验证方法：传输完成 sha256sum 与源端比对一致即通过；限速生效用 -v 或传输速率目测核对；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：实测:scp -l 8000 到 127.0.0.1(sshpass 代答口令)传 20MB 成功,sha256 一致;dst_path 示例已修为文件路径 ✓", "duration": "temp", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(ubuntu:22.04, 容器)", "verified_date": "2026-10-09", "favorite": 0, "created_at": "2026-09-24 16:09:30", "updated_at": "2026-10-09 17:17:57", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除传输到远端/本地的目标产物（远端路径按变更记录）\nrm -f {{dst_path}}\n# 复核\nls {{dst_path}} 2>/dev/null || echo '目标已清空'"}, {"uuid": "5ad3452a-c461-57c6-87f6-7d11cf13976c", "platform": "linux", "device_type": "服务器", "vendor": "ops", "os_family": "linux", "models": "任意 Linux（RHEL/Debian 系通用）", "category": "传输工具", "title": "python3 http.server 临时文件分发（半离网）", "description": "内网无 FTP/samba 时零安装起临时下载点：python3 自带 http.server，浏览器/wget 即取。", "commands": "# ===== python3 http.server 临时文件分发 =====\n# ---- 0. 确认要分发的目录与本机 IP ----\nls {{src_path}}\nhostname -I\n# ---- 1. 起临时 HTTP 服务（前台运行，Ctrl+C 即停；卡住终端可放 tmux/screen 里跑）----\ncd {{src_path}} && python3 -m http.server {{port}}\n# ---- 2. 接收侧下载（浏览器打开 http://<hostname -I 显示的IP>:{{port}}/ 点选文件；或命令行）----\n# wget http://<本机IP>:{{port}}/文件名\n# curl -O http://<本机IP>:{{port}}/文件名\n# ---- 3. 下载完校验（分发侧先生成清单放进 {{src_path}} 更省事）----\n# sha256sum -c SHA256SUMS\n", "params": [{"name": "src_path", "label": "分发目录", "default": "", "required": true, "validate": "path", "example": "/data/share", "type": "string", "description": "源文件/目录路径（拷贝/打包起点）；rsync 尾部斜杠语义不同（带斜杠拷内容、不带拷目录本身），先 -n 演练"}, {"name": "port", "label": "监听端口", "default": "8000", "required": false, "validate": "int:1024-65535", "example": "8000", "type": "int", "range": "1024-65535", "description": "临时 HTTP 服务的监听端口（python3 -m http.server），供接收侧浏览器/wget 下载；选 1024 以上空闲端口，避免与业务端口冲突"}], "notes": "1) ★ 危险点：http.server 无鉴权，同网段任何人可浏览/下载 {{src_path}} 全部内容——只放待分发文件，用完 Ctrl+C 立即关；绝不要起在 / 或含敏感数据的目录。\n2) 防火墙会拦 {{port}}：放行见 firewalld/ufw 条目（或临时 systemctl stop firewalld 用完恢复，不建议）。\n3) python3 为 Linux 通行自带（RHEL/Debian 系都预装）；需要上传能力则换 ssh/scp 条目，http.server 只做单向分发。\n验证方法：接收侧 wget 拉取一个文件 + sha256sum 与分发侧比对一致；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：实测:http.server 8000 起服→curl -O 拉取→sha256 一致→ss 见 LISTEN→停止后端口释放 ✓", "duration": "temp", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(ubuntu:22.04, 容器)", "verified_date": "2026-10-09", "favorite": 0, "created_at": "2026-09-24 16:09:30", "updated_at": "2026-10-09 13:46:02", "exec_level": "", "interactive": 0, "rollback": "# 回退：临时 HTTP 服务为前台进程，Ctrl+C 即停（tmux/screen 里跑的先切回窗口再停）；\n# 确认端口已释放\nss -tlnp | grep :{{port}} || echo '端口已释放'"}, {"uuid": "174b1a16-198f-5013-8eed-b1b400861cdf", "platform": "network", "device_type": "交换机", "vendor": "zte", "os_family": "zxr10", "models": "中兴 ZXR10 全系列", "category": "DNS域名解析", "title": "配置 DNS 服务器与域名解析（中兴 ZXR10）", "description": "指向内网 DNS 服务器，验证域名可解析（离网内网 DNS 标准动作）。", "commands": "! ===== 配置 DNS 服务器与域名解析（中兴 ZXR10）=====\n! ---- 配置段 ----\nconfigure terminal\nip name-server {{dns_server_ip}}\nend\n! ---- 验证段 ----\nping {{test_domain}}\n", "params": [{"name": "dns_server_ip", "label": "内网 DNS 服务器 IP", "default": "", "required": true, "validate": "ipv4", "example": "192.168.66.10", "type": "ip", "description": "设备侧 DNS 服务器地址，用于域名解析（ping 域名、日志主机名反查）；须网络可达；改动立即生效"}, {"name": "test_domain", "label": "验证用内网域名", "default": "", "required": true, "validate": "", "example": "gw.corp.local", "type": "string", "description": "DNS/连通性测试域名，ping 它通 = 网络+解析都正常；不通时分层排查（先 IP 后域名）"}], "notes": "1) ZXR10 ROS 各版本查看 DNS 配置的命令差异较大：新版本支持 show ip name-server；老版本用 show running-config 后人工找 name-server 行，现场以 ? 为准。\n2) ip name-server 与 IOS 同源写法；ping 域名能解析出 IP 即生效。\n验证方法：show running-config 中核对 name-server 行 + ping test_domain，60 秒完成；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-24 16:09:30", "updated_at": "2026-10-09 13:46:03", "exec_level": "", "interactive": 0, "rollback": "! 回退：删除 name-server 引用（原 DNS 值按变更记录恢复）\nconfigure terminal\nno ip name-server {{dns_server_ip}}\nend\nwrite\n! 复核\nping {{test_domain}}"}, {"uuid": "f6e8ea28-8fe6-5a95-93c5-162e3aac0cf6", "platform": "network", "device_type": "交换机", "vendor": "cisco", "os_family": "ios", "models": "全体 Cisco 设备", "category": "时间同步", "title": "配置 NTP 服务器与状态验证（Cisco IOS）", "description": "指向内网 NTP 服务器并验证时钟同步（离网统一时基，日志/证书依赖）。", "commands": "! ===== 配置 NTP 服务器与状态验证（Cisco IOS）=====\nenable\nconfigure terminal\nntp server {{ntp_server_ip}}\nend\n! ---- 验证：Clock is synchronized + associations 的 ~* 前缀 ----\nshow ntp status\nshow ntp associations\nshow clock detail\n", "params": [{"name": "ntp_server_ip", "label": "内网 NTP 服务器 IP", "default": "", "required": true, "validate": "ipv4", "example": "192.168.66.10", "type": "ip", "description": "NTP 时间源地址，统一设备时钟；时间漂移会导致证书校验失败、日志排序混乱；须网络可达，内网建议指向专用 NTP"}], "notes": "1) show ntp status 里 Clock is synchronized、stratum 有值才算同步——刚配置要等 2-5 分钟收敛，别急着判失败。\n2) associations 输出前缀 ~* = 当前选中的同步源；~x = 该源不可用（地址错/UDP 123 被拦）。\n3) NTP 认证（ntp authenticate）与访问控制本条不含；show clock detail 应显示时间来源为 NTP。\n验证方法：show ntp status synchronized + show clock detail，收敛后 60 秒完成；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）\n—— lab 判定（场2,FRR 8.4）:不可核对(不可验证):show ntp Unknown(FRR 无内建 NTP 栈);待真机/模拟器", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-24 16:21:49", "updated_at": "2026-10-09 13:45:31", "exec_level": "", "interactive": 0, "rollback": "! 回退：删除 NTP 服务器引用（时钟恢复本地自由运行；如设备原有时钟源按变更记录恢复）\nenable\nconfigure terminal\nno ntp server {{ntp_server_ip}}\nend\nwrite memory\n! 复核\nshow ntp status\nshow clock detail"}, {"uuid": "6621a79d-127b-5e43-94f8-e4b2f76d792a", "platform": "network", "device_type": "交换机", "vendor": "cisco", "os_family": "ios", "models": "全体 Cisco 设备（IOS；IOS-XE 见 notes）", "category": "版本升级", "title": "软件版本查看、备份与升级流程（Cisco IOS）", "description": "show version → 配置/镜像双备份 → md5 校验 → 指定启动镜像 → reload → 复核。", "commands": "! ===== 版本查看、备份与升级流程（Cisco IOS）=====\n! ---- 0. ★ 三要素确认：变更窗口 / 回滚点（旧镜像保留）/ 带外 Console 通道 ----\n! ---- 0b. 备份服务器可达性确认（配置/镜像备份前必须 ping 通）----\nping {{backup_server}}\nshow version\n! ---- 1. 备份配置与当前镜像（交互式输入 TFTP 地址与文件名）----\ncopy running-config tftp:\ncopy flash: tftp:\n! ---- 2. 看 flash 空间，传输新镜像（交互式 copy tftp: flash:）----\ndir flash:\ncopy tftp: flash:\n! ---- 3. ★ 校验新镜像（md5 值来自官方下载页；不匹配绝对禁止 reload）----\nverify /md5 flash:{{ios_image}}\n! ---- 4. 指定启动镜像并保存 ----\nconfigure terminal\nboot system flash:{{ios_image}}\nend\nwrite memory\n! ---- 5. 重启加载新版本（★ 备份与回滚方案就绪后再做）----\nreload\n! ---- 6. 重启后复核 ----\nshow version\n", "params": [{"name": "backup_server", "label": "TFTP/备份服务器 IP", "default": "", "required": true, "required_note": "", "validate": "ipv4", "example": "192.168.66.20", "type": "ip", "description": "TFTP/SFTP 备份服务器地址，配置与镜像的异地留痕去向；升级/回滚前先从设备 ping 通确认可达；注意该地址可能出现在配置明文中"}, {"name": "ios_image", "label": "新版本镜像文件名", "default": "", "required": true, "required_note": "", "validate": "", "example": "c1100-universalk9.17.06.05.SPA.bin", "type": "string", "description": "Cisco IOS 镜像文件名（flash 内），boot system 启动项指向；升级/更换前必须 verify /md5 校验，镜像损坏设备起不来"}], "notes": "1) ★ 危险点：全流程含 reload（重启断业务）——必须在变更窗口；回滚点 = 旧镜像仍在 flash（空间紧张删最老的，别删当前运行版）；带外 Console 是升级失败唯一救命通道。\n2) IOS-XE 16/17 走 install 模式（request platform software system upgrade / install add file xxx.bin），与本条 boot system 流程不同——先 show version 看清 IOS/XE 再选条目。\n3) verify /md5 不匹配 = 传输损坏，重传，绝不能 reload。\n4) 交互式 copy 会依次询问地址/源/目的文件名，照实回答即可。\n验证方法：升级后 show version 新版本号 + show flash 镜像齐全 + 业务连通抽测；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-24 16:21:49", "updated_at": "2026-10-09 13:45:31", "exec_level": "", "interactive": 0, "rollback": "! 回退：回退到旧 IOS 镜像（★ 与变更同门槛：变更窗口/回滚点/带外 Console 就绪后再做；\n! 旧镜像若有显式 boot system 行，按变更记录回填替换 no 行）\nenable\nconfigure terminal\nno boot system flash:{{ios_image}}\nend\nwrite memory\n! 重启加载旧镜像（★ 确认旧镜像仍在 flash）\nreload\n! 重启后复核\nshow version\nshow flash:"}, {"uuid": "2cdea85e-079c-5aed-8ef9-a343c07b068f", "platform": "network", "device_type": "防火墙", "vendor": "fortinet", "os_family": "fortios", "models": "FortiGate 全系列", "category": "时间同步", "title": "配置 NTP 服务器与状态验证（FortiOS）", "description": "config system ntp 指向内网 NTP，execute time 验证时钟同步。", "commands": "# ===== 配置 NTP 服务器与状态验证（FortiOS）=====\nconfig system ntp\nset ntpsync enable\nconfig ntpserver\nedit 1\nset server {{ntp_server_ip}}\nnext\nend\nend\n# 实际文件名替换；存储不足先 request system storage cleanup。\n验证方法：升级后 show version 新版本 + show system storage 正常 + 业务抽测；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-24 16:21:50", "updated_at": "2026-10-09 13:45:40", "exec_level": "", "interactive": 0, "rollback": "# 回退：重装旧版本包（旧包名按变更记录回填；升级时已做 slice alternate 快照，\n# 极端情况可从备用分区引导旧系统）\nrequest system software add /var/tmp/<旧版本.tgz> reboot\n# 重启后复核\nshow version"}, {"uuid": "c1eb0f12-9b7a-5a8e-85c2-2c87e9a35b49", "platform": "linux", "device_type": "", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7（RHEL 系通用）", "category": "时间同步", "title": "配置 chrony 时间同步（CentOS 7）", "description": "chronyd 指向内网 NTP 并开机自启；证书/日志/数据库全依赖时间，部署应用前先对表。", "commands": "# ===== 配置 chrony 时间同步（CentOS 7，指向内网 NTP）=====\n# ---- 0. 备份配置 ----\ncp /etc/chrony.conf /etc/chrony.conf.bak.$(date +%Y%m%d)\n# ---- 1. 注释掉原 server 行（离网防连公网超时），追加内网 NTP ----\nsed -i 's/^server /#&/' /etc/chrony.conf\necho 'server {{ntp_server_ip}} iburst' >> /etc/chrony.conf\n# ---- 2. 重启并设开机自启 ----\nsystemctl restart chronyd && systemctl enable chronyd\n# ---- 3. 验证（^* = 已同步，^? = 未同步上）----\nchronyc sources -v\nchronyc tracking\ndate\n", "params": [{"name": "ntp_server_ip", "label": "内网 NTP 服务器 IP", "default": "", "required": true, "validate": "ipv4", "example": "192.168.66.10", "type": "ip", "description": "NTP 时间源地址，统一设备时钟；时间漂移会导致证书校验失败、日志排序混乱；须网络可达，内网建议指向专用 NTP"}], "notes": "1) chronyc sources 输出 MS 列为 ^* 才是真同步；^? 是没同步上——先查防火墙有没有放行 UDP 123、NTP 服务器侧 chrony 有没有配 allow 网段。\n2) chronyc tracking 看 Stratum 与系统时间偏差（System time 那行）；date 应与标准时间一致。\n3) 内网没有 NTP 源时，选一台服务器做源：chrony.conf 里 server 用自身/上级，另加 allow <网段>，其余机器都指向它。\n验证方法：chronyc sources 见 ^* + date 与标准时间一致，60 秒完成；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）\n—— 实测 2026-10-12（场2,Docker(ubuntu:22.04, 容器)）:语法核对(非目标发行版容器):centos7 容器 chronyd 起不来(无 CAP_SYS_TIME,adjtimex 被拒,实录);转 ubuntu 容器:chrony.conf 备份/sed 注释 server/追加 127.127.1.0+local→systemctl restart chrony→sources ^? +tracking stratum 8✓;rollback cp 恢复+重启+server 行计数复核✓;ms 级判读待真机", "duration": "perm", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-24 16:21:50", "updated_at": "2026-10-09 13:45:43", "exec_level": "verified-cli", "interactive": 0, "rollback": "# 回退：恢复变更日备份的 chrony.conf 并重启服务（备份文件名日期=变更当天）\nls -l /etc/chrony.conf.bak.*\ncp /etc/chrony.conf.bak.<变更日期> /etc/chrony.conf\nsystemctl restart chronyd\n# 复核（原 server 行恢复）\nchronyc sources -v"}, {"uuid": "cda05342-8fe9-58c0-ae88-7d95a6f84d4f", "platform": "linux", "device_type": "", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7", "category": "进程管理", "title": "进程排查与安全终止（ps/top/kill，CentOS 7）", "description": "CPU/内存 TOP 定位、进程树确认、TERM→KILL 两级终止、OOM 判读。", "commands": "# ===== 进程排查与安全终止（ps/top/kill）=====\n# ---- 1. CPU / 内存占用 TOP10（快照）----\nps aux --sort=-%cpu | head -11\nps aux --sort=-%mem | head -11\n# ---- 2. 动态判读（交互式 top：P 按CPU M 按内存，1 展开各核，q 退出）----\ntop -b -n 1 | head -15\n# ---- 3. 锁定目标进程：确认 PID、属主、父进程（别误杀子进程/服务拉起的守护）----\nps -ef | grep <关键字>\nsystemctl status <服务名> 2>/dev/null | head -8\n# ---- 4. 终止：先 TERM（15，给收尾机会），无效再 KILL（9）----\n# kill <PID>\n# kill -9 <PID>        # ★ 最后手段：不给收尾机会，可能丢数据/留共享内存段\n# ---- 5. OOM 判读（进程莫名消失先查这里）----\ndmesg | grep -i \"out of memory\" | tail -5\njournalctl -k --no-pager | grep -i -E \"oom|killed process\" | tail -5\n", "params": [], "notes": "1) ★ 危险点：kill -9 是最后手段——先 TERM 等几秒观察，数据库/中间件进程被 -9 可能丢数据或下次起不来；杀前用 ps -ef | grep 核对 PID 与属主，别按记忆敲 PID。\n2) 进程\"莫名消失\"九成是 OOM：dmesg/journalctl 里 Killed process 一行带 PID 与 oom_score，处理思路是限内存或加内存，不是重启了事。\n3) 僵尸进程（STAT=Z）杀不掉是父进程没回收：找到 PPID 处理父进程，kill 僵尸本身无效。\n4) top -b -n 1 是快照；交互式直接敲 top，P/M 排序、1 看各核。\n验证方法：ps aux --sort=-%cpu 出 TOP10 + dmesg 无 OOM 记录（或定位到消失进程），60 秒完成；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）\n—— 实测 2026-10-12（场2,Docker(centos7:local, 容器)）:实测:ps aux --sort=-%mem/top;spawn sleep 进程 kill -TERM 后 ps 确认消失 ✓", "duration": "temp", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(centos7:local, 容器)", "verified_date": "2026-10-12", "favorite": 0, "created_at": "2026-09-24 16:21:50", "updated_at": "2026-09-24 16:21:50", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "7af976e7-bc40-5885-ac88-1b0db0a8f9f9", "platform": "linux", "device_type": "", "vendor": "kylin", "os_family": "kylinV10", "models": "银河麒麟 V10", "category": "时间同步", "title": "配置 chrony 时间同步（麒麟 V10）", "description": "chronyd 指向内网 NTP 并开机自启；国产化环境对表同 RHEL 系。", "commands": "# ===== 配置 chrony 时间同步（麒麟 V10）=====\n# ---- 0. 备份配置 ----\ncp /etc/chrony.conf /etc/chrony.conf.bak.$(date +%Y%m%d)\n# ---- 1. 注释掉原 server 行，追加内网 NTP ----\nsed -i 's/^server /#&/' /etc/chrony.conf\necho 'server {{ntp_server_ip}} iburst' >> /etc/chrony.conf\n# ---- 2. 重启并设开机自启 ----\nsystemctl restart chronyd && systemctl enable chronyd\n# ---- 3. 验证 ----\nchronyc sources -v\nchronyc tracking\ndate\n", "params": [{"name": "ntp_server_ip", "label": "内网 NTP 服务器 IP", "default": "", "required": true, "validate": "ipv4", "example": "192.168.66.10", "type": "ip", "description": "NTP 时间源地址，统一设备时钟；时间漂移会导致证书校验失败、日志排序混乱；须网络可达，内网建议指向专用 NTP"}], "notes": "1) 麒麟 V10 的 chrony 与 RHEL 系完全同构（/etc/chrony.conf、chronyc 命令一致）。\n2) sources 见 ^* 才是真同步；^? 先查 UDP 123 与 NTP 服务端 allow 配置。\n3) 若系统用 ntpd 而非 chrony（少数老装机构建）：systemctl status ntpd 区分，别混配。\n验证方法：chronyc sources 见 ^* + date 一致，60 秒完成；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）\n—— 实测 2026-10-12（场2,Docker(centos7:local, 容器)）:语法核对(非目标发行版容器,裁决A):RHEL 路径 /etc/chrony.conf 段 centos7 容器核对+服务栈/sources 判读 ubuntu 容器(b3/b4 证据);ms 级判读待真机", "duration": "perm", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-24 16:21:50", "updated_at": "2026-10-09 13:45:45", "exec_level": "verified-cli", "interactive": 0, "rollback": "# 回退：恢复变更日备份的 chrony.conf 并重启服务（备份文件名日期=变更当天）\nls -l /etc/chrony.conf.bak.*\ncp /etc/chrony.conf.bak.<变更日期> /etc/chrony.conf\nsystemctl restart chronyd\n# 复核（原 server 行恢复）\nchronyc sources -v"}, {"uuid": "e7e0e777-1cb0-5861-b2bb-8a3b204175f9", "platform": "linux", "device_type": "", "vendor": "kylin", "os_family": "kylinV10", "models": "麒麟 V10", "category": "进程管理", "title": "进程排查与安全终止（ps/top/kill，麒麟 V10）", "description": "CPU/内存 TOP 定位、进程树确认、TERM→KILL 两级终止、OOM 判读。", "commands": "# ===== 进程排查与安全终止（ps/top/kill）=====\n# ---- 1. CPU / 内存占用 TOP10（快照）----\nps aux --sort=-%cpu | head -11\nps aux --sort=-%mem | head -11\n# ---- 2. 动态判读（交互式 top：P 按CPU M 按内存，1 展开各核，q 退出）----\ntop -b -n 1 | head -15\n# ---- 3. 锁定目标进程：确认 PID、属主、父进程（别误杀子进程/服务拉起的守护）----\nps -ef | grep <关键字>\nsystemctl status <服务名> 2>/dev/null | head -8\n# ---- 4. 终止：先 TERM（15，给收尾机会），无效再 KILL（9）----\n# kill <PID>\n# kill -9 <PID>        # ★ 最后手段：不给收尾机会，可能丢数据/留共享内存段\n# ---- 5. OOM 判读（进程莫名消失先查这里）----\ndmesg | grep -i \"out of memory\" | tail -5\njournalctl -k --no-pager | grep -i -E \"oom|killed process\" | tail -5\n", "params": [], "notes": "1) ★ 危险点：kill -9 是最后手段——先 TERM 等几秒观察，数据库/中间件进程被 -9 可能丢数据或下次起不来；杀前用 ps -ef | grep 核对 PID 与属主，别按记忆敲 PID。\n2) 进程\"莫名消失\"九成是 OOM：dmesg/journalctl 里 Killed process 一行带 PID 与 oom_score，处理思路是限内存或加内存，不是重启了事。\n3) 僵尸进程（STAT=Z）杀不掉是父进程没回收：找到 PPID 处理父进程，kill 僵尸本身无效。\n4) top -b -n 1 是快照；交互式直接敲 top，P/M 排序、1 看各核。\n验证方法：ps aux --sort=-%cpu 出 TOP10 + dmesg 无 OOM 记录（或定位到消失进程），60 秒完成；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）\n—— 实测 2026-10-12（场2,Docker(ubuntu:22.04, 容器)）:语法核对(裁决A):kill -TERM spawn 进程 KILL-OK✓", "duration": "temp", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-24 16:21:50", "updated_at": "2026-09-24 16:21:50", "exec_level": "verified-cli", "interactive": 0, "rollback": ""}, {"uuid": "23379895-06ce-5721-9792-3ec24e5c482b", "platform": "linux", "device_type": "", "vendor": "openeuler", "os_family": "openeuler2203", "models": "openEuler 22.03 LTS", "category": "时间同步", "title": "配置 chrony 时间同步（openEuler 22.0 mem | head -11\n# ---- 2. 动态判读（交互式 top：P 按CPU M 按内存，1 展开各核，q 退出）----\ntop -b -n 1 | head -15\n# ---- 3. 锁定目标进程：确认 PID、属主、父进程（别误杀子进程/服务拉起的守护）----\nps -ef | grep <关键字>\nsystemctl status <服务名> 2>/dev/null | head -8\n# ---- 4. 终止：先 TERM（15，给收尾机会），无效再 KILL（9）----\n# kill <PID>\n# kill -9 <PID>        # ★ 最后手段：不给收尾机会，可能丢数据/留共享内存段\n# ---- 5. OOM 判读（进程莫名消失先查这里）----\ndmesg | grep -i \"out of memory\" | tail -5\njournalctl -k --no-pager | grep -i -E \"oom|killed process\" | tail -5\n", "params": [], "notes": "1) ★ 危险点：kill -9 是最后手段——先 TERM 等几秒观察，数据库/中间件进程被 -9 可能丢数据或下次起不来；杀前用 ps -ef | grep 核对 PID 与属主，别按记忆敲 PID。\n2) 进程\"莫名消失\"九成是 OOM：dmesg/journalctl 里 Killed process 一行带 PID 与 oom_score，处理思路是限内存或加内存，不是重启了事。\n3) 僵尸进程（STAT=Z）杀不掉是父进程没回收：找到 PPID 处理父进程，kill 僵尸本身无效。\n4) top -b -n 1 是快照；交互式直接敲 top，P/M 排序、1 看各核。\n验证方法：ps aux --sort=-%cpu 出 TOP10 + dmesg 无 OOM 记录（或定位到消失进程），60 秒完成；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）\n—— 实测 2026-10-12（场2,Docker(ubuntu:22.04, 容器)）:语法核对(裁决A):ps aux --sort✓", "duration": "temp", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-24 16:21:50", "updated_at": "2026-09-24 16:21:50", "exec_level": "verified-cli", "interactive": 0, "rollback": ""}, {"uuid": "e28d4a54-7e60-5293-8459-af5c1bb57a71", "platform": "linux", "device_type": "", "vendor": "ubuntu", "os_family": "ubuntu2204", "models": "Ubuntu 22.04", "category": "时间同步", "title": "配置 systemd-timesyncd 时间同步（Ubuntu 22.04）", "description": "Ubuntu 原生 timesyncd 指向内网 NTP；要 chrony 见 notes（两者别同时跑）。", "commands": "# ===== 配置 systemd-timesyncd 时间同步（Ubuntu 22.04）=====\n# ---- 0. 备份 ----\ncp /etc/systemd/timesyncd.conf /etc/systemd/timesyncd.conf.bak.$(date +%Y%m%d)\n# ---- 1. 指向内网 NTP（NTP= 大写；FallbackNTP 留空防连公网）----\ncat > /etc/systemd/timesyncd.conf << 'EOF'\n[Time]\nNTP={{ntp_server_ip}}\nFallbackNTP=\nEOF\n# ---- 2. 重启并确认 NTP 服务开启 ----\nsystemctl restart systemd-timesyncd\ntimedatectl set-ntp true\n# ---- 3. 验证 ----\ntimedatectl status\ntimedatectl timesync-status\n", "params": [{"name": "ntp_server_ip", "label": "内网 NTP 服务器 IP", "default": "", "required": true, "validate": "ipv4", "example": "192.168.66.10", "type": "ip", "description": "NTP 时间源地址，统一设备时钟；时间漂移会导致证书校验失败、日志排序混乱；须网络可达，内网建议指向专用 NTP"}], "notes": "1) Ubuntu 22.04 默认用 systemd-timesyncd（不是 chrony）；若已装 chrony 需先 systemctl disable --now chrony，两个时间服务同时跑会互抢。\n2) timedatectl timesync-status 里 Offset 是偏差、Sync Status 应为 synchronized；NTP 服务没起先看 firewall 是否拦 UDP 123。\n3) 需要 chrony 的高级功能（作为内网 NTP 源对外服务）时：apt install chrony（本地源，见本地源条目）后改用 chrony.conf，并 disable timesyncd。\n验证方法：timedatectl status 显示 synchronized + timesync-status 偏差毫秒级，60 秒完成；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：实测:备份→写 conf→restart rc=0→timedatectl synchronized:yes;timesync-status 查询超时(timesync1 bus 不可达,WSL2 环境);回退恢复备份 restart ✓——毫秒级偏差判读待真机", "duration": "perm", "verified": 0, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(ubuntu:22.04, 容器)", "verified_date": "2026-10-09", "favorite": 0, "created_at": "2026-09-24 16:21:50", "updated_at": "2026-10-09 13:45:49", "exec_level": "verified-cli", "interactive": 0, "rollback": "# 回退：恢复变更日备份的 timesyncd.conf 并重启服务\nls -l /etc/systemd/timesyncd.conf.bak.*\ncp /etc/systemd/timesyncd.conf.bak.<变更日期> /etc/systemd/timesyncd.conf\nsystemctl restart systemd-timesyncd\n# 复核\ntimedatectl timesync-status"}, {"uuid": "e348e7c7-d8be-5c21-92dd-a18c22946754", "platform": "linux", "device_type": "", "vendor": "ubuntu", "os_family": "ubuntu2204", "models": "Ubuntu 22.04", "category": "进程管理", "title": "进程排查与安全终止（ps/top/kill，Ubuntu 22.04）", "description": "CPU/内存 TOP 定位、进程树确认、TERM→KILL 两级终止、OOM 判读。", "commands": "# ===== 进程排查与安全终止（ps/top/kill）=====\n# ---- 1. CPU / 内存占用 TOP10（快照）----\nps aux --sort=-%cpu | head -11\nps aux --sort=-%mem | head -11\n# ---- 2. 动态判读（交互式 top：P 按CPU M 按内存，1 展开各核，q 退出）----\ntop -b -n 1 | head -15\n# ---- 3. 锁定目标进程：确认 PID、属主、父进程（别误杀子进程/服务拉起的守护）----\nps -ef | grep <关键字>\nsystemctl status <服务名> 2>/dev/null | head -8\n# ---- 4. 终止：先 TERM（15，给收尾机会），无效再 KILL（9）----\n# kill <PID>\n# kill -9 <PID>        # ★ 最后手段：不给收尾机会，可能丢数据/留共享内存段\n# ---- 5. OOM 判读（进程莫名消失先查这里）----\ndmesg | grep -i \"out of memory\" | tail -5\njournalctl -k --no-pager | grep -i -E \"oom|killed process\" | tail -5\n", "params": [], "notes": "1) ★ 危险点：kill -9 是最后手段——先 TERM 等几秒观察，数据库/中间件进程被 -9 可能丢数据或下次起不来；杀前用 ps -ef | grep 核对 PID 与属主，别按记忆敲 PID。\n2) 进程\"莫名消失\"九成是 OOM：dmesg/journalctl 里 Killed process 一行带 PID 与 oom_score，处理思路是限内存或加内存，不是重启了事。\n3) 僵尸进程（STAT=Z）杀不掉是父进程没回收：找到 PPID 处理父进程，kill 僵尸本身无效。\n4) top -b -n 1 是快照；交互式直接敲 top，P/M 排序、1 看各核。\n验证方法：ps aux --sort=-%cpu 出 TOP10 + dmesg 无 OOM 记录（或定位到消失进程），60 秒完成；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：实测:ps/top 快照、ps -ef|grep 定位、dmesg 与 journalctl -k 无 OOM 记录(空属正常);未做真实 kill(免破坏现场) ✓", "duration": "temp", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(ubuntu:22.04, 容器)", "verified_date": "2026-10-09", "favorite": 0, "created_at": "2026-09-24 16:21:50", "updated_at": "2026-09-24 16:21:50", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "3db181e1-b710-51c0-958f-68f59fa45503", "platform": "network", "device_type": "防火墙", "vendor": "paloalto", "os_family": "panos", "models": "Palo Alto 全系列", "category": "时间同步", "title": "配置 NTP 服务器与状态验证（PAN-OS，set 系）", "description": "set ntp-servers 指向内网 NTP 并 commit，show ntp 验证同步状态。", "commands": "# ===== 配置 NTP 服务器与状态验证（PAN-OS，set 系）=====\nset deviceconfig system ntp-servers primary-ntp ntp-server-address {{ntp_server_ip}}\ncommit\n# ---- 验证（收敛需数分钟）----\nshow ntp\nshow system info | match datetime\n", "params": [{"name": "ntp_server_ip", "label": "内网 NTP 服务器 IP", "default": "", "required": true, "validate": "ipv4", "example": "192.168.66.10", "type": "ip", "description": "NTP 时间源地址，统一设备时钟；时间漂移会导致证书校验失败、日志排序混乱；须网络可达，内网建议指向专用 NTP"}], "notes": "1) Web 路径：Device → Setup → Services → NTP；CLI set 后必须 commit。\n2) show ntp 的 SYNCHRONIZED 才是同步成功；首次同步可能要几分钟。\n3) 备用 NTP：secondary-ntp 同结构追加。\n验证方法：show ntp 显示 SYNCHRONIZED + show system info 时间准确，收敛后 60 秒完成；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-24 16:21:50", "updated_at": "2026-10-09 13:45:52", "exec_level": "", "interactive": 0, "rollback": "# 回退：撤销 NTP 配置\nconfigure\ndelete deviceconfig system ntp-servers primary-ntp\ncommit\n# 复核\nshow ntp"}, {"uuid": "2e2c7470-dd13-525f-9419-ec95b07b3a0b", "platform": "network", "device_type": "防火墙", "vendor": "paloalto", "os_family": "panos", "models": "Palo Alto 全系列", "category": "版本升级", "title": "软件版本查看、备份与升级流程（PAN-OS，request 系）", "description": "show system info → software download/install → 重启复核。", "commands": "# ===== 版本查看、备份与升级流程（PAN-OS）=====\n# ---- 0. ★ 三要素：变更窗口 / 回滚点 / 带外通道 ----\n# ---- 0b. 备份服务器可达性确认（导出/备份前）----\nping host {{backup_server}}\nshow system info | match sw-version\n# ---- 1. 下载目标版本（设备可达更新源；离网用离线包经 Web 上传）----\nrequest system software download version <目标版本号>\nrequest system software download status\n# ---- 2. 安装（安装完需手动 reboot 才切换）----\nrequest system software install version <目标版本号>\nrequest system reboot\n# ---- 3. 重启后复核 ----\nshow system info | match sw-version\n", "params": [{"name": "backup_server", "label": "TFTP/备份服务器 IP", "default": "", "required": true, "required_note": "", "validate": "ipv4", "example": "192.168.66.20", "type": "ip", "description": "TFTP/SFTP 备份服务器地址，配置与镜像的异地留痕去向；升级/回滚前先从设备 ping 通确认可达；注意该地址可能出现在配置明文中"}], "notes": "1) ★ 危险点（变更窗口/回滚点/带外通道三要素先行）：install + reboot 两段式，中间不可断电；PAN-OS 自带旧版本分区（软件管理页可切换回退），回滚点天然存在。\n2) 升级前确认 content/威胁库版本与目标 PAN-OS 兼容；跨大版本按官方升级路径逐级升。\n3) 离网环境：官方站点下载 .tar 离线包，Web（Device → Software）上传安装更直接。\n4) <目标版本号> 按实际替换（如 10.2.9）。\n验证方法：升级后 show system info sw-version 新版本 + Web 登录 + 策略抽测；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-24 16:21:50", "updated_at": "2026-10-09 13:45:52", "exec_level": "", "interactive": 0, "rollback": "# 回退：PAN-OS 回退=重装旧版本（旧版本号按变更记录回填；\n# 升级窗口内下载的旧版本包仍可 install）\nrequest system software install version <旧版本号>\nrequest system reboot\n# 重启后复核\nshow system info | match sw-version"}, {"uuid": "10f38c42-b923-50d5-bf00-5e689aa0f2a6", "platform": "network", "device_type": "交换机", "vendor": "ruijie", "os_family": "rgos", "models": "锐捷 RGOS 全系列", "category": "时间同步", "title": "配置 NTP 服务器与状态验证（锐捷 RGOS）", "description": "ntp server 指向内网 NTP 并验证时钟同步（IOS 系同源写法）。", "commands": "! ===== 配置 NTP 服务器与状态验证（锐捷 RGOS）=====\nenable\nconfigure terminal\nntp server {{ntp_server_ip}}\nend\n! ---- 验证 ----\nshow ntp status\nshow ntp associations\nshow clock detail\n", "params": [{"name": "ntp_server_ip", "label": "内网 NTP 服务器 IP", "default": "", "required": true, "validate": "ipv4", "example": "192.168.66.10", "type": "ip", "description": "NTP 时间源地址，统一设备时钟；时间漂移会导致证书校验失败、日志排序混乱；须网络可达，内网建议指向专用 NTP"}], "notes": "1) RGOS 与 IOS 同源：ntp server / show ntp status 写法一致，Clock is synchronized 判据相同。\n2) 部分盒式版本 show ntp status 输出项较少，以 associations 的 ~* 标记 + show clock detail 为准。\n验证方法：show ntp status synchronized + show clock detail，收敛后 60 秒完成；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-24 16:21:50", "updated_at": "2026-10-09 13:45:54", "exec_level": "", "interactive": 0, "rollback": "! 回退：删除 NTP 服务器引用（时钟恢复本地自由运行）\nenable\nconfigure terminal\nno ntp server {{ntp_server_ip}}\nend\nwrite\n! 复核\nshow ntp status\nshow clock detail"}, {"uuid": "14f6d356-c4e7-5af0-9bc7-64924b5fc9a3", "platform": "network", "device_type": "交换机", "vendor": "ruijie", "os_family": "rgos", "models": "锐捷 RGOS 全系列", "category": "版本升级", "title": "软件版本查看、备份与升级流程（锐捷 RGOS）", "description": "show version → 备份 → 传输新镜像 → boot system 指定 → reload。", "commands": "! ===== 版本查看、备份与升级流程（锐捷 RGOS） etwork", "device_type": "防火墙", "vendor": "fortinet", "os_family": "fortios", "models": "防火墙全系列", "category": "防火墙诊断", "title": "NAT 会话与端口映射诊断（FortiOS）", "description": "按公网地址过滤会话看 NAT 转换段 + 查 VIP 映射表（端口映射不通第一排查动作）。", "commands": "# ===== NAT 会话与端口映射诊断（FortiOS）=====\n# ---- 1. 按公网目的地址过滤会话 ----\ndiagnose sys session filter clear\ndiagnose sys session filter dst {{target_ip}}\ndiagnose sys session list\n# ---- 2. 会话条目看 NAT 转换段（translated 字段 = 转换后的真实地址:端口）----\n# ---- 3. VIP/端口映射配置核对（映射表 + 引用的真实服务器）----\nshow firewall vip\n", "params": [{"name": "target_ip", "label": "排查目标 IP（内网服务器/公网映射地址）", "default": "", "required": true, "validate": "ipv4", "example": "192.168.10.100", "type": "ip", "description": "会话/调试过滤的目标 IP（FortiGate/PaloAlto 诊断命令），缩小排障范围；仅诊断用途不影响配置"}], "notes": "1) 端口映射不通最常见三种：会话里 translated 地址/端口与预期不符（VIP 配错真实服务器）、映射存在但安全策略没放行转换后流量、协议没勾（只映射了 tcp 没勾 udp）。\n2) 会话里 nat 段缺失 = 没走 NAT（策略没开 NAT 或路由绕过）。\n3) show firewall vip 核对外部 IP/端口与 mappedip 一一对应；多 VIP 逐条核对。\n验证方法：外部实测端口 + 会话 translated 字段与 VIP 配置三方一致即通过；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-24 16:58:15", "updated_at": "2026-10-09 13:45:33", "exec_level": "", "interactive": 0, "rollback": "# 回退：清理会话过滤条件（诊断会话级，不影响流量与配置）\ndiagnose sys session filter clear"}, {"uuid": "24feb9c8-bdf3-54e9-8291-cf5462701e46", "platform": "network", "device_type": "防火墙", "vendor": "paloalto", "os_family": "panos", "models": "防火墙全系列", "category": "防火墙诊断", "title": "会话表与策略命中诊断（PAN-OS）", "description": "show session 过滤 + show running security-policy 看生效策略序（配了策略不通的第一排查动作）。", "commands": "# ===== 会话表与策略命中诊断（PAN-OS）=====\n# ---- 1. 按目的地址过滤会话 ----\nshow session all filter destination {{target_ip}}\n# ---- 2. 会话总数与速率概览 ----\nshow session info\n# ---- 3. 当前生效的安全策略（按序命中，排前的先赢）----\nshow running security-policy\n", "params": [{"name": "target_ip", "label": "排查目标 IP（内网服务器/公网映射地址）", "default": "", "required": true 登录过的账号（排查僵尸账号）：\nlastlog | grep -v \"Never logged in\" | head -10\n# ---- 2. 失败登录（爆破特征：同一来源连续 Failed）----\ngrep -c \"Failed password\" /var/log/secure\ngrep \"Failed password\" /var/log/secure | tail -8\n# ---- 3. 审计服务状态（auditd 在跑才有审计事件）----\nsystemctl status auditd --no-pager | head -5\n# auditctl -l        <- 当前审计规则（为空 = 只记系统默认）\n", "params": [], "notes": "1) 登录痕迹三件套：last（历史登录，含来源 IP）、w（当前在线）、lastlog（各账号最后一次登录——长期 Never 的账号是清理对象）。\n2) 失败登录看 secure：同一来源 IP 连续 Failed password 是爆破特征，配合防火墙封禁来源 IP。\n3) secure 日志为 /var/log/secure（sshd 登录成败都在这里）。\n4) auditd 规则为空不代表没日志，只是没自定义审计规则；现场取证需求再按需加规则（-w 监控关键文件）。\n验证方法：last/w 有记录、grep 失败登录有计数、auditd running，三条命令 60 秒完成；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）\n—— 实测 2026-10-12（场2,Docker(centos7:local, 容器)）:语法核对:lastlog 实跑✓;last command not found(镜像缺 util-linux 组件?真机有)+who 空记录(sshd 前台不经 PAM utmp)——降档,真机复核 last/who", "duration": "temp", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-28 10:47:40", "updated_at": "2026-09-28 10:47:40", "exec_level": "verified-cli", "interactive": 0, "rollback": ""}, {"uuid": "9794adfc-ecad-5515-aacb-8ad7b34cf1a0", "platform": "linux", "device_type": "", "vendor": "kylin", "os_family": "kylinV10", "models": "麒麟 V10", "category": "审计日志", "title": "登录痕迹与审计排查（麒麟 V10）", "description": "last/w/lastlog 登录痕迹 + 失败登录爆破特征 + auditd 服务状态（账号治理与取证常用）。", "commands": "# ===== 登录痕迹与审计排查（麒麟 V10）=====\n# ---- 1. 最近登录记录（来源 IP/端口/时段）----\nlast -n 15\n# 当前在线：\nw\n# 从未登录过的账号（排查僵尸账号）：\nlastlog | grep -v \"Never logged in\" | head -10\n# ---- 2. 失败登录（爆破特征：同一来源连续 Failed）----\ngrep -c \"Failed password\" /var/log/secure\ngrep \"Failed password\" /var/log/secure | tail -8\n# ---- 3. 审计服务状态（auditd 在跑才有审计事件）----\nsystemctl status auditd --no-pager | head -5\n# auditctl -l        <- 当前审计规则（为空 = 只记系统默认）\n", "params": [], "notes": "1) 登录痕迹三件套：last（历史登录，含来源 IP）、w（当前在线）、lastlog（各账号最后一次登录——长期 Never 的账号是清理对象）。\n2) 失败登录看 secure：同一来源 IP 连续 Failed password 是爆破特征，配合防火墙封禁来源 I --\nshow high-availability state\n# ---- 2. HA 链路监控（heartbeat/hb2 状态）----\nshow high-availability link-monitoring\nshow high-availability path-monitoring\n# ---- 3. 运行配置同步确认 ----\nshow high-availability sync\n", "params": [], "notes": "1) show high-availability state 里 local 为 active、peer 为 passive 才是正常主备；local 显示 suspended/non-functional 要查 reason 字段。\n2) sync 状态 \"synced\" 才是配置一致；\"sync pending\" 表示配置未同步完，此时切机会有差异。\n3) 切换验证：主设备挂起（request high-availability state suspend）观察备机接管，变更窗口内做。\n验证方法：两台 state 互为主备 + sync synced + 模拟切换接管成功；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-28 10:47:40", "updated_at": "2026-09-28 10:47:40", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "318680d4-6762-5dfc-98cb-1755a48f5936", "platform": "network", "device_type": "防火墙", "vendor": "sangfor", "os_family": "sangfor_af", "models": "深信服 AF 全系列（双机热备）", "category": "HA/双机", "title": "HA 双机热备状态检查（深信服 AF，骨架 + Web 对照）", "description": "双机热备主备角色、心跳与配置同步检查；以 Web 为主，CLI 骨架待真机核对。", "commands": "# ⚠ 待真机核对：本条目为 CLI 骨架 + Web 控制台对照，命令行未在本厂商真机验证过。\n#\n# ---- Web 控制台路径（标准做法）----\n# 1. 系统 → 双机热备：查看本机角色（主机/备机）、对端状态、心跳口状态；\n# 2. 核对配置同步状态（是否一致/最近同步时间）；\n# 3. 切换演练：变更窗口内停主机心跳或点主动切换，观察备机接管。\n#\n# ---- CLI 骨架（关键字待现场用 ? 确认）----\n# show ha / show dual 相关命令按 ? 实测\n", "params": [], "notes": "1) ★ 待真机核对：AF 双机热备 CLI 各版本差异大，优先走 Web 双机热备页。\n2) 巡检三看：主备角色、心跳口 up、配置同步一致——任何一项异常都会在切换时掉业务。\n3) 核对通过后回填本条目并升 exec_level 为 verified-cli。\n验证方法：Web 双机页三要素正常 + 模拟切换接管成功；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-28 10:47:40", "updated_at": "2026-09-28 10:47:40", "exec_level": "skeleton", "interactive": 0, "rollback": ""}, {"uuid": "a7ab91d3-d1d3-5150-987c-de7f91f57ccb", "platform": "network", "device_type": "防火墙", "vendor": "topsec", "os_family": "topos", "models": "天融信 TopOS 全系列（双机热备）", "category": "HA/双机", "title": "HA 双机热备状态检查（天融信 TopOS，骨架 + Web 对照）", "description": "双机热备主备角色、心跳与配置同步检查；以 Web 为主，CLI 骨架待真机核对。", "commands": "# ⚠ 待真机核对：本条目为 CLI 骨架 + Web 控制台对照，命令行未在本厂商真机验证过。\n#\n# ---- Web 控制台路径（标准做法）----\n# 1. 系统 → 双机热备/HA：查看本机角色、对端状态、心跳；\n# 2. 核对配置同步状态；\n# 3. 切换演练在变更窗口内进行。\n#\n# ---- CLI 骨架（关键字待现场用 ? 确认）----\n# show ha / ha 相关命令按 ? 实测\n", "params": [], "notes": "1) ★ 待真机核对：TopOS 双机 CLI 差异大，优先走 Web。\n2) 巡检三看：主备角色、心跳、配置同步。\n3) 核对通过后回填本条目并升 exec_level 为 verified-cli。\n验证方法：Web 双机页三要素正常 + 模拟切换接管成功；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-28 10:47:40", "updated_at": "2026-09-28 10:47:40", "exec_level": "skeleton", "interactive": 0, "rollback": ""}, {"uuid": "250cdf66-7530-5c2c-8143-5d294078d57e", "platform": "linux", "device_type": "", "vendor": "ops", "os_family": "linux", "models": "任意 Linux（客户端/服务端通用）", "category": "地址分配", "title": "DHCP 客户端取址与服务端排查（Linux 通用）", "description": "Linux 侧拿不到地址时：客户端重新取址 + 服务端 dnsmasq 状态 + 抓包定位（半离网办公网/隔离区通用）。", "commands": "# ===== DHCP 客户端取址与服务端排查（Linux 通用）=====\n# ---- 0. 看当前地址与网卡状态（有没有拿到 169.254.* 自动私有地址 = 取址失败的典型特征）----\nip -4 addr show\n# ---- 1. 客户端重新取址（指定网卡，-v 显示交互过程）----\n# dhclient -v <网卡名>          # 有 dhclient 的系统\n# nmcli con up \"<连接名>\"       # NetworkManager 系统重连即触发 DHCP\n# ---- 2. 服务端侧（本机是 dnsmasq DHCP 时）：服务状态与租约表 ----\nsystemctl status dnsmasq --no-pager | head -8\n# tail /var/lib/misc/dnsmasq.leases        ← 租约表路径按配置核实\n# ---- 3. 定位 DISCOVER 有没有到服务端（服务端/中继上抓包）----\n# tcpdump -i <网卡名> -n port 67 or port 68\n", "params": [], "notes": "1) 拿到 169.254.x.x = DHCP 请求发出但无服务端应答：查服务端存活、中继（ip helper）配置、VLAN 间广播是否被隔离。\n2) tcpdump 看到 DISCOVER 没有 OFFER = 服务端池空/池错网段；连 DISCOVER 都没有 = 客户端侧问题（网卡/交换机端口/中继）。\n3) <网卡名>/<连接名> 按实际替换（ip link / nmcli con show 查看）。\n验证方法：客户端 ip addr 拿到预期网段地址 + 服务端租约表出现该终端记录；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）\n—— 实验室实测 2026-10-09（场1,ubuntu:22.04）：实测:ip -4 addr 正常;装 dnsmasq 后 systemctl status 单元可见(inactive);完整取址场景需服务端+客户端拓扑,实验室单机不可复现", "duration": "temp", "verified": 0, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(ubuntu:22.04, 容器)", "verified_date": "2026-10-09", "favorite": 0, "created_at": "2026-09-28 10:47:40", "updated_at": "2026-09-28 10:47:40", "exec_level": "verified-cli", "interactive": 0, "rollback": ""}, {"uuid": "6156cb72-fcd3-5f9f-926a-7b93745d3764", "platform": "network", "device_type": "交换机", "vendor": "cisco", "os_family": "ios", "models": "全体 Cisco 设备（IOS）", "category": "配置回滚", "title": "配置回滚（Cisco IOS，archive/replace）", "description": "改配置前用 archive 存回滚点，改坏后 configure replace 整体回退（比手工 undo 稳）。", "commands": "! ===== 配置回滚（Cisco IOS）=====\n! ---- 0. 改动前：建立回滚点（archive 方式，先配置 archive 路径）----\nconfigure terminal\narchive\n path flash:archive-config\n write-memory\nexit\narchive config\nexit\n! ---- 1. 改动出问题后：整体回退到备份文件（★ 回滚前先 diff）----\nshow archive config differences nvram:startup-config flash:{{backup_file}}\nconfigure replace flash:{{backup_file}} force\n! ---- 2. 复核 ----\nshow running-config | include <核对关键字>\n", "params": [{"name": "backup_file", "label": "备份配置文件名", "default": "", "required": true, "validate": "", "example": "confg-bak-20260928.cfg", "type": "string", "description": "备份配置在设备存储中的文件名（如 old-cfg.cfg）；configure replace 会以它整体回滚配置——回滚是全量替换动作，执行前先 diff 确认目标文件内容"}], "notes": "1) ★ 危险点：configure replace 是整体替换运行配置——替换前先 show archive config differences 做 diff，确认只回退不该回退的没有。\n2) configure replace 需要 archive 配置过；未配 archive 的老平台用 copy flash:xxx running-config 替代（注意是 merge 不是 replace，效果不同）。\n3) 与《保存配置并备份到本地 flash》分工：那条是\"改动后保存\"，本条是\"改坏后回退\"——先有保存的备份才有回滚点。\n4) 回滚后 write memory 与否取决于你要不要把回滚态固化（默认固化）。\n验证方法：diff 确认差异仅目标改动 + replace 后 show running-config 复核 + 业务抽测；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-28 11:09:34", "updated_at": "2026-10-09 13:45:31", "exec_level": "", "interactive": 0, "rollback": "! 回退：本条目本身即回滚操作；若 configure replace 后需退回 replace 前状态，\n! 对 replace 前自动生成的 archive 存档再次 replace（N 按 show archive 输出确认）\nenable\nshow archive\nconfigure replace flash:archive-config-<N> force\n! 复核\nshow running-config | include <核对关键字>"}, {"uuid": "9c901a97-f2b6-54aa-bdd0-5187f3aa42eb", "platform": "network", "device_type": "交换机", "vendor": "cisco", "os_family": "ios", "models": "Cisco", "category": "AAA认证", "title": "配置 AAA 认证与本地兜底（Cisco IOS）", "description": "radius/tacacs+ 服务器 + 本地兜底顺序 + test aaa 验证（先验证后退出，见 notes 铁律）。", "commands": "! ===== AAA 认证与本地兜底（Cisco IOS）=====\nenable\nconfigure terminal\n! ---- 1. AAA 总开关 ----\naaa new-model\n! ---- 2. 服务器组（TACACS+ 为例；RADIUS 换 aaa group server radius）----\ntacacs server TAC1\n address ipv4 {{aaa_server_ip}}\n key {{aaa_shared_key}}\nexit\n! ---- 3. 认证顺序：先服务器，本地兜底 ----\naaa authentication login default group tacacs+ local\naaa authorization exec default group tacacs+ local\n! ---- 4. ★ 验证（新开窗口测，勿退当前会话）----\ntest aaa group tacacs+ {{test_user}} {{test_password}} legacy\n! ---- 5. 本地兜底账号确认存在 ----\nusername {{local_user}} privilege 15 secret {{local_password}}\nend\n", "params": [{"name": "aaa_server_ip", "label": "AAA 服务器 IP", "default": "", "required": true, "validate": "ipv4", "example": "192.168.66.30", "type": "ip", "description": "AAA/RADIUS/TACACS 服务器地址，决定设备把认证/授权/审计请求发往哪台服务器；填内网可达的管理网段 IP；配错将导致所有远程登录认证失败，建议先 ping 通再下发"}, {"name": "aaa_shared_key", "label": "共享密钥", "default": "", "required": true, "validate": "", "example": "现场生成强密钥", "type": "string", "description": "AAA 服务器共享密钥，用于设备与服务器间认证报文的加密校验；必须与服务器侧完全一致；配置中可能弱加密存储，导出配置时注意脱敏"}, {"name": "test_user", "label": "验证用域账号", "default": "", "required": true, "validate": "", "example": "netadmin", "type": "string", "description": "AAA 测试用户名，验证 RADIUS/TACACS 服务器联通性；测试失败优先查共享密钥与 NAS IP 配置"}, {"name": "test_password", "label": "验证用口令", "default": "", "required": true, "validate": "", "example": "现场生成强口令", "type": "string", "description": "AAA 测试口令，test aaa/test-aaa 验证服务器认证链路；与正式口令一致即可，仅测试用途"}, {"name": "local_user", "label": "本地兜底账号", "default": "", "required": true, "validate": "", "example": "netadmin", "type": "string", "description": "本地登录用户名，设备本地认证的身份标识；其权限等级（privilege/level）决定可执行命令范围，遵循最小权限"}, {"name": "local_password", "label": "本地兜底口令", "default": "", "required": true, "validate": "", "example": "现场生成强口令", "type": "string", "description": "本地账号口令，控制该用户登录认证；privilege 15 级账号等同最高权限，口令泄露等于设备失守；配置中可能弱加密存储，导出时脱敏"}], "notes": "1) ★ 危险点（AAA 第一铁律）：配置 AAA 后**不要退出当前会话**——先用新开窗口验证能登录，确认兜底本地账号可用再断开；配置错误把自己锁外面只能 Console 救。\n2) ★ 保留 Console 通道：AAA 服务器不可达时 Console 是最后生命线（console 上配置本地兜底）。\n3) 本地兜底顺序必须显式配置（radius/tacacs 之后跟 local），服务器全挂时才回落本地账号。\n4) test aaa 返回 PASSED 才算服务器侧通；返回 FAIL 要区分口令错还是服务器拒绝。\n5) 与《开启 SSH 并创建本地管理用户》配套：本地兜底账号就是那条建的用户。\n验证方法：test aaa PASSED + 新窗口用域账号登录成功 + 拔服务器线后本地账号仍可登录；（验证人/型号/日期验证通过后回填 verified，属下轮真机验证会重点对象）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-28 11:09:35", "updated_at": "2026-10-09 13:45:31", "exec_level": "", "interactive": 0, "rollback": "! 回退：撤销 AAA（★ 先确认 console/本地账号仍可登录，再按序撤销；\n! 本地兜底账号若变更前不存在则一并删除）\nenable\nconfigure terminal\nno aaa authentication login default group tacacs+ local\nno aaa authorization exec default group tacacs+ local\nno username {{local_user}}\nno tacacs server TAC1\nno aaa new-model\nend\nwrite memory\n! 复核\nshow running-config | include aaa|tacacs"}, {"uuid": "2511fe7a-f082-5cae-9a9e-781e9c3b81fd", "platform": "network", "device_type": "防火墙", "vendor": "fortinet", "os_family": "fortios", "models": "FortiGate 全系列", "category": "配置回滚", "title": "配置回滚（FortiOS，restore config 恢复式）", "description": "改动前备份配置到 TFTP，改坏后 execute restore config 恢复（设备自动重启加载）。", "commands": "# ===== 配置回滚（FortiOS）=====\n# ---- 0. 改动前：备份配置到 TFTP（{{backup_file}}）----\nexecute backup config tftp {{backup_file}} {{backup_server}}\n# ---- 1. 改动出问题后：恢复备份（执行后设备自动重启加载该配置）----\nexecute restore config tftp {{backup_file}} {{backup_server}}\n# ---- 2. 重启后复核 ----\nget system status\n", "params": [{"name": "backup_file", "label": "备份配置文件名", "default": "", "required": true, "validate": "", "example": "fw-bak-20260928.conf", "type": "string", "description": "备份配置在设备存储中的文件名（如 old-cfg.cfg）；configure replace 会以它整体回滚配置——回滚是全量替换动作，执行前先 diff 确认目标文件内容"}, {"name": "backup_server", "label": "TFTP 服务器 IP", "default": "", "required": true, "validate": "ipv4", "example": "192.168.66.20", "type": "ip", "description": "TFTP/SFTP 备份服务器地址，配置与镜像的异地留痕去向；升级/回滚前先从设备 ping 通确认可达；注意该地址可能出现在配置明文中"}], "notes": "1) ★ 危险点：restore config 执行后设备自动重启加载该配置——变更窗口内操作；回滚前先在 Web 里 diff 当前与备份（或导出两份对比）。\n2) 与《保存配置并备份到本地 flash》分工：那条是备份动作，本条是恢复动作——两者是同一流程的两半。\n3) 备份服务器 IP 用 {{backup_server}} 参数。\n验证方法：重启后 get system status + 策略抽测（对照 diff 项）；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-28 11:09:35", "updated_at": "2026-10-09 13:45:33", "exec_level": "", "interactive": 0, "rollback": "# 回退：本条目本身即恢复操作；若恢复后需退回恢复前的配置，\n# 用恢复前另存的备份文件再 restore（文件名按变更记录回填）\nexecute restore config tftp <恢复前配置.conf> {{backup_server}}\n# 重启完成后复核\nget system status"}, {"uuid": "d7df5860-7844-5fff-a285-c0b3dadd3122", "platform": "network", "device_type": "防火墙", "vendor": "fortinet", "os_family": "fortios", "models": "FortiGate", "category": "环路检测", "title": "环路风险核查（FortiOS，骨架参照）", "description": "防火墙本身不跑 STP 的场景居多；核查硬件交换口环路与 STP 配置（骨架以 ? 实测为准）。", "commands": "# ===== 环路风险核查（FortiOS）=====\n# ---- 1. 硬件交换口/软件交换（soft switch）上的 STP 设置 ----\nconfig system global\nget | grep switch\nend\n# ---- 2. 接口级 STP 状态（enable/disable 逐口核对）----\nshow system interface\n# ---- 3. 广播风暴防护（DoS 策略/风暴控制按版本确认）----\n", "params": [], "notes": "1) ★ 待真机核对：FortiOS 环路相关特性各版本差异大，本条为骨架参照；防火墙内网口被环路的典型表现是 CPU 突增与广播包激增。\n2) ★ 危险点：风暴中勿盲目插拔线。\n3) 核对通过后回填本条目并升 exec_level 为 verified-cli。\n验证方法：接口 STP 状态明确 + 无广播 按 display archive configuration 确认）\ndisplay archive configuration\nconfiguration replace file flash:/archive/<replace前归档.cfg>\n# 复核\ndisplay current-configuration | include <核对关键字>"}, {"uuid": "d032d4e5-5468-5897-b459-60ca37796f0a", "platform": "network", "device_type": "交换机", "vendor": "h3c", "os_family": "comware7", "models": "H3C Comware7", "category": "AAA认证", "title": "配置 AAA 认证与本地兜底（H3C Comware7）", "description": "RADIUS 方案 + ISP 域 + 本地兜底 + test-aaa 验证（先验证后退出，见 notes 铁律）。", "commands": "# ===== AAA 认证与本地兜底（H3C Comware7）=====\nsystem-view\n# ---- 1. RADIUS 方案 ----\nradius scheme RD1\n primary authentication {{aaa_server_ip}}\n key authentication cipher {{aaa_shared_key}}\nquit\n# ---- 2. ISP 域：先 radius 后 local 兜底 ----\ndomain dm1\n authentication login radius-scheme RD1 local\nquit\n# ---- 3. VTY 引用该域 ----\nline vty 0 4\n authentication-mode scheme\n quit\n# ---- 4. 本地兜底账号 ----\nlocal-user {{local_user}} class manage\n password cipher {{local_password}}\n service-type ssh\n authorization-attribute user-role network-admin\n quit\n# ---- 5. ★ 验证（勿退当前会话）----\ntest-aaa {{test_user}} {{test_password}} radius-scheme RD1\n", "params": [{"name": "aaa_server_ip", "label": "RADIUS 服务器 IP", "default": "", "required": true, "validate": "ipv4", "example": "192.168.66.30", "type": "ip", "description": "AAA/RADIUS/TACACS 服务器地址，决定设备把认证/授权/审计请求发往哪台服务器；填内网可达的管理网段 IP；配错将导致所有远程登录认证失败，建议先 ping 通再下发"}, {"name": "aaa_shared_key", "label": "共享密钥", "default": "", "required": true, "validate": "", "example": "现场生成强密钥", "type": "string", "description": "AAA 服务器共享密钥，用于设备与服务器间认证报文的加密校验；必须与服务器侧完全一致；配置中可能弱加密存储，导出配置时注意脱敏"}, {"name": "test_user", "label": "验证用域账号", "default": "", "required": true, "validate": "", "example": "netadmin", "type": "string", "description": "AAA 测试用户名，验证 RADIUS/TACACS 服务器联通性；测试失败优先查共享密钥与 NAS IP 配置"}, {"name": "test_password", "label": "验证用口令", "default": "", "required": true, "validate": "", "example": "现场生成强口令", "type": "string", "description": "AAA 测试口令，test aaa/ y current-configuration | include <核对关键字>\n", "params": [{"name": "backup_file", "label": "备份配置文件名", "default": "", "required": true, "validate": "", "example": "confg-bak-20260928.cfg", "type": "string", "description": "备份配置在设备存储中的文件名（如 old-cfg.cfg）；configure replace 会以它整体回滚配置——回滚是全量替换动作，执行前先 diff 确认目标文件内容"}], "notes": "1) ★ 危险点：VRP5 无原生 checkpoint 回滚，恢复配置文件需重启——变更窗口内操作，带外 Console 先确认。\n2) VRP8/AR 系列支持 configuration checkpoint save / configuration rollback last（两步原生回滚），VRP5 用本条的备份恢复式。\n3) ★ 回滚前先 compare configuration 做 diff，确认回退范围。\n4) 与《保存配置并备份到本地 flash》分工：那条是\"保存当前\"，本条是\"回退到历史备份\"。\n验证方法：重启后 display version/配置复核关键字 + 业务抽测；（验证人/型号/日期验证通过后回填 verified，本条属下轮真机验证会重点对象）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-28 11:09:35", "updated_at": "2026-10-09 13:45:38", "exec_level": "", "interactive": 0, "rollback": "# 回退：本条目本身即恢复操作；若恢复后需退回恢复前的配置，\n# 把变更后已保存的配置文件指回启动项（文件名按变更记录回填）\nstartup saved-configuration flash:/<变更后配置文件.zip>\ndisplay startup\nreboot\n# 复核\ndisplay current-configuration | include <核对关键字>"}, {"uuid": "c3ddd6bb-ba13-5ff4-a613-fbd819b891ef", "platform": "network", "device_type": "交换机", "vendor": "huawei", "os_family": "vrp5", "models": "华为 VRP5", "category": "AAA认证", "title": "配置 AAA 认证与本地兜底（华为 VRP5）", "description": "RADIUS 服务器模板 + 认证域 + test-aaa 验证 + 本地兜底（先验证后退出，见 notes 铁律）。", "commands": "# ===== AAA 认证与本地兜底（华为 VRP5）=====\nsystem-view\n# ---- 1. RADIUS 服务器模板 ----\nradius-server template RD1\n radius-server authentication {{aaa_server_ip}} 1812\n radius-server shared-key cipher {{aaa_shared_key}}\nquit\n# ---- 2. 认证域引用（default域：先 radius 后 local 兜底）----\naaa\n authentication-scheme SCH\n  authentication-mode radius local\n radius-server RD1\n quit\n# ---- 3. ★ 验证（勿退当前会话）----\ntest-aaa {{test_user}} {{test_password}} radius-template RD1\n# ---- 4. 本地兜底账号确认存在 ----\nlocal-user {{local_user}} password irreversible-cipher {{local_password}}\nlocal-user {{local_user}} service-type ssh\nquit\n", "params": [{"name": "aaa_server_ip", "label": "RADIUS 服务器 IP", "default": "", "required": true, "validate": "ipv4", "example": "192.168.66.30", "type": "ip", "description": "AAA/RADIUS/TACACS 服务器地址，决定设备把认证/授权/审计请求发往哪台服务器；填内网可达的管理网段 IP；配错将导致所有远程登录认证失败，建议先 ping 通再下发"}, {"name": "aaa_shared_key", "label": "共享密钥", "default": "", "required": true, "validate": "", "example": "现场生成强密钥", "type": "string", "description": "AAA 服务器共享密钥，用于设备与服务器间认证报文的加密校验；必须与服务器侧完全一致；配置中可能弱加密存储，导出配置时注意脱敏"}, {"name": "test_user", "label": "验证用域账号", "default": "", "required": true, "validate": "", "example": "netadmin", "type": "string", "description": "AAA 测试用户名，验证 RADIUS/TACACS 服务器联通性；测试失败优先查共享密钥与 NAS IP 配置"}, {"name": "test_password", "label": "验证用口令", "default": "", "required": true, "validate": "", "example": "现场生成强口令", "type": "string", "description": "AAA 测试口令，test aaa/test-aaa 验证服务器认证链路；与正式口令一致即可，仅测试用途"}, {"name": "local_user", "label": "本地兜底账号", "default": "", "required": true, "validate": "", "example": "netadmin", "type": "string", "description": "本地登录用户名，设备本地认证的身份标识；其权限等级（privilege/level）决定可执行命令范围，遵循最小权限"}, {"name": "local_password", "label": "本地兜底口令", "default": "", "required": true, "validate": "", "example": "现场生成强口令", "type": "string", "description": "本地账号口令，控制该用户登录认证；privilege 15 级账号等同最高权限，口令泄露等于设备失守；配置中可能弱加密存储，导出时脱敏"}], "notes": "1) ★ 危险点（AAA 第一铁律）：配置 AAA 后**不要退出当前会话**——先用新开窗口验证能登录，确认兜底本地账号可用再断开；配置错误把自己锁外面只能 Console 救。\n2) ★ 保留 Console 通道：AAA 服务器不可达时 Console 是最后生命线（console 上配置本地兜底）。\n3) 本地兜底顺序必须显式配置（radius/tacacs 之后跟 local），服务器全挂时才回落本地账号。\n4) test-aaa 返回 Respond Time OK + 认证成功才算通。\n5) authentication-mode radius local 顺序即兜底顺序，local 不能省。\n验证方法：test-aaa 成功 + 新窗口域账号登录 + 断服务器后本地账号可登录；（验证人/型号/日期验证通过后回填 verified，属下轮真机验证会重点对象）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-28 11:09:36", "updated_at": "2026-10-09 13:45:38", "exec_level": "", "interactive": 0, "rollback": "# 回退：撤销 AA 程。", "commands": "# ===== CPU 与内存诊断（Junos）=====\n# ---- 1. 路由引擎 CPU/内存（重点看 CPU Load 与 Memory utilization）----\nshow chassis routing-engine\n# ---- 2. 进程级定位（top 视图，空格刷新 q 退出）----\nshow system processes extensive\n# ---- 3. 线卡侧补充（EX/QFX 看 FPC CPU）----\nshow chassis fpc", "params": [], "notes": "1) 判读：RE 持续 >70% 结合 show log messages 找事件源；转发面 CPU 与 RE 分开看。\n2) show system processes extensive 输出较长，排查时重定向或分屏看。\n验证方法：routing-engine 回显含 load 与内存水位；（验证人/型号/日期验证通过后回填 verified）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-10-09 10:29:48", "updated_at": "2026-10-09 10:29:48", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "a48d3438-19b7-58e6-8abb-5a2ae7c819ba", "platform": "network", "device_type": "交换机", "vendor": "juniper", "os_family": "junos", "models": "Juniper EX / QFX 系列", "category": "接口诊断", "title": "接口状态诊断（show interfaces 族，Junos）", "description": "端口 down/翻动、错包增长、协商异常时的接口侧体检：全口速览定位问题口，单口 extensive 看物理层与错包明细、flapped 历史与告警位。", "commands": "# ===== 接口状态诊断（Junos）=====\n# ---- 1. 全口速览（Oper 状态与 Link 一列看清谁 down）----\nshow interfaces terse\n# ---- 2. 单口详查（物理层 + 错包计数 + 翻动历史）----\nshow interfaces {{port}} extensive\n# ---- 3. 仅看协商与告警位（精简回显）----\nshow interfaces {{port}} media", "params": [{"name": "port", "label": "接口名", "type": "string", "required": true, "default": "ge-0/0/1", "example": "ge-0/0/1 / xe-0/0/0", "validate": "port", "description": "Junos 接口名（ge-/xe- 前缀按速率，含 unit 时物理口不带 .0），本条诊断的目标口；先用 terse 确认口名再填，填错看的是别人的口；只做 show 只读操作"}], "notes": "1) 判读：extensive 里 Link-level / Error 计数持续增长先查物理层；flapped 次数多说明口在翻动。\n2) SRX/EX 的 management 口（fxp0/me0）状态单独看，不算业务口。\n验证方法：extensive 回显含物理层与计数字段；（验证人/型号/日期验证通过后回填 verified）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-10-09 10:29:48", "updated_at": "2026-10-09 10:29:48", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "9dd90b53-7b41-5ff3-b043-570063149775", "platform": "network", "device_type": "交换机", "vendor": "juniper", "os_family": "junos", "models": "Juniper EX / SRX 系列", "category": "日志", "title": "系统日志排查（show log messages，Junos）", "description": "设备异常（接口翻动、BGP/OSPF 邻居事件、进程告警）后翻日志找时间线：messages 是主日志文件，match 过滤缩范围，monitor 实时盯现场复现。", "commands": "# ===== 系统日志排查（Junos）=====\n# ---- 1. 主日志最近 50 行（默认日志文件 messages）----\nshow log messages | last 50\n# ---- 2. 按关键字过滤（match 支持正则）----\nshow log messages | match {{keyword}} | last 30\n# ---- 3. 实时跟踪复现（monitor stop 停止跟踪）----\nmonitor start messages", "params": [{"name": "keyword", "label": "过滤关键字", "type": "string", "required": false, "default": "DOWN", "example": "DOWN / bgp_peer / RPD", "validate": "", "description": "match 过滤的正则或关键字，锁定日志里的事件类型（接口 DOWN、bgp_peer 状态机、RPD 路由进程告警）；只过滤 show 回显，不影响设备状态"}], "notes": "1) Junos 日志是文件制：messages 之外，changelog/interactive-commands 各有分工，traceoptions 默认关。\n2) monitor start 后终端会持续刷屏，停止必须 monitor stop（或 Ctrl+C 后补 stop）。\n验证方法：show log messages 真机有历史事件；（验证人/型号/日期验证通过后回填 verified）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-10-09 10:29:48", "updated_at": "2026-10-09 10:29:48", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "824dbfe2-32a9-5e82-b704-3f2e5726b709", "platform": "network", "device_type": "路由器", "vendor": "juniper", "os_family": "junos", "models": "Juniper MX / EX / SRX", "category": "BGP", "title": "BGP 邻居与路由状态核查（Junos）", "description": "BGP 邻居 Idle/震荡、收发路由数异常时的状态核查：summary 看会话与路由量，单邻居下钻看 Last Event 与 FlapCount，再查路由表确认接收情况。", "commands": "# ===== BGP 邻居与路由状态核查（Junos）=====\n# ---- 1. 邻居会话汇总（State 看 Established；FlapCount 看震荡）----\nshow bgp summary\n# ---- 2. 单邻居详查（Last Event、Keepalive、收发路由数）----\nshow bgp neighbor {{neighbor_ip}}\n# ---- 3. BGP 学到的路由 ----\nshow route protocol bgp", "params": [{"name": "neighbor_ip", "label": "邻居地址", "type": "ip", "required": true, "default": "", "example": "198.51.100.9", "validate": "ipv4", "description": "要下钻的 BGP 邻居地址（summary 里 Peer 列），单邻居详查的对象；先从 summary 确认邻居在列再填；只做 show 只读操作"}], "notes": "1) 判读：Idle 查配置组/认证/更新源可达；Active/Connect 循环多为 TCP 不可达或对端策略拒。\n2) show route protocol bgp 只看 BGP 来源路由，结合 hidden 路由核查被策略扣住的路由。\n验证方法：summary 真机回显 Peer/State 列；（验证人/型号/日期验证通过后回填 verified）", "duration": "", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-10-09 10:29:48", "updated_at": "2026-10-09 10:29:48", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "9e8fce7a-2958-5bdd-95ce-882ff407a9b9", "platform": "linux", "device_type": "服务器", "vendor": "openeuler", "os_family": "openeuler2203", "models": "openEuler 22.03 LTS", "category": "排查命令", "title": "tcpdump 抓包入门五式（openEuler）", "description": "按主机/端口抓包定位流量是否到达本机：五式覆盖定点抓包、排除 SSH 防刷屏、落盘 pcap 离线分析与回放，远程排查时先排除自己的连接再定过滤。", "commands": "# ===== tcpdump 抓包入门五式（openEuler）=====\n# ---- 1. 按对端主机抓（最常用）----\ntcpdump -i {{ifname}} -nn host {{peer_ip}} -c 100\n# ---- 2. 按端口抓 ----\ntcpdump -i {{ifname}} -nn port {{port}} -c 100\n# ---- 3. 远程排查：排除自己的 SSH，防刷屏 ----\ntcpdump -i {{ifname}} -nn not port 22 -c 200\n# ---- 4. 落盘成 pcap（带回工作机用 Wireshark 分析）----\ntcpdump -i {{ifname}} -nn -w /tmp/capture.pcap -c 1000\n# ---- 5. 回放读包（服务器上快速核对内容）----\ntcpdump -nn -r /tmp/capture.pcap | head -40", "params": [{"name": "ifname", "label": "网卡名", "type": "string", "required": true, "default": "ens192", "example": "eth0 / ens192 / enp3s0 / bond0", "validate": "ifname", "description": "抓包的目标网卡（ip link 确认存在与状态），抓错网卡等于没抓；虚拟机常见 ens192/ens160；只读抓包不改配置"}, {"name": "peer_ip", "label": "对端 IP", "type": "ip", "required": true, "default": "192.0.2.10", "example": "192.0.2.10", "validate": "ipv4", "description": "过滤的对端/目标地址，确认该主机的流量是否到达本机；抓包是只读诊断，但完整抓到敏感流量时注意 pcap 的留存范围"}, {"name": "port", "label": "端口号", "type": "int", "required": true, "default": "8080", "example": "8080", "range": "1-65535", "validate": "int:1-65535", "description": "过滤的 TCP/UDP 端口号（1-65535），确认服务端口的流量是否到达；先 ss -lntp 确认服务在监听再抓，抓包无流量可能是上游没到"}], "notes": "1) -nn 不解析域名端口名，回显快且不受 DNS 影响；远程排查务必 not port 22 排除自己。\n2) tcpdump 未装：dnf install tcpdump（离网场景见本地源条目）。\n3) 与「网络排查三件套」分工：三件套管 ss/tcpdump/journalctl 起手，本条是 tcpdump 专精深化。\n—— 实测 2026-10-12（场2,Docker(ubuntu:22.04, 容器)）:语法核对(裁决A):icmp 过滤实抓 2 包✓", "duration": "temp", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-10-09 10:29:56", "updated_at": "2026-10-09 10:29:56", "exec_level": "verified-cli", "interactive": 0, "rollback": ""}, {"uuid": "3aa06616-3ba9-5a1a-8378-548300b4548e", "platform": "linux", "device_type": "服务器", "vendor": "openeuler", "os_family": "openeuler2203", "models": "openEuler 22.03 LTS", "category": "排查命令", "title": "连通性排查三连（openEuler）", "description": "ping / traceroute / dig 三连：先确认三层可达，再定位路径断点，最后分离 DNS 问题——IP 通但域名不通是 DNS 配置问题，不是连通性问题。", "commands": "# ===== 连通性排查三连（openEuler）=====\n# ---- 1. 基础连通（能通 = 二层+三层可达）----\nping -c 4 {{target}}\n# ---- 2. 路径定位（-n 不解析域名，出在那一跳）----\ntraceroute -n {{target}}\n# ---- 3. DNS 解析（IP 通但这里不通 = DNS 问题）----\ndig +short {{domain}}", "params": [{"name": "target", "label": "目标地址", "type": "ip", "required": true, "default": "223.5.5.5", "example": "223.5.5.5", "validate": "ipv4", "description": "连通性测试目标（先测 IP 再测域名，分离网络故障与 DNS 故障）；只做探测不影响转发；经防火墙环境注意 ICMP/UDP 可能被策略拦"}, {"name": "domain", "label": "待解析域名", "type": "string", "required": false, "default": "www.baidu.com", "example": "www.baidu.com", "validate": "", "description": "用于验证 DNS 解析链路的域名，dig 不通时查 /etc/resolv.conf 与防火墙 53 端口；只读查询不改配置"}], "notes": "1) traceroute 默认 UDP 高端口，被策略过滤时改 tracepath（openEuler 默认自带）或 traceroute -I 走 ICMP。\n2) ping 通 IP 但 dig 不通 → 查 /etc/resolv.conf 与到 53 端口的可达性。\n3) 与「网络排查三件套」分工：三件套起手概览，本条专精连通性三连。\n—— 实测 2026-10-12（场2,Docker(ubuntu:22.04, 容器)）:语法核对(裁决A):ping/dig 全通✓", "duration": "temp", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-10-09 10:29:56", "updated_at": "2026-10-09 10:29:56", "exec_level": "verified-cli", "interactive": 0, "rollback": ""}, {"uuid": "613f2357-ccf3-569b-a118-e5d793e3eb5e", "platform": "linux", "device_type": "服务器", "vendor": "openeuler", "os_family": "openeuler2203", "models": "openEuler 22.03 LTS", "category": "排查命令", "title": "ethtool 网卡链路诊断（openEuler 22.03）", "description": "物理层排查入口：Link detected 判断线缆/网口/对端是否起来，速率双工是否协商正常，错包计数与内核统计交叉核对，区分物理层问题与协议层问题。", "commands": "# ===== ethtool 网卡链路诊断（openEuler）=====\n# ---- 1. 物理层状态（Link detected 是核心判据）----\nethtool {{ifname}}\n# ---- 2. 网卡计数器（错包/丢包趋势）----\nethtool -S {{ifname}} | head -40\n# ---- 3. 内核侧统计交叉核对 ----\nip -s link show {{ifname}}", "params": [{"name": "ifname", "label": "网卡名", "type": "string", "required": false, "default": "ens192", "example": "eth0 / ens192", "validate": "ifname", "description": "诊断的目标网卡（ip link 先确认存在），查看链路与计数不改任何配置；选错网卡会看到别人的正常状态造成误判"}], "notes": "1) Link detected: no → 线缆/网口/对端/端口组逐段查；虚拟机另核对 vSphere 端口组与虚拟网卡对应关系。\n2) 与「光模块读数与网卡错包判读（ethtool -m）」分工：本条管链路与计数基线，-m 条管光模块读数专精。\n3) 清计数前留基线（对比趋势用），排查树「同网段 ping 不通（Linux）」物理层分支引用本条。\n—— 实测 2026-10-12（场2,Docker(ubuntu:22.04, 容器)）:语法核对(裁决A):ethtool Speed/Link detected✓", "duration": "temp", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-10-09 10:29:56", "updated_at": "2026-10-09 10:29:56", "exec_level": "verified-cli", "interactive": 0, "rollback": ""}, {"uuid": "16a56984-ebc7-5e03-8764-762c743afbd3", "platform": "network", "device_type": "交换机", "vendor": "zte", "os_family": "zxr10", "models": "ZXR10 5250 / 5950 / 6900 系列", "category": "接口诊断", "title": "CPU 与内存诊断（show cpu，ZXR10）", "description": "CPU 或内存占用突增（整机卡顿、BGP/OSPF 邻居震荡、ping 延迟抖动）时的第一步定位：确认占用率高低与走势，再决定是否进一步查进程、广播风暴或攻击面。", "commands": "! ===== CPU 与内存诊断（ZXR10）=====\n! ---- 1. CPU 占用（连续观察几次，排除定时任务的瞬时峰值）----\nshow cpu\n! ---- 2. 内存使用（占用率与水位）----\nshow memory\n! ---- 3. 部分版本关键字不同（show cpu 无效时用 ? 逐级确认）----\n! show cpu-usage\n! show process cpu", "params": [], "notes": "1) 判读：持续 >70% <script>
/* ================= 工具 ================= */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function tierBadge(e){
  if(e.verified==1)return '<span class="badge b-green">绿·已验证</span>';
  if(e.exec_level=="verified-cli")return '<span class="badge b-syntax">语法核对</span>';
  if(e.exec_level=="skeleton")return '<span class="badge b-hold">骨架·待真机</span>';
  if(e.notes&&e.notes.indexOf("不可验证")>=0)return '<span class="badge b-hold">挂起</span>';
  return '<span class="badge b-unverified">未验证</span>';
}
function tierOf(e){
  if(e.verified==1)return "green";
  if(e.exec_level=="verified-cli")return "syntax";
  if(e.exec_level=="skeleton"||(e.notes&&e.notes.indexOf("不可验证")>=0))return "suspended";
  return "unverified";
}
function lerp(c1,c2,r){ /* #rrggbb 插值，与 ui_dashboard._lerp_color 同逻辑 */
  var a=parseInt(c1.slice(1),16),b=parseInt(c2.slice(1),16);
  var mix=function(x,y){return Math.round(x+(y-x)*r)};
  var r0=mix(a>>16,b>>16),g0=mix((a>>8)&255,(b>>8)&255),b0=mix(a&255,b&255);
  return "rgb("+r0+","+g0+","+b0+")";
}
function codeHtml(text){
  // 命令注释灰化（与 renderer 同规则：#/! 开头独立行）
  return String(text||"").split("\n").map(function(l){
    var t=l.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    if(/^\s*[#!]/.test(l))return '<span class="cm">'+t+'</span>';
    return t;}).join("\n");
}
/* ================= 仪表盘 ================= */
function renderDash(){
  var cv=DATA.coverage,p=document.getElementById("p-dash");
  function tierRow(name,c){
    var tot=Math.max(1,c.green+c.syntax+c.suspended+c.unverified);
    var segs=[["绿",c.green,"var(--success)"],["语法核对",c.syntax,"var(--accent)"],
      ["挂起",c.suspended,"var(--warning)"],["未验证",c.unverified,"rgba(106,112,128,.45)"]];
    return '<div class="tier"><span class="lbl">'+name+'</span><div class="bar">'+
      segs.filter(function(s){return s[1]>0}).map(function(s){
        return '<i style="width:'+(100*s[1]/tot)+'%;background:'+s[2]+'"></i>'}).join("")+
      '</div><span class="nums"><b>'+c.green+'</b> / <b>'+c.syntax+'</b> / <b>'+c.suspended+
      '</b> / <b>'+c.unverified+'</b>　共 '+c.total+'</span></div>';
  }
  var matrix={},vendors={},cats={};
  cv.matrix.forEach(function(r){matrix[r.vendor+"|"+r.category]=r.n;
    vendors[r.vendor]=1;cats[r.category]=1;});
  var vs=Object.keys(vendors).sort(),cs=Object.keys(cats).sort();
  var maxn=0;cv.matrix.forEach(function(r){maxn=Math.max(maxn,r.n)});
  var h='<h2 style="margin:8px 0 2px">覆盖度仪表盘</h2>'+
    '<div class="hint">与桌面端仪表盘同源口径：绿/语法核对/挂起/未验证；挂起=正当状态（环境不具备·骨架·介质依赖），如实呈现。</div>'+
    '<div class="tiers">'+tierRow("命令",cv.entries)+tierRow("报错",cv.errs)+tierRow("树",cv.trees)+'</div>'+
    '<div class="sec">厂商 × 分类 矩阵（格内数字=条目数，色深映射数量，点击跳命令库）</div>'+
    '<table class="matrix"><tr><th style="text-align:left">厂商 \\ 分类</th>'+
    cs.map(function(c){return "<th>"+esc(c)+"</th>"}).join("")+"</tr>"+
    vs.map(function(v){return '<tr><td class="v">'+esc(v)+"</td>"+
      cs.map(function(c){var n=matrix[v+"|"+c];
        if(!n)return "<td></td>";
        var bg=lerp("#2a2d3a","#4f8cff",0.12+0.55*n/maxn);
        return '<td class="c" style="background:'+bg+'" onclick="jumpLib(\''+esc(v)+'\',\''+esc(c)+'\')">'+n+"</td>";
      }).join("")+"</tr>"}).join("")+"</table>";
  p.innerHTML=h;
}
/* ================= 命令库 ================= */
var libV="*",libC="*",libQ="";
function renderLib(){
  var p=document.getElementById("p-lib");
  var vcnt={},ccnt={};
  DATA.entries.forEach(function(e){
    vcnt[e.vendor]=(vcnt[e.vendor]||0)+1;
    if(e.vendor==libV||libV=="*")ccnt[e.category]=(ccnt[e.category]||0)+1;});
  var vs=Object.keys(vcnt).sort(),cs=Object.keys(ccnt).sort();
  p.innerHTML='<div class="lib"><div class="side">'+
    '<div class="grp">厂商</div><div class="vbtn '+(libV=="*"?"on":"")+'" onclick="setV(\'*\')">全部 <span class="n">'+DATA.entries.length+'</span></div>'+
    vs.map(function(v){return '<div class="vbtn '+(libV==v?"on":"")+'" onclick="setV(\''+esc(v)+'\')">'+esc(v)+' <span class="n">'+vcnt[v]+'</span></div>'}).join("")+
    '<div class="grp">分类</div><div class="vbtn '+(libC=="*"?"on":"")+'" onclick="setC(\'*\')">全部</div>'+
    cs.map(function(c){return '<div class="vbtn '+(libC==c?"on":"")+'" onclick="setC(\''+esc(c)+'\')">'+esc(c)+'</div>'}).join("")+
    '</div><div class="main"><div class="toolbar">'+
    '<input type="text" class="search" placeholder="搜索：标题 / 描述 / 命令 / 备注…（Ctrl+F 焦点）" value="'+esc(libQ)+'" oninput="libQ=this.value;renderList()">'+
    '</div><div class="hint" id="libCount"></div><div class="list" id="libList"></div></div></div>';
  renderList();
}
function setV(v){libV=v;libC="*";renderLib()}
function setC(c){libC=c;renderLib()}
function renderList(){
  var q=libQ.trim().toLowerCase();
  var rows=DATA.entries.filter(function(e){
    if(libV!="*"&&e.vendor!=libV)return false;
    if(libC!="*"&&e.category!=libC)return false;
    if(!q)return true;
    return (e.title+" "+e.description+" "+e.commands+" "+e.notes+" "+e.os_family).toLowerCase().indexOf(q)>=0;});
  document.getElementById("libCount").textContent="命中 "+rows.length+" 条";
  document.getElementById("libList").innerHTML=rows.map(function(e,i){
    return '<div class="item" onclick="showDetail(\''+e.uuid+'\')"><div class="t">'+esc(e.title)+tierBadge(e)+
      '</div><div class="m">'+esc(e.vendor)+" · "+esc(e.category)+" · "+esc(e.os_family||"")+
      (e.models?" · "+esc(e.models):"")+'</div></div>'}).join("")||
    '<div class="empty">无匹配条目</div>';
}
function jumpLib(v,c){switchTab("lib");libV=v;libC=c;renderLib()}
function showDetail(uuid){
  var e=DATA.entries.filter(function(x){return x.uuid==uuid})[0];
  if(!e)return;
  var list=document.getElementById("libList");
  var dur={"temp":"临时生效","perm":"持久化","both":"临时+持久化"}[e.duration]||"";
  var h='<div class="detail"><h2>'+esc(e.title)+tierBadge(e)+'</h2>'+
    '<div class="meta">'+esc(e.vendor)+" / "+esc(e.category)+" / "+esc(e.os_family||"")+
    (e.models?" · "+esc(e.models):"")+(dur?" · "+dur:"")+"</div>"+
    '<div class="sec">说明</div><div>'+esc(e.description)+"</div>";
  if((e.commands||"").trim()){
    h+='<div class="sec">命令'+(e.interactive?' <span class="badge b-hold">交互式</span>':"")+'</div><pre class="code">'+codeHtml(e.commands)+"</pre>";
  }
  if(e.params&&e.params.length){
    h+='<div class="sec">参数</div><table class="params"><tr><th>参数</th><th>类型</th><th>必填</th><th>默认</th><th>说明</th></tr>'+
      e.params.map(function(p){return "<tr><td><span class='kw'>"+esc(p.name)+"</span></td><td>"+esc(p.type||"")+
        (p.choices?"<br><span style='color:var(--txt3)'>"+esc((p.choices||[]).join(" | "))+"</span>":"")+
        "</td><td>"+(p.required?"✓":"")+"</td><td>"+esc(p.default==null?"":p.default)+"</td><td>"+esc(p.description||"")+"</td></tr>"}).join("")+"</table>";
  }
  if((e.rollback||"").trim()){
    h+='<details class="fold"><summary>回退方案（rollback）</summary><pre class="code">'+codeHtml(e.rollback)+"</pre></details>";
  }
  if((e.notes||"").trim()){
    h+='<div class="sec">坑点 / 判读口径</div><div class="notes">'+esc(e.notes)+"</div>";
  }
  if(e.verified==1){
    h+='<div class="meta" style="margin-top:10px">验证：'+esc(e.verified_by||"")+" @ "+esc(e.verified_model||"")+" · "+esc(e.verified_date||"")+"</div>";
  }else if(e.exec_level=="skeleton"||(e.notes||"").indexOf("不可验证")>=0){
    h+='<div class="meta" style="margin-top:10px;color:var(--warning)">挂起（正当状态）：'+esc(e.exec_level=="skeleton"?"骨架条目，待真机核对":"环境不具备，待真机/介质")+"</div>";
  }
  h+='<div style="margin-top:12px"><a href="#" onclick="renderLib();return false">← 返回列表</a></div></div>';
  list.innerHTML=h;
  window.scrollTo(0,0);
}
/* ================= 排查树 ================= */
function renderTrees(){
  var p=document.getElementById("p-trees");
  p.innerHTML='<h2 style="margin:8px 0 2px">排查树（'+DATA.trees.length+'）</h2>'+
    '<div class="hint">步骤编号 sN；分支 when→goto；步骤命令引用按厂商列出。</div>'+
    DATA.trees.map(function(t){
      var steps={};
      t.steps.forEach(function(s){steps[s.id]=s});
      return '<div class="card"><h3>'+esc(t.symptom)+' '+(t.verified==1?'<span class="badge b-green">已验证</span>':'<span class="badge b-unverified">未验证</span>')+
        '</h3><div class="meta">'+esc(t.category||"")+" · 适用厂商："+esc(t.vendor_hint||"通用")+"</div>"+
        t.steps.map(function(s){
          return '<div class="step"><span class="sid">'+esc(s.id)+'</span> <b>'+esc(s.title)+"</b>"+
            (s.observe?'<div class="hint">观察：'+esc(s.observe)+"</div>":"")+
            (s.explain?'<div style="color:var(--txt2);font-size:12.5px">'+esc(s.explain)+"</div>":"")+
            (s.cmd_ref?refHtml(s.cmd_ref):"")+
            ((s.branches||[]).length?'<div>'+(s.branches||[]).map(function(b){
              return '<span class="branch">'+esc(b.when)+' → <b>'+esc(b.goto)+"</b></span>"}).join("")+"</div>":"")+
            "</div>"}).join("")+"</div>";
    }).join("");
}
function refHtml(ref){
  var bv=ref.by_vendor||{},ks=Object.keys(bv).sort();
  var inner='<span class="kw">'+esc(ref.vendor_category||"")+"</span>"+
    (ref.title_keyword?" · "+esc(ref.title_keyword):"");
  if(!ks.length)return '<div class="hint">命令来源：'+inner+"</div>";
  return '<div class="hint">命令来源（'+inner+'）：</div>'+ks.map(function(v){
    var u=bv[v];
    return '<span class="branch" style="cursor:pointer" onclick="jumpUuid(\''+u.uuid+'\')">'+esc(v)+'：'+esc(u.title)+" →</span>";
  }).join("");
}
function jumpUuid(uuid){switchTab("lib");libV="*";libC="*";libQ="";renderLib();showDetail(uuid)}
/* ================= 报错字典 ================= */
var errQ="";
function renderErrs(){
  var p=document.getElementById("p-errs");
  p.innerHTML='<h2 style="margin:8px 0 2px">报错字典（'+DATA.errs.length+'）</h2>'+
    '<div class="toolbar"><input type="text" class="search" placeholder="搜索报错关键词…" oninput="errQ=this.value;renderErrList()"></div>'+
    '<div id="errList"></div>';
  renderErrList();
}
function renderErrList(){
  var q=errQ.trim().toLowerCase();
  var rows=DATA.errs.filter(function(x){
    if(!q)return true;
    return (x.pattern+" "+x.cause+" "+x.solution_steps+" "+(x.vendor||"")).toLowerCase().indexOf(q)>=0;});
  document.getElementById("errList").innerHTML=rows.map(function(x){
    return '<div class="card"><h3>'+esc(x.pattern)+" "+(x.vendor?'<span class="badge b-syntax">'+esc(x.vendor)+"</span>":"")+"</h3>"+
      (x.cause?'<div class="sec">原因</div><div style="white-space:pre-wrap">'+esc(x.cause)+"</div>":"")+
      (x.solution_steps?'<div class="sec">处置</div><div style="white-space:pre-wrap">'+esc(x.solution_steps)+"</div>":"")+
      (x.fix_template?'<div class="sec">修复模板</div><pre class="code">'+codeHtml(x.fix_template)+"</pre>":"")+
      ((x.examples||[]).length?'<div class="sec">回显样例</div>'+x.examples.map(function(t){
        return '<pre class="code">'+esc(t)+"</pre>"}).join(""):"")+
      "</div>"}).join("")||'<div class="empty">无匹配</div>';
}
/* ================= Tab 切换 ================= */
function switchTab(name){
  document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("on",t.dataset.p==name)});
  document.querySelectorAll(".page").forEach(function(p){p.classList.toggle("on",p.id=="p-"+name)});
  window.scrollTo(0,0);
}
document.querySelectorAll(".tab").forEach(function(t){
  t.addEventListener("click",function(){switchTab(t.dataset.p)});
});
renderDash();renderLib();renderTrees();renderErrs();
</script>
</body>
</html>
