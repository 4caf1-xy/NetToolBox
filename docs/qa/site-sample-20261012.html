: true, "validate": "ifname", "example": "eth0 / ens33 / enp3s0 / bond0", "type": "string", "description": "Linux 网卡名（eth0/ens33/bond0 等），操作的目标接口；先 ip link 确认存在再操作，选错网卡会当场断 SSH（远程操作务必留带外兜底）"}, {"name": "ip_addr", "label": "IP 地址", "default": "192.168.10.50", "required": true, "validate": "ipv4", "example": "192.168.10.50", "type": "ip", "description": "接口 IP 地址，本机网络身份；改错/地址冲突会当场断 SSH——远程改网卡务必留 console 或带外兜底"}, {"name": "prefix_len", "label": "掩码长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24（不是 255.255.255.0）", "type": "int", "range": "0-32", "description": "前缀长度（0-32），与 IP 组成 CIDR（如 /24）；写错网段判定全错，远程操作可能当场断 SSH"}, {"name": "gateway", "label": "网关", "default": "192.168.10.1", "required": true, "validate": "ipv4", "example": "192.168.10.1", "type": "ip", "description": "网关 IP，本网段出方向的下一跳；配错表现为同网段通、跨网段断；nmcli 修改后需重新激活连接生效"}], "notes": "1) ⚠ 重启后失效：持久化见配套条目：《永久配置 IP（ifcfg-* 文件）》或\n   《nmcli 永久配置 IP（推荐）》。持久化之后再做临时变更两不误。\n2) ip addr add 可以给一块网卡挂多个 IP（辅助地址场景），删掉主 IP 不影响辅助 IP。\n3) 网卡是 DOWN 状态时先 ip link set {{ifname}} up，否则加了 IP 也不通。\n—— 实测 2026-10-12（场2,Docker(ubuntu:22.04, 容器)）:语法核对(非目标发行版容器):centos7 容器无 CAP_NET_ADMIN 不可跑;ubuntu 容器 ip addr add 10.255.255.10/32→ping 本机通→del 复核 ADDR-CLEAN-OK 三段✓", "duration": "temp", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:56", "updated_at": "2026-10-09 13:45:40", "exec_level": "verified-cli", "interactive": 0, "rollback": "# 回退：删除临时添加的 IP（临时生效，重启网络/机器自动消失；手动清除如下）\nip addr del {{ip_addr}}/{{prefix_len}} dev {{ifname}}\n# 复核\nip addr show {{ifname}}"}, {"uuid": "3461989b-84aa-5812-ab2c-cb097a42e289", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7 / RHEL 7", "category": "网络配置", "title": "永久配置 IP（ifcfg-* 文件）", "description": "改 ifcfg-* 配置文件实现 IP 持久化，重启后仍生效。", "commands": "# 持久化配置：/etc/sysconfig/network-scripts/ifcfg-{{ifname}}\n# 改之前先备份！\ncp /etc/sysconfig/network-scripts/ifcfg-{{ifname}} /etc/sysconfig/network-scripts/ifcfg-{{ifname}}.bak\nvi /etc/sysconfig/network-scripts/ifcfg-{{ifname}}\n# ---- 文件内容（按现场实际填写）----\n# DEVICE={{ifname}}\n# BOOTPROTO=static\n# ONBOOT=yes\n# IPADDR={{ip_addr}}\n# PREFIX={{prefix_len}}\n# GATEWAY={{gateway}}\n# DNS1={{dns_ip}}\n# ------------------------------------\nsystemctl restart network\nip addr show {{ifname}}\nip route show", "params": [{"name": "ifname", "label": "网卡名", "default": "eth0", "required": true, "validate": "ifname", "example": "eth0 / ens33 / enp3s0 / bond0", "type": "string", "description": "Linux 网卡名（eth0/ens33/bond0 等），操作的目标接口；先 ip link 确认存在再操作，选错网卡会当场断 SSH（远程操作务必留带外兜底）"}, {"name": "ip_addr", "label": "IP 地址", "default": "192.168.10.50", "required": true, "validate": "ipv4", "example": "192.168.10.50", "type": "ip", "description": "接口 IP 地址，本机网络身份；改错/地址冲突会当场断 SSH——远程改网卡务必留 console 或带外兜底"}, {"name": "prefix_len", "label": "掩码长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24（不是 255.255.255.0）", "type": "int", "range": "0-32", "description": "前缀长度（0-32），与 IP 组成 CIDR（如 /24）；写错网段判定全错，远程操作可能当场断 SSH"}, {"name": "gateway", "label": "网关", "default": "192.168.10.1", "required": true, "validate": "ipv4", "example": "192.168.10.1", "type": "ip", "description": "网关 IP，本网段出方向的下一跳；配错表现为同网段通、跨网段断；nmcli 修改后需重新激活连接生效"}, {"name": "dns_ip", "label": "DNS 服务器", "default": "223.5.5.5", "required": true, "validate": "ipv4", "example": "223.5.5.5", "type": "ip", "description": "DNS 服务器 IP，写入网卡连接配置；填错表现为 ping IP 通、域名解析失败——是『能 ping 通打不开网页』的典型根因"}], "notes": "1) PREFIX 写掩码长度（24），不要写 255.255.255.0 —— 写点分掩码会不生效。\n2) ONBOOT=no 是\"装完系统网卡不起来\"的头号原因，改成 yes。\n3) systemctl restart network 会瞬断所有网卡连接，远程操作时留一个备用会话。\n4) 想平滑生效可用 nmcli（见配套条目：《nmcli 永久配置 IP（推荐）》）。\n—— 实验室实测 2026-10-09（场1,centos7）：不可验证(centos7 容器无 systemd 且无 network-scripts 目录):备份源文件不存在→cp 断→写 ifcfg 断(目录缺失)→restart network 报 Failed to get D-Bus connection;回退链依赖备份步,备份断则全断(实战教训入 notes);真机验证\n—— 实测 2026-10-12（场2,Docker(centos7:local, 容器)）:语法核对(文件段):ifcfg-eth0.99 构造写入+备份守卫✓;生效链 systemctl restart network=D-Bus 死结(场1 实录)结构性挂起;真机复核重启生效", "duration": "perm", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:56", "updated_at": "2026-10-09 13:45:40", "exec_level": "verified-cli", "interactive": 0, "rollback": "# 回退：恢复变更前备份的 ifcfg 文件并重启网络\n#（★ SSH 走该口时重启 network 会瞬断，用带外/本机 console 操作）\ncp /etc/sysconfig/network-scripts/ifcfg-{{ifname}}.bak /etc/sysconfig/network-scripts/ifcfg-{{ifname}}\nsystemctl restart network\n# 复核\nip addr show {{ifname}}\nip route show"}, {"uuid": "d76cdcfd-93c6-5dd4-9fa0-5781819794e9", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7.3+ / RHEL 7.3+（带 NetworkManager）", "category": "网络配置", "title": "nmcli 永久配置 IP（推荐）", "description": "用 nmcli 修改连接配置：写入持久化配置且立即生效，一条命令两件事都办。", "commands": "nmcli con show\nnmcli con mod \"{{con_name}}\" ipv4.method manual ipv4.addresses {{ip_addr}}/{{prefix_len}}\nnmcli con mod \"{{con_name}}\" ipv4.gateway {{gateway}}\nnmcli con mod \"{{con_name}}\" ipv4.dns {{dns_ip}}\nnmcli con up \"{{con_name}}\"\nnmcli con show \"{{con_name}}\"\nip addr show {{ifname}}", "params": [{"name": "con_name", "label": "连接名", "default": "eth0", "required": false, "validate": "", "example": "nmcli con show 查看，一般等于网卡名", "type": "string", "description": "NetworkManager 连接配置名，nmcli 按它修改网卡参数；先 nmcli con show 确认名字再改，改错连接会断网（远程操作务必留 console/带外兜底）"}, {"name": "ip_addr", "label": "IP 地址", "default": "192.168.10.50", "required": true, "validate": "ipv4", "example": "192.168.10.50", "type": "ip", "description": "接口 IP 地址，本机网络身份；改错/地址冲突会当场断 SSH——远程改网卡务必留 console 或带外兜底"}, {"name": "prefix_len", "label": "掩码长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24（不是 255.255.255.0）", "type": "int", "range": "0-32", "description": "前缀长度（0-32），与 IP 组成 CIDR（如 /24）；写错网段判定全错，远程操作可能当场断 SSH"}, {"name": "gateway", "label": "网关", "default": "192.168.10.1", "required": true, "validate": "ipv4", "example": "192.168.10.1", "type": "ip", "description": "网关 IP，本网段出方向的下一跳；配错表现为同网段通、跨网段断；nmcli 修改后需重新激活连接生效"}, {"name": "dns_ip", "label": "DNS 服务器", "default": "223.5.5.5", "required": true, "validate": "ipv4", "example": "223.5.5.5", "type": "ip", "description": "DNS 服务器 IP，写入网卡连接配置；填错表现为 ping IP 通、域名解析失败——是『能 ping 通打不开网页』的典型根因"}, {"name": "ifname", "label": "网卡名", "default": "eth0", "required": true, "validate": "ifname", "example": "eth0 / ens33 / enp3s0 / bond0", "type": "string", "description": "Linux 网卡名（eth0/ens33/bond0 等），操作的目标接口；先 ip link 确认存在再操作，选错网卡会当场断 SSH（远程操作务必留带外兜底）"}], "notes": "1) ipv4.method manual 别漏 —— 不改的话还是 DHCP，地址不生效。\n2) 连接名（con_name）用 nmcli con show 查，一般等于网卡名；带空格要加引号。\n3) nmcli con up 会瞬断该网卡，远程操作留备用会话。\n4) 改坏了回滚：nmcli con mod \"{{con_name}}\" ipv4.method auto && nmcli con up \"{{con_name}}\"。\n—— lab 判定（场2,场2）:不可验证:centos7 容器 nmcli 不存在+ubuntu 容器 NetworkManager.service 未装(实录 Unit not found);NM 生效链待真机", "duration": "both", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:56", "updated_at": "2026-10-09 13:45:40", "exec_level": "", "interactive": 0, "rollback": "# 回退：恢复连接旧地址配置（nmcli 无历史快照——旧值按变更记录回填；\n# 变更前若为 DHCP 则按下行清空静态项）\nnmcli con mod \"{{con_name}}\" ipv4.method auto ipv4.addresses \"\" ipv4.gateway \"\" ipv4.dns \"\"\nnmcli con up \"{{con_name}}\"\n# 复核\nnmcli con show \"{{con_name}}\"\nip addr show {{ifname}}"}, {"uuid": "5061d3b4-37ab-511c-8c02-89606803c0df", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7 / RHEL 7", "category": "网络配置", "title": "临时添加静态路由（ip route）", "description": "用 ip route 加静态路由，立即生效，重启后失效。", "commands": "# ⚠ 临时生效：持久化见配套条目：《静态路由持久化（route-* 文件）》\nip route show\nip route add {{dest_net}}/{{prefix_len}} via {{gateway}} dev {{ifname}}\nip route show\n# 删除该路由（需要时）：\n# ip route del {{dest_net}}/{{prefix_len}} via {{gateway}}", "params": [{"name": "dest_net", "label": "目的网段", "default": "10.20.0.0", "required": true, "validate": "ipv4", "example": "10.20.0.0", "type": "ip", "description": "目的网段地址，路由/策略匹配的目标方向；0.0.0.0/0 表示任意目的；方向写反会导致流量走错策略"}, {"name": "prefix_len", "label": "掩码长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24（不是 255.255.255.0）", "type": "int", "range": "0-32", "description": "前缀长度（0-32），与 IP 组成 CIDR（如 /24）；写错网段判定全错，远程操作可能当场断 SSH"}, {"name": "gateway", "label": "网关", "default": "192.168.10.1", "required": true, "validate": "ipv4", "example": "192.168.10.1", "type": "ip", "description": "网关 IP，本网段出方向的下一跳；配错表现为同网段通、跨网段断；nmcli 修改后需重新激活连接生效"}, {"name": "ifname", "label": "网卡名", "default": "eth0", "required": true, "validate": "ifname", "example": "eth0 / ens33 / enp3s0 / bond0", "type": "string", "description": "Linux 网卡名（eth0/ens33/bond0 等），操作的目标接口；先 ip link 确认存在再操作，选错网卡会当场断 SSH（远程操作务必留带外兜底）"}], "notes": "1) ⚠ 重启后失效：持久化见配套条目：《静态路由持久化（route-* 文件）》。\n2) via 后面是下一跳，必须是本机同网段可达的地址，写错了路由加得上但不通。\n3) 默认路由：ip route add default via {{gateway}}。\n—— 实测 2026-10-12（场2,Docker(ubuntu:22.04, 容器)）:语法核对(非目标发行版容器):ubuntu 容器 ip route add via→show 命中→del 复核 ROUTE-CLEAN-OK 三段✓", "duration": "temp", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:56", "updated_at": "2026-10-09 13:45:40", "exec_level": "verified-cli", "interactive": 0, "rollback": "# 回退：删除临时添加的路由（临时生效，重启网络自动消失；手动清除如下）\nip route del {{dest_net}}/{{prefix_len}} via {{gateway}} dev {{ifname}}\n# 复核\nip route show"}, {"uuid": "59e0fb72-e3be-5dd1-8fae-3892931dadec", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7 / RHEL 7", "category": "网络配置", "title": "静态路由持久化（route-* 文件）", "description": "用 route-* 配置文件持久化静态路由，重启后仍生效。", "commands": "# 持久化：/etc/sysconfig/network-scripts/route-{{ifname}}\nvi /etc/sysconfig/network-scripts/route-{{ifname}}\n# ---- 文件内容（每行一条路由）----\n# {{dest_net}}/{{prefix_len}} via {{gateway}} dev {{ifname}}\nsystemctl restart network\nip route show", "params": [{"name": "dest_net", "label": "目的网段", "default": "10.20.0.0", "required": true, "validate": "ipv4", "example": "10.20.0.0", "type": "ip", "description": "目的网段地址，路由/策略匹配的目标方向；0.0.0.0/0 表示任意目的；方向写反会导致流量走错策略"}, {"name": "prefix_len", "label": "掩码长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24（不是 255.255.255.0）", "type": "int", "range": "0-32", "description": "前缀长度（0-32），与 IP 组成 CIDR（如 /24）；写错网段判定全错，远程操作可能当场断 SSH"}, {"name": "gateway", "label": "网关", "default": "192.168.10.1", "required": true, "validate": "ipv4", "example": "192.168.10.1", "type": "ip", "description": "网关 IP，本网段出方向的下一跳；配错表现为同网段通、跨网段断；nmcli 修改后需重新激活连接生效"}, {"name": "ifname", "label": "网卡名", "default": "eth0", "required": true, "validate": "ifname", "example": "eth0 / ens33 / enp3s0 / bond0", "type": "string", "description": "Linux 网卡名（eth0/ens33/bond0 等），操作的目标接口；先 ip link 确认存在再操作，选错网卡会当场断 SSH（远程操作务必留带外兜底）"}], "notes": "1) 文件名必须与网卡对应（route-eth0 对 eth0），写错网卡名不生效。\n2) 每行一条路由，支持多行；写错格式会导致 network.service 启动报错，改前备份。\n3) 临时验证先用配套条目：《临时添加静态路由（ip route）》，通了再持久化。\n—— 实测 2026-10-12（场2,Docker(centos7:local, 容器)）:语法核对(文件段):route-eth0 写入+回退✓;生效链结构性挂起,真机复核", "duration": "perm", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:56", "updated_at": "2026-10-09 13:45:40", "exec_level": "verified-cli", "interactive": 0, "rollback": "# 回退：变更时未备份 route-{{ifname}} 文件——按变更记录恢复原内容\n#（若该文件为本次新建则直接删除）后重启网络\nvi /etc/sysconfig/network-scripts/route-{{ifname}}\nsystemctl restart network\n# 复核\nip route show"}, {"uuid": "40adf302-ad41-5b58-8862-bfffd543a221", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7 / RHEL 7", "category": "网络配置", "title": "临时创建 VLAN 子接口（802.1Q）", "description": "用 ip link 创建 VLAN 子接口，立即生效，重启后失效。", "commands": "# ⚠ 临时生效：持久化见配套条目：《VLAN 子接口持久化（ifcfg 文件）》\n# 前提：交换机侧该口已配 trunk 并放通该 VLAN\nmodprobe 8021q\nip link add link {{ifname}} name {{ifname}}.{{vlan_id}} type vlan id {{vlan_id}}\nip addr add {{ip_addr}}/{{prefix_len}} dev {{ifname}}.{{vlan_id}}\nip link set {{ifname}}.{{vlan_id}} up\nip -d link show {{ifname}}.{{vlan_id}}", "params": [{"name": "ifname", "label": "网卡名", "default": "eth0", "required": true, "validate": "ifname", "example": "eth0 / ens33 / enp3s0 / bond0", "type": "string", "description": "Linux 网卡名（eth0/ens33/bond0 等），操作的目标接口；先 ip link 确认存在再操作，选错网卡会当场断 SSH（远程操作务必留带外兜底）"}, {"name": "vlan_id", "label": "VLAN ID", "default": "10", "required": true, "validate": "vlan", "example": "10", "type": "string", "description": "VLAN 编号，二层广播域标识；有效范围 1-4094（1 为默认 VLAN、1002-1005 系统保留）；Trunk 两端放行列表与 PVID 必须配套，改错会隔离业务"}, {"name": "ip_addr", "label": "IP 地址", "default": "192.168.10.50", "required": true, "validate": "ipv4", "example": "192.168.10.50", "type": "ip", "description": "接口 IP 地址，本机网络身份；改错/地址冲突会当场断 SSH——远程改网卡务必留 console 或带外兜底"}, {"name": "prefix_len", "label": "掩码长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24（不是 255.255.255.0）", "type": "int", "range": "0-32", "description": "前缀长度（0-32），与 IP 组成 CIDR（如 /24）；写错网段判定全错，远程操作可能当场断 SSH"}], "notes": "1) ⚠ 重启后失效：持久化见配套条目：《VLAN 子接口持久化（ifcfg 文件）》。\n2) 交换机侧必须是 trunk 且放通了 {{vlan_id}}，否则配了也不通（排查先查对端）。\n3) 8021q 模块一般已编译进内核，modprobe 报 already loaded 属正常。\n—— 实测 2026-10-12（场2,Docker(ubuntu:22.04, 容器)）:语法核对(非目标发行版容器):ubuntu 容器 ip link add link eth0 name eth0.100 type vlan id 100→ip -d link 见 vlan protocol 802.1Q id 100→del 后 Device not exist✓;modprobe 缺失但 8021q 内建生效", "duration": "temp", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:56", "updated_at": "2026-10-09 13:45:41", "exec_level": "verified-cli", "interactive": 0, "rollback": "# 回退：删除临时 VLAN 子接口（临时生效；8021q 模块保留无害不必卸载）\nip link del {{ifname}}.{{vlan_id}}\n# 复核（期望报不存在）\nip -d link show {{ifname}}.{{vlan_id}}"}, {"uuid": "d3659ded-f306-5c33-a1ad-445c1b2b848f", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7 / RHEL 7", "category": "网络配置", "title": "VLAN 子接口持久化（ifcfg 文件）", "description": "用 ifcfg 持久化 VLAN 子接口，重启后仍生效。", "commands": "# 持久化：/etc/sysconfig/network-scripts/ifcfg-{{ifname}}.{{vlan_id}}\ncat > /etc/sysconfig/network-scripts/ifcfg-{{ifname}}.{{vlan_id}} << 'EOF'\nDEVICE={{ifname}}.{{vlan_id}}\nBOOTPROTO=static\nONBOOT=yes\nVLAN=yes\nPHYSDEV={{ifname}}\nIPADDR={{ip_addr}}\nPREFIX={{prefix_len}}\nEOF\nsystemctl restart network\nip -d link show {{ifname}}.{{vlan_id}}", "params": [{"name": "ifname", "label": "网卡名", "default": "eth0", "required": true, "validate": "ifname", "example": "eth0 / ens33 / enp3s0 / bond0", "type": "string", "description": "Linux 网卡名（eth0/ens33/bond0 等），操作的目标接口；先 ip link 确认存在再操作，选错网卡会当场断 SSH（远程操作务必留带外兜底）"}, {"name": "vlan_id", "label": "VLAN ID", "default": "10", "required": true, "validate": "vlan", "example": "10", "type": "string", "description": "VLAN 编号，二层广播域标识；有效范围 1-4094（1 为默认 VLAN、1002-1005 系统保留）；Trunk 两端放行列表与 PVID 必须配套，改错会隔离业务"}, {"name": "ip_addr", "label": "IP 地址", "default": "192.168.10.50", "required": true, "validate": "ipv4", "example": "192.168.10.50", "type": "ip", "description": "接口 IP 地址，本机网络身份；改错/地址冲突会当场断 SSH——远程改网卡务必留 console 或带外兜底"}, {"name": "prefix_len", "label": "掩码长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24（不是 255.255.255.0）", "type": "int", "range": "0-32", "description": "前缀长度（0-32），与 IP 组成 CIDR（如 /24）；写错网段判定全错，远程操作可能当场断 SSH"}], "notes": "1) VLAN=yes 让 network 服务自动创建子接口，不要手写 8021q 相关行。\n2) 母接口（PHYSDEV）自身的 ifcfg 里不要写 VLAN=yes，否则行为混乱。\n3) 验证 VLAN 标签：cat /proc/net/vlan/{{ifname}}.{{vlan_id}}。\n—— 实测 2026-10-12（场2,Docker(centos7:local, 容器)）:语法核对(文件段):ifcfg-eth0.100(VLAN=yes)写入+回退✓;生效链同上结构性挂起,真机复核", "duration": "perm", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:56", "updated_at": "2026-10-09 13:45:41", "exec_level": "verified-cli", "interactive": 0, "rollback": "# 回退：变更时未备份 ifcfg 文件——本次新建则直接删除后重启网络\n#（若该文件此前已存在，按变更记录恢复原内容）\nrm -f /etc/sysconfig/network-scripts/ifcfg-{{ifname}}.{{vlan_id}}\nsystemctl restart network\n# 复核（期望报不存在）\nip -d link show {{ifname}}.{{vlan_id}}"}, {"uuid": "1670a689-4336-5726-a418-df3f14f19035", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7 / RHEL 7", "category": "网络配置", "title": "双网卡绑定 bond（nmcli 方式）", "description": "把两块网卡绑成一个 bond 口做链路冗余/带宽，配置持久化。", "commands": "nmcli con add type bond con-name bond0 ifname bond0 \\\n  bond.options \"mode=active-backup,miimon=100\"\nnmcli con add type bond-slave con-name slave-{{ifname}} ifname {{ifname}} master bond0\nnmcli con add type bond-slave con-name slave-{{ifname2}} ifname {{ifname2}} master bond0\nnmcli con mod bond0 ipv4.method manual ipv4.addresses {{ip_addr}}/{{prefix_len}} \\\n  ipv4.gateway {{gateway}}\nnmcli con up bond0\ncat /proc/net/bonding/bond0", "params": [{"name": "ifname", "label": "网卡名", "default": "eth0", "required": true, "validate": "ifname", "example": "eth0 / ens33 / enp3s0 / bond0", "type": "string", "description": "Linux 网卡名（eth0/ens33/bond0 等），操作的目标接口；先 ip link 确认存在再操作，选错网卡会当场断 SSH（远程操作务必留带外兜底）"}, {"name": "ifname2", "label": "第二块网卡", "default": "eth1", "required": true, "validate": "ifname", "example": "eth1", "type": "string", "description": "bond 的第二个成员网卡名；加入 bond 后该口原有 IP 配置被接管，先确认其上无独立业务"}, {"name": "ip_addr", "label": "IP 地址", "default": "192.168.10.50", "required": true, "validate": "ipv4", "example": "192.168.10.50", "type": "ip", "description": "接口 IP 地址，本机网络身份；改错/地址冲突会当场断 SSH——远程改网卡务必留 console 或带外兜底"}, {"name": "prefix_len", "label": "掩码长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24（不是 255.255.255.0）", "type": "int", "range": "0-32", "description": "前缀长度（0-32），与 IP 组成 CIDR（如 /24）；写错网段判定全错，远程操作可能当场断 SSH"}, {"name": "gateway", "label": "网关", "default": "192.168.10.1", "required": true, "validate": "ipv4", "example": "192.168.10.1", "type": "ip", "description": "网关 IP，本网段出方向的下一跳；配错表现为同网段通、跨网段断；nmcli 修改后需重新激活连接生效"}], "notes": "1) mode=active-backup 是主备（最常用）；负载均衡用 mode=802.3ad（需交换机配 LACP）。\n2) 两块 slave 网卡的原 ifcfg 配置要先清掉（或由 NM 接管），否则冲突。\n3) 验证看 /proc/net/bonding/bond0：当前活动网卡与 miimon 状态都在里面。\n—— lab 判定（场2,场2）:不可验证(无 NM 服务+单网卡):nmcli con add 语法无法实跑;双网卡+NM 环境待真机", "duration": "perm", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:56", "updated_at": "2026-10-09 13:45:41", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除 bond 连接与两个 slave 连接（成员口恢复独立可用；\n# ★ 原成员口 IP 配置按变更记录恢复，恢复期间业务走带外）\nnmcli con del bond0\nnmcli con del slave-{{ifname}}\nnmcli con del slave-{{ifname2}}\n# 复核\nnmcli con show\ncat /proc/net/bonding/bond0"}, {"uuid": "5ca5ddd1-6be9-5069-b81d-52f1c7183b87", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7 / RHEL 7", "category": "网络配置", "title": "DNS 配置（临时 + 持久化）", "description": "临时改 /etc/resolv.conf 立即生效；持久化走 nmcli 或 ifcfg 的 DNS 字段。", "commands": "# ---- 临时：直接改 resolv.conf（NetworkManager 管理时重启网络会被覆盖）----\necho \"nameserver {{dns_ip}}\" >> /etc/resolv.conf\ncat /etc/resolv.conf\n# 验证\ndig @{{dns_ip}} {{domain}} +short\n# ---- 持久化（推荐 nmcli）----\nnmcli con mod \"{{con_name}}\" ipv4.dns \"{{dns_ip}}\"\nnmcli con up \"{{con_name}}\"", "params": [{"name": "dns_ip", "label": "DNS 服务器", "default": "223.5.5.5", "required": true, "validate": "ipv4", "example": "223.5.5.5", "type": "ip", "description": "DNS 服务器 IP，写入网卡连接配置；填错表现为 ping IP 通、域名解析失败——是『能 ping 通打不开网页』的典型根因"}, {"name": "domain", "label": "域名", "default": "www.example.com", "required": true, "validate": "", "example": "www.example.com", "type": "string", "description": "设备域名后缀（ip domain-name / domain-name），用于 DNS 解析补全与 SSH RSA 密钥生成；改后提示符与解析习惯同步变化"}, {"name": "con_name", "label": "连接名", "default": "eth0", "required": false, "validate": "", "example": "nmcli con show 查看，一般等于网卡名", "type": "string", "description": "NetworkManager 连接配置名，nmcli 按它修改网卡参数；先 nmcli con show 确认名字再改，改错连接会断网（远程操作务必留 console/带外兜底）"}], "notes": "1) 有 NetworkManager 时直接改 resolv.conf 是临时的，会被 NM 用连接配置覆盖回去。\n2) 持久化二选一：nmcli con mod（推荐）或 ifcfg-{{ifname}} 里加 DNS1={{dns_ip}}。\n3) 多个 DNS 用空格分隔：nmcli con mod \"{{con_name}}\" ipv4.dns \"8.8.8.8 114.114.114.114\"。\n—— 实测 2026-10-12（场2,Docker(centos7:local, 容器)）:语法核对:临时段 echo>>resolv.conf+dig @127.0.0.11 解析✓;回退 sed -i 对 bind-mount 文件 rename 被拒(Device or resource busy,实录 err_unresolved)→cp 备份法回退✓;nmcli 持久化段无 NM 挂起", "duration": "both", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:56", "updated_at": "2026-10-09 13:45:41", "exec_level": "verified-cli", "interactive": 0, "rollback": "# 回退：删除 resolv.conf 追加行并恢复 nmcli DNS 旧值（旧值按变更记录回填）\nsed -i '/nameserver {{dns_ip}}/d' /etc/resolv.conf\nnmcli con mod \"{{con_name}}\" ipv4.dns <变更前DNS>\nnmcli con up \"{{con_name}}\"\n# 复核\ncat /etc/resolv.conf\ndig {{domain}} +short"}, {"uuid": "86214216-5e00-5e49-954b-5a369f2587d7", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7 / RHEL 7", "category": "服务管理", "title": "systemctl 服务管理五件套", "description": "启动/停止/重启/查状态/开机自启，含查看为什么起不来。", "commands": "systemctl start {{service_name}}\nsystemctl stop {{service_name}}\nsystemctl restart {{service_name}}\nsystemctl status {{service_name}} --no-pager\nsystemctl is-enabled {{service_name}}\n# 开机自启 / 取消自启\nsystemctl enable {{service_name}}\nsystemctl disable {{service_name}}\n# 起不来时看细节\nsystemctl status {{service_name}} -l --no-pager\njournalctl -u {{service_name}} -n 50 --no-pager", "params": [{"name": "service_name", "label": "服务名", "default": "sshd", "required": true, "validate": "", "example": "sshd / firewalld / NetworkManager", "type": "string", "description": "systemd 服务名（sshd/nginx 等），start/stop/enable 的操作对象；disable/stop 关键服务（如 sshd）前确认 console 可达"}], "notes": "1) start/restart 是\"现在跑起来\"，enable 是\"开机自启\"—— 两个独立，新装服务要都做。\n2) status 里 Active: failed 时先看 journalctl -u 的最后几行，八成是配置文件或端口被占。\n3) 改了 unit 文件（/usr/lib/systemd/system/*.service）要 systemctl daemon-reload。\n—— 实验室实测 2026-10-09（场1,centos7）：不可验证(centos7 容器无 systemd):start/stop/restart/status 全报 Failed to get D-Bus connection: Operation not permitted;is-enabled 走离线 unit 扫描可用(rc=0)——systemctl 五件套待真机\n—— 实测 2026-10-12（场2,Docker(ubuntu:22.04, 容器)）:语法核对(裁决B2,ubuntu 容器 systemd 同族):restart/enable/is-enabled(enabled✓)/list-unit-files/stop→start 全实跑 RESTART-OK+STOP-START-OK;centos7 目标环境 systemd 组结构性挂起(场1 实证 D-Bus 死结)", "duration": "both", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:57", "updated_at": "2026-10-09 13:45:41", "exec_level": "verified-cli", "interactive": 0, "rollback": "# 回退：本条目为服务管理操作演示，回退目标=恢复变更前服务状态：\n# systemctl start/stop {{service_name}} 回原运行态；\n# systemctl enable/disable {{service_name}} 回原自启态（原状态按变更记录）\nsystemctl status {{service_name}} --no-pager"}, {"uuid": "5f774ec6-2019-5172-9c27-3e75d51e260f", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7 / RHEL 7", "category": "服务管理", "title": "开机自启排查", "description": "查某个服务会不会开机自启、哪些服务在自启列表里。", "commands": "systemctl is-enabled {{service_name}}\nsystemctl list-unit-files --type=service --state=enabled --no-pager\nsystemctl list-unit-files --type=service --state=disabled --no-pager | head -20\n# 某服务开机自启被谁依赖/依赖谁\nsystemctl list-dependencies {{service_name}}", "params": [{"name": "service_name", "label": "服务名", "default": "sshd", "required": true, "validate": "", "example": "sshd / firewalld / NetworkManager", "type": "string", "description": "systemd 服务名（sshd/nginx 等），start/stop/enable 的操作对象；disable/stop 关键服务（如 sshd）前确认 console 可达"}], "notes": "1) is-enabled 输出 enabled/static/indirect/disabled：static 表示被其它服务拉着启动。\n2) 排查\"为什么开机没起\"：先 is-enabled，再 status 看 Active，最后 journalctl 看日志。\n—— 实测 2026-10-12（场2,Docker(ubuntu:22.04, 容器)）:语法核对(裁决B2,ubuntu 容器):systemctl is-enabled ssh=enabled+list-unit-files --state=enabled 实跑✓;centos7 真机复核属centos7 真机计划", "duration": "both", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:57", "updated_at": "2026-10-09 13:45:41", "exec_level": "verified-cli", "interactive": 0, "rollback": ""}, {"uuid": "ab2aaeca-7569-53f4-8296-062b9a2faf2e", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7 / RHEL 7", "category": "防火墙", "title": "firewalld 放行端口与服务", "description": "用 firewall-cmd 永久放行端口/服务，含验证与排错。", "commands": "firewall-cmd --state\nfirewall-cmd --get-active-zones\n# 永久放行端口\nfirewall-cmd --permanent --add-port={{port}}/tcp\nfirewall-cmd --permanent --add-service=https\nfirewall-cmd --reload\nfirewall-cmd --list-all\n# 验证（本机监听 + 远端 telnet）\nss -tlnp | grep :{{port}}", "params": [{"name": "port", "label": "端口号", "default": "8080", "required": true, "validate": "int:1-65535", "example": "8080", "type": "int", "range": "1-65535", "description": "TCP 端口号（0-65535），firewalld/iptables/ufw 放行、ss 查监听、tcpdump 抓包过滤的对象；放行前先 ss -tlnp 确认服务真的在监听，--permanent 后须 firewall-cmd --reload 才生效"}], "notes": "1) ★ 不加 --permanent 只改运行时，reload/重启后丢失；加了 --permanent 必须 --reload 才生效。\n2) 端口没起来是应用没监听（ss 查），端口起了但不通才是防火墙 —— 别上来就关防火墙。\n3) 应急放通 SSH：firewall-cmd --permanent --add-service=ssh && firewall-cmd --reload。\n—— 实验室实测 2026-10-09（场1,centos7）：不可验证(centos7 容器无 firewalld 包且无 systemd):firewall-cmd command not found(rc=127);真机验证\n—— lab 判定（场2,正当挂起,裁决B）:不可验证:结构性无解(centos7 容器无 firewalld 包+无 systemd,场1 实证 firewall-cmd command not found);无 centos7 真机计划,归档", "duration": "perm", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:57", "updated_at": "2026-10-09 13:45:41", "exec_level": "", "interactive": 0, "rollback": "# 回退：移除本次放行的端口与服务（--permanent 修改须 --reload 生效）\nfirewall-cmd --permanent --remove-port={{port}}/tcp\nfirewall-cmd --permanent --remove-service=https\nfirewall-cmd --reload\n# 复核（期望无该端口/服务）\nfirewall-cmd --list-all"}, {"uuid": "8dc510d6-bd40-5600-bda8-6818e38d9b00", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7 / RHEL 7", "category": "防火墙", "title": "firewalld 富规则（只放行指定源 IP）", "description": "用富规则实现「只允许某网段访问某端口」，比全开放安全。", "commands": "firewall-cmd --permanent --add-rich-rule='rule family=\"ipv4\" \\\n  source address=\"{{src_net}}/{{prefix_len}}\" \\\n  port protocol=\"tcp\" port=\"{{port}}\" accept'\nfirewall-cmd --permanent --add-rich-rule='rule family=\"ipv4\" \\\n  source address=\"0.0.0.0/0\" \\\n  port protocol=\"tcp\" port=\"{{port}}\" drop'\nfirewall-cmd --reload\nfirewall-cmd --list-rich-rules", "params": [{"name": "src_net", "label": "允许的源网段", "default": "10.0.0.0", "required": true, "validate": "ipv4", "example": "10.0.0.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "prefix_len", "label": "源掩码长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24", "type": "int", "range": "0-32", "description": "前缀长度（0-32），与 IP 组成 CIDR（如 /24）；写错网段判定全错，远程操作可能当场断 SSH"}, {"name": "port", "label": "端口号", "default": "8080", "required": true, "validate": "int:1-65535", "example": "8080", "type": "int", "range": "1-65535", "description": "TCP 端口号（0-65535），firewalld/iptables/ufw 放行、ss 查监听、tcpdump 抓包过滤的对象；放行前先 ss -tlnp 确认服务真的在监听，--permanent 后须 firewall-cmd --reload 才生效"}], "notes": "1) 先放行白名单网段（accept），再放行全网段拒绝（drop）—— 富规则按顺序匹配。\n2) 引号嵌套：外层单引号、内层双引号，写错会报 syntax error。\n3) 等价图形化思路：放行 22/管理口给运维网段，业务端口按需白名单。\n—— lab 判定（场2,正当挂起,裁决B）:不可验证:结构性无解(同 firewalld 放行条);归档", "duration": "perm", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:57", "updated_at": "2026-10-09 13:45:42", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除本次添加的两条富规则并重载（remove 参数须与 add 时逐字一致）\nfirewall-cmd --permanent --remove-rich-rule='rule family=\"ipv4\" source address=\"{{src_net}}/{{prefix_len}}\" port protocol=\"tcp\" port=\"{{port}}\" accept'\nfirewall-cmd --permanent --remove-rich-rule='rule family=\"ipv4\" source address=\"0.0.0.0/0\" port protocol=\"tcp\" port=\"{{port}}\" drop'\nfirewall-cmd --reload\n# 复核（期望为空）\nfirewall-cmd --list-rich-rules"}, {"uuid": "33be5cc9-2510-5d74-abd9-f2bf9190d431", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7 / RHEL 7", "category": "防火墙", "title": "iptables 基础（临时规则）", "description": "查看与添加 iptables 规则；与 firewalld 同时用会打架，二选一。", "commands": "iptables -L -n -v --line-numbers\n# 放行端口（插到最前面）\niptables -I INPUT 1 -p tcp --dport {{port}} -j ACCEPT\n# 只放行指定网段\niptables -A INPUT -p tcp -s {{src_net}}/{{prefix_len}} --dport {{port}} -j ACCEPT\n# 拒绝其它\niptables -A INPUT -p tcp --dport {{port}} -j DROP\n# 保存（重启后仍生效，需要 iptables-services 包）\niptables-save > /etc/sysconfig/iptables", "params": [{"name": "port", "label": "端口号", "default": "8080", "required": true, "validate": "int:1-65535", "example": "8080", "type": "int", "range": "1-65535", "description": "TCP 端口号（0-65535），firewalld/iptables/ufw 放行、ss 查监听、tcpdump 抓包过滤的对象；放行前先 ss -tlnp 确认服务真的在监听，--permanent 后须 firewall-cmd --reload 才生效"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}, {"name": "prefix_len", "label": "源掩码长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24", "type": "int", "range": "0-32", "description": "前缀长度（0-32），与 IP 组成 CIDR（如 /24）；写错网段判定全错，远程操作可能当场断 SSH"}], "notes": "1) ⚠ 直接加的规则重启后失效；持久化要 iptables-save 或装 iptables-services。\n2) ★ RHEL7 默认用 firewalld，iptables 与 firewalld 同时改规则会互相覆盖，二选一。\n3) -I INPUT 1 是插到第 1 条（优先匹配），-A 是追加到末尾 —— 顺序错了 DROP 会挡掉 ACCEPT。\n—— lab 判定（场2,场2）:不可验证:centos7 容器 iptables v1.4.21 存在但 Permission denied(无 CAP_NET_ADMIN,实录)+ubuntu 容器无 iptables 包;真机/privileged 验证", "duration": "temp", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:57", "updated_at": "2026-10-09 13:45:42", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除本变更新增的 INPUT 规则（按行号倒序删，编号现场确认后回填），\n# 已 iptables-save 落盘的重新保存\niptables -L INPUT -n -v --line-numbers\niptables -D INPUT <行号>\niptables-save > /etc/sysconfig/iptables\n# 复核\niptables -L INPUT -n -v --line-numbers"}, {"uuid": "7ddb249b-4d42-5f56-b592-36c2cc4b595c", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7 / RHEL 7", "category": "排查命令", "title": "查端口监听与占用（ss/netstat）", "description": "确认服务是否在监听端口、被哪个进程占用。", "commands": "ss -tlnp | grep :{{port}}\nss -tlnp\nss -s\n# netstat 用法相同（需 yum install net-tools）\nnetstat -tlnp | grep :{{port}}\n# 查某进程占了哪些端口\nss -tlnp | grep {{pid}}", "params": [{"name": "port", "label": "端口号", "default": "8080", "required": true, "validate": "int:1-65535", "example": "8080", "type": "int", "range": "1-65535", "description": "TCP 端口号（0-65535），firewalld/iptables/ufw 放行、ss 查监听、tcpdump 抓包过滤的对象；放行前先 ss -tlnp 确认服务真的在监听，--permanent 后须 firewall-cmd --reload 才生效"}, {"name": "pid", "label": "进程号", "default": "1234", "required": true, "validate": "int:1-4194304", "example": "1234", "type": "int", "range": "1-4194304", "description": "进程号（PID），ss/cat /proc/PID 定位进程资源与监听；kill 前先 ps 确认进程归属，误杀系统进程会宕机"}], "notes": "1) -t TCP、-l 监听、-n 不解析域名（快）、-p 显示进程 —— 记住 tlnp 四件套。\n2)LISTEN 都没有 → 服务没起或起在别的端口（先 systemctl status）；LISTEN 有但不通 → 查防火墙。\n3) 老脚本用 netstat 的话装 net-tools 包，新排查一律用 ss（更快更全）。\n—— 实测 2026-10-12（场2,Docker(centos7:local, 容器)）:实测:ss -tlnp 命中 sshd:22 LISTEN+进程名;ss -s/netstat 对照一致", "duration": "temp", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(centos7:local, 容器)", "verified_date": "2026-10-12", "favorite": 0, "created_at": "2026-09-22 16:33:57", "updated_at": "2026-10-09 13:45:42", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "65715bad-f12c-56fa-9179-3acb7dee7506", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7 / RHEL 7", "category": "排查命令", "title": "tcpdump 抓包入门五式", "description": "五个最常用的抓包姿势：按主机、按端口、按网段、落盘、抓 ARP。", "commands": "tcpdump -i {{ifname}} -nn host {{peer_ip}} -c 100\ntcpdump -i {{ifname}} -nn port {{port}} -c 100\ntcpdump -i {{ifname}} -nn src net {{src_net}}/24 -c 100\ntcpdump -i {{ifname}} -nn -w /tmp/capture.pcap -c 1000\ntcpdump -i any -nn arp -c 50\n# 只看不抓自己 SSH 的流量（远程排查必备）\ntcpdump -i {{ifname}} -nn not port 22 -c 100", "params": [{"name": "ifname", "label": "网卡名", "default": "eth0", "required": true, "validate": "ifname", "example": "eth0 / ens33 / enp3s0 / bond0", "type": "string", "description": "Linux 网卡名（eth0/ens33/bond0 等），操作的目标接口；先 ip link 确认存在再操作，选错网卡会当场断 SSH（远程操作务必留带外兜底）"}, {"name": "peer_ip", "label": "对端 IP", "default": "192.168.10.1", "required": true, "validate": "ipv4", "example": "192.168.10.1", "type": "ip", "description": "对端/目标 IP，ping/traceroute/tcpdump 等诊断命令的过滤与测试对象；仅诊断用途不影响配置"}, {"name": "port", "label": "端口号", "default": "8080", "required": true, "validate": "int:1-65535", "example": "8080", "type": "int", "range": "1-65535", "description": "TCP 端口号（0-65535），firewalld/iptables/ufw 放行、ss 查监听、tcpdump 抓包过滤的对象；放行前先 ss -tlnp 确认服务真的在监听，--permanent 后须 firewall-cmd --reload 才生效"}, {"name": "src_net", "label": "源网段", "default": "192.168.10.0", "required": true, "validate": "ipv4", "example": "192.168.10.0", "type": "ip", "description": "源网段地址，ACL/策略的来源匹配字段；0.0.0.0/0 表示任意来源；范围写宽等于放宽访问控制"}], "notes": "1) -nn 不解析域名端口（速度快、输出干净）；-c 限制包数防止刷屏。\n2) 远程排查一定加 not port 22，否则自己的 SSH 流量把输出淹了。\n3) -w 落盘的 pcap 拷回本机用 Wireshark 分析；-i any 抓所有网卡（VLAN 场景好用）。\n—— 实测 2026-10-12（场2,Docker(centos7:local, 容器)）:实测:五式中 4 式实抓成功(host 抓 3 包/-w+(-r)/组合过滤/-s 68);port 22 式语法接受未捕获(ssh 触发时序),非语法错", "duration": "temp", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(centos7:local, 容器)", "verified_date": "2026-10-12", "favorite": 0, "created_at": "2026-09-22 16:33:57", "updated_at": "2026-10-09 13:45:42", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "ba83f283-c390-5fb6-ad71-14e03f1b62f4", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7 / RHEL 7", "category": "排查命令", "title": "ethtool 网卡与光模块诊断", "description": "查网卡速率、双工、链路状态与驱动信息。", "commands": "ethtool {{ifname}}\nethtool -i {{ifname}}\nethtool -S {{ifname}} | grep -iE \"error|drop|crc\" | head\nip -s link show {{ifname}}", "params": [{"name": "ifname", "label": "网卡名", "default": "eth0", "required": true, "validate": "ifname", "example": "eth0 / ens33 / enp3s0 / bond0", "type": "string", "description": "Linux 网卡名（eth0/ens33/bond0 等），操作的目标接口；先 ip link 确认存在再操作，选错网卡会当场断 SSH（远程操作务必留带外兜底）"}], "notes": "1) Link detected: yes 才有物理链路；no 先查线缆/光模块/对端端口。\n2) Speed: 1000Mb/s 与对端不一致（一边 100M）就是双工/速率协商问题。\n3) CRC/error 计数持续增长 → 大概率光模块或线缆质量差，换线换模块。\n—— 实测 2026-10-12（场2,Docker(centos7:local, 容器)）:实测:ethtool/-i/-S+ip -s link 全实跑,veth 驱动 10G 速率计数器回显符合判读;wake-on-lan 不可读属容器虚拟化正常现象", "duration": "temp", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(centos7:local, 容器)", "verified_date": "2026-10-12", "favorite": 0, "created_at": "2026-09-22 16:33:57", "updated_at": "2026-10-09 13:45:42", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "edc961f1-86cc-59d5-9958-7569af10034c", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7 / RHEL 7", "category": "排查命令", "title": "连通性排查三连（ping/traceroute/dig）", "description": "从链路层到应用层快速定位网络不通的点。", "commands": "ping -c 4 {{peer_ip}}\ntraceroute {{peer_ip}}\ndig @{{dns_ip}} {{domain}} +short\n# 指定出口网卡 ping（多网卡/策略路由场景）\nping -I {{ifname}} -c 4 {{peer_ip}}\n# 端口级连通（比 telnet 直观）\ncurl -v telnet://{{peer_ip}}:{{port}} --connect-timeout 3", "params": [{"name": "peer_ip", "label": "对端 IP", "default": "192.168.10.1", "required": true, "validate": "ipv4", "example": "192.168.10.1", "type": "ip", "description": "对端/目标 IP，ping/traceroute/tcpdump 等诊断命令的过滤与测试对象；仅诊断用途不影响配置"}, {"name": "dns_ip", "label": "DNS 服务器", "default": "223.5.5.5", "required": true, "validate": "ipv4", "example": "223.5.5.5", "type": "ip", "description": "DNS 服务器 IP，写入网卡连接配置；填错表现为 ping IP 通、域名解析失败——是『能 ping 通打不开网页』的典型根因"}, {"name": "domain", "label": "域名", "default": "www.example.com", "required": true, "validate": "", "example": "www.example.com", "type": "string", "description": "设备域名后缀（ip domain-name / domain-name），用于 DNS 解析补全与 SSH RSA 密钥生成；改后提示符与解析习惯同步变化"}, {"name": "ifname", "label": "网卡名", "default": "eth0", "required": true, "validate": "ifname", "example": "eth0 / ens33 / enp3s0 / bond0", "type": "string", "description": "Linux 网卡名（eth0/ens33/bond0 等），操作的目标接口；先 ip link 确认存在再操作，选错网卡会当场断 SSH（远程操作务必留带外兜底）"}, {"name": "port", "label": "端口号", "default": "8080", "required": true, "validate": "int:1-65535", "example": "8080", "type": "int", "range": "1-65535", "description": "TCP 端口号（0-65535），firewalld/iptables/ufw 放行、ss 查监听、tcpdump 抓包过滤的对象；放行前先 ss -tlnp 确认服务真的在监听，--permanent 后须 firewall-cmd --reload 才生效"}], "notes": "1) ping 通但端口不通 → 防火墙或服务没监听；ping 不通 → 先看 ARP（ip neigh）。\n2) traceroute 中间 * 号不一定是断点（路由器可以禁 ICMP），看最后一跳在哪。\n3) dig +short 只出结果行；排查解析问题加 @ 指定 DNS 服务器对比。\n—— 实测 2026-10-12（场2,Docker(centos7:local, 容器)）:语法核对:ping 网关 0% loss✓+dig @127.0.0.11 解析容器名✓;traceroute 镜像未装降档,真机复核", "duration": "temp", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:57", "updated_at": "2026-10-09 13:45:42", "exec_level": "verified-cli", "interactive": 0, "rollback": "# 回退：本条目为连通性诊断（ping/traceroute/dig/curl 探测均只读），\n# 无配置变更，无需回退"}, {"uuid": "e2da85a1-b6a5-54d7-8909-edba295ead46", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7 / RHEL 7", "category": "日志", "title": "journalctl 日志过滤", "description": "按服务、时间窗、级别过滤 systemd 日志。", "commands": "journalctl -u {{service_name}} -n 100 --no-pager\njournalctl -xe\njournalctl -u {{service_name}} --since \"2026-09-21 10:00\" --until \"2026-09-21 11:00\" --no-pager\njournalctl -p err -b --no-pager\njournalctl --disk-usage", "params": [{"name": "service_name", "label": "服务名", "default": "sshd", "required": true, "validate": "", "example": "sshd / firewalld / NetworkManager", "type": "string", "description": "systemd 服务名（sshd/nginx 等），start/stop/enable 的操作对象；disable/stop 关键服务（如 sshd）前确认 console 可达"}], "notes": "1) -xe 的 x 是补全上下文、e 是跳到最后 —— 服务起不来先看这个。\n2) -b 只看本次开机以来的日志；-p err 只看 err 及以上级别。\n3) 日志占满磁盘：journalctl --vacuum-size=500M 直接缩到指定大小。\n—— 实测 2026-10-12（场2,Docker(ubuntu:22.04, 容器)）:语法核对(非目标发行版容器):journalctl -u ssh -n 5/-n 3/--disk-usage(8.0M) 实跑✓;centos7 容器无 systemd 日志(场1 空回显实录)", "duration": "temp", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:57", "updated_at": "2026-10-09 13:45:42", "exec_level": "verified-cli", "interactive": 0, "rollback": ""}, {"uuid": "89838bc5-9518-52f4-8d28-b6527c30a560", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7 / RHEL 7", "category": "日志", "title": "日志 grep + tail 组合排查", "description": "传统文本日志的快速过滤姿势。", "commands": "tail -n 100 /var/log/messages\ngrep -iE \"error|fail\" /var/log/messages | tail -20\ngrep -C 3 \"{{keyword}}\" /var/log/messages\ntail -f /var/log/messages\ntail -f /var/log/messages | grep --line-buffered -i \"{{keyword}}\"", "params": [{"name": "keyword", "label": "关键字", "default": "eth0", "required": true, "validate": "", "example": "eth0 / dhcp / sshd", "type": "string", "description": "日志检索关键字，grep 过滤 /var/log/messages 等日志文件；支持正则；关键字太泛刷屏、太窄漏报，先宽后窄收敛"}], "notes": "1) grep -C 3 显示命中行前后各 3 行，排障时上下文很重要。\n2) tail -f 跟踪时 Ctrl+C 退出；管道里 grep 要加 --line-buffered 否则缓冲会卡输出。\n3) 关键字先小写 + -i 忽略大小写，避免 \"Error\"/\"ERROR\" 漏匹配。\n—— 实测 2026-10-12（场2,Docker(centos7:local, 容器)）:实测:构造测试日志后 tail/grep -iE/-C3/tail -f(3s 截断+新行命中 --line-buffered) 全通", "duration": "temp", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(centos7:local, 容器)", "verified_date": "2026-10-12", "favorite": 0, "created_at": "2026-09-22 16:33:57", "updated_at": "2026-10-09 13:45:42", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "f5d0e9fa-80fb-5cb3-bada-272cb72a1f12", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7 / RHEL 7", "category": "本地源", "title": "本地 yum 源（ISO 挂载）★ 离网特供", "description": "用 ISO 镜像搭本地 yum 源，完全离线装包——隔离网最高频场景。", "commands": "mkdir -p /mnt/cdrom\nmount -o loop {{iso_path}} /mnt/cdrom\n# 物理光驱则：mount /dev/cdrom /mnt/cdrom\ncat > /etc/yum.repos.d/local.repo << 'EOF'\n[local-iso]\nname=Local ISO Repo\nbaseurl=file:///mnt/cdrom\nenabled=1\ngpgcheck=0\nEOF\nyum clean all\nyum makecache\nyum repolist\nyum install {{pkg_name}} -y", "params": [{"name": "iso_path", "label": "ISO 文件路径", "default": "/opt/CentOS-7-x86_64-DVD-2009.iso", "required": true, "validate": "path", "example": "/opt/CentOS-7-x86_64-DVD-2009.iso", "type": "string", "description": "本地 ISO 镜像文件路径，loop 挂载为本地安装源；写错路径 mount 失败；写入 /etc/fstab 前先手动挂载验证（配错 fstab 重启起不来）"}, {"name": "pkg_name", "label": "软件包名", "default": "createrepo", "required": true, "validate": "", "example": "createrepo", "type": "string", "description": "软件包名（yum/apt/rpm 的操作对象）；离网环境先在异机下载（pip download / yumdownloader）再拷入安装"}], "notes": "1) ★ 离网装包第一选择；gpgcheck=0 免去导 key 的麻烦。\n2) 开机自动挂载：echo \"{{iso_path}} /mnt/cdrom iso9660 loop,defaults 0 0\" >> /etc/fstab\n3) repolist 显示 0 个包 → baseurl 指错层级，要指向含 repodata/ 目录的那一层。\n4) 多台机器共用：把 ISO 目录用 NFS/HTTP 发出去，baseurl 改成 http://内网IP/centos7/。\n—— lab 判定（场2,centos7:local）:不可验证(需 ISO 介质):容器无 CentOS-7 ISO,mount -o loop 全链待带介质环境实测", "duration": "perm", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:57", "updated_at": "2026-10-09 13:45:42", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除 local.repo 并卸载 ISO（★ 已用该源安装的包保留不影响系统）\nrm -f /etc/yum.repos.d/local.repo\numount /mnt/cdrom\nyum clean all && yum makecache\n# 复核（期望无 local-iso 源）\nyum repolist"}, {"uuid": "ee15bcb0-dab7-55da-9adf-67a0c085f5c9", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7 / RHEL 7", "category": "本地源", "title": "createrepo 自建 yum 源", "description": "把收集来的 rpm 做成正式 yum 源，供本机或内网其它机器使用。", "commands": "mkdir -p /opt/local-repo\ncp ./*.rpm /opt/local-repo/\ncreaterepo /opt/local-repo\ncat > /etc/yum.repos.d/local-repo.repo << 'EOF'\n[local-repo]\nname=Local Created Repo\nbaseurl=file:///opt/local-repo\nenabled=1\ngpgcheck=0\nEOF\nyum clean all\nyum makecache\nyum repolist", "params": [], "notes": "1) ★ 每次往目录里加了新 rpm 都要重新 createrepo /opt/local-repo，否则 yum 看不到。\n2) createrepo 命令本身没装：从 ISO 的 Packages 里找出\n   createrepo / deltarpm / python-deltarpm 三个包 rpm -Uvh 安装。\n3) 给内网其它机器用：/opt/local-repo 用 HTTP 发出去（python -m http.server 8000 也行）。\n—— 实测 2026-10-12（场2,Docker(centos7:local, 容器)）:实测:downloadonly 拉真实 rpm→createrepo 生成 repodata→file: 源 makecache→repolist 命中 local-repo;rollback 三段 rm repo+dir→yum clean→repolist 无 local-repo ✓", "duration": "perm", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(centos7:local, 容器)", "verified_date": "2026-10-12", "favorite": 0, "created_at": "2026-09-22 16:33:57", "updated_at": "2026-10-09 13:45:43", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除自建源配置与仓库目录（★ 已安装的包保留）\nrm -f /etc/yum.repos.d/local-repo.repo\nrm -rf /opt/local-repo\nyum clean all && yum makecache\n# 复核（期望无 local-repo 源）\nyum repolist"}, {"uuid": "1a839752-cb50-5611-aac4-b1752232be03", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7 / RHEL 7", "category": "本地源", "title": "离线 rpm 安装（含依赖处理）", "description": "没有 yum 源时用 rpm 直接装，重点是如何处理依赖。", "commands": "# 查这个包装不装得上、缺什么依赖\nrpm -ivh --test {{pkg_name}}.rpm\nrpm -qpR {{pkg_name}}.rpm\n# ★ 推荐姿势：把依赖包都放进同一目录，一次性装（rpm 自动排顺序）\nrpm -Uvh ./*.rpm\n# 验证\nrpm -q {{pkg_name}}\nrpm -ql {{pkg_name}} | head", "params": [{"name": "pkg_name", "label": "软件包名", "default": "createrepo", "required": true, "validate": "", "example": "createrepo", "type": "string", "description": "软件包名（yum/apt/rpm 的操作对象）；离网环境先在异机下载（pip download / yumdownloader）再拷入安装"}], "notes": "1) ★ rpm 不会自动下载依赖 —— 先用 rpm -qpR 看缺什么，把依赖包一起拷过来。\n2) yum localinstall {{pkg_name}}.rpm 会自动找依赖（前提是有可用源，见本地源条目）。\n3) 已装同版本再装报\"已安装\"是正常的；降级用 rpm -Uvh --oldpackage。\n—— 实测 2026-10-12（场2,Docker(centos7:local, 容器)）:语法核对:rpm -q/-ql/-qpR(真实 tree.rpm)/-ivh --test(Preparing✓)全实跑;rpm -Uvh 实装段未执行(单包环境以 --test 等价),真机复核批量实装", "duration": "temp", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:57", "updated_at": "2026-10-09 13:45:43", "exec_level": "verified-cli", "interactive": 0, "rollback": ""}, {"uuid": "a3d432c9-5bc7-5b62-a099-eb37fb106890", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7 / RHEL 7", "category": "磁盘", "title": "磁盘空间排查（df/du/deleted 句柄）", "description": "定位磁盘被什么占满，含「df 满但 du 找不到」的经典坑。", "commands": "df -h\ndu -sh /* 2>/dev/null | sort -rh | head -10\ndu -sh /var/log/* | sort -rh | head -10\n# df 满、du 找不到大文件 → 八成是被删文件还被进程占着\nlsof | grep deleted | head\n# 找到进程后重启它释放空间，或：\n: > /var/log/bigfile.log", "params": [], "notes": "1) df 满、du 加起来不大 → 查 lsof | grep deleted：日志被删了但进程还握着句柄。\n2) 清理正在写的日志用 : > 文件（截断），不要 rm —— rm 了空间不会立刻释放。\n3) inode 用满也是 \"No space left on device\"：df -i 看节点数，海量小文件场景。\n4) ★ 截断文件（: > 大文件）前先确认属主与进程占用：lsof | grep 文件名；正在被进程写入的日志直接清空可能导致句柄错乱，优先用 journalctl --vacuum-size 等正规收缩手段。\n\n—— 实测 2026-10-12（场2,Docker(centos7:local, 容器)）:语法核对:df/du/截断演示(8M→0)实跑✓;lsof deleted 段缺包降档,真机复核", "duration": "temp", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:57", "updated_at": "2026-10-09 13:45:43", "exec_level": "verified-cli", "interactive": 0, "rollback": "# 回退：本条目为排查演示；\": >\" 截断示例日志文件的内容已清空且不可恢复，\n# 如该文件是业务日志需从应用侧重建或恢复轮转；其余均为只读命令无需回退"}, {"uuid": "b4c04b67-0ce8-5209-826f-0c1f9b892e7b", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7 / RHEL 7", "category": "磁盘", "title": "文件句柄不足排查（Too many open files）", "description": "查系统与进程的句柄使用，定位并临时调大限制。", "commands": "cat /proc/sys/fs/file-nr\nulimit -n\ncat /proc/{{pid}}/limits | grep \"open files\"\nlsof -p {{pid}} | wc -l\n# 临时调大（重启失效，持久化改 /etc/security/limits.conf）\nulimit -n 65535", "params": [{"name": "pid", "label": "进程号", "default": "1234", "required": true, "validate": "int:1-4194304", "example": "1234", "type": "int", "range": "1-4194304", "description": "进程号（PID），ss/cat /proc/PID 定位进程资源与监听；kill 前先 ps 确认进程归属，误杀系统进程会宕机"}], "notes": "1) 持久化：/etc/security/limits.conf 加 \"* soft nofile 65535 / * hard nofile 65535\"，\n   systemd 服务的限制要在 unit 文件里加 LimitNOFILE=65535，改完 daemon-reload。\n2) /proc/sys/fs/file-nr 三个数：已分配 / 已分配未使用 / 上限。\n3) 报 Too many open files 先看报错进程的 limits，而不是系统的。\n—— 实测 2026-10-12（场2,Docker(centos7:local, 容器)）:语法核对:file-nr/ulimit -n/proc limits 全实跑+ulimit 65535 生效✓;lsof 缺包降档,真机复核 lsof -p 段", "duration": "temp", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:57", "updated_at": "2026-10-09 13:45:43", "exec_level": "verified-cli", "interactive": 0, "rollback": "# 回退：ulimit -n 调大仅影响当前 shell 会话，重新登录即恢复默认；\n# 若持久化改过 /etc/security/limits.conf，按变更记录回填原值"}, {"uuid": "2af0330b-0b4f-58a3-8e6d-b841777ac249", "platform": "linux", "device_type": "服务器", "vendor": "centos", "os_family": "centos7", "models": "CentOS 7 / RHEL 7", "category": "系统资源", "title": "CPU / 内存资源判读（top/free）", "description": "快速看谁在吃资源，并正确解读 free 的输出。", "commands": "top -b -n 1 | head -20\nfree -h\ncat /proc/meminfo | head -5\nps aux --sort=-%mem | head -10\nps aux --sort=-%cpu | head -10", "params": [], "notes": "1) free 里看 available 才是真实可用；buff/cache 是系统缓存，不算\"被占用\"。\n2) top 里 %wa 高说明 IO 等待严重（磁盘瓶颈），%us 高是应用吃 CPU。\n3) 交互模式 top 里按 1 展开每颗 CPU，按 M 按内存排序、按 P 按 CPU 排序。\n—— 实测 2026-10-12（场2,Docker(centos7:local, 容器)）:实测:top -b -n1/free -h/uptime/proc meminfo 全实跑,load/mem 判读口径可复述", "duration": "temp", "verified": 1, "verified_by": "4caf1-xy+AI", "verified_model": "Docker(centos7:local, 容器)", "verified_date": "2026-10-12", "favorite": 0, "created_at": "2026-09-22 16:33:57", "updated_at": "2026-09-22 16:33:57", "exec_level": "", "interactive": 0, "rollback": ""}, {"uuid": "0026be66-e1db-5eea-a9c0-8393c59ce9ef", "platform": "linux", "device_type": "服务器", "vendor": "kylin", "os_family": "kylinV10", "models": "银河麒麟 V10（SP1/SP2/SP3）", "category": "网络配置", "title": "nmcli 配置 IP（麒麟 V10）", "description": "麒麟 V10 用 NetworkManager 管网络，nmcli 配置即持久化。", "commands": "nmcli con show\nnmcli con mod \"{{con_name}}\" ipv4.method manual ipv4.addresses {{ip_addr}}/{{prefix_len}}\nnmcli con mod \"{{con_name}}\" ipv4.gateway {{gateway}}\nnmcli con mod \"{{con_name}}\" ipv4.dns {{dns_ip}}\nnmcli con up \"{{con_name}}\"\nnmcli con show \"{{con_name}}\"", "params": [{"name": "con_name", "label": "连接名", "default": "eth0", "required": false, "validate": "", "example": "nmcli con show 查看，一般等于网卡名", "type": "string", "description": "NetworkManager 连接配置名，nmcli 按它修改网卡参数；先 nmcli con show 确认名字再改，改错连接会断网（远程操作务必留 console/带外兜底）"}, {"name": "ip_addr", "label": "IP 地址", "default": "192.168.10.50", "required": true, "validate": "ipv4", "example": "192.168.10.50", "type": "ip", "description": "接口 IP 地址，本机网络身份；改错/地址冲突会当场断 SSH——远程改网卡务必留 console 或带外兜底"}, {"name": "prefix_len", "label": "掩码长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24（不是 份——按变更记录恢复原内容\n#（本次新建则删除文件）后重启网络\nip route del {{dest_net}}/{{prefix_len}} via {{gateway}} dev {{ifname}}\nrm -f /etc/sysconfig/network-scripts/route-{{ifname}}\nsystemctl restart NetworkManager\n# 复核\nip route show"}, {"uuid": "269bd02e-c85d-5e39-af7c-c9f1387770b0", "platform": "linux", "device_type": "服务器", "vendor": "kylin", "os_family": "kylinV10", "models": "银河麒麟 V10", "category": "网络配置", "title": "VLAN 子接口（临时 + 持久化，麒麟 V10）", "description": "ip link 临时建 VLAN 子接口，ifcfg 持久化。", "commands": "# ---- 临时 ----\nip link add link {{ifname}} name {{ifname}}.{{vlan_id}} type vlan id {{vlan_id}}\nip addr add {{ip_addr}}/{{prefix_len}} dev {{ifname}}.{{vlan_id}}\nip link set {{ifname}}.{{vlan_id}} up\n# ---- 持久化 ----\ncat > /etc/sysconfig/network-scripts/ifcfg-{{ifname}}.{{vlan_id}} << 'EOF'\nDEVICE={{ifname}}.{{vlan_id}}\nBOOTPROTO=static\nONBOOT=yes\nVLAN=yes\nPHYSDEV={{ifname}}\nIPADDR={{ip_addr}}\nPREFIX={{prefix_len}}\nEOF\nsystemctl restart NetworkManager\nip -d link show {{ifname}}.{{vlan_id}}", "params": [{"name": "ifname", "label": "网卡名", "default": "eth0", "required": true, "validate": "ifname", "example": "eth0 / ens33 / enp3s0 / bond0", "type": "string", "description": "Linux 网卡名（eth0/ens33/bond0 等），操作的目标接口；先 ip link 确认存在再操作，选错网卡会当场断 SSH（远程操作务必留带外兜底）"}, {"name": "vlan_id", "label": "VLAN ID", "default": "10", "required": true, "validate": "vlan", "example": "10", "type": "string", "description": "VLAN 编号，二层广播域标识；有效范围 1-4094（1 为默认 VLAN、1002-1005 系统保留）；Trunk 两端放行列表与 PVID 必须配套，改错会隔离业务"}, {"name": "ip_addr", "label": "IP 地址", "default": "192.168.10.50", "required": true, "validate": "ipv4", "example": "192.168.10.50", "type": "ip", "description": "接口 IP 地址，本机网络身份；改错/地址冲突会当场断 SSH——远程改网卡务必留 console 或带外兜底"}, {"name": "prefix_len", "label": "掩码长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24（不是 255.255.255.0）", "type": "int", "range": "0-32", "description": "前缀长度（0-32），与 IP 组成 CIDR（如 /24）；写错网段判定全错，远程操作可能当场断 SSH"}], "notes": "1) ★ 待真机核对：ifcfg 的 VLAN 字段与 RHEL 一致，重启服务名按版本确认。\n2) 交换机侧 trunk + 放通该 VLAN；验证 cat /proc/net/vlan/config。\n—— 实测 2026-10-12（场2,Docker(ubuntu:22.04, 容器)）:语法核对(裁决A):临时段 ip link add vlan 实跑(b4 同款)+ifcfg 文件段 centos7 核对(b5 同款);生效链待真机", "duration": "both", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:58", "updated_at": "2026-10-09 13:45:44", "exec_level": "verified-cli", "interactive": 0, "rollback": "# 回退：删除 VLAN 子接口与持久化文件（本次新建则删文件；若文件此前已存在\n# 按变更记录恢复原内容）后重启网络\nip link del {{ifname}}.{{vlan_id}}\nrm -f /etc/sysconfig/network-scripts/ifcfg-{{ifname}}.{{vlan_id}}\nsystemctl restart NetworkManager\n# 复核（期望报不存在）\nip -d link show {{ifname}}.{{vlan_id}}"}, {"uuid": "b3c063a9-ab25-57bb-b25f-69c7580ea5b1", "platform": "linux", "device_type": "服务器", "vendor": "kylin", "os_family": "kylinV10", "models": "银河麒麟 V10", "category": "防火墙", "title": "firewalld 放行端口（麒麟 V10）", "description": "firewall-cmd 永久放行端口并验证。", "commands": "firewall-cmd --state\nfirewall-cmd --permanent --add-port={{port}}/tcp\nfirewall-cmd --reload\nfirewall-cmd --list-all\nss -tlnp | grep :{{port}}", "params": [{"name": "port", "label": "端口号", "default": "8080", "required": true, "validate": "int:1-65535", "example": "8080", "type": "int", "range": "1-65535", "description": "TCP 端口号（0-65535），firewalld 放行与 ss 查监听的对象；--permanent 后须 firewall-cmd --reload 才生效"}], "notes": "1) ★ 待真机核对：麒麟 V10 默认带 firewalld，用法与 RHEL 一致。\n2) --permanent 与 --reload 成对出现；应用没监听（ss 查）不是防火墙问题。\n—— 实验室实测 2026-10-09（场1,centos7）：不可验证(centos7 容器无 firewalld 包且无 systemd):firewall-cmd command not found;真机验证\n—— lab 判定（场2,正当挂起）:不可验证(容器无 firewalld 包+无 systemd,裁决B 同族);待真机", "duration": "perm", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:58", "updated_at": "2026-10-09 13:45:44", "exec_level": "", "interactive": 0, "rollback": "# 回退：移除本次放行的端口（--permanent 修改须 --reload 生效）\nfirewall-cmd --permanent --remove-port={{port , "label": "ISO 文件路径", "default": "/opt/CentOS-7-x86_64-DVD-2009.iso", "required": true, "validate": "path", "example": "/opt/CentOS-7-x86_64-DVD-2009.iso", "type": "string", "description": "本地 ISO 镜像文件路径，loop 挂载为本地安装源；写错路径 mount 失败；写入 /etc/fstab 前先手动挂载验证（配错 fstab 重启起不来）"}, {"name": "pkg_name", "label": "软件包名", "default": "createrepo", "required": true, "validate": "", "example": "createrepo", "type": "string", "description": "软件包名（yum/apt/rpm 的操作对象）；离网环境先在异机下载（pip download / yumdownloader）再拷入安装"}], "notes": "1) ★ 待真机核对：麒麟 ISO 的 repo 目录层级可能与 CentOS 不同，\n   挂载后先 ls /mnt/cdrom 找到含 repodata/ 的目录再写 baseurl。\n2) 开机自动挂载写 /etc/fstab；gpgcheck=0 免导 key。\n—— lab 判定（场2,正当挂起）:不可验证(需麒麟 ISO 介质,容器无 ISO);待真机", "duration": "perm", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:58", "updated_at": "2026-10-09 13:45:44", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除本地源配置并卸载 ISO（★ 已安装的包保留不影响系统）\nrm -f /etc/yum.repos.d/kylin-local.repo\numount /mnt/cdrom\nyum clean all && yum makecache\n# 复核（期望无 kylin-local 源）\nyum repolist"}, {"uuid": "a83df474-c651-5ae8-93b6-ae5e82c0b285", "platform": "linux", "device_type": "服务器", "vendor": "kylin", "os_family": "kylinV10", "models": "银河麒麟 V10", "category": "本地源", "title": "createrepo 自建源（麒麟 V10）", "description": "把收集的 rpm 做成正式源。", "commands": "mkdir -p /opt/local-repo\ncp ./*.rpm /opt/local-repo/\ncreaterepo /opt/local-repo\ncat > /etc/yum.repos.d/local-repo.repo << 'EOF'\n[local-repo]\nname=Local Repo\nbaseurl=file:///opt/local-repo\nenabled=1\ngpgcheck=0\nEOF\nyum clean all && yum makecache && yum repolist", "params": [], "notes": "1) ★ 待真机核对；加新 rpm 后要重新 createrepo。\n2) createrepo 未装时可从麒麟 ISO 的 Packages 里找。\n—— 实测 2026-10-12（场2,Docker(centos7:local, 容器)）:语法核对(裁决A,RHEL 同族):createrepo+file: 源 makecache+回退✓(b2x 同款)", "duration": "perm", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:58", " 表现为同网段通、跨网段断；nmcli 修改后需重新激活连接生效"}, {"name": "dns_ip", "label": "DNS 服务器", "default": "223.5.5.5", "required": true, "validate": "ipv4", "example": "223.5.5.5", "type": "ip", "description": "DNS 服务器 IP，写入网卡连接配置；填错表现为 ping IP 通、域名解析失败——是『能 ping 通打不开网页』的典型根因"}, {"name": "ifname", "label": "网卡名", "default": "eth0", "required": true, "validate": "ifname", "example": "eth0 / ens33 / enp3s0 / bond0", "type": "string", "description": "Linux 网卡名（eth0/ens33/bond0 等），操作的目标接口；先 ip link 确认存在再操作，选错网卡会当场断 SSH（远程操作务必留带外兜底）"}], "notes": "1) openEuler 22.03 网络管理与 RHEL8 一致（NM + ifcfg 兼容）。\n2) ipv4.method manual 别漏；openEuler 也有 ifcfg-* 兼容层，两种方式别混用同一网卡。\n—— lab 判定（场2,正当挂起）:不可验证(容器无 NetworkManager 服务,生效链不可验);待真机", "duration": "both", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:59", "updated_at": "2026-10-09 13:45:46", "exec_level": "", "interactive": 0, "rollback": "# 回退：恢复连接旧地址配置（旧值按变更记录回填；变更前若为 DHCP 按下行清空静态项）\nnmcli con mod \"{{con_name}}\" ipv4.method auto ipv4.addresses \"\" ipv4.gateway \"\" ipv4.dns \"\"\nnmcli con up \"{{con_name}}\"\n# 复核\nnmcli con show \"{{con_name}}\"\nip addr show {{ifname}}"}, {"uuid": "fa212d5e-ea27-5b74-8eb6-9e8276749e9a", "platform": "linux", "device_type": "服务器", "vendor": "openeuler", "os_family": "openeuler2203", "models": "openEuler 22.03 LTS", "category": "本地源", "title": "本地 dnf/yum 源（openEuler ISO 挂载）★ 离网特供", "description": "openEuler ISO 挂载做本地源，完全离线装包。", "commands": "mkdir -p /mnt/cdrom\nmount -o loop {{iso_path}} /mnt/cdrom\ncat > /etc/yum.repos.d/local.repo << 'EOF'\n[local-iso]\nname=Local openEuler ISO\nbaseurl=file:///mnt/cdrom\nenabled=1\ngpgcheck=0\nEOF\ndnf clean all\ndnf makecache\ndnf repolist\ndnf install {{pkg_name}} -y", "params": [{"name": "iso_path", "label": "ISO 文件路径", "default": "/opt/CentOS-7-x86_64-DVD-2009.iso", "required": true, "validate": "path", "example": "/opt/CentOS-7-x86_64-DVD-2009.iso", "type": "string", "description": "本地 ISO 镜像文件路径，loop 挂载为本地安装源；写错路径 mount 失败；写入 /etc/fstab 前先手动挂载验证（配错 fstab 重启起不来）"}, {"name": "pkg_name", "label": "软件包名", "default": "createrepo", "required": true, "validate": "", "example": "createrepo", "type": "string", "description": "软件包名（yum/apt/rpm 的操作对象）；离网环境先在异机下载（pip download / yumdownloader）再拷入安装"}], "notes": "1) ★ openEuler 的 dnf 与 yum 命令等价（dnf 是 yum 的软链）。\n2) baseurl 要指向含 repodata/ 的目录；开机自动挂载写 /etc/fstab。\n3) 若同时存在其它 repo 报错，可先在 /etc/yum.repos.d/ 里把 openEuler 官方源改名 .bak。\n—— lab 判定（场2,正当挂起）:不可验证(需 openEuler ISO 介质,容器无 ISO);待真机", "duration": "perm", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:59", "updated_at": "2026-10-09 13:45:46", "exec_level": "", "interactive": 0, "rollback": "# 回退：删除本地源配置并卸载 ISO（★ 已用该源安装的包保留不影响系统）\nrm -f /etc/yum.repos.d/local.repo\numount /mnt/cdrom\ndnf clean all && dnf makecache\n# 复核（期望无 local-iso 源）\ndnf repolist"}, {"uuid": "f6ca4000-a13a-5700-897c-4dd2bdbf0566", "platform": "linux", "device_type": "服务器", "vendor": "openeuler", "os_family": "openeuler2203", "models": "openEuler 22.03 LTS", "category": "防火墙", "title": "firewalld 放行端口（openEuler）", "description": "firewall-cmd 永久放行并验证。", "commands": "firewall-cmd --permanent --add-port={{port}}/tcp\nfirewall-cmd --reload\nfirewall-cmd --list-all\nss -tlnp | grep :{{port}}", "params": [{"name": "port", "label": "端口号", "default": "8080", "required": true, "validate": "int:1-65535", "example": "8080", "type": "int", "range": "1-65535", "description": "TCP 端口号（0-65535），firewalld 放行与 ss 查监听的对象；--permanent 后须 firewall-cmd --reload 才生效"}], "notes": "1) 与 RHEL 用法一致：--permanent + --reload 成对；先 ss 确认应用在监听。\n—— 实验室实测 2026-10-09（场1,centos7）：不可验证(centos7 容器无 firewalld 包且无 systemd):firewall-cmd command not found;真机验证\n—— lab 判定（场2,正当挂起）:不可验证(容器无 firewalld 包+无 systemd,裁决B 同族);待真机", "duration": "perm", "verified": 0, "verified_by": "", "verified_model": "", "verified_date": "", "favorite": 0, "created_at": "2026-09-22 16:33:59", "updated_at": "2026-10-09 13:45:46", "exec_level": "", "interactive": 0, "rollback": "# 回退：移除本次放行的端口（--permanent 修改须 --reload 生效）\nfirewall-cmd --permanent --remove-port={{port}}/tcp\nfirewall-cmd --reload\n# 复核（期望无该端口）\nfirewall-cmd --list-all"}, {"uuid": "ad4beaf0-8bed-5dde-891e-4050ac2b5b14", "platform": "linux", "device_type": "服务器", "vendor": "openeuler", "os_family": "openeuler2203", "models": "openEuler 22.03 LTS", "category": "网络配置", "title": "静态路由（临时 + 持久化，openEuler）", "description": "ip route 临时 + nmcli 持久化。", "commands": "# ---- 临时 ----\nip route add {{dest_net}}/{{prefix_len}} via {{gateway}} dev {{ifname}}\nip route show\n# ---- 持久化（nmcli）----\nnmcli con mod \"{{con_name}}\" +ipv4.routes \"{{dest_net}}/{{prefix_len}} {{gateway}}\"\nnmcli con up \"{{con_name}}\"\nip route show", "params": [{"name": "dest_net", "label": "目的网段", "default": "10.20.0.0", "required": true, "validate": "ipv4", "example": "10.20.0.0", "type": "ip", "description": "目的网段地址，路由/策略匹配的目标方向；0.0.0.0/0 表示任意目的；方向写反会导致流量走错策略"}, {"name": "prefix_len", "label": "掩码长度", "default": "24", "required": true, "validate": "int:0-32", "example": "24（不是 255.255.255.0）", "type": "int", "range": "0-32", "description": "前缀长度（0-32），与 IP 组成 CIDR（如 /24）；写错网段判定全错，远程操作可能当场断 SSH"}, {"name": "gateway", "label": "网关", "default": "192.168.10.1", "required": true, "validate": "ipv4", "example": "192.168.10.1", "type": "ip", "description": "网关 IP，本网段出方向的下一跳；配错表现为同网段通、跨网段断；nmcli 修改后需重新激活连接生效"}, {"name": "ifname", "label": "网卡名", "default": "eth0", "required": true, "validate": "ifname", "example": "eth0 / ens33 / enp3s0 / bond0", "type": "string", "description": "Linux 网卡名（eth0/ens33/bond0 等），操作的目标接口；先 ip link 确认存在再操作，选错网卡会当场断 SSH（远程操作务必留带外兜底）"}, {"name": "con_name", "label": "连接名", "default": "eth0", "required": false, "validate": "", "example": "nmcli con show 查看，一般等于网卡名", "type": "string", "description": "NetworkManager 连接配置名，nmcli 按它修改网卡参数；先 nmcli con show 确认名字再改，改错连接会断网（远程操作务必留 console/带外兜底）"}], "notes": "1) nmcl
